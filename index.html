"row\">Full midline laparotomy<\/th><td>T6 to T12, both sides<\/td><td>Thoracic epidural; rectus sheath catheters on both sides; TAP in all four quadrants<\/td><td>Wall blocks leave visceral pain to other analgesics<\/td><\/tr><tr><th scope=\"row\">Lower midline or Pfannenstiel (cesarean, gynecology)<\/th><td>T11 to L1<\/td><td>Lateral TAP, quadratus lumborum, ilioinguinal–iliohypogastric<\/td><td>A Pfannenstiel incision can trap the ilioinguinal or iliohypogastric nerve and cause chronic groin pain<\/td><\/tr><tr><th scope=\"row\">Inguinal hernia<\/th><td>T12, L1, genital branch of the genitofemoral<\/td><td>Ilioinguinal–iliohypogastric block plus infiltration of the cord or sac by the surgeon<\/td><td><\/td><\/tr><tr><th scope=\"row\">Umbilical hernia<\/th><td>T10<\/td><td>Rectus sheath on both sides<\/td><td><\/td><\/tr><tr><th scope=\"row\">Flank (open kidney surgery)<\/th><td>T10 to L1<\/td><td>Paravertebral, erector spinae, quadratus lumborum<\/td><td><\/td><\/tr><tr><th scope=\"row\">Laparoscopy<\/th><td>Port sites<\/td><td>Port infiltration or TAP<\/td><td>Visceral and shoulder pain remain<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Visceral pain and neuraxial levels<\/h3><ul><li>The parietal peritoneum of the front wall shares the somatic nerves of the skin over it, so its pain is sharp and well localized. The central diaphragm is supplied by the phrenic nerve (C3 to C5), so gas or blood under the diaphragm causes shoulder-tip pain after laparoscopy.<\/li><li>Visceral pain travels with autonomic nerves (sympathetic fibers to the thoracolumbar cord, the vagus, and the pelvic splanchnic nerves from S2 to S4). It is dull and poorly localized, and wall blocks do not touch it.<\/li><li>Spinal anesthesia for cesarean delivery needs a T4 level, far above the incision, because pulling on the peritoneum and handling the uterus are felt through higher segments.<\/li><\/ul><h3 class=\"nb-h\">TAP blocks after cesarean delivery<\/h3><ul><li>In a meta-analysis of nine trials (<a href=\"https://doi.org/10.1007/s12630-012-9729-1\" target=\"_blank\" rel=\"noopener\">Mishriky 2012<\/a>), TAP blocks reduced opioid use and pain after cesarean delivery when intrathecal morphine was not given, but added little when it was. Intrathecal morphine gave better analgesia than TAP blocks alone, with more opioid side effects.<\/li><li>So TAP or quadratus lumborum blocks fit when intrathecal morphine was not given (general anesthesia, or a contraindication), or as rescue analgesia (see <a href=\"#ii-d-3-g-4-b\">II.D.3.g.4.b<\/a>).<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a midline incision gets nerves from both sides with little crossover, so a one-sided wall block fails. Block both sides, or use neuraxial analgesia.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-b-5\">I.A.1.b.5 Abdominal wall ultrasound<\/a> · <a href=\"#ii-b-1-a-3\">II.B.1.a.3 Trunk blocks<\/a> · <a href=\"#ii-d-3-g-4-b\">II.D.3.g.4.b Pain management after cesarean delivery<\/a> · <a href=\"#i-a-1-a-5\">I.A.1.a.5 Dermatome Anatomy<\/a> · <a href=\"#i-a-1-c-3-a\">I.A.1.c.3.a Intercostal<\/a> · <a href=\"#ii-d-6\">II.D.6 Laparoscopic surgery<\/a><\/p>","b":"The abdominal wall is supplied by T6 to L1, nerves that run between the internal oblique and transversus abdominis and then through the rectus sheath. Wall blocks treat incision pain only, because visceral pain travels with autonomic nerves; that is why a cesarean delivery under spinal needs a T4 level although the incision lies near L1.","u":"2026-11-05"},"I.A.2.a":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Pressure is force per unit area, and anesthesia uses several units for it. Know the conversions, the difference between gauge and absolute pressure, and how the machine steps cylinder and pipeline pressures down to the low pressures that reach the patient.<\/p><h3 class=\"nb-h\">Pressure units<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Unit<\/th><th scope=\"col\">Equals<\/th><th scope=\"col\">Where you see it<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">1 atmosphere<\/th><td>760 mmHg = 101.3 kPa = 1.013 bar = 14.7 psi = 1,033 cmH2O<\/td><td>Barometric pressure at sea level<\/td><\/tr><tr><th scope=\"row\">1 kPa<\/th><td>7.5 mmHg = 10.2 cmH2O<\/td><td>Gas tensions in SI units<\/td><\/tr><tr><th scope=\"row\">1 mmHg<\/th><td>1.36 cmH2O<\/td><td>Blood pressure, gas tensions<\/td><\/tr><tr><th scope=\"row\">1 cmH2O<\/th><td>0.74 mmHg<\/td><td>Airway pressure, central venous pressure<\/td><\/tr><tr><th scope=\"row\">1 psi<\/th><td>51.7 mmHg = 6.9 kPa<\/td><td>Cylinder and pipeline pressures<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Gauge and absolute pressure<\/h3><ul><li>A gauge reads pressure above atmospheric (psig). Absolute pressure (psia) is the gauge reading plus atmospheric pressure, so a cylinder reading 2,000 psig holds about 2,015 psia.<\/li><li>Gas law calculations use absolute pressure. Partial pressures are fractions of the absolute total.<\/li><\/ul><h3 class=\"nb-h\">Pressure stages in the anesthesia machine<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Stage<\/th><th scope=\"col\">Pressure<\/th><th scope=\"col\">Parts<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">High<\/th><td>Cylinder pressure, up to about 2,200 psi for a full oxygen cylinder<\/td><td>Cylinders, hanger yokes, cylinder gauges, cylinder pressure regulators<\/td><\/tr><tr><th scope=\"row\">Intermediate<\/th><td>About 50 psi from the pipeline, or about 45 psi after the cylinder regulator<\/td><td>Pipeline inlets, check valves, oxygen pressure failure device, oxygen flush, flow control valves<\/td><\/tr><tr><th scope=\"row\">Low<\/th><td>Just above atmospheric<\/td><td>Flowmeters, vaporizers, outlet check valve (on some machines), common gas outlet<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Because the cylinder regulator delivers slightly less than pipeline pressure, the machine draws from the pipeline whenever it is connected and working. A cylinder valve left open drains silently if pipeline pressure falls.<\/li><li>The oxygen flush delivers 35 to 75 L/min straight from the intermediate-pressure system, bypassing the flowmeters and vaporizers. Used during inspiration with a closed circuit, it can cause barotrauma; used often, it dilutes the anesthetic.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-d\">I.A.2.d Gas Laws<\/a> · <a href=\"#i-a-2-g-4\">I.A.2.g.4 Oxygen Supply Systems<\/a> · <a href=\"#i-a-2-g-6\">I.A.2.g.6 Safety Features<\/a> · <a href=\"#i-a-2-i-3\">I.A.2.i.3 Pressure Transducers<\/a><\/p>","b":"Pressure is force per unit area, and anesthesia uses several units for it. Know the conversions, the difference between gauge and absolute pressure, and how the machine steps cylinder and pipeline pressures down to the low pressures that reach the patient.","u":"2026-11-05"},"I.A.2.a.1":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Every pressure is measured against a reference. A manometer balances it against a column of liquid, a Bourdon gauge against a bending tube, and an electronic transducer against a flexing diaphragm; for vascular pressures, where you zero and level the transducer matters as much as the device.<\/p><h3 class=\"nb-h\">Liquid columns<\/h3><ul><li>Pressure under a liquid column depends only on its height and density (P = ρgh), not on the shape of the container.<\/li><li>Water columns read small pressures (cmH2O: airway pressure, central venous pressure). Mercury is 13.6 times denser than water, so the same pressure lifts it 13.6 times less, which is why 1 mmHg equals 1.36 cmH2O.<\/li><li>A U-tube manometer reads the difference between the pressures at its two ends; with one end open to air it reads gauge pressure.<\/li><\/ul><h3 class=\"nb-h\">Mechanical gauges<\/h3><ul><li>Bourdon gauge: a curved, flattened tube that straightens as pressure rises and moves a needle. It reads cylinder and pipeline pressures and needs no power.<\/li><li>Aneroid (diaphragm or bellows) gauges read lower pressures, such as in aneroid blood pressure cuffs and breathing circuit pressure gauges.<\/li><\/ul><h3 class=\"nb-h\">Fluid-filled systems for vascular pressures<\/h3><ul><li>Zeroing: open the transducer to air so it reads atmospheric pressure as zero.<\/li><li>Leveling: place the transducer at the reference point. For most pressures that is the right atrium, at about the fourth intercostal space halfway between the front and back of the chest. To estimate brain perfusion in a sitting patient, level at the external ear.<\/li><li>Every 10 cm the transducer sits below the reference adds about 7.5 mmHg to the reading, and every 10 cm above subtracts it. That error is small for arterial pressure but large for a central venous pressure of 8 mmHg.<\/li><li>Zero and level give static accuracy. How faithfully the system follows a fast-changing waveform (resonance and damping) is covered in <a href=\"#i-a-2-i-3\">I.A.2.i.3<\/a>.<\/li><\/ul><h3 class=\"nb-h\">Gas pressures<\/h3><ul><li>Airway pressure is measured in the breathing circuit, usually in cmH2O.<\/li><li>In a compressed-gas cylinder (oxygen, air) the pressure falls in step with the contents. In a liquefied-gas cylinder (nitrous oxide, carbon dioxide) it stays constant until the liquid is gone (see <a href=\"#i-a-2-a-2\">I.A.2.a.2<\/a>).<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> zeroing and leveling are different steps. Zeroing removes atmospheric pressure; leveling removes the height error. If the bed is raised or lowered while the transducer stays on a fixed pole, every reading changes.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-i-3\">I.A.2.i.3 Pressure Transducers<\/a> · <a href=\"#i-a-2-h-6\">I.A.2.h.6 Blood Pressure<\/a> · <a href=\"#ii-a-1-a-1\">II.A.1.a.1 Vascular Pressures<\/a> · <a href=\"#i-a-2-a-2\">I.A.2.a.2 Cylinders and regulators<\/a><\/p>","b":"Every pressure is measured against a reference. A manometer balances it against a column of liquid, a Bourdon gauge against a bending tube, and an electronic transducer against a flexing diaphragm; for vascular pressures, where you zero and level the transducer matters as much as the device.","u":"2026-11-05"},"I.A.2.a.2":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Medical gases arrive from pipelines at about 50 psi or from cylinders at much higher pressure, and regulators bring cylinder gas down to a steady working pressure. Know each cylinder's color, pressure and contents, how to estimate the time left in an oxygen cylinder, and the systems that keep the wrong gas from reaching the patient.<\/p><h3 class=\"nb-h\">E cylinders (the size on anesthesia machines)<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Gas<\/th><th scope=\"col\">US color<\/th><th scope=\"col\">Full pressure (psi)<\/th><th scope=\"col\">Contents (L)<\/th><th scope=\"col\">Form in the cylinder<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Oxygen<\/th><td>Green (white internationally)<\/td><td>About 1,900 to 2,200<\/td><td>About 660<\/td><td>Compressed gas<\/td><\/tr><tr><th scope=\"row\">Air<\/th><td>Yellow<\/td><td>About 1,900<\/td><td>About 625<\/td><td>Compressed gas<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide<\/th><td>Blue<\/td><td>745<\/td><td>About 1,590<\/td><td>Liquid with vapor above it<\/td><\/tr><tr><th scope=\"row\">Carbon dioxide<\/th><td>Gray<\/td><td>838<\/td><td>About 1,590<\/td><td>Liquid with vapor above it<\/td><\/tr><tr><th scope=\"row\">Nitrogen<\/th><td>Black<\/td><td>About 1,800 to 2,200<\/td><td>About 610<\/td><td>Compressed gas<\/td><\/tr><tr><th scope=\"row\">Helium<\/th><td>Brown<\/td><td>About 1,600 to 2,000<\/td><td>About 500<\/td><td>Compressed gas<\/td><\/tr><\/tbody><\/table><\/div><ul><li>For a compressed gas, pressure falls in step with contents (Boyle's law), so the gauge shows how much is left.<\/li><li>For a liquefied gas, the pressure stays at the vapor pressure until the liquid is gone, when about three-quarters of the contents have been used. After that it falls quickly. Only weight shows how much is left.<\/li><\/ul><h3 class=\"nb-h\">Time left in an oxygen E cylinder<\/h3><ul><li>A full cylinder holds about 660 L at about 2,000 psi, so each psi is worth about a third of a liter.<\/li><li>Time in minutes ≈ (gauge pressure in psi × 0.3) ÷ flow in L/min. At 1,000 psi there are about 330 L: about 30 minutes at 10 L/min.<\/li><li>A bellows ventilator driven by oxygen also uses cylinder oxygen as its drive gas, so during a pipeline failure it can empty the cylinder fast. Use low fresh gas flows and hand ventilation to make it last.<\/li><\/ul><h3 class=\"nb-h\">Safety systems<\/h3><ul><li>Pin Index Safety System: pins on the cylinder yoke fit holes in that gas's cylinder valve only (oxygen 2 and 5, nitrous oxide 3 and 5, air 1 and 5). Two washers stacked in a yoke can let the wrong cylinder seat.<\/li><li>Diameter Index Safety System: gas-specific threaded fittings where pipeline hoses connect to the machine. Wall outlets use gas-specific quick connectors.<\/li><li>These systems fail with adapters, misassembly or a crossed pipeline, so the oxygen analyzer in the breathing circuit is the last line of defense.<\/li><li>Open cylinder valves slowly: sudden compression of gas into the regulator heats it and can ignite. Keep oil and grease off fittings.<\/li><li>Check valves in each yoke stop gas leaking out of an empty yoke and stop one cylinder filling another.<\/li><\/ul><h3 class=\"nb-h\">Regulators<\/h3><ul><li>A pressure regulator turns a high, falling inlet pressure into a lower, steady outlet pressure. A diaphragm balances a spring against the outlet pressure and opens or closes the valve to hold it constant.<\/li><li>On the machine the cylinder regulator delivers about 45 psi, just below pipeline pressure, so the pipeline is used first. Check the cylinder during the machine check, then close it so it is full when you need it.<\/li><\/ul><h3 class=\"nb-h\">Transducers<\/h3><ul><li>A transducer converts one form of energy into another, usually into an electrical signal.<\/li><li>Pressure transducer: pressure flexes a diaphragm attached to strain gauges in a Wheatstone bridge, changing their resistance and the output voltage in proportion to pressure (dynamic behavior in <a href=\"#i-a-2-i-3\">I.A.2.i.3<\/a>).<\/li><li>Others: thermistors and thermocouples (temperature), piezoelectric crystals (ultrasound probes), and photodetectors (pulse oximetry).<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> with a crossed pipeline, opening the oxygen cylinder is not enough. The machine keeps drawing the wrong gas from the pipeline at its higher pressure until you disconnect the pipeline hose.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-a-1\">I.A.2.a.1 Pressure Measurement<\/a> · <a href=\"#i-a-2-g-4\">I.A.2.g.4 Oxygen Supply Systems<\/a> · <a href=\"#i-a-2-g-6\">I.A.2.g.6 Safety Features<\/a> · <a href=\"#i-a-2-i-3\">I.A.2.i.3 Pressure Transducers<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a><\/p>","b":"Medical gases arrive from pipelines at about 50 psi or from cylinders at much higher pressure, and regulators bring cylinder gas down to a steady working pressure. Know each cylinder's color, pressure and contents, how to estimate the time left in an oxygen cylinder, and the systems that keep the wrong gas from reaching the patient.","u":"2026-11-05"},"I.A.2.a.3":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> An ultrasound probe sends pulses of sound and times their echoes to place each structure on the screen. Higher frequency gives finer detail but shallower penetration, and most artifacts come from the machine's assumptions: sound travels in a straight line at 1,540 m/s and each echo returns once.<\/p><h3 class=\"nb-h\">How an image forms<\/h3><ul><li>A piezoelectric crystal turns an electrical pulse into sound and turns returning echoes back into voltage. Medical imaging uses roughly 2 to 15 MHz; human hearing stops at about 20 kHz.<\/li><li>Depth = (speed × round-trip time) ÷ 2, using an assumed soft tissue speed of 1,540 m/s. Sound is slower in air (about 330 m/s) and fat, and much faster in bone.<\/li><li>Echoes come from boundaries between tissues of different acoustic impedance (density × speed of sound). Soft tissue against air or bone reflects almost everything, which is why gel is needed and why bone casts a shadow.<\/li><li>Bright structures are hyperechoic (bone surface, fascia, needle), gray ones hypoechoic, and black ones anechoic (blood, fluid, local anesthetic).<\/li><li>Sound weakens with depth (attenuation), and more so at higher frequency. Gain brightens the whole image; time-gain compensation brightens deeper echoes selectively.<\/li><\/ul><h3 class=\"nb-h\">Frequency, wavelength and resolution<\/h3><ul><li>Wavelength = speed ÷ frequency: about 0.3 mm at 5 MHz and 0.15 mm at 10 MHz. Shorter waves resolve finer detail but are absorbed sooner.<\/li><li>Axial resolution (along the beam) improves with higher frequency and shorter pulses.<\/li><li>Lateral resolution (side to side) depends on beam width and is best at the focal zone, so set the focus at the target.<\/li><li>Temporal resolution (frame rate) falls with greater depth, a wider sector and color Doppler.<\/li><\/ul><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Probe<\/th><th scope=\"col\">Frequency<\/th><th scope=\"col\">Depth<\/th><th scope=\"col\">Typical uses<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Linear<\/th><td>High, about 6 to 15 MHz<\/td><td>Shallow, a few centimeters<\/td><td>Vessels, most nerve blocks, airway, pleura<\/td><\/tr><tr><th scope=\"row\">Curved<\/th><td>Low, about 2 to 5 MHz<\/td><td>Deep<\/td><td>Abdomen, deep blocks, neuraxial imaging in adults<\/td><\/tr><tr><th scope=\"row\">Phased array<\/th><td>Low, about 1 to 5 MHz<\/td><td>Deep, through a small window<\/td><td>Heart between the ribs, transcranial Doppler<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Resonance<\/h3><ul><li>The crystal rings at a resonant frequency set by its thickness: thinner crystals make higher frequencies.<\/li><li>Backing material damps the ringing so pulses stay short (better axial resolution), and matching layers on the probe face ease the impedance step from crystal to skin.<\/li><li>Pressure transducers also resonate, with very different consequences (see <a href=\"#i-a-2-i-3\">I.A.2.i.3<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Common artifacts<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Artifact<\/th><th scope=\"col\">What you see<\/th><th scope=\"col\">Cause<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Acoustic shadow<\/th><td>Black band behind bone or a stone<\/td><td>Almost all sound reflected or absorbed<\/td><\/tr><tr><th scope=\"row\">Acoustic enhancement<\/th><td>Bright band behind fluid (vessels, cysts, local anesthetic)<\/td><td>Fluid weakens sound less than the gain setting expects<\/td><\/tr><tr><th scope=\"row\">Reverberation<\/th><td>Evenly spaced repeated lines (A-lines under the pleura, a ladder behind a needle)<\/td><td>Sound bouncing between two strong reflectors<\/td><\/tr><tr><th scope=\"row\">Mirror image<\/th><td>A copy of a structure beyond a strong curved reflector, such as liver above the diaphragm<\/td><td>The echo takes an indirect path back<\/td><\/tr><tr><th scope=\"row\">Anisotropy<\/th><td>A tendon or nerve darkens when the probe tilts<\/td><td>Smooth surfaces reflect best when the beam hits them squarely<\/td><\/tr><tr><th scope=\"row\">Bayonet<\/th><td>A straight needle looks bent<\/td><td>Sound travels at a different speed in the tissue the needle crosses<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Safety: absorbed energy warms tissue (thermal index) and pressure swings can cause cavitation (mechanical index). Use the lowest output and shortest scan that answer the question.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> the bright band of acoustic enhancement behind an artery can look like a nerve. Confirm a nerve by following it up and down its course.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-b-3\">I.A.2.b.3 Principles of Doppler Ultrasound<\/a> · <a href=\"#i-a-1-b-6\">I.A.1.b.6 Extremities ultrasound<\/a> · <a href=\"#ii-a-1-b-4\">II.A.1.b.4 Ultrasound-guided vascular catheters and nerve blocks<\/a> · <a href=\"#ii-a-1-b-5\">II.A.1.b.5 Point-of-Care Ultrasound<\/a><\/p>","b":"An ultrasound probe sends pulses of sound and times their echoes to place each structure on the screen. Higher frequency gives finer detail but shallower penetration, and most artifacts come from the machine's assumptions: sound travels in a straight line at 1,540 m/s and each echo returns once.","u":"2026-11-05"},"I.A.2.b":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Flow is either laminar, where viscosity sets the resistance, or turbulent, where density does. Poiseuille's law, the Reynolds number and Bernoulli's principle explain IV cannula choice, airway resistance, heliox, flowmeters and Doppler.<\/p><h3 class=\"nb-h\">The rules at a glance<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Rule<\/th><th scope=\"col\">Statement<\/th><th scope=\"col\">Practical point<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Poiseuille (laminar flow)<\/th><td>Flow = ΔP × πr⁴ ÷ (8 × viscosity × length)<\/td><td>Radius to the fourth power: halving the radius cuts flow 16-fold<\/td><\/tr><tr><th scope=\"row\">Turbulent flow<\/th><td>Flow rises with the square root of ΔP and falls with density<\/td><td>Doubling flow needs four times the pressure; low-density heliox helps<\/td><\/tr><tr><th scope=\"row\">Reynolds number<\/th><td>(velocity × diameter × density) ÷ viscosity<\/td><td>Below about 2,000 flow is usually laminar<\/td><\/tr><tr><th scope=\"row\">Continuity<\/th><td>Flow = velocity × cross-sectional area<\/td><td>Velocity rises at a narrowing, which Doppler measures<\/td><\/tr><tr><th scope=\"row\">Bernoulli and Venturi<\/th><td>Where velocity rises, lateral pressure falls<\/td><td>Venturi masks, jet ventilation and nebulizers entrain gas<\/td><\/tr><\/tbody><\/table><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-g-1\">I.A.2.g.1 Breathing system principles<\/a> · <a href=\"#i-a-2-h-2\">I.A.2.h.2 Ventilation monitoring<\/a> · <a href=\"#i-a-2-n\">I.A.2.n IV Pumps and Infusers<\/a><\/p>","b":"Flow is either laminar, where viscosity sets the resistance, or turbulent, where density does. Poiseuille's law, the Reynolds number and Bernoulli's principle explain IV cannula choice, airway resistance, heliox, flowmeters and Doppler.","u":"2026-11-05"},"I.A.2.b.1":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> In laminar flow resistance depends on viscosity and, above all, on radius; in turbulent flow it depends on density and rises with the flow itself. That is why a short, wide cannula runs fastest and why heliox eases upper airway obstruction but not small-airway disease.<\/p><h3 class=\"nb-h\">Laminar flow<\/h3><ul><li>Smooth, parallel layers, fastest in the center. It occurs at low velocity in long, straight, smooth tubes.<\/li><li>Hagen–Poiseuille: flow = ΔP × πr⁴ ÷ (8 × viscosity × length). Flow depends on viscosity, not density.<\/li><li>IV access: a short, wide peripheral cannula outflows a longer central line lumen of the same gauge. Raising the bag raises ΔP; warming blood or diluting packed cells lowers viscosity.<\/li><li>Airways: going from an 8.0 to a 7.0 mm tracheal tube raises laminar resistance about 1.7-fold, because (8 ÷ 7)⁴ ≈ 1.7.<\/li><li>Liquids become less viscous when warmed; gases become slightly more viscous. Blood viscosity rises with hematocrit.<\/li><\/ul><h3 class=\"nb-h\">Turbulent flow<\/h3><ul><li>Chaotic eddies at high velocity, at branches, sharp bends, narrowings and rough surfaces. Stridor and wheeze are the sound of it.<\/li><li>Flow rises only with the square root of the pressure difference, so doubling flow needs four times the pressure. Resistance depends on density, not viscosity.<\/li><li>Flow through an orifice (a narrowing shorter than its own diameter) behaves as turbulent: tight upper airway obstruction, a high-flow rotameter, a stenotic valve.<\/li><\/ul><h3 class=\"nb-h\">Reynolds number<\/h3><ul><li>Reynolds number = (velocity × diameter × density) ÷ viscosity. Below about 2,000 flow is usually laminar; well above it, turbulent.<\/li><li>In the lungs, flow is turbulent in the trachea and large bronchi, where velocity is high, and laminar in the small airways, whose huge total cross-section keeps velocity low.<\/li><\/ul><h3 class=\"nb-h\">Heliox<\/h3><ul><li>Helium is about one-seventh as dense as air, so heliox (70 to 80% helium) lowers resistance where flow is turbulent: stridor after extubation, tracheal or laryngeal narrowing, a foreign body.<\/li><li>It does little for laminar small-airway flow, and its oxygen content (20 to 30%) limits it in hypoxemic patients.<\/li><\/ul><h3 class=\"nb-h\">Bernoulli and Venturi<\/h3><ul><li>At a narrowing, velocity rises and lateral pressure falls. A side port at that point draws in surrounding gas (entrainment).<\/li><li>Uses: Venturi masks deliver a fixed oxygen fraction by a set entrainment ratio; jet ventilation entrains room air; nebulizers and suction devices work the same way.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> heliox helps turbulent flow because it is less dense, not because it is less viscous; its viscosity is similar to air's. It is a bridge for upper airway obstruction, not a treatment for bronchospasm in the small airways.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-b\">I.A.2.b Flow Velocity<\/a> · <a href=\"#i-a-2-g-1\">I.A.2.g.1 Breathing system principles<\/a> · <a href=\"#i-a-2-b-2\">I.A.2.b.2 Flowmeters<\/a> · <a href=\"#i-b-3-c\">I.B.3.c Airway Management<\/a><\/p>","b":"In laminar flow resistance depends on viscosity and, above all, on radius; in turbulent flow it depends on density and rises with the flow itself. That is why a short, wide cannula runs fastest and why heliox eases upper airway obstruction but not small-airway disease.","u":"2026-11-05"},"I.A.2.b.2":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> A rotameter is a tapered tube, narrowest at the bottom, with a float that rises until the gas flowing around it holds up its weight. At low flows the gap acts like a tube (laminar, viscosity-dependent) and at high flows like an orifice (turbulent, density-dependent), so each rotameter is calibrated for one gas.<\/p><h3 class=\"nb-h\">How it works<\/h3><ul><li>It is a variable-orifice, constant-pressure-drop flowmeter: the pressure difference across the float stays the same, and the gap around it widens as the float rises.<\/li><li>Read the top of a bobbin and the center of a ball.<\/li><li>Some machines put a fine and a coarse tube in series for accurate low flows. Many modern machines measure flow electronically and show a virtual flowmeter, usually with a mechanical oxygen flowmeter as backup.<\/li><\/ul><h3 class=\"nb-h\">Sources of error<\/h3><ul><li>Wrong gas: viscosity and density differ between gases, so a tube calibrated for one gas misreads another.<\/li><li>Altitude: at high flows the reading depends on density, and gas at altitude is less dense, so the actual flow is higher than the reading. At low flows, which depend on viscosity, the error is small.<\/li><li>A sticking float: dirt or static electricity can hold it in place. A rotating bobbin shows that it is floating freely.<\/li><li>A tilted tube, or a cracked tube that leaks.<\/li><\/ul><h3 class=\"nb-h\">Safety design<\/h3><ul><li>The oxygen flowmeter sits downstream of the others, next to the outlet to the common manifold. A leak in an upstream tube then loses nitrous oxide or air rather than oxygen (details in <a href=\"#i-a-2-g-6\">I.A.2.g.6<\/a>).<\/li><li>The oxygen control knob has a distinct fluted shape and sticks out further, so it can be identified by touch.<\/li><li>Proportioning systems link oxygen and nitrous oxide flows so the mixture cannot fall below about 25% oxygen, but they do not stop a third gas from diluting oxygen.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> at high altitude a rotameter under-reads at high flows, because the thinner gas passes the float more easily than the scale assumes.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-b-1\">I.A.2.b.1 Laminar and turbulent flow<\/a> · <a href=\"#i-a-2-g-6\">I.A.2.g.6 Safety Features<\/a> · <a href=\"#i-a-2-a\">I.A.2.a Mechanics<\/a><\/p>","b":"A rotameter is a tapered tube, narrowest at the bottom, with a float that rises until the gas flowing around it holds up its weight. At low flows the gap acts like a tube (laminar, viscosity-dependent) and at high flows like an orifice (turbulent, density-dependent), so each rotameter is calibrated for one gas.","u":"2026-11-05"},"I.A.2.b.3":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Sound reflected from moving blood comes back at a shifted frequency, and the shift tells you the speed and direction of flow. Keep the beam as parallel to flow as you can, and know which Doppler mode can measure fast jets (continuous-wave) and which can tell you where the flow is (pulsed-wave).<\/p><h3 class=\"nb-h\">The Doppler equation<\/h3><ul><li>Doppler shift = (2 × transmitted frequency × velocity × cos θ) ÷ speed of sound, where θ is the angle between the beam and the flow.<\/li><li>The shift is largest with the beam parallel to flow (cos 0° = 1) and zero at 90 degrees. Velocity estimates stay reliable up to about 60 degrees, then the error grows quickly.<\/li><li>Flow toward the probe raises the frequency and flow away lowers it. On color displays the usual map shows toward as red and away as blue (\"BART\": blue away, red toward), whatever the vessel.<\/li><li>The shift falls in the audible range, which is why handheld and precordial Doppler probes can be heard.<\/li><\/ul><h3 class=\"nb-h\">Doppler modes<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Mode<\/th><th scope=\"col\">How it works<\/th><th scope=\"col\">Strength<\/th><th scope=\"col\">Limit<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Continuous-wave<\/th><td>One crystal sends while another listens, all the time<\/td><td>Measures very high velocities (aortic stenosis, regurgitant jets)<\/td><td>Cannot tell at what depth along the beam the flow is<\/td><\/tr><tr><th scope=\"row\">Pulsed-wave<\/th><td>One crystal sends a pulse, then listens at a chosen depth (the sample volume)<\/td><td>Shows flow at a specific spot<\/td><td>Aliasing above the Nyquist limit (half the pulse repetition frequency)<\/td><\/tr><tr><th scope=\"row\">Color flow<\/th><td>Pulsed-wave sampling over an area, with mean velocity coded by color<\/td><td>Maps direction and turbulence over a region<\/td><td>Aliasing shows as color wrap and mosaic; lowers frame rate<\/td><\/tr><tr><th scope=\"row\">Power Doppler<\/th><td>Displays the strength of the Doppler signal<\/td><td>Sensitive to slow flow<\/td><td>Usually no direction<\/td><\/tr><tr><th scope=\"row\">Tissue Doppler<\/th><td>Tracks slow, strong signals from the myocardium<\/td><td>Measures wall velocities, such as e′ for diastolic function<\/td><td>Angle-dependent<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Pressure from velocity: the simplified Bernoulli equation<\/h3><ul><li>Pressure gradient (mmHg) ≈ 4 × velocity² (velocity in m/s).<\/li><li>A tricuspid regurgitant jet of 3 m/s means a right ventricle-to-atrium gradient of about 36 mmHg, so right ventricular systolic pressure is about 36 mmHg plus right atrial pressure. The same rule estimates gradients across stenotic valves.<\/li><\/ul><h3 class=\"nb-h\">Uses in anesthesia<\/h3><ul><li>Vascular access: telling arteries from veins and checking patency (see <a href=\"#i-a-1-b-4\">I.A.1.b.4<\/a>).<\/li><li>Precordial Doppler over the right heart: the most sensitive noninvasive monitor for venous air embolism; transesophageal echocardiography is more sensitive still.<\/li><li>Transcranial Doppler: middle cerebral artery velocities for vasospasm and emboli.<\/li><li>Esophageal Doppler: descending aortic blood velocity, from which stroke volume and cardiac output are estimated.<\/li><li>Doppler blood pressure: a probe over an artery detects return of flow as the cuff deflates, giving the systolic pressure only. Useful in infants and in shock.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> aliasing limits pulsed-wave and color Doppler. When velocity exceeds half the pulse repetition frequency, the signal wraps around and looks like flow in the opposite direction; measure fast jets with continuous-wave Doppler.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-a-3\">I.A.2.a.3 Principles of Ultrasound<\/a> · <a href=\"#i-a-1-b-4\">I.A.1.b.4 Neck ultrasound and central access<\/a> · <a href=\"#i-a-2-h-7\">I.A.2.h.7 Heart Function<\/a> · <a href=\"#i-a-2-h-6\">I.A.2.h.6 Blood Pressure<\/a><\/p>","b":"Sound reflected from moving blood comes back at a shifted frequency, and the shift tells you the speed and direction of flow. Keep the beam as parallel to flow as you can, and know which Doppler mode can measure fast jets (continuous-wave) and which can tell you where the flow is (pulsed-wave).","u":"2026-11-05"},"I.A.2.c":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> A vapor is a substance below its critical temperature, so pressure alone can turn it into a liquid; a gas is above it. Diffusion, solubility and critical temperature explain why nitrous oxide is stored as a liquid, why poorly soluble agents act fast, and why carbon dioxide crosses tissue about 20 times faster than oxygen.<\/p><h3 class=\"nb-h\">Key terms<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Term<\/th><th scope=\"col\">Meaning<\/th><th scope=\"col\">Example<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Vapor pressure<\/th><td>Pressure of the vapor above its liquid at equilibrium; rises with temperature<\/td><td>Sevoflurane about 157 mmHg at 20 °C<\/td><\/tr><tr><th scope=\"row\">Boiling point<\/th><td>Temperature at which vapor pressure equals ambient pressure<\/td><td>Desflurane boils at about 23 °C at sea level<\/td><\/tr><tr><th scope=\"row\">Latent heat of vaporization<\/th><td>Heat absorbed when a liquid evaporates<\/td><td>Vaporizers and nitrous oxide cylinders cool during use<\/td><\/tr><tr><th scope=\"row\">Partition coefficient<\/th><td>Ratio of concentrations in two phases at equilibrium<\/td><td>Blood:gas coefficient sets speed of onset<\/td><\/tr><tr><th scope=\"row\">Critical temperature<\/th><td>Above it, no pressure can liquefy the substance<\/td><td>Oxygen −119 °C (a gas); nitrous oxide 36.5 °C (a vapor at room temperature)<\/td><\/tr><\/tbody><\/table><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-d\">I.A.2.d Gas Laws<\/a> · <a href=\"#i-a-2-e\">I.A.2.e Vaporizers<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a> · <a href=\"#i-a-2-f\">I.A.2.f Uptake and Distribution<\/a><\/p>","b":"A vapor is a substance below its critical temperature, so pressure alone can turn it into a liquid; a gas is above it. Diffusion, solubility and critical temperature explain why nitrous oxide is stored as a liquid, why poorly soluble agents act fast, and why carbon dioxide crosses tissue about 20 times faster than oxygen.","u":"2026-11-05"},"I.A.2.c.1":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Gases diffuse down their partial pressure gradient. Across a membrane, the rate rises with area, solubility and the pressure difference and falls with thickness, so carbon dioxide, which is far more soluble than oxygen, diffuses about 20 times faster.<\/p><h3 class=\"nb-h\">The laws<\/h3><ul><li>Fick's law: diffusion rate ∝ (area × solubility × partial pressure difference) ÷ (thickness × √molecular weight).<\/li><li>Graham's law: in the gas phase, the rate is inversely proportional to the square root of molecular weight, so lighter gases diffuse faster.<\/li><li>In tissue, solubility dominates. Carbon dioxide is about 24 times more soluble in water than oxygen and only slightly heavier, so it diffuses about 20 times faster. Hypoxemia from a diffusion problem therefore appears long before carbon dioxide retention.<\/li><\/ul><h3 class=\"nb-h\">Diffusing capacity (DLCO)<\/h3><ul><li>Carbon monoxide binds hemoglobin so tightly that its uptake is limited only by diffusion, which makes it the test gas for the lung's diffusing capacity.<\/li><li>It falls with less surface area (emphysema, lung resection), a thicker barrier (pulmonary fibrosis) and less blood in the capillaries (anemia, pulmonary vascular disease). It rises with polycythemia and alveolar hemorrhage.<\/li><\/ul><h3 class=\"nb-h\">Diffusion in the operating room<\/h3><ul><li>Diffusion hypoxia (Fink effect): when nitrous oxide is stopped, it pours out of the blood into the alveoli and dilutes oxygen and carbon dioxide. Give 100% oxygen for the first several minutes of emergence.<\/li><li>Nitrous oxide diffuses into air-filled spaces faster than nitrogen leaves them, enlarging bowel, pneumothoraces and air emboli and raising pressure in tracheal tube cuffs and the middle ear (see <a href=\"#i-a-2-f-4\">I.A.2.f.4<\/a>).<\/li><li>Gas exchange across the placenta and across membrane oxygenators follows the same rules.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> oxygen and carbon dioxide do not diffuse in proportion to molecular weight in the body. Solubility matters far more, which is why carbon dioxide crosses the alveolar membrane so much faster.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-c-2\">I.A.2.c.2 Solubility Coefficients<\/a> · <a href=\"#i-a-2-f-4\">I.A.2.f.4 Nitrous Oxide and Closed Spaces<\/a> · <a href=\"#i-a-4-b-5\">I.A.4.b.5 Effects on Respiration<\/a> · <a href=\"#i-c-2\">I.C.2 Respiratory System<\/a><\/p>","b":"Gases diffuse down their partial pressure gradient. Across a membrane, the rate rises with area, solubility and the pressure difference and falls with thickness, so carbon dioxide, which is far more soluble than oxygen, diffuses about 20 times faster.","u":"2026-11-05"},"I.A.2.c.2":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> By Henry's law, the amount of gas dissolved in a liquid is proportional to its partial pressure. A partition coefficient compares how much of an agent two phases hold at equal partial pressures: blood:gas sets the speed of onset, and oil:gas tracks potency.<\/p><h3 class=\"nb-h\">Henry's law<\/h3><ul><li>At a fixed temperature, dissolved gas = solubility × partial pressure.<\/li><li>Dissolved oxygen is 0.003 mL per dL of blood for each mmHg. At a PaO2 of 100 mmHg that is only 0.3 mL/dL; breathing 100% oxygen (PaO2 near 600) gives about 1.8 mL/dL, and hyperbaric oxygen at 3 atmospheres about 6 mL/dL, enough to meet resting needs without hemoglobin.<\/li><li>Dissolved carbon dioxide is about 0.03 mmol/L per mmHg, roughly 20 times more soluble than oxygen.<\/li><\/ul><h3 class=\"nb-h\">Partition coefficients<\/h3><ul><li>The ratio of an agent's concentrations in two phases once their partial pressures are equal. A blood:gas coefficient of 0.45 means each milliliter of blood holds 0.45 times as much agent as a milliliter of alveolar gas at equilibrium.<\/li><li>For gas in liquid, this ratio is the Ostwald coefficient, which does not depend on pressure. The Bunsen coefficient is the volume dissolved, corrected to standard conditions, per volume of liquid at 1 atmosphere.<\/li><\/ul><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Coefficient<\/th><th scope=\"col\">What it predicts<\/th><th scope=\"col\">Example<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Blood:gas<\/th><td>Speed of induction and emergence; lower is faster<\/td><td>Desflurane 0.45, sevoflurane 0.65, isoflurane 1.4<\/td><\/tr><tr><th scope=\"row\">Oil:gas<\/th><td>Potency; higher means a lower MAC<\/td><td>Isoflurane about 90, sevoflurane about 50, desflurane about 19<\/td><\/tr><tr><th scope=\"row\">Tissue:blood (brain, muscle, fat)<\/th><td>How much agent the tissues soak up, and how long recovery takes after long cases<\/td><td>Fat:blood is high for all volatiles, so fat fills and empties slowly<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide vs nitrogen (blood:gas 0.47 vs 0.015)<\/th><td>Why nitrous oxide enlarges air-filled spaces<\/td><td>About 30 times more soluble than nitrogen<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Temperature<\/h3><ul><li>Gases dissolve more in cold liquids. Hypothermia raises the blood solubility of volatile agents (slowing changes in depth) and increases dissolved oxygen and carbon dioxide, which is the basis of alpha-stat versus pH-stat blood gas management (see <a href=\"#i-a-2-i-1\">I.A.2.i.1<\/a>).<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a highly soluble agent is slow, not fast. Blood acts as a sink that must fill before the alveolar, and therefore brain, partial pressure can rise.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a> · <a href=\"#i-a-2-f-1\">I.A.2.f.1 Uptake and elimination<\/a> · <a href=\"#i-a-2-c-1\">I.A.2.c.1 Diffusion of Gases<\/a> · <a href=\"#i-a-2-i-1\">I.A.2.i.1 Blood gases<\/a><\/p>","b":"By Henry's law, the amount of gas dissolved in a liquid is proportional to its partial pressure. A partition coefficient compares how much of an agent two phases hold at equal partial pressures: blood:gas sets the speed of onset, and oil:gas tracks potency.","u":"2026-11-05"},"I.A.2.c.3":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> The critical temperature is the temperature above which no amount of pressure can liquefy a substance, and the critical pressure is the pressure needed to liquefy it at that temperature. Oxygen, air and nitrogen are far above theirs at room temperature, so they are stored as compressed gases; nitrous oxide and carbon dioxide are below theirs, so they sit in the cylinder as liquids.<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Substance<\/th><th scope=\"col\">Critical temperature<\/th><th scope=\"col\">Critical pressure<\/th><th scope=\"col\">Stored as<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Helium<\/th><td>−268 °C<\/td><td>About 2 atm<\/td><td>Compressed gas<\/td><\/tr><tr><th scope=\"row\">Nitrogen<\/th><td>−147 °C<\/td><td>About 33 atm<\/td><td>Compressed gas<\/td><\/tr><tr><th scope=\"row\">Oxygen<\/th><td>−119 °C<\/td><td>About 50 atm<\/td><td>Compressed gas in cylinders; liquid in hospital bulk tanks<\/td><\/tr><tr><th scope=\"row\">Carbon dioxide<\/th><td>31 °C<\/td><td>About 73 atm<\/td><td>Liquid under its own vapor pressure<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide<\/th><td>36.5 °C<\/td><td>About 72 atm<\/td><td>Liquid under its own vapor pressure (745 psi at 20 °C)<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Consequences<\/h3><ul><li>Gas or vapor: a gas is above its critical temperature; a vapor is the gaseous form of a substance below it. Volatile anesthetics have critical temperatures far above room temperature, so they are liquids that give off vapor.<\/li><li>Nitrous oxide cylinders: pressure reflects the vapor pressure, not the amount left, until the liquid runs out (see <a href=\"#i-a-2-a-2\">I.A.2.a.2<\/a>). Above 36.5 °C the contents become a single gas phase and the pressure climbs, so cylinders are filled only part way with liquid (a lower filling ratio in hot climates) to leave room for expansion.<\/li><li>Hospital bulk oxygen is stored as a liquid at about −160 °C in an insulated tank and warmed into gas for the pipeline. A small volume of liquid makes a very large volume of gas.<\/li><\/ul><h3 class=\"nb-h\">Cooling as liquids and gases change state<\/h3><ul><li>Evaporation takes latent heat from the remaining liquid. Nitrous oxide cylinders frost at high flows, and vaporizers cool during use, which is why they need temperature compensation (see <a href=\"#i-a-2-e-2\">I.A.2.e.2<\/a>).<\/li><li>A compressed gas that expands rapidly cools (the Joule–Thomson effect), the principle behind cryoprobes. The reverse, sudden compression, heats gas, which is why cylinder valves are opened slowly.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a nitrous oxide cylinder reading 745 psi may be nearly full or three-quarters empty. Weigh it to know.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-a-2\">I.A.2.a.2 Medical Gas Cylinders<\/a> · <a href=\"#i-a-2-c\">I.A.2.c Properties of Liquids, Gases, and Vapors<\/a> · <a href=\"#i-a-2-e\">I.A.2.e Vaporizers<\/a> · <a href=\"#i-a-2-g-4\">I.A.2.g.4 Oxygen Supply Systems<\/a><\/p>","b":"The critical temperature is the temperature above which no amount of pressure can liquefy a substance, and the critical pressure is the pressure needed to liquefy it at that temperature. Oxygen, air and nitrogen are far above theirs at room temperature, so they are stored as compressed gases; nitrous oxide and carbon dioxide are below theirs, so they sit in the cylinder as liquids.","u":"2026-11-05"},"I.A.2.d":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> The gas laws link pressure, volume, temperature and amount: PV = nRT, with Dalton's law for mixtures and Henry's law for gas in liquid. Use absolute pressure and absolute temperature (kelvin), and remember that anesthetic effect follows partial pressure, not volume percent.<\/p><h3 class=\"nb-h\">The laws<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Law<\/th><th scope=\"col\">Statement<\/th><th scope=\"col\">Anesthesia example<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Boyle<\/th><td>P × V is constant at a fixed temperature<\/td><td>Oxygen cylinder contents fall in step with pressure; trapped gas expands as ambient pressure falls<\/td><\/tr><tr><th scope=\"row\">Charles<\/th><td>V is proportional to absolute temperature at a fixed pressure<\/td><td>Gas measured at room temperature expands when warmed to body temperature<\/td><\/tr><tr><th scope=\"row\">Gay-Lussac<\/th><td>P is proportional to absolute temperature at a fixed volume<\/td><td>A cylinder's pressure rises in a hot room<\/td><\/tr><tr><th scope=\"row\">Ideal gas law<\/th><td>PV = nRT<\/td><td>Combines the three above<\/td><\/tr><tr><th scope=\"row\">Avogadro<\/th><td>Equal volumes of gases at the same temperature and pressure hold equal numbers of molecules; 1 mole fills 22.4 L at 0 °C and 1 atm<\/td><td>1 mL of liquid volatile agent makes about 180 to 210 mL of vapor at room temperature<\/td><\/tr><tr><th scope=\"row\">Dalton<\/th><td>Total pressure is the sum of the partial pressures<\/td><td>Inspired PO2 = FiO2 × (barometric pressure − 47 mmHg)<\/td><\/tr><tr><th scope=\"row\">Henry<\/th><td>Dissolved gas is proportional to its partial pressure<\/td><td>0.003 mL of oxygen dissolves per dL of blood per mmHg<\/td><\/tr><tr><th scope=\"row\">Graham<\/th><td>Diffusion rate is inversely proportional to the square root of molecular weight<\/td><td>Light gases diffuse faster in the gas phase<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Standard conditions<\/h3><ul><li>STPD: 0 °C (273 K), 760 mmHg, dry. Used for gas amounts such as oxygen consumption.<\/li><li>BTPS: body temperature (37 °C), ambient pressure, saturated with water vapor (47 mmHg at 37 °C). Used for lung volumes.<\/li><li>ATPS: ambient temperature and pressure, saturated. What a spirometer measures; converting to BTPS adds several percent.<\/li><\/ul><h3 class=\"nb-h\">Worked examples<\/h3><ul><li>Altitude: in Denver (barometric pressure about 630 mmHg) inspired PO2 on room air is 0.21 × (630 − 47) ≈ 122 mmHg, against about 150 mmHg at sea level. Water vapor pressure stays 47 mmHg at any altitude.<\/li><li>Air transport: at a typical cabin altitude of 8,000 feet (about 565 mmHg), trapped gas expands by about a third (760 ÷ 565 ≈ 1.35). Tracheal tube cuffs, pneumothoraces and bowel all expand, so check cuff pressures or fill cuffs with saline.<\/li><li>Hyperbaric oxygen: at 3 atmospheres every partial pressure triples, so dissolved oxygen alone can meet resting needs (see <a href=\"#i-a-2-c-2\">I.A.2.c.2<\/a>).<\/li><li>Liquid use: milliliters of liquid volatile used per hour ≈ 3 × fresh gas flow (L/min) × dialed volume percent. At 2 L/min and 2% sevoflurane, that is about 12 mL per hour.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> anesthetic effect follows partial pressure, not volume percent. At altitude the same volume percent is a lower partial pressure, although variable-bypass vaporizers compensate on their own (see <a href=\"#i-a-2-e-2\">I.A.2.e.2<\/a>).<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-a\">I.A.2.a Mechanics<\/a> · <a href=\"#i-a-2-c-2\">I.A.2.c.2 Solubility Coefficients<\/a> · <a href=\"#i-a-2-e-1\">I.A.2.e.1 Vapor Pressure and Calculation of Anesthetic Concentrations<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a><\/p>","b":"The gas laws link pressure, volume, temperature and amount: PV = nRT, with Dalton's law for mixtures and Henry's law for gas in liquid. Use absolute pressure and absolute temperature (kelvin), and remember that anesthetic effect follows partial pressure, not volume percent.","u":"2026-11-05"},"I.A.2.e":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> A vaporizer turns liquid agent into a precise vapor concentration. Most are variable-bypass vaporizers that split fresh gas between a bypass and a saturating chamber, compensate for temperature and deliver a steady partial pressure; desflurane needs a heated, pressurized vaporizer, and newer machines meter or inject the agent electronically.<\/p><h3 class=\"nb-h\">Saturated vapor is far above a clinical dose<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Agent<\/th><th scope=\"col\">Vapor pressure at 20 °C (mmHg)<\/th><th scope=\"col\">Saturated concentration at sea level<\/th><th scope=\"col\">Typical MAC<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Sevoflurane<\/th><td>About 157<\/td><td>About 21%<\/td><td>About 2%<\/td><\/tr><tr><th scope=\"row\">Isoflurane<\/th><td>About 238<\/td><td>About 31%<\/td><td>About 1.2%<\/td><\/tr><tr><th scope=\"row\">Halothane<\/th><td>About 243<\/td><td>About 32%<\/td><td>About 0.75%<\/td><\/tr><tr><th scope=\"row\">Desflurane<\/th><td>About 669<\/td><td>About 88%<\/td><td>About 6%<\/td><\/tr><\/tbody><\/table><\/div><p>Saturated concentration = vapor pressure ÷ barometric pressure, which is why the vaporizer has to dilute chamber gas many times over.<\/p><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a> · <a href=\"#i-a-4-b-11\">I.A.4.b.11 MAC<\/a> · <a href=\"#i-a-2-d\">I.A.2.d Gas Laws<\/a> · <a href=\"#i-a-2-c\">I.A.2.c Properties of Liquids, Gases, and Vapors<\/a><\/p>","b":"A vaporizer turns liquid agent into a precise vapor concentration. Most are variable-bypass vaporizers that split fresh gas between a bypass and a saturating chamber, compensate for temperature and deliver a steady partial pressure; desflurane needs a heated, pressurized vaporizer, and newer machines meter or inject the agent electronically.","u":"2026-11-05"},"I.A.2.e.1":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> An agent's saturated vapor pressure depends only on the agent and its temperature. Gas leaving the vaporizing chamber is saturated, so the output is set by how much fresh gas goes through the chamber versus the bypass (the splitting ratio).<\/p><h3 class=\"nb-h\">Vapor pressure<\/h3><ul><li>Saturated vapor pressure rises steeply with temperature and does not depend on barometric pressure. When it equals ambient pressure, the liquid boils.<\/li><li>Saturated concentration = vapor pressure ÷ barometric pressure: about 21% for sevoflurane and 31% for isoflurane at sea level.<\/li><li>Evaporation cools the liquid, which lowers its vapor pressure; vaporizers compensate (see <a href=\"#i-a-2-e-2\">I.A.2.e.2<\/a>).<\/li><\/ul><h3 class=\"nb-h\">The splitting ratio<\/h3><ul><li>Vapor picked up = carrier gas through the chamber × vapor pressure ÷ (barometric pressure − vapor pressure).<\/li><li>Example, isoflurane (vapor pressure 238 mmHg) at sea level: each 100 mL/min through the chamber picks up 100 × 238 ÷ 522 ≈ 46 mL/min of vapor.<\/li><li>To deliver 1% isoflurane with 5 L/min of fresh gas you need about 50 mL/min of vapor, so about 110 mL/min passes through the chamber and about 4,890 mL/min bypasses it, a splitting ratio of roughly 1:44.<\/li><\/ul><h3 class=\"nb-h\">The wrong agent in a vaporizer<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Error<\/th><th scope=\"col\">Result<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Higher vapor pressure agent in the vaporizer (isoflurane in a sevoflurane vaporizer)<\/th><td>Overdose<\/td><\/tr><tr><th scope=\"row\">Lower vapor pressure agent (sevoflurane in an isoflurane vaporizer)<\/th><td>Underdose<\/td><\/tr><tr><th scope=\"row\">Desflurane in a standard vaporizer<\/th><td>Massive overdose; the agent can boil in the chamber<\/td><\/tr><tr><th scope=\"row\">Isoflurane and halothane swapped<\/th><td>Near-correct volume percent, because their vapor pressures are almost equal, but different potency<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Altitude and output<\/h3><ul><li>Anesthetic effect depends on partial pressure. A variable-bypass vaporizer delivers about the same partial pressure at any altitude, so no correction is needed; the volume percent it delivers is higher at altitude.<\/li><li>The desflurane vaporizer delivers a set volume percent, so at altitude the dial must be turned up: required setting ≈ desired percent × 760 ÷ barometric pressure.<\/li><\/ul><h3 class=\"nb-h\">Liquid consumption<\/h3><ul><li>1 mL of liquid volatile makes about 180 to 210 mL of vapor at room temperature.<\/li><li>mL of liquid used per hour ≈ 3 × fresh gas flow (L/min) × dialed volume percent; for example, 1 L/min of 2% sevoflurane uses about 6 mL per hour.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> gas in the chamber is saturated, at roughly 10 times a clinical dose. Anything that lets it reach the patient undiluted, such as a tipped vaporizer or liquid spilling into the bypass, can deliver a lethal concentration.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-e-2\">I.A.2.e.2 Vaporizer Types and Safety Features<\/a> · <a href=\"#i-a-2-d\">I.A.2.d Gas Laws<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a> · <a href=\"#i-a-2-c-3\">I.A.2.c.3 Critical Temperature<\/a><\/p>","b":"An agent's saturated vapor pressure depends only on the agent and its temperature. Gas leaving the vaporizing chamber is saturated, so the output is set by how much fresh gas goes through the chamber versus the bypass (the splitting ratio).","u":"2026-11-05"},"I.A.2.e.2":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Modern vaporizers are agent-specific, temperature-compensated and accurate across normal flows, but tipping, overfilling, back pressure and the wrong agent can all change their output. The agent analyzer, not the dial, shows what the patient receives.<\/p><h3 class=\"nb-h\">Types<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Type<\/th><th scope=\"col\">Examples<\/th><th scope=\"col\">How it works<\/th><th scope=\"col\">Notes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Variable bypass, flow-over<\/th><td>Tec 5 and 7, Dräger Vapor 2000 and 3000<\/td><td>Fresh gas splits between a bypass and a chamber where it flows over wicks and leaves saturated; a temperature-sensitive valve adjusts the split<\/td><td>Agent-specific, outside the breathing circuit, no power needed<\/td><\/tr><tr><th scope=\"row\">Heated, pressurized gas–vapor blender<\/th><td>Tec 6 and its successors, for desflurane<\/td><td>Heats desflurane to 39 °C (about 2 atm) and meters pure vapor into the fresh gas in proportion to flow<\/td><td>Needs electricity; delivers a set volume percent, so adjust it at altitude<\/td><\/tr><tr><th scope=\"row\">Electronically controlled cassette<\/th><td>GE Aladin<\/td><td>Agent-specific cassettes with flow controlled by the machine's computer; handles desflurane too<\/td><td>Needs power<\/td><\/tr><tr><th scope=\"row\">Direct injection<\/th><td>Some Maquet and Dräger machines<\/td><td>Liquid agent injected into the fresh gas under electronic control<\/td><td>Fast changes in concentration<\/td><\/tr><tr><th scope=\"row\">Draw-over<\/th><td>Oxford Miniature Vaporizer, EMO<\/td><td>The patient's own breaths (or a self-inflating bag) pull air through a low-resistance vaporizer<\/td><td>Austere and field settings without compressed gas<\/td><\/tr><tr><th scope=\"row\">Measured flow (historical)<\/th><td>Copper kettle, Vernitrol<\/td><td>A separate measured flow bubbles through the agent, and the user calculates the output<\/td><td>Not agent-specific; obsolete<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">What changes a variable-bypass vaporizer's output<\/h3><ul><li>Flow: accurate across usual flows, but output drops at very low flows (too little turbulence to carry vapor) and at very high flows (incomplete saturation).<\/li><li>Temperature: compensated within the working range, by a bimetallic strip or expanding element that narrows the chamber inlet as the vaporizer warms.<\/li><li>Intermittent back pressure (the pumping effect): positive-pressure breaths or the oxygen flush push gas back into the chamber, raising output, especially at low flows and low dial settings. Check valves and inlet design reduce it.<\/li><li>Carrier gas: adding nitrous oxide briefly lowers output because nitrous oxide dissolves in the liquid agent.<\/li><li>Tipping or overfilling: liquid enters the bypass and output can become dangerously high. Flush a tipped vaporizer at high flow with a low setting, as the manufacturer directs, before use.<\/li><\/ul><h3 class=\"nb-h\">Safety features<\/h3><ul><li>Keyed, agent-specific fillers and color coding: sevoflurane yellow, isoflurane purple, desflurane blue, halothane red.<\/li><li>An interlock lets only one vaporizer be turned on at a time.<\/li><li>Desflurane vaporizers alarm and shut off when they lose power, run low, or are tilted.<\/li><li>Filler caps and mounting O-rings are common sources of low-pressure leaks, so leak-check the machine with each vaporizer turned on.<\/li><li>The agent analyzer in the breathing circuit is the final check of what is delivered.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> putting desflurane or isoflurane into a sevoflurane vaporizer causes an overdose, because both have higher vapor pressures. Suspect a filling error whenever the measured agent does not match the dial.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-e-1\">I.A.2.e.1 Vapor Pressure and Calculation of Anesthetic Concentrations<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a> · <a href=\"#i-a-2-h-3\">I.A.2.h.3 Gas Concentrations<\/a> · <a href=\"#i-a-2-g-6\">I.A.2.g.6 Safety Features<\/a><\/p>","b":"Modern vaporizers are agent-specific, temperature-compensated and accurate across normal flows, but tipping, overfilling, back pressure and the wrong agent can all change their output. The agent analyzer, not the dial, shows what the patient receives.","u":"2026-11-05"},"I.A.2.f":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Anesthetic depth follows the partial pressure in the brain, which follows the alveolar partial pressure. The alveolar fraction (FA) rises toward the inspired fraction (FI) as delivery (inspired concentration and ventilation) outruns uptake into blood (solubility × cardiac output × alveolar-to-venous difference).<\/p><h3 class=\"nb-h\">Uptake in one line<\/h3><p>Uptake = blood:gas coefficient × cardiac output × (alveolar − venous partial pressure) ÷ barometric pressure. If any of the three terms is small, little agent leaves the alveoli and FA/FI rises quickly.<\/p><h3 class=\"nb-h\">What changes the speed of induction<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Factor<\/th><th scope=\"col\">Effect on the rise of FA/FI<\/th><th scope=\"col\">Larger for<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Lower blood:gas solubility<\/th><td>Faster<\/td><td>—<\/td><\/tr><tr><th scope=\"row\">Higher inspired concentration (overpressure, concentration effect)<\/th><td>Faster<\/td><td>Nitrous oxide at high concentrations<\/td><\/tr><tr><th scope=\"row\">More alveolar ventilation<\/th><td>Faster<\/td><td>Soluble agents<\/td><\/tr><tr><th scope=\"row\">Lower cardiac output<\/th><td>Faster<\/td><td>Soluble agents<\/td><\/tr><tr><th scope=\"row\">Higher fresh gas flow, smaller circuit volume<\/th><td>Faster (FI approaches the dialed value sooner)<\/td><td>All agents<\/td><\/tr><tr><th scope=\"row\">Right-to-left shunt<\/th><td>Slower rise of arterial partial pressure<\/td><td>Insoluble agents<\/td><\/tr><\/tbody><\/table><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a> · <a href=\"#i-a-4-b-11\">I.A.4.b.11 MAC<\/a> · <a href=\"#i-a-2-c-2\">I.A.2.c.2 Solubility Coefficients<\/a> · <a href=\"#i-a-2-g-3-a\">I.A.2.g.3.a Circle Systems<\/a><\/p>","b":"Anesthetic depth follows the partial pressure in the brain, which follows the alveolar partial pressure. The alveolar fraction (FA) rises toward the inspired fraction (FI) as delivery (inspired concentration and ventilation) outruns uptake into blood (solubility × cardiac output × alveolar-to-venous difference).","u":"2026-11-05"},"I.A.2.f.1":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> FA/FI rises steeply in the first minutes, bends as the vessel-rich organs fill, then creeps up for hours as muscle and fat take up agent. Insoluble agents rise fastest. More ventilation and a lower cardiac output speed the rise, mostly for soluble agents, and the breathing system's volume and fresh gas flow decide how soon the inspired concentration matches the dial. Elimination runs the same curve in reverse.<\/p><h3 class=\"nb-h\">Shape of the curve<\/h3><ul><li>Order of rise, fastest first: nitrous oxide and desflurane, then sevoflurane, isoflurane and halothane, following their blood:gas coefficients (about 0.47, 0.45, 0.65, 1.4 and 2.4).<\/li><li>Steep early rise: ventilation replaces the gas in the functional residual capacity (FRC) with gas that contains agent.<\/li><li>The knee: uptake into blood, most of it carried to the vessel-rich organs, starts to oppose the rise.<\/li><li>Slow late rise: once the vessel-rich group is near equilibrium (roughly 4 to 8 minutes), venous blood returns carrying more agent and uptake falls. What remains is slow uptake into muscle and fat.<\/li><\/ul><h3 class=\"nb-h\">Tissue groups<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Group<\/th><th scope=\"col\">Share of body mass<\/th><th scope=\"col\">Share of cardiac output<\/th><th scope=\"col\">Time to near equilibrium<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Vessel-rich (brain, heart, kidney, liver, endocrine glands)<\/th><td>About 10%<\/td><td>About 75%<\/td><td>Minutes (roughly 4 to 8)<\/td><\/tr><tr><th scope=\"row\">Muscle and skin<\/th><td>About 50%<\/td><td>About 19%<\/td><td>Hours<\/td><\/tr><tr><th scope=\"row\">Fat<\/th><td>About 20%<\/td><td>About 6%<\/td><td>Many hours to days for the potent agents, because fat holds so much of them<\/td><\/tr><tr><th scope=\"row\">Vessel-poor (bone, cartilage, ligaments, tendons)<\/th><td>About 20%<\/td><td>Near 0%<\/td><td>Takes up almost nothing<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Ventilation<\/h3><ul><li>More alveolar ventilation replaces agent as fast as blood removes it, so FA/FI rises faster. The gain is large for soluble agents (halothane, isoflurane) and small for insoluble ones, whose FA/FI is already close to its ceiling.<\/li><li>Spontaneous breathing gives negative feedback: as anesthesia deepens, ventilation falls and delivery slows. Controlled ventilation removes this protection, so an overdose of a potent agent is easier.<\/li><li>A small FRC relative to ventilation, as in infants and in pregnancy, speeds the early rise; a large FRC slows it.<\/li><\/ul><h3 class=\"nb-h\">Circulation<\/h3><ul><li>A higher cardiac output carries more agent away from the alveoli and slows the rise. A low cardiac output (shock, hypovolemia, heart failure) speeds it, again most for soluble agents.<\/li><li>In low-output states a larger share of the reduced flow goes to the brain and heart, so they reach a high partial pressure quickly.<\/li><li>Infants and young children have more alveolar ventilation per unit of FRC and send a larger share of cardiac output to the vessel-rich group, so FA/FI rises faster than in adults.<\/li><\/ul><h3 class=\"nb-h\">Shunts<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Shunt<\/th><th scope=\"col\">Effect on an inhaled induction<\/th><th scope=\"col\">Why<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Right-to-left (cyanotic heart disease, endobronchial intubation, atelectasis)<\/th><td>Slower rise of arterial and brain partial pressure, most for insoluble agents<\/td><td>Shunted blood carries no agent and dilutes blood from ventilated alveoli. Those alveoli now get more ventilation per unit of blood flow, which raises their partial pressure of a soluble agent enough to offset much of the dilution. An insoluble agent is already near FI there, so it cannot compensate.<\/td><\/tr><tr><th scope=\"row\">Left-to-right (atrial or ventricular septal defect, patent ductus)<\/th><td>Little effect in practice<\/td><td>Blood recirculating through the lungs already carries agent, which changes uptake only slightly<\/td><\/tr><\/tbody><\/table><\/div><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a right-to-left shunt slows an inhaled induction, most for insoluble agents, but speeds an intravenous one, because the drug bypasses the lungs and reaches the brain sooner.<\/p><\/div><h3 class=\"nb-h\">The breathing system<\/h3><ul><li>Circuit time constant = circuit volume ÷ fresh gas flow. Ignoring uptake by the patient, one time constant brings the circuit to 63% of a new dial setting, two to 86% and three to 95%.<\/li><li>Example: a 6 L circle system at 6 L/min has a time constant of 1 minute (95% in about 3 minutes). At 1 L/min it is 6 minutes (95% in about 18 minutes).<\/li><li>At low flows the patient rebreathes exhaled gas that has lost agent to the blood, so the inspired concentration stays below the dial setting, most of all early in the case when uptake is high. High flows close the gap.<\/li><li>Rubber and plastic parts and the CO2 absorbent, especially when dry, take up a little agent; this is minor with modern materials.<\/li><li>Non-rebreathing systems at high flow deliver close to the dial setting almost at once.<\/li><li>Overpressure, setting the dial well above the target alveolar concentration at first, speeds induction the way a loading dose does for an IV drug. Turn it down as FA approaches the target.<\/li><\/ul><h3 class=\"nb-h\">Elimination<\/h3><ul><li>FA falls fast at first as the lungs and vessel-rich group empty, then slowly as muscle and fat return agent to the blood.<\/li><li>It is faster with low solubility, high fresh gas flow (no rebreathing of exhaled agent), more alveolar ventilation and a shorter anesthetic.<\/li><li>After long cases the slow late phase lengthens, especially for soluble agents, because more agent is stored in muscle and fat. Desflurane recovery changes least with duration.<\/li><li>There is no overpressure in reverse: the inspired concentration cannot go below zero.<\/li><li>Metabolism contributes little, except for halothane (about 20% is metabolized).<\/li><li>At the end of a nitrous oxide anesthetic, outflowing nitrous oxide dilutes alveolar oxygen (diffusion hypoxia, see <a href=\"#i-a-2-f-3\">I.A.2.f.3<\/a>).<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> low cardiac output speeds the rise of FA/FI. In a patient in shock, a soluble agent at a usual inspired concentration can bring the heart and brain to a high partial pressure quickly, so lower concentrations are needed.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-f-2\">I.A.2.f.2 Concentration Effect<\/a> · <a href=\"#i-a-2-c-2\">I.A.2.c.2 Solubility Coefficients<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a> · <a href=\"#i-a-2-g-3-a\">I.A.2.g.3.a Circle Systems: Closed and Semi-Closed<\/a> · <a href=\"#ii-d-2-g-5\">II.D.2.g.5 Altered Uptake/Distribution of IV and Inhalation Anesthetics<\/a> · <a href=\"#ii-d-3-a-1\">II.D.3.a.1 Effects of Pregnancy on Uptake and Distribution<\/a><\/p>","b":"FA/FI rises steeply in the first minutes, bends as the vessel-rich organs fill, then creeps up for hours as muscle and fat take up agent. Insoluble agents rise fastest. More ventilation and a lower cardiac output speed the rise, mostly for soluble agents, and the breathing system's volume and fresh gas flow decide how soon the inspired concentration matches the dial. Elimination runs the same curve in reverse.","u":"2026-11-05"},"I.A.2.f.2":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> The higher the inspired concentration of a gas, the faster its alveolar concentration approaches the inspired concentration. Only nitrous oxide is given at concentrations high enough for this to matter.<\/p><h3 class=\"nb-h\">Two mechanisms<\/h3><ul><li>Concentrating effect: when a large volume of gas is taken up, the alveolar gas shrinks, so the agent left behind is more concentrated than simple proportional loss would leave it.<\/li><li>Augmented inflow: the volume taken up is replaced by fresh inspired gas drawn into the lungs, which brings in more agent.<\/li><\/ul><h3 class=\"nb-h\">Worked example: half the gas is taken up<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Inspired concentration<\/th><th scope=\"col\">After uptake (shrunken volume)<\/th><th scope=\"col\">After inflow refills the lung<\/th><th scope=\"col\">FA/FI<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">80% (80 parts in 100)<\/th><td>40 parts in 60, or 67%<\/td><td>72 parts in 100, or 72%<\/td><td>0.90<\/td><\/tr><tr><th scope=\"row\">10% (10 parts in 100)<\/th><td>5 parts in 95, or 5.3%<\/td><td>5.5 parts in 100, or 5.5%<\/td><td>0.55<\/td><\/tr><tr><th scope=\"row\">100%<\/th><td>Still 100%<\/td><td>100%<\/td><td>1.0<\/td><\/tr><\/tbody><\/table><\/div><p>The same fractional uptake costs the 80% mixture only a tenth of its concentration, but costs the 10% mixture almost half. At 100%, uptake changes only the volume, never the concentration.<\/p><h3 class=\"nb-h\">Where it matters<\/h3><ul><li>Nitrous oxide at 50 to 70%: its FA/FI rises faster than its low solubility alone would predict.<\/li><li>The effect is largest early, when uptake is greatest, and it is the basis of the second gas effect (see <a href=\"#i-a-2-f-3\">I.A.2.f.3<\/a>).<\/li><li>Volatile agents are given at a few percent, so the effect is negligible for them.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> the concentration effect is a gas speeding its own rise. The second gas effect is nitrous oxide speeding the rise of another gas given with it.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-f-1\">I.A.2.f.1 Uptake and Elimination Curves; Effect of Ventilation, Circulation, Anesthetic Systems<\/a> · <a href=\"#i-a-2-f-3\">I.A.2.f.3 Second Gas Effect<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a><\/p>","b":"The higher the inspired concentration of a gas, the faster its alveolar concentration approaches the inspired concentration. Only nitrous oxide is given at concentrations high enough for this to matter.","u":"2026-11-05"},"I.A.2.f.3":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> When a volatile agent is given with a high concentration of nitrous oxide, the fast uptake of nitrous oxide concentrates the volatile in the alveoli and draws in extra inspired gas, so the volatile's alveolar concentration rises faster. Oxygen is concentrated the same way. When nitrous oxide is stopped, the process runs in reverse and dilutes alveolar oxygen (diffusion hypoxia).<\/p><h3 class=\"nb-h\">How it works<\/h3><ul><li>Nitrous oxide is the first gas. Given at 50 to 70%, it is taken up in large volumes in the first minutes.<\/li><li>The alveolar gas shrinks, which concentrates everything left behind, including the volatile (the second gas) and oxygen.<\/li><li>Inspired gas is drawn in to replace the lost volume and brings in more volatile and oxygen (augmented inflow, as in <a href=\"#i-a-2-f-2\">I.A.2.f.2<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Simplified example<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Step<\/th><th scope=\"col\">Nitrous oxide<\/th><th scope=\"col\">Oxygen<\/th><th scope=\"col\">Volatile<\/th><th scope=\"col\">Total gas<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Start (the inspired mixture)<\/th><td>70 parts (70%)<\/td><td>29 parts (29%)<\/td><td>1 part (1%)<\/td><td>100 parts<\/td><\/tr><tr><th scope=\"row\">Half the nitrous oxide taken up<\/th><td>35 parts (54%)<\/td><td>29 parts (45%)<\/td><td>1 part (1.5%)<\/td><td>65 parts<\/td><\/tr><tr><th scope=\"row\">35 parts of inspired gas drawn in<\/th><td>59.5 parts (60%)<\/td><td>39.2 parts (39%)<\/td><td>1.35 parts (1.35%)<\/td><td>100 parts<\/td><\/tr><\/tbody><\/table><\/div><p>The example ignores uptake of oxygen and of the volatile, which is why both end above their inspired values. Real uptake keeps them lower, but still higher than they would be without nitrous oxide.<\/p><h3 class=\"nb-h\">What it means clinically<\/h3><ul><li>It has been shown in people, but the size of the effect is modest and largest in the first minutes, when nitrous oxide uptake is greatest.<\/li><li>It speeds the rise of the volatile during an induction with nitrous oxide, on top of nitrous oxide's own contribution to depth (MAC fractions add).<\/li><li>Alveolar oxygen rises briefly when nitrous oxide is started.<\/li><\/ul><h3 class=\"nb-h\">Diffusion hypoxia: the effect in reverse<\/h3><ul><li>When nitrous oxide is turned off, large volumes of it move from blood into the alveoli. Nitrogen, which replaces it, is far less soluble and enters the blood slowly.<\/li><li>The outflow dilutes alveolar oxygen and carbon dioxide. Lower alveolar CO2 also weakens the drive to breathe.<\/li><li>The risk is greatest in the first few minutes after nitrous oxide is stopped, in a patient breathing room air.<\/li><li>Prevention: give 100% oxygen for the first several minutes of emergence, commonly 5 to 10.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> diffusion hypoxia belongs to the end of a nitrous oxide anesthetic, not the start. At the start, the second gas effect briefly raises alveolar oxygen.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-f-2\">I.A.2.f.2 Concentration Effect<\/a> · <a href=\"#i-a-2-f-4\">I.A.2.f.4 Nitrous Oxide and Closed Spaces<\/a> · <a href=\"#i-a-4-b-5\">I.A.4.b.5 Effects on Respiration<\/a> · <a href=\"#i-c-2-a-4-b\">I.C.2.a.4.b Apneic Oxygenation, Diffusion Hypoxia<\/a><\/p>","b":"When a volatile agent is given with a high concentration of nitrous oxide, the fast uptake of nitrous oxide concentrates the volatile in the alveoli and draws in extra inspired gas, so the volatile's alveolar concentration rises faster. Oxygen is concentrated the same way. When nitrous oxide is stopped, the process runs in reverse and dilutes alveolar oxygen (diffusion hypoxia).","u":"2026-11-05"},"I.A.2.f.4":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Nitrous oxide is about 30 times more soluble in blood than nitrogen, so it enters an air-filled space much faster than nitrogen can leave. A compliant space grows; a stiff space rises in pressure. Avoid nitrous oxide wherever trapped gas matters, and never give it while an intraocular gas bubble remains.<\/p><h3 class=\"nb-h\">Why spaces expand<\/h3><ul><li>Blood:gas coefficients are about 0.47 for nitrous oxide and 0.015 for nitrogen, so blood brings far more nitrous oxide to the space than it carries nitrogen away.<\/li><li>At equilibrium a compliant space can reach 1 ÷ (1 − fraction of nitrous oxide) times its starting volume: 50% doubles it, 67% triples it and 75% quadruples it.<\/li><li>Speed depends on the blood flow around the space. A pneumothorax can double within minutes, while bowel gas expands over hours.<\/li><li>Eger and Saidman first showed this hazard in bowel obstruction and pneumothorax (<a href=\"https://doi.org/10.1097/00000542-196501000-00011\" target=\"_blank\" rel=\"noopener\">Eger and Saidman 1965<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Spaces to know<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Space<\/th><th scope=\"col\">What changes<\/th><th scope=\"col\">Effect<\/th><th scope=\"col\">Practical point<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Pneumothorax, lung bullae and cysts<\/th><td>Volume grows<\/td><td>A simple pneumothorax can become a tension pneumothorax; bullae can rupture<\/td><td>Avoid nitrous oxide, including in chest trauma and congenital lobar emphysema<\/td><\/tr><tr><th scope=\"row\">Bowel (obstruction, long open abdominal cases)<\/th><td>Volume grows, slowly<\/td><td>Distension can make the abdomen hard to close<\/td><td>Avoid in bowel obstruction<\/td><\/tr><tr><th scope=\"row\">Venous air embolism<\/th><td>Bubble volume grows<\/td><td>A small embolism has a larger effect<\/td><td>Avoid when the risk is high, as in a sitting craniotomy; stop it at once if an embolism occurs<\/td><\/tr><tr><th scope=\"row\">Middle ear<\/th><td>Pressure rises<\/td><td>Can lift a tympanic membrane graft; after nitrous oxide stops, it is absorbed and the pressure turns negative<\/td><td>Avoid it, or stop it before the graft is

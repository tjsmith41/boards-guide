"row\">Full midline laparotomy<\/th><td>T6 to T12, both sides<\/td><td>Thoracic epidural; rectus sheath catheters on both sides; TAP in all four quadrants<\/td><td>Wall blocks leave visceral pain to other analgesics<\/td><\/tr><tr><th scope=\"row\">Lower midline or Pfannenstiel (cesarean, gynecology)<\/th><td>T11 to L1<\/td><td>Lateral TAP, quadratus lumborum, ilioinguinal–iliohypogastric<\/td><td>A Pfannenstiel incision can trap the ilioinguinal or iliohypogastric nerve and cause chronic groin pain<\/td><\/tr><tr><th scope=\"row\">Inguinal hernia<\/th><td>T12, L1, genital branch of the genitofemoral<\/td><td>Ilioinguinal–iliohypogastric block plus infiltration of the cord or sac by the surgeon<\/td><td><\/td><\/tr><tr><th scope=\"row\">Umbilical hernia<\/th><td>T10<\/td><td>Rectus sheath on both sides<\/td><td><\/td><\/tr><tr><th scope=\"row\">Flank (open kidney surgery)<\/th><td>T10 to L1<\/td><td>Paravertebral, erector spinae, quadratus lumborum<\/td><td><\/td><\/tr><tr><th scope=\"row\">Laparoscopy<\/th><td>Port sites<\/td><td>Port infiltration or TAP<\/td><td>Visceral and shoulder pain remain<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Visceral pain and neuraxial levels<\/h3><ul><li>The parietal peritoneum of the front wall shares the somatic nerves of the skin over it, so its pain is sharp and well localized. The central diaphragm is supplied by the phrenic nerve (C3 to C5), so gas or blood under the diaphragm causes shoulder-tip pain after laparoscopy.<\/li><li>Visceral pain travels with autonomic nerves (sympathetic fibers to the thoracolumbar cord, the vagus, and the pelvic splanchnic nerves from S2 to S4). It is dull and poorly localized, and wall blocks do not touch it.<\/li><li>Spinal anesthesia for cesarean delivery needs a T4 level, far above the incision, because pulling on the peritoneum and handling the uterus are felt through higher segments.<\/li><\/ul><h3 class=\"nb-h\">TAP blocks after cesarean delivery<\/h3><ul><li>In a meta-analysis of nine trials (<a href=\"https://doi.org/10.1007/s12630-012-9729-1\" target=\"_blank\" rel=\"noopener\">Mishriky 2012<\/a>), TAP blocks reduced opioid use and pain after cesarean delivery when intrathecal morphine was not given, but added little when it was. Intrathecal morphine gave better analgesia than TAP blocks alone, with more opioid side effects.<\/li><li>So TAP or quadratus lumborum blocks fit when intrathecal morphine was not given (general anesthesia, or a contraindication), or as rescue analgesia (see <a href=\"#ii-d-3-g-4-b\">II.D.3.g.4.b<\/a>).<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a midline incision gets nerves from both sides with little crossover, so a one-sided wall block fails. Block both sides, or use neuraxial analgesia.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-b-5\">I.A.1.b.5 Abdominal wall ultrasound<\/a> · <a href=\"#ii-b-1-a-3\">II.B.1.a.3 Trunk blocks<\/a> · <a href=\"#ii-d-3-g-4-b\">II.D.3.g.4.b Pain management after cesarean delivery<\/a> · <a href=\"#i-a-1-a-5\">I.A.1.a.5 Dermatome Anatomy<\/a> · <a href=\"#i-a-1-c-3-a\">I.A.1.c.3.a Intercostal<\/a> · <a href=\"#ii-d-6\">II.D.6 Laparoscopic surgery<\/a><\/p>","b":"The abdominal wall is supplied by T6 to L1, nerves that run between the internal oblique and transversus abdominis and then through the rectus sheath. Wall blocks treat incision pain only, because visceral pain travels with autonomic nerves; that is why a cesarean delivery under spinal needs a T4 level although the incision lies near L1.","u":"2026-11-05"},"I.A.2.a":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Pressure is force per unit area, and anesthesia uses several units for it. Know the conversions, the difference between gauge and absolute pressure, and how the machine steps cylinder and pipeline pressures down to the low pressures that reach the patient.<\/p><h3 class=\"nb-h\">Pressure units<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Unit<\/th><th scope=\"col\">Equals<\/th><th scope=\"col\">Where you see it<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">1 atmosphere<\/th><td>760 mmHg = 101.3 kPa = 1.013 bar = 14.7 psi = 1,033 cmH2O<\/td><td>Barometric pressure at sea level<\/td><\/tr><tr><th scope=\"row\">1 kPa<\/th><td>7.5 mmHg = 10.2 cmH2O<\/td><td>Gas tensions in SI units<\/td><\/tr><tr><th scope=\"row\">1 mmHg<\/th><td>1.36 cmH2O<\/td><td>Blood pressure, gas tensions<\/td><\/tr><tr><th scope=\"row\">1 cmH2O<\/th><td>0.74 mmHg<\/td><td>Airway pressure, central venous pressure<\/td><\/tr><tr><th scope=\"row\">1 psi<\/th><td>51.7 mmHg = 6.9 kPa<\/td><td>Cylinder and pipeline pressures<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Gauge and absolute pressure<\/h3><ul><li>A gauge reads pressure above atmospheric (psig). Absolute pressure (psia) is the gauge reading plus atmospheric pressure, so a cylinder reading 2,000 psig holds about 2,015 psia.<\/li><li>Gas law calculations use absolute pressure. Partial pressures are fractions of the absolute total.<\/li><\/ul><h3 class=\"nb-h\">Pressure stages in the anesthesia machine<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Stage<\/th><th scope=\"col\">Pressure<\/th><th scope=\"col\">Parts<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">High<\/th><td>Cylinder pressure, up to about 2,200 psi for a full oxygen cylinder<\/td><td>Cylinders, hanger yokes, cylinder gauges, cylinder pressure regulators<\/td><\/tr><tr><th scope=\"row\">Intermediate<\/th><td>About 50 psi from the pipeline, or about 45 psi after the cylinder regulator<\/td><td>Pipeline inlets, check valves, oxygen pressure failure device, oxygen flush, flow control valves<\/td><\/tr><tr><th scope=\"row\">Low<\/th><td>Just above atmospheric<\/td><td>Flowmeters, vaporizers, outlet check valve (on some machines), common gas outlet<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Because the cylinder regulator delivers slightly less than pipeline pressure, the machine draws from the pipeline whenever it is connected and working. A cylinder valve left open drains silently if pipeline pressure falls.<\/li><li>The oxygen flush delivers 35 to 75 L/min straight from the intermediate-pressure system, bypassing the flowmeters and vaporizers. Used during inspiration with a closed circuit, it can cause barotrauma; used often, it dilutes the anesthetic.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-d\">I.A.2.d Gas Laws<\/a> · <a href=\"#i-a-2-g-4\">I.A.2.g.4 Oxygen Supply Systems<\/a> · <a href=\"#i-a-2-g-6\">I.A.2.g.6 Safety Features<\/a> · <a href=\"#i-a-2-i-3\">I.A.2.i.3 Pressure Transducers<\/a><\/p>","b":"Pressure is force per unit area, and anesthesia uses several units for it. Know the conversions, the difference between gauge and absolute pressure, and how the machine steps cylinder and pipeline pressures down to the low pressures that reach the patient.","u":"2026-11-05"},"I.A.2.a.1":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Every pressure is measured against a reference. A manometer balances it against a column of liquid, a Bourdon gauge against a bending tube, and an electronic transducer against a flexing diaphragm; for vascular pressures, where you zero and level the transducer matters as much as the device.<\/p><h3 class=\"nb-h\">Liquid columns<\/h3><ul><li>Pressure under a liquid column depends only on its height and density (P = ρgh), not on the shape of the container.<\/li><li>Water columns read small pressures (cmH2O: airway pressure, central venous pressure). Mercury is 13.6 times denser than water, so the same pressure lifts it 13.6 times less, which is why 1 mmHg equals 1.36 cmH2O.<\/li><li>A U-tube manometer reads the difference between the pressures at its two ends; with one end open to air it reads gauge pressure.<\/li><\/ul><h3 class=\"nb-h\">Mechanical gauges<\/h3><ul><li>Bourdon gauge: a curved, flattened tube that straightens as pressure rises and moves a needle. It reads cylinder and pipeline pressures and needs no power.<\/li><li>Aneroid (diaphragm or bellows) gauges read lower pressures, such as in aneroid blood pressure cuffs and breathing circuit pressure gauges.<\/li><\/ul><h3 class=\"nb-h\">Fluid-filled systems for vascular pressures<\/h3><ul><li>Zeroing: open the transducer to air so it reads atmospheric pressure as zero.<\/li><li>Leveling: place the transducer at the reference point. For most pressures that is the right atrium, at about the fourth intercostal space halfway between the front and back of the chest. To estimate brain perfusion in a sitting patient, level at the external ear.<\/li><li>Every 10 cm the transducer sits below the reference adds about 7.5 mmHg to the reading, and every 10 cm above subtracts it. That error is small for arterial pressure but large for a central venous pressure of 8 mmHg.<\/li><li>Zero and level give static accuracy. How faithfully the system follows a fast-changing waveform (resonance and damping) is covered in <a href=\"#i-a-2-i-3\">I.A.2.i.3<\/a>.<\/li><\/ul><h3 class=\"nb-h\">Gas pressures<\/h3><ul><li>Airway pressure is measured in the breathing circuit, usually in cmH2O.<\/li><li>In a compressed-gas cylinder (oxygen, air) the pressure falls in step with the contents. In a liquefied-gas cylinder (nitrous oxide, carbon dioxide) it stays constant until the liquid is gone (see <a href=\"#i-a-2-a-2\">I.A.2.a.2<\/a>).<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> zeroing and leveling are different steps. Zeroing removes atmospheric pressure; leveling removes the height error. If the bed is raised or lowered while the transducer stays on a fixed pole, every reading changes.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-i-3\">I.A.2.i.3 Pressure Transducers<\/a> · <a href=\"#i-a-2-h-6\">I.A.2.h.6 Blood Pressure<\/a> · <a href=\"#ii-a-1-a-1\">II.A.1.a.1 Vascular Pressures<\/a> · <a href=\"#i-a-2-a-2\">I.A.2.a.2 Cylinders and regulators<\/a><\/p>","b":"Every pressure is measured against a reference. A manometer balances it against a column of liquid, a Bourdon gauge against a bending tube, and an electronic transducer against a flexing diaphragm; for vascular pressures, where you zero and level the transducer matters as much as the device.","u":"2026-11-05"},"I.A.2.a.2":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Medical gases arrive from pipelines at about 50 psi or from cylinders at much higher pressure, and regulators bring cylinder gas down to a steady working pressure. Know each cylinder's color, pressure and contents, how to estimate the time left in an oxygen cylinder, and the systems that keep the wrong gas from reaching the patient.<\/p><h3 class=\"nb-h\">E cylinders (the size on anesthesia machines)<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Gas<\/th><th scope=\"col\">US color<\/th><th scope=\"col\">Full pressure (psi)<\/th><th scope=\"col\">Contents (L)<\/th><th scope=\"col\">Form in the cylinder<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Oxygen<\/th><td>Green (white internationally)<\/td><td>About 1,900 to 2,200<\/td><td>About 660<\/td><td>Compressed gas<\/td><\/tr><tr><th scope=\"row\">Air<\/th><td>Yellow<\/td><td>About 1,900<\/td><td>About 625<\/td><td>Compressed gas<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide<\/th><td>Blue<\/td><td>745<\/td><td>About 1,590<\/td><td>Liquid with vapor above it<\/td><\/tr><tr><th scope=\"row\">Carbon dioxide<\/th><td>Gray<\/td><td>838<\/td><td>About 1,590<\/td><td>Liquid with vapor above it<\/td><\/tr><tr><th scope=\"row\">Nitrogen<\/th><td>Black<\/td><td>About 1,800 to 2,200<\/td><td>About 610<\/td><td>Compressed gas<\/td><\/tr><tr><th scope=\"row\">Helium<\/th><td>Brown<\/td><td>About 1,600 to 2,000<\/td><td>About 500<\/td><td>Compressed gas<\/td><\/tr><\/tbody><\/table><\/div><ul><li>For a compressed gas, pressure falls in step with contents (Boyle's law), so the gauge shows how much is left.<\/li><li>For a liquefied gas, the pressure stays at the vapor pressure until the liquid is gone, when about three-quarters of the contents have been used. After that it falls quickly. Only weight shows how much is left.<\/li><\/ul><h3 class=\"nb-h\">Time left in an oxygen E cylinder<\/h3><ul><li>A full cylinder holds about 660 L at about 2,000 psi, so each psi is worth about a third of a liter.<\/li><li>Time in minutes ≈ (gauge pressure in psi × 0.3) ÷ flow in L/min. At 1,000 psi there are about 330 L: about 30 minutes at 10 L/min.<\/li><li>A bellows ventilator driven by oxygen also uses cylinder oxygen as its drive gas, so during a pipeline failure it can empty the cylinder fast. Use low fresh gas flows and hand ventilation to make it last.<\/li><\/ul><h3 class=\"nb-h\">Safety systems<\/h3><ul><li>Pin Index Safety System: pins on the cylinder yoke fit holes in that gas's cylinder valve only (oxygen 2 and 5, nitrous oxide 3 and 5, air 1 and 5). Two washers stacked in a yoke can let the wrong cylinder seat.<\/li><li>Diameter Index Safety System: gas-specific threaded fittings where pipeline hoses connect to the machine. Wall outlets use gas-specific quick connectors.<\/li><li>These systems fail with adapters, misassembly or a crossed pipeline, so the oxygen analyzer in the breathing circuit is the last line of defense.<\/li><li>Open cylinder valves slowly: sudden compression of gas into the regulator heats it and can ignite. Keep oil and grease off fittings.<\/li><li>Check valves in each yoke stop gas leaking out of an empty yoke and stop one cylinder filling another.<\/li><\/ul><h3 class=\"nb-h\">Regulators<\/h3><ul><li>A pressure regulator turns a high, falling inlet pressure into a lower, steady outlet pressure. A diaphragm balances a spring against the outlet pressure and opens or closes the valve to hold it constant.<\/li><li>On the machine the cylinder regulator delivers about 45 psi, just below pipeline pressure, so the pipeline is used first. Check the cylinder during the machine check, then close it so it is full when you need it.<\/li><\/ul><h3 class=\"nb-h\">Transducers<\/h3><ul><li>A transducer converts one form of energy into another, usually into an electrical signal.<\/li><li>Pressure transducer: pressure flexes a diaphragm attached to strain gauges in a Wheatstone bridge, changing their resistance and the output voltage in proportion to pressure (dynamic behavior in <a href=\"#i-a-2-i-3\">I.A.2.i.3<\/a>).<\/li><li>Others: thermistors and thermocouples (temperature), piezoelectric crystals (ultrasound probes), and photodetectors (pulse oximetry).<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> with a crossed pipeline, opening the oxygen cylinder is not enough. The machine keeps drawing the wrong gas from the pipeline at its higher pressure until you disconnect the pipeline hose.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-a-1\">I.A.2.a.1 Pressure Measurement<\/a> · <a href=\"#i-a-2-g-4\">I.A.2.g.4 Oxygen Supply Systems<\/a> · <a href=\"#i-a-2-g-6\">I.A.2.g.6 Safety Features<\/a> · <a href=\"#i-a-2-i-3\">I.A.2.i.3 Pressure Transducers<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a><\/p>","b":"Medical gases arrive from pipelines at about 50 psi or from cylinders at much higher pressure, and regulators bring cylinder gas down to a steady working pressure. Know each cylinder's color, pressure and contents, how to estimate the time left in an oxygen cylinder, and the systems that keep the wrong gas from reaching the patient.","u":"2026-11-05"},"I.A.2.a.3":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> An ultrasound probe sends pulses of sound and times their echoes to place each structure on the screen. Higher frequency gives finer detail but shallower penetration, and most artifacts come from the machine's assumptions: sound travels in a straight line at 1,540 m/s and each echo returns once.<\/p><h3 class=\"nb-h\">How an image forms<\/h3><ul><li>A piezoelectric crystal turns an electrical pulse into sound and turns returning echoes back into voltage. Medical imaging uses roughly 2 to 15 MHz; human hearing stops at about 20 kHz.<\/li><li>Depth = (speed × round-trip time) ÷ 2, using an assumed soft tissue speed of 1,540 m/s. Sound is slower in air (about 330 m/s) and fat, and much faster in bone.<\/li><li>Echoes come from boundaries between tissues of different acoustic impedance (density × speed of sound). Soft tissue against air or bone reflects almost everything, which is why gel is needed and why bone casts a shadow.<\/li><li>Bright structures are hyperechoic (bone surface, fascia, needle), gray ones hypoechoic, and black ones anechoic (blood, fluid, local anesthetic).<\/li><li>Sound weakens with depth (attenuation), and more so at higher frequency. Gain brightens the whole image; time-gain compensation brightens deeper echoes selectively.<\/li><\/ul><h3 class=\"nb-h\">Frequency, wavelength and resolution<\/h3><ul><li>Wavelength = speed ÷ frequency: about 0.3 mm at 5 MHz and 0.15 mm at 10 MHz. Shorter waves resolve finer detail but are absorbed sooner.<\/li><li>Axial resolution (along the beam) improves with higher frequency and shorter pulses.<\/li><li>Lateral resolution (side to side) depends on beam width and is best at the focal zone, so set the focus at the target.<\/li><li>Temporal resolution (frame rate) falls with greater depth, a wider sector and color Doppler.<\/li><\/ul><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Probe<\/th><th scope=\"col\">Frequency<\/th><th scope=\"col\">Depth<\/th><th scope=\"col\">Typical uses<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Linear<\/th><td>High, about 6 to 15 MHz<\/td><td>Shallow, a few centimeters<\/td><td>Vessels, most nerve blocks, airway, pleura<\/td><\/tr><tr><th scope=\"row\">Curved<\/th><td>Low, about 2 to 5 MHz<\/td><td>Deep<\/td><td>Abdomen, deep blocks, neuraxial imaging in adults<\/td><\/tr><tr><th scope=\"row\">Phased array<\/th><td>Low, about 1 to 5 MHz<\/td><td>Deep, through a small window<\/td><td>Heart between the ribs, transcranial Doppler<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Resonance<\/h3><ul><li>The crystal rings at a resonant frequency set by its thickness: thinner crystals make higher frequencies.<\/li><li>Backing material damps the ringing so pulses stay short (better axial resolution), and matching layers on the probe face ease the impedance step from crystal to skin.<\/li><li>Pressure transducers also resonate, with very different consequences (see <a href=\"#i-a-2-i-3\">I.A.2.i.3<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Common artifacts<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Artifact<\/th><th scope=\"col\">What you see<\/th><th scope=\"col\">Cause<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Acoustic shadow<\/th><td>Black band behind bone or a stone<\/td><td>Almost all sound reflected or absorbed<\/td><\/tr><tr><th scope=\"row\">Acoustic enhancement<\/th><td>Bright band behind fluid (vessels, cysts, local anesthetic)<\/td><td>Fluid weakens sound less than the gain setting expects<\/td><\/tr><tr><th scope=\"row\">Reverberation<\/th><td>Evenly spaced repeated lines (A-lines under the pleura, a ladder behind a needle)<\/td><td>Sound bouncing between two strong reflectors<\/td><\/tr><tr><th scope=\"row\">Mirror image<\/th><td>A copy of a structure beyond a strong curved reflector, such as liver above the diaphragm<\/td><td>The echo takes an indirect path back<\/td><\/tr><tr><th scope=\"row\">Anisotropy<\/th><td>A tendon or nerve darkens when the probe tilts<\/td><td>Smooth surfaces reflect best when the beam hits them squarely<\/td><\/tr><tr><th scope=\"row\">Bayonet<\/th><td>A straight needle looks bent<\/td><td>Sound travels at a different speed in the tissue the needle crosses<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Safety: absorbed energy warms tissue (thermal index) and pressure swings can cause cavitation (mechanical index). Use the lowest output and shortest scan that answer the question.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> the bright band of acoustic enhancement behind an artery can look like a nerve. Confirm a nerve by following it up and down its course.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-b-3\">I.A.2.b.3 Principles of Doppler Ultrasound<\/a> · <a href=\"#i-a-1-b-6\">I.A.1.b.6 Extremities ultrasound<\/a> · <a href=\"#ii-a-1-b-4\">II.A.1.b.4 Ultrasound-guided vascular catheters and nerve blocks<\/a> · <a href=\"#ii-a-1-b-5\">II.A.1.b.5 Point-of-Care Ultrasound<\/a><\/p>","b":"An ultrasound probe sends pulses of sound and times their echoes to place each structure on the screen. Higher frequency gives finer detail but shallower penetration, and most artifacts come from the machine's assumptions: sound travels in a straight line at 1,540 m/s and each echo returns once.","u":"2026-11-05"},"I.A.4.b.1":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Blood:gas solubility sets how fast an agent comes on and wears off, oil:gas solubility tracks potency, and vapor pressure decides what vaporizer it needs.<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Agent<\/th><th scope=\"col\">Blood:gas<\/th><th scope=\"col\">Oil:gas<\/th><th scope=\"col\">Vapor pressure at 20 °C (mmHg)<\/th><th scope=\"col\">Boiling point (°C)<\/th><th scope=\"col\">Pungent<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Desflurane<\/th><td>0.42–0.45<\/td><td>~19<\/td><td>~669<\/td><td>~23<\/td><td>Yes<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide<\/th><td>0.46–0.47<\/td><td>~1.4<\/td><td>Gas, stored as liquid<\/td><td>−88<\/td><td>No<\/td><\/tr><tr><th scope=\"row\">Sevoflurane<\/th><td>0.65–0.69<\/td><td>~50<\/td><td>~157<\/td><td>~59<\/td><td>No<\/td><\/tr><tr><th scope=\"row\">Isoflurane<\/th><td>1.4–1.46<\/td><td>~90–98<\/td><td>~238<\/td><td>~49<\/td><td>Yes<\/td><\/tr><tr><th scope=\"row\">Halothane<\/th><td>2.4–2.5<\/td><td>~224<\/td><td>~243<\/td><td>~50<\/td><td>No<\/td><\/tr><\/tbody><\/table><\/div><p>Values are approximate; textbooks differ slightly.<\/p><h3 class=\"nb-h\">Solubility and speed<\/h3><ul><li>A low blood:gas coefficient means little agent is taken up by blood, so the alveolar concentration (FA/FI) rises quickly. Induction, emergence and changes in depth are faster.<\/li><li>Speed, fastest first: desflurane and nitrous oxide, then sevoflurane, isoflurane, halothane.<\/li><li>After long cases, tissue (fat and muscle) solubility matters too: desflurane washes out fastest.<\/li><\/ul><h3 class=\"nb-h\">Potency (Meyer–Overton)<\/h3><ul><li>Higher oil:gas solubility means higher potency and a lower MAC. MAC multiplied by the oil:gas coefficient is roughly constant across agents.<\/li><li>Exceptions to this rule are part of the case for protein targets (see <a href=\"#i-a-4-b-2\">I.A.4.b.2<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Vapor pressure and vaporizers<\/h3><ul><li>Desflurane boils near room temperature, so it needs a heated, pressurized vaporizer (about 39 °C and 2 atm).<\/li><li>Variable-bypass vaporizers are agent-specific. Filling one with an agent of higher vapor pressure than it was built for delivers more vapor than dialed; desflurane in a standard vaporizer is the extreme case. Keyed fillers prevent most mix-ups.<\/li><li>Altitude: variable-bypass vaporizers deliver a constant partial pressure and need no correction. The desflurane vaporizer delivers a constant volume percent, so at altitude the dial must be turned up to keep the same partial pressure.<\/li><\/ul><h3 class=\"nb-h\">Pungency<\/h3><ul><li>Desflurane and isoflurane irritate the airway (coughing, breath-holding, laryngospasm), so they are not used for mask induction. Sevoflurane is the agent of choice for inhalational induction.<\/li><\/ul><h3 class=\"nb-h\">Nitrous oxide specifics<\/h3><ul><li>Its critical temperature is 36.5 °C, so it is stored as a liquid. Cylinder pressure stays near 745 psi until the liquid is gone; only weight shows how full the cylinder is.<\/li><li>It is about 30 times more soluble in blood than nitrogen, so it enters air-filled spaces faster than nitrogen leaves. Compliant spaces (bowel, pneumothorax, air embolus) expand: at equilibrium, 50% N2O can double the volume and 75% can quadruple it. Eger and Saidman first showed this hazard in bowel obstruction and pneumothorax (<a href=\"https://doi.org/10.1097/00000542-196501000-00011\" target=\"_blank\" rel=\"noopener\">Eger and Saidman 1965<\/a>).<\/li><li>Noncompliant spaces rise in pressure instead: middle ear, pneumocephalus, and the eye while an intraocular gas bubble remains.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-f\">I.A.2.f Uptake and Distribution of Inhalation Agents<\/a> · <a href=\"#i-a-4-b-11\">I.A.4.b.11 MAC<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a><\/p>","b":"Blood:gas solubility sets how fast an agent comes on and wears off, oil:gas solubility tracks potency, and vapor pressure decides what vaporizer it needs.","u":"2026-11-05"},"I.A.4.b.2":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> There is no single mechanism. Immobility comes mainly from the spinal cord, unconsciousness and amnesia come from the brain, and the agents act on several ion channels rather than on cell membranes in general.<\/p><h3 class=\"nb-h\">Where they act<\/h3><ul><li>Immobility, the MAC endpoint, is produced mainly in the spinal cord. In animal studies, removing the brain's influence barely changes the dose needed to stop movement, while delivering agent to the brain alone takes far more.<\/li><li>Unconsciousness involves the cortex, the thalamus and brainstem arousal networks.<\/li><li>Amnesia involves the hippocampus and amygdala, and it occurs at lower concentrations than loss of consciousness.<\/li><li>Rough order as concentration rises: amnesia, then unconsciousness (MAC-awake, about 0.3 to 0.4 MAC for volatile agents), then immobility (1 MAC), then blunting of the sympathetic response to incision (MAC-BAR, about 1.5 MAC).<\/li><\/ul><h3 class=\"nb-h\">Molecular targets<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Agents<\/th><th scope=\"col\">Main targets<\/th><th scope=\"col\">Effect<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Volatile agents<\/th><td>GABA-A receptors (potentiated)<\/td><td>More inhibitory chloride current<\/td><\/tr><tr><th scope=\"row\">Volatile agents<\/th><td>Glycine receptors (potentiated), mainly in the spinal cord<\/td><td>Contributes to immobility<\/td><\/tr><tr><th scope=\"row\">Volatile agents<\/th><td>Two-pore-domain K+ channels such as TREK-1 and TASK (activated)<\/td><td>Neuronal hyperpolarization<\/td><\/tr><tr><th scope=\"row\">Volatile agents<\/th><td>Presynaptic Na+ channels and neuronal nicotinic receptors (inhibited)<\/td><td>Less excitatory transmitter release<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide, xenon<\/th><td>NMDA receptors (blocked); little GABA-A effect<\/td><td>Analgesia and anesthesia by a different route, like ketamine<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Meyer–Overton and its exceptions<\/h3><ul><li>Potency tracks lipid solubility across a huge range of compounds, which led to the old lipid theory.<\/li><li>Evidence for protein targets instead: anesthetics inhibit a lipid-free protein (firefly luciferase) at clinical concentrations; mirror-image forms (enantiomers) of some agents act differently at ion channels; some lipid-soluble compounds predicted to anesthetize do not (nonimmobilizers); and potency disappears beyond a certain molecular size (cutoff effect).<\/li><\/ul><h3 class=\"nb-h\">Clinical tie-ins<\/h3><ul><li>Because immobility is mostly spinal, MAC does not measure hypnosis. When neuromuscular blockers remove movement as a warning sign, rely on end-tidal agent monitoring and, where useful, processed EEG.<\/li><li>Opioids, alpha-2 agonists and IV anesthetics reduce MAC by acting at spinal and supraspinal sites, each through its own receptors.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-11\">I.A.4.b.11 MAC<\/a> · <a href=\"#i-b-3-a\">I.B.3.a Stages and Signs of Anesthesia; Awareness under Anesthesia<\/a> · <a href=\"#i-a-4-b-3\">I.A.4.b.3 Effects on CNS<\/a><\/p>","b":"There is no single mechanism. Immobility comes mainly from the spinal cord, unconsciousness and amnesia come from the brain, and the agents act on several ion channels rather than on cell membranes in general.","u":"2026-11-05"},"I.A.4.b.3":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Volatile agents lower brain metabolism but dilate cerebral vessels. Below about 1 MAC the two roughly cancel; above it, cerebral blood flow and ICP rise. Nitrous oxide raises metabolism, blood flow and ICP.<\/p><h3 class=\"nb-h\">Metabolism and blood flow<\/h3><ul><li>CMRO2 falls with dose, by up to about 50% once the EEG is isoelectric (isoflurane, sevoflurane and desflurane at roughly 1.5 to 2 MAC). Halothane rarely reaches an isoelectric EEG at tolerable doses.<\/li><li>Direct cerebral vasodilation raises CBF. Around 0.5 MAC the fall in metabolism offsets it; above about 1 MAC vasodilation wins, so flow rises while metabolism falls (flow–metabolism uncoupling).<\/li><li>Vasodilating potency: halothane &gt; isoflurane ≈ desflurane &gt; sevoflurane.<\/li><li>Autoregulation is impaired with dose; sevoflurane preserves it best.<\/li><li>CO2 reactivity is preserved, so modest hyperventilation can blunt the rise in CBF and ICP.<\/li><\/ul><h3 class=\"nb-h\">Raised ICP in practice<\/h3><ul><li>Keep volatile agents at or below about 1 MAC, or use propofol-based TIVA when ICP is critical.<\/li><li>Nitrous oxide increases CMRO2, CBF and ICP; IV anesthetics blunt this. Avoid it with pneumocephalus, which counts as a closed gas space.<\/li><\/ul><h3 class=\"nb-h\">EEG<\/h3><ul><li>Low doses cause fast (beta) activation. Deeper levels bring slower, higher-amplitude waves, then burst suppression, then an isoelectric EEG.<\/li><li>Epileptiform activity: enflurane, especially with hypocapnia, is the classic cause. Sevoflurane can cause epileptiform EEG during high-concentration induction, particularly in children. Isoflurane and desflurane are anticonvulsant.<\/li><\/ul><h3 class=\"nb-h\">Evoked potentials<\/h3><ul><li>Volatile agents reduce amplitude and prolong latency of SSEPs and MEPs in a dose-dependent way. MEPs are the most sensitive, and nitrous oxide adds to the depression.<\/li><li>Common practice for MEP monitoring is 0.5 MAC or less of volatile agent, or TIVA.<\/li><li>Brainstem auditory evoked potentials are resistant to anesthetics.<\/li><\/ul><h3 class=\"nb-h\">Emergence and the developing brain<\/h3><ul><li>Emergence delirium in children is more common after sevoflurane and desflurane.<\/li><li>In 2016 the FDA warned that repeated or lengthy (over 3 hours) anesthetic exposure in children under 3 years or in the third trimester may affect brain development.<\/li><li>In the GAS trial, about an hour of sevoflurane anesthesia in infancy gave the same IQ at age 5 as awake-regional anesthesia (<a href=\"https://doi.org/10.1016/S0140-6736%2818%2932485-1\" target=\"_blank\" rel=\"noopener\">McCann 2019<\/a>).<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#ii-a-1-a-3\">II.A.1.a.3 Brain and Spinal Cord Function monitoring (EEG, evoked potentials)<\/a> · <a href=\"#i-a-4-b-2\">I.A.4.b.2 Mechanism of Action<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a><\/p>","b":"Volatile agents lower brain metabolism but dilate cerebral vessels. Below about 1 MAC the two roughly cancel; above it, cerebral blood flow and ICP rise. Nitrous oxide raises metabolism, blood flow and ICP.","u":"2026-11-05"},"I.A.4.b.4":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> All volatile agents lower blood pressure with dose. Isoflurane, desflurane and sevoflurane do it mainly by lowering SVR; halothane does it mainly by depressing contractility and cardiac output.<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Effect<\/th><th scope=\"col\">Sevoflurane<\/th><th scope=\"col\">Desflurane<\/th><th scope=\"col\">Isoflurane<\/th><th scope=\"col\">Halothane<\/th><th scope=\"col\">Nitrous oxide<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">MAP<\/th><td>Down<\/td><td>Down<\/td><td>Down<\/td><td>Down<\/td><td>Little change<\/td><\/tr><tr><th scope=\"row\">SVR<\/th><td>Down<\/td><td>Down<\/td><td>Down<\/td><td>Little change<\/td><td>Little change<\/td><\/tr><tr><th scope=\"row\">Heart rate<\/th><td>Little change<\/td><td>Up; surges with rapid increases<\/td><td>Up<\/td><td>Down<\/td><td>Little change<\/td><\/tr><tr><th scope=\"row\">Cardiac output<\/th><td>Maintained<\/td><td>Maintained<\/td><td>Maintained<\/td><td>Down<\/td><td>Little change<\/td><\/tr><tr><th scope=\"row\">Contractility<\/th><td>Down<\/td><td>Down<\/td><td>Down<\/td><td>Down most<\/td><td>Direct depression, offset by sympathetic stimulation<\/td><\/tr><tr><th scope=\"row\">Epinephrine arrhythmias<\/th><td>Low risk<\/td><td>Low risk<\/td><td>Low risk<\/td><td>High risk<\/td><td>None<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Key points<\/h3><ul><li>Desflurane: raising the concentration quickly above about 1 MAC triggers a transient sympathetic surge (tachycardia, hypertension). Opioids, beta-blockers or slower increases blunt it.<\/li><li>Halothane sensitizes the myocardium to catecholamines. With submucosal epinephrine, the dose causing ventricular ectopy in half of patients was 2.1 mcg/kg under halothane, 6.7 under isoflurane and 10.9 under enflurane; adding lidocaine raised the halothane figure to 3.7 (<a href=\"https://doi.org/10.1213/00000539-197609000-00021\" target=\"_blank\" rel=\"noopener\">Johnston 1976<\/a>).<\/li><li>Halothane also slows the SA node, so bradycardia and junctional rhythms are common.<\/li><li>Volatile agents, sevoflurane included, prolong the QTc. Take care in congenital long QT syndrome.<\/li><li>The baroreceptor reflex is depressed with dose, most by halothane.<\/li><li>Isoflurane dilates small coronary arterioles, which raised a theoretical worry about coronary steal. Clinical studies have not shown it to matter.<\/li><li>Volatile agents precondition the myocardium against ischemia in laboratory models. In the MYRIAD trial of 5,400 CABG patients, volatile anesthesia did not lower 1-year mortality compared with TIVA (2.8% vs 3.0%) (<a href=\"https://doi.org/10.1056/NEJMoa1816476\" target=\"_blank\" rel=\"noopener\">Landoni 2019<\/a>).<\/li><li>Nitrous oxide raises pulmonary vascular resistance, most in patients with pulmonary hypertension. Added to a high-dose opioid technique, it can depress cardiac output and blood pressure.<\/li><li>Hypovolemic or shocked patients drop their pressure more with any volatile agent, so titrate carefully.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a> · <a href=\"#i-a-4-b-11\">I.A.4.b.11 MAC<\/a> · <a href=\"#i-a-4-b-5\">I.A.4.b.5 Effects on Respiration<\/a><\/p>","b":"All volatile agents lower blood pressure with dose. Isoflurane, desflurane and sevoflurane do it mainly by lowering SVR; halothane does it mainly by depressing contractility and cardiac output.","u":"2026-11-05"},"I.A.4.b.5":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Volatile agents cause dose-dependent respiratory depression with rapid, shallow breathing and a rising PaCO2. They blunt the response to CO2 and, even more, the response to hypoxemia, and they relax airway smooth muscle.<\/p><h3 class=\"nb-h\">Ventilation<\/h3><ul><li>Tidal volume falls and respiratory rate rises, but minute and alveolar ventilation fall, so PaCO2 rises. Dead space makes up a larger share of each breath.<\/li><li>The CO2 response curve flattens and shifts right, and the apneic threshold rises.<\/li><li>The hypoxic ventilatory response, driven by the carotid bodies, is depressed even at subanesthetic concentrations (around 0.1 MAC); studies differ on how much. This matters in PACU, where leftover agent meets hypoxemia.<\/li><li>Surgical stimulation partly offsets the depression.<\/li><\/ul><h3 class=\"nb-h\">Airways<\/h3><ul><li>Volatile agents are bronchodilators. Sevoflurane is a common choice in asthma and during bronchospasm.<\/li><li>Desflurane can raise airway resistance in smokers and in reactive airways, especially above 1 MAC.<\/li><li>Pungent agents (desflurane more than isoflurane) cause coughing, breath-holding and laryngospasm when given by mask.<\/li><li>Mucociliary clearance is depressed, worse with dry gases.<\/li><\/ul><h3 class=\"nb-h\">Pulmonary circulation and lung volume<\/h3><ul><li>Volatile agents inhibit hypoxic pulmonary vasoconstriction with dose. At 1 MAC or less the effect during one-lung ventilation is small. Propofol does not inhibit it.<\/li><li>Functional residual capacity falls under general anesthesia with any agent, promoting atelectasis.<\/li><\/ul><h3 class=\"nb-h\">Nitrous oxide<\/h3><ul><li>It causes only modest respiratory depression but also blunts the hypoxic response.<\/li><li>Diffusion hypoxia (Fink effect): when N2O is stopped, it floods from blood into the alveoli and dilutes oxygen. Give 100% oxygen for the first several minutes of emergence.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-4\">I.A.4.b.4 Effects on Cardiovascular System<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a><\/p>","b":"Volatile agents cause dose-dependent respiratory depression with rapid, shallow breathing and a rising PaCO2. They blunt the response to CO2 and, even more, the response to hypoxemia, and they relax airway smooth muscle.","u":"2026-11-05"},"I.A.4.b.6":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Volatile agents relax skeletal muscle and potentiate nondepolarizing neuromuscular blockers, and every potent volatile agent can trigger malignant hyperthermia. Nitrous oxide does neither in any meaningful way.<\/p><h3 class=\"nb-h\">Skeletal muscle<\/h3><ul><li>Relaxation is dose-dependent and comes from actions on spinal motor neurons and at the neuromuscular junction.<\/li><li>Volatile agents potentiate nondepolarizing blockers, lowering the dose needed and prolonging the block. A commonly cited order of potentiation is desflurane &gt; sevoflurane &gt; isoflurane &gt; halothane &gt; nitrous oxide-opioid or propofol anesthesia.<\/li><li>The effect grows with concentration and with time of exposure. Leftover agent at the end of a case can deepen an apparently fading block, so use quantitative twitch monitoring before extubation.<\/li><\/ul><h3 class=\"nb-h\">Malignant hyperthermia<\/h3><ul><li>Triggers: all potent volatile agents and succinylcholine.<\/li><li>Safe: nitrous oxide, propofol and other IV induction agents, opioids, benzodiazepines, ketamine, nondepolarizing blockers and local anesthetics.<\/li><li>For susceptible patients, use a vapor-free machine: remove or disable vaporizers, change the absorbent and flush the machine as the manufacturer directs (or fit activated charcoal filters).<\/li><\/ul><h3 class=\"nb-h\">Myopathies<\/h3><ul><li>In Duchenne and Becker muscular dystrophy, succinylcholine can cause hyperkalemic arrest, and volatile agents have been linked to rhabdomyolysis. Many clinicians prefer TIVA.<\/li><\/ul><h3 class=\"nb-h\">Smooth muscle note<\/h3><ul><li>Volatile agents relax uterine muscle with dose, which can worsen atony after delivery. Many clinicians lower the volatile dose after delivery and add nitrous oxide or IV agents. The same effect can help when uterine relaxation is needed, although nitroglycerin acts faster.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-b-6-i\">I.B.6.i Malignant Hyperthermia<\/a> · <a href=\"#ii-a-2-a-1-a\">II.A.2.a.1.a Malignant Hyperthermia (Including Diagnosis and Therapy)<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a><\/p>","b":"Volatile agents relax skeletal muscle and potentiate nondepolarizing neuromuscular blockers, and every potent volatile agent can trigger malignant hyperthermia. Nitrous oxide does neither in any meaningful way.","u":"2026-11-05"},"I.A.4.b.7":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Volatile agents lower renal blood flow, GFR and urine output mostly by lowering blood pressure and cardiac output. True nephrotoxicity came from fluoride with methoxyflurane; with sevoflurane the theoretical concern is compound A.<\/p><h3 class=\"nb-h\">Hemodynamic effects<\/h3><ul><li>Renal blood flow, GFR and urine output fall with dose. The changes are reversible and are limited by keeping blood pressure and volume up.<\/li><\/ul><h3 class=\"nb-h\">Fluoride<\/h3><ul><li>Methoxyflurane, heavily metabolized inside the kidney, caused vasopressin-resistant, high-output renal failure. Risk rose when serum fluoride passed about 50 µmol/L.<\/li><li>Sevoflurane also produces fluoride, and peaks can pass 50 µmol/L, yet it has not caused this injury. Its metabolism is hepatic rather than intrarenal, and it is eliminated quickly.<\/li><li>Enflurane produces modest fluoride; prolonged exposure plus enzyme induction (for example isoniazid) raises levels.<\/li><\/ul><h3 class=\"nb-h\">Compound A<\/h3><ul><li>A vinyl ether formed when sevoflurane reacts with strong bases (sodium or potassium hydroxide) in CO2 absorbents.<\/li><li>More forms with low fresh gas flow, high sevoflurane concentration and a warm absorbent.<\/li><li>It is nephrotoxic in rats. In humans, some studies found transient proteinuria or glycosuria but no clinically significant renal injury.<\/li><li>The US label says exposure \"should not exceed 2 MAC·hours at flow rates of 1 to 2 L/min\", that \"fresh gas flow rates &lt;1 L/min are not recommended\", and that KOH-containing absorbents are not recommended (<a href=\"https://medlibrary.org/lib/rx/meds/sevoflurane-1/page/6/\" target=\"_blank\" rel=\"noopener\">sevoflurane label<\/a>).<\/li><li>Absorbents without strong bases (calcium hydroxide lime) produce little or no compound A.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-10\">I.A.4.b.10 Biotransformation and Toxicity<\/a> · <a href=\"#i-a-4-b-14\">I.A.4.b.14 Environmental Implications<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a><\/p>","b":"Volatile agents lower renal blood flow, GFR and urine output mostly by lowering blood pressure and cardiac output. True nephrotoxicity came from fluoride with methoxyflurane; with sevoflurane the theoretical concern is compound A.","u":"2026-11-05"},"I.A.4.b.8":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Modern agents preserve hepatic blood flow well. The hepatotoxicity story is halothane, mostly through an immune reaction to its oxidative metabolites.<\/p><h3 class=\"nb-h\">Blood flow<\/h3><ul><li>Portal flow falls as cardiac output falls. Isoflurane, sevoflurane and desflurane keep hepatic arterial flow and hepatic oxygen delivery better than halothane, because the hepatic arterial buffer response is preserved.<\/li><li>With liver disease, protect hepatic oxygen delivery by keeping blood pressure and cardiac output up. Isoflurane, sevoflurane and desflurane are all acceptable.<\/li><\/ul><h3 class=\"nb-h\">Halothane hepatitis<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Feature<\/th><th scope=\"col\">Type I<\/th><th scope=\"col\">Type II<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Severity<\/th><td>Mild, transient rise in transaminases<\/td><td>Fulminant hepatic necrosis, often fatal<\/td><\/tr><tr><th scope=\"row\">How common<\/th><td>Up to about 1 in 5 patients<\/td><td>Roughly 1 in 10,000 to 35,000 adult exposures<\/td><\/tr><tr><th scope=\"row\">Mechanism<\/th><td>Reductive metabolism and hepatic hypoxia<\/td><td>Immune reaction to trifluoroacetyl (TFA) protein adducts formed by CYP2E1 oxidation<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Type II risk factors: repeated exposures, especially at short intervals; middle age; female sex; obesity; prior unexplained fever or jaundice after halothane; a family history. Children are rarely affected.<\/li><\/ul><h3 class=\"nb-h\">Cross-sensitivity<\/h3><ul><li>Enflurane, isoflurane and desflurane also form TFA or similar protein adducts, in proportion to how much of each is metabolized: halothane about 20%, enflurane about 2%, isoflurane about 0.2%, desflurane about 0.02%. Rare cases of hepatitis have followed each.<\/li><li>Sevoflurane is metabolized to hexafluoroisopropanol, not TFA, so it lacks this mechanism.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-10\">I.A.4.b.10 Biotransformation and Toxicity<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a><\/p>","b":"Modern agents preserve hepatic blood flow well. The hepatotoxicity story is halothane, mostly through an immune reaction to its oxidative metabolites.","u":"2026-11-05"},"I.A.4.b.9":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Nitrous oxide inactivates vitamin B12 and, with it, methionine synthase. Volatile agents suppress immune cells in the laboratory, but trials have not shown a clinical effect on infection or cancer recurrence.<\/p><h3 class=\"nb-h\">Nitrous oxide and vitamin B12<\/h3><ul><li>N2O oxidizes the cobalt in vitamin B12, irreversibly inactivating methionine synthase. Folate metabolism and DNA synthesis suffer, and homocysteine rises.<\/li><li>Prolonged or repeated exposure causes megaloblastic bone marrow changes; exposures lasting days can cause agranulocytosis.<\/li><li>Patients with B12 deficiency (pernicious anemia, malabsorption, strict vegan diet) or severe MTHFR deficiency can develop subacute combined degeneration of the spinal cord after a single anesthetic. The same myeloneuropathy is seen in recreational N2O users.<\/li><li>In ENIGMA-II, 7,112 at-risk patients having major noncardiac surgery: N2O did not increase death or cardiovascular complications (8% vs 8%) or wound infection, but severe nausea and vomiting rose (15% vs 11%) (<a href=\"https://doi.org/10.1016/S0140-6736%2814%2960893-X\" target=\"_blank\" rel=\"noopener\">Myles 2014<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Volatile agents and immunity<\/h3><ul><li>In laboratory and animal studies, volatile agents suppress neutrophil, natural killer cell and lymphocyte function.<\/li><li>Retrospective studies suggested better cancer outcomes with propofol TIVA. In a trial of 2,108 women having breast cancer surgery, recurrence was 10% with paravertebral block plus propofol and 10% with sevoflurane plus opioids (<a href=\"https://doi.org/10.1016/S0140-6736%2819%2932313-X\" target=\"_blank\" rel=\"noopener\">Sessler 2019<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Coagulation<\/h3><ul><li>Small in-vitro effects on platelet aggregation (halothane, sevoflurane) are not clinically important.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-10\">I.A.4.b.10 Biotransformation and Toxicity<\/a> · <a href=\"#i-a-4-b-12\">I.A.4.b.12 Personnel Hazards<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a><\/p>","b":"Nitrous oxide inactivates vitamin B12 and, with it, methionine synthase. Volatile agents suppress immune cells in the laboratory, but trials have not shown a clinical effect on infection or cancer recurrence.","u":"2026-11-05"},"I.A.4.b.10":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> The more an agent is metabolized, the more toxic products it can make. Today most toxicity comes from reactions with CO2 absorbents rather than from metabolism.<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Agent<\/th><th scope=\"col\">Share metabolized<\/th><th scope=\"col\">Main products<\/th><th scope=\"col\">Key toxicity<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Methoxyflurane (historical)<\/th><td>~50–70%<\/td><td>Fluoride, formed partly inside the kidney<\/td><td>High-output renal failure<\/td><\/tr><tr><th scope=\"row\">Halothane<\/th><td>~20%<\/td><td>Trifluoroacetic acid, bromide, chloride; fluoride by reductive metabolism<\/td><td>Hepatitis<\/td><\/tr><tr><th scope=\"row\">Sevoflurane<\/th><td>~2–5%<\/td><td>Hexafluoroisopropanol (then glucuronidated) and fluoride<\/td><td>No TFA; compound A comes from absorbents, not metabolism<\/td><\/tr><tr><th scope=\"row\">Enflurane (historical)<\/th><td>~2.5%<\/td><td>Fluoride<\/td><td>Fluoride with long exposure<\/td><\/tr><tr><th scope=\"row\">Isoflurane<\/th><td>~0.2%<\/td><td>Small amounts of TFA and fluoride<\/td><td>Rare hepatitis; CO with dry absorbent<\/td><\/tr><tr><th scope=\"row\">Desflurane<\/th><td>~0.02%<\/td><td>Trace TFA<\/td><td>CO with dry absorbent<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide<\/th><td>~0.004%<\/td><td>Reduced by gut bacteria<\/td><td>B12 inactivation, which is not metabolic<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Enzymes<\/h3><ul><li>CYP2E1 does most of the oxidative metabolism. Ethanol and isoniazid induce it.<\/li><\/ul><h3 class=\"nb-h\">Carbon monoxide<\/h3><ul><li>Desiccated absorbents containing strong bases degrade desflurane (most), enflurane and isoflurane to carbon monoxide. Sevoflurane produces little.<\/li><li>Classic scenario: the first case on Monday morning, after fresh gas flowed through the machine all weekend and dried out the absorbent.<\/li><li>Prevention: turn off fresh gas flow when the machine is idle, change absorbent that may be dry, and use absorbents without strong bases.<\/li><\/ul><h3 class=\"nb-h\">Heat and fire<\/h3><ul><li>Sevoflurane with desiccated barium hydroxide lime (Baralyme) reacted exothermically, with extreme heat and fires reported. Baralyme was withdrawn from the US market.<\/li><\/ul><h3 class=\"nb-h\">Other points<\/h3><ul><li>Compound A and fluoride nephrotoxicity: see <a href=\"#i-a-4-b-7\">I.A.4.b.7<\/a>.<\/li><li>Halothane hepatitis: see <a href=\"#i-a-4-b-8\">I.A.4.b.8<\/a>.<\/li><li>Nitrous oxide is teratogenic in rodents after prolonged exposure; no human effect has been proven.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-7\">I.A.4.b.7 Effects on Renal Function<\/a> · <a href=\"#i-a-4-b-8\">I.A.4.b.8 Effects on Hepatic Function<\/a> · <a href=\"#i-a-4-b-9\">I.A.4.b.9 Hematologic and Immune Systems<\/a><\/p>","b":"The more an agent is metabolized, the more toxic products it can make. Today most toxicity comes from reactions with CO2 absorbents rather than from metabolism.","u":"2026-11-05"},"I.A.4.b.11":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> MAC is the alveolar concentration, at 1 atm, that prevents movement in response to surgical incision in 50% of patients. It is the standard measure of inhaled anesthetic potency, and many patient and drug factors shift it.<\/p><h3 class=\"nb-h\">Definitions<\/h3><ul><li>MAC is an ED50, measured as end-tidal concentration at steady state. The dose-response curve is steep: about 1.2 to 1.3 MAC prevents movement in roughly 95% of patients.<\/li><li>MAC-awake, the concentration at which half of patients open their eyes to command, is roughly 0.3 to 0.4 MAC for volatile agents.<\/li><li>MAC-BAR, which blocks the adrenergic response to incision in half of patients, is about 1.5 MAC.<\/li><li>Fractions of MAC roughly add: 0.5 MAC of nitrous oxide plus 0.5 MAC of sevoflurane is close to 1 MAC.<\/li><\/ul><h3 class=\"nb-h\">Values at age 40, in oxygen <span class=\"nb-cite\">(<a href=\"https://doi.org/10.1093/bja/76.2.179\" target=\"_blank\" rel=\"noopener\">Mapleson 1996<\/a>)<\/span><\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Agent<\/th><th scope=\"col\">MAC<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Halothane<\/th><td>0.75%<\/td><\/tr><tr><th scope=\"row\">Isoflurane<\/th><td>1.17%<\/td><\/tr><tr><th scope=\"row\">Sevoflurane<\/th><td>1.80%<\/td><\/tr><tr><th scope=\"row\">Desflurane<\/th><td>6.6%<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide<\/th><td>104%<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Other studies give slightly different figures; sevoflurane is often quoted near 2% and desflurane near 6%.<\/li><li>Nitrous oxide cannot reach 1 MAC at normal atmospheric pressure.<\/li><\/ul><h3 class=\"nb-h\">Age<\/h3><ul><li>MAC is highest in infancy. After the first year it falls about 6% per decade (Mapleson 1996), so an 80-year-old needs about 22% less than a 40-year-old.<\/li><\/ul><h3 class=\"nb-h\">Factors that lower MAC<\/h3><ul><li>Patient: increasing age, hypothermia, pregnancy, hyponatremia, acute alcohol intoxication.<\/li><li>Severe physiologic derangement: PaO2 below about 40 mmHg, MAP below about 40 mmHg, PaCO2 above about 95 mmHg, severe anemia.<\/li><li>Drugs: opioids, benzodiazepines, propofol and other IV anesthetics, ketamine, alpha-2 agonists (dexmedetomidine, clonidine), IV lidocaine, lithium, chronic amphetamine use.<\/li><\/ul><h3 class=\"nb-h\">Factors that raise MAC<\/h3><ul><li>Hyperthermia, hypernatremia, chronic alcohol use, acute amphetamine or cocaine use.<\/li><li>Red hair: in women with natural red hair, the desflurane requirement was about 19% higher (6.2% vs 5.2%), linked to melanocortin-1 receptor variants (<a href=\"https://doi.org/10.1097/00000542-200408000-00006\" target=\"_blank\" rel=\"noopener\">Liem 2004<\/a>).<\/li><\/ul><h3 class=\"nb-h\">No meaningful change<\/h3><ul><li>Sex, duration of anesthesia, thyroid status, serum potassium, and PaCO2 within roughly 15 to 95 mmHg.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> hyperthyroidism sounds as if it should raise MAC, but thyroid status does not meaningfully change it.<\/p><\/div><h3 class=\"nb-h\">Clinical use<\/h3><ul><li>MAC measures immobility, which is mostly spinal, not awareness. Age-adjusted MAC readouts and end-tidal alarms help avoid awareness when neuromuscular blockers hide movement.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-2\">I.A.4.b.2 Mechanism of Action<\/a> · <a href=\"#i-b-3-a\">I.B.3.a Stages and Signs of Anesthesia; Awareness under Anesthesia<\/a> · <a href=\"#i-a-4-c-7\">I.A.4.c.7 Dexmedetomidine<\/a><\/p>","b":"MAC is the alveolar concentration, at 1 atm, that prevents movement in response to surgical incision in 50% of patients. It is the standard measure of inhaled anesthetic potency, and many patient and drug factors shift it.","u":"2026-11-05"},"I.A.4.b.12":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Waste anesthetic gas is controlled by scavenging, leak checks and careful work habits. NIOSH recommends exposure limits; OSHA has no enforceable limit. With modern scavenging no risk to OR staff has been proven, but heavy unscavenged nitrous oxide exposure has been linked to lower fertility.<\/p><h3 class=\"nb-h\">Exposure limits <span class=\"nb-cite\">(<a href=\"https://www.osha.gov/waste-anesthetic-gases/workplace-exposures-guidelines\" target=\"_blank\" rel=\"noopener\">OSHA guidance<\/a>)<\/span><\/h3><ul><li>Nitrous oxide: NIOSH recommends 25 ppm as a time-weighted average during anesthetic administration.<\/li><li>Halogenated agents: no worker should be exposed to a ceiling above 2 ppm, over a sampling period of no more than 1 hour.<\/li><li>OSHA has no permissible exposure limits for these agents.<\/li><\/ul><h3 class=\"nb-h\">Where waste gas comes from<\/h3><ul><li>Mask induction and poor mask seals; uncuffed tubes and supraglottic airway leaks.<\/li><li>Turning on gas before the airway is secured; flushing the circuit; disconnections.<\/li><li>Filling vaporizers; leaks in the high-pressure (pipeline and cylinder) and low-pressure parts of the machine.<\/li><li>Patients exhaling agent in the PACU.<\/li><\/ul><h3 class=\"nb-h\">Scavenging systems<\/h3><ul><li>Active systems use hospital suction; passive systems rely on the patient's exhaled pressure.<\/li><li>Open interfaces are vented to the room and have no valves. Closed interfaces have a positive-pressure relief valve, plus a negative-pressure relief valve and reservoir bag when suction is used.<\/li><li>Failure modes: a blocked transfer hose can push pressure back into the breathing circuit and cause barotrauma; excess suction through a closed interface can pull negative pressure on the circuit.<\/li><\/ul><h3 class=\"nb-h\">Habits that cut exposure<\/h3><ul><li>Leak-check the machine daily, use cuffed airways where appropriate, and start gas flow only once the mask seal or airway is in place.<\/li><li>Turn off fresh gas flow, not just the vaporizer, before disconnecting the circuit.<\/li><li>Use keyed vaporizer fillers and keep room ventilation working.<\/li><\/ul><h3 class=\"nb-h\">Health evidence<\/h3><ul><li>Older studies from before scavenging linked chronic exposure to miscarriage and birth defects, but bias and confounding weaken them, and no causal link is established.<\/li><li>Female dental assistants exposed to unscavenged N2O for 5 or more hours a week were 41% as likely to conceive per cycle as unexposed women (<a href=\"https://doi.org/10.1056/NEJM199210013271405\" target=\"_blank\" rel=\"noopener\">Rowland 1992<\/a>).<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-14\">I.A.4.b.14 Environmental Implications<\/a> · <a href=\"#i-a-4-b-9\">I.A.4.b.9 Hematologic and Immune Systems<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a><\/p>","b":"Waste anesthetic gas is controlled by scavenging, leak checks and careful work habits. NIOSH recommends exposure limits; OSHA has no enforceable limit. With modern scavenging no risk to OR staff has been proven, but heavy unscavenged nitrous oxide exposure has been linked to lower fertility.","u":"2026-11-05"},"I.A.4.b.13":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Choose by speed, airway irritability and side effects: sevoflurane for mask induction, desflurane for the fastest wake-up (not with reactive airways), isoflurane when cost matters, and nitrous oxide as an adjunct.<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Feature<\/th><th scope=\"col\">Sevoflurane<\/th><th scope=\"col\">Desflurane<\/th><th scope=\"col\">Isoflurane<\/th><th scope=\"col\">Nitrous oxide<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">MAC at age 40<\/th><td>1.80%<\/td><td>6.6%<\/td><td>1.17%<\/td><td>104%<\/td><\/tr><tr><th scope=\"row\">Blood:gas<\/th><td>~0.65<\/td><td>~0.45<\/td><td>~1.4<\/td><td>~0.47<\/td><\/tr><tr><th scope=\"row\">Mask induction<\/th><td>Smooth; agent of choice<\/td><td>Airway irritant; avoid<\/td><td>Airway irritant; avoid<\/td><td>Fast, but too weak alone<\/td><\/tr><tr><th scope=\"row\">Emergence<\/th><td>Fast<\/td><td>Fastest volatile<\/td><td>Slower<\/td><td>Fast; give oxygen to prevent diffusion hypoxia<\/td><\/tr><tr><th scope=\"row\">Blood pressure<\/th><td>Down, via SVR<\/td><td>Down, via SVR<\/td><td>Down, via SVR<\/td><td>Little change<\/td><\/tr><tr><th scope=\"row\">Heart rate<\/th><td>Stable<\/td><td>Up; surges with rapid increases<\/td><td>Up<\/td><td>Stable<\/td><\/tr><tr><th scope=\"row\">Airways<\/th><td>Bronchodilator<\/td><td>May raise resistance in smokers<\/td><td>Bronchodilator<\/td><td>Little effect<\/td><\/tr><tr><th scope=\"row\">Share metabolized<\/th><td>~2–5%<\/td><td>~0.02%<\/td><td>~0.2%<\/td><td>~0.004%<\/td><\/tr><tr><th scope=\"row\">Watch for<\/th><td>Compound A; epileptiform EEG at high doses in children; emergence delirium<\/td><td>CO with dry absorbent; heated vaporizer; largest climate impact<\/td><td>Slower wake-up after long cases<\/td><td>Closed gas spaces; B12 inactivation; nausea<\/td><\/tr><tr><th scope=\"row\">MH trigger<\/th><td>Yes<\/td><td>Yes<\/td><td>Yes<\/td><td>No<\/td><\/tr><\/tbody><\/table><\/div><p>MAC values are from <a href=\"https://doi.org/10.1093/bja/76.2.179\" target=\"_blank\" rel=\"noopener\">Mapleson 1996<\/a>.<\/p><h3 class=\"nb-h\">Other agents<\/h3><ul><li>Halothane, no longer used in the US but still used elsewhere: slow onset, nonpungent, myocardial depression, bradycardia, epinephrine-induced arrhythmias, hepatitis.<\/li><li>Xenon: blood:gas about 0.115 and MAC roughly 60 to 70%. An NMDA antagonist with minimal cardiovascular effects, but costly and rarely available.<\/li><\/ul><h3 class=\"nb-h\">Putting it together<\/h3><ul><li>Inhalational induction, including in children: sevoflurane.<\/li><li>Fast emergence after long cases or in obesity: desflurane, unless the airway is reactive; weigh its climate impact (<a href=\"#i-a-4-b-14\">I.A.4.b.14<\/a>).<\/li><li>Lowest cost maintenance: isoflurane.<\/li><li>Cutting the volatile dose: add nitrous oxide, unless a closed gas space, B12 deficiency or high nausea risk argues against it.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a> · <a href=\"#i-a-4-b-4\">I.A.4.b.4 Effects on Cardiovascular System<\/a> · <a href=\"#i-a-4-b-11\">I.A.4.b.11 MAC<\/a> · <a href=\"#i-a-4-b-14\">I.A.4.b.14 Environmental Implications<\/a><\/p>","b":"Choose by speed, airway irritability and side effects: sevoflurane for mask induction, desflurane for the fastest wake-up (not with reactive airways), isoflurane when cost matters, and nitrous oxide as an adjunct.","u":"2026-11-05"},"I.A.4.b.14":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Inhaled anesthetics are exhaled almost unchanged and vented to the atmosphere, where they act as potent greenhouse gases. Desflurane and nitrous oxide have the largest impact; low fresh gas flows, choosing sevoflurane over desflurane, and TIVA or regional techniques reduce it.<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Agent<\/th><th scope=\"col\">Atmospheric lifetime<\/th><th scope=\"col\">100-year global warming potential (CO2 = 1)<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Desflurane<\/th><td>~14 years<\/td><td>~2,540 (published range 1,620–2,720)<\/td><\/tr><tr><th scope=\"row\">Isoflurane<\/th><td>~3.2 years<\/td><td>~510<\/td><\/tr><tr><th scope=\"row\">Sevoflurane<\/th><td>~1.1–1.4 years<\/td><td>~130<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide<\/th><td>~114 years<\/td><td>~265–300, and it depletes ozone<\/td><\/tr><\/tbody><\/table><\/div><p>Values vary by source; these are the ranges compiled in the <a href=\"https://mpog.org/wp-content/uploads/2023/06/MPOGSustainabilityToolkit_FGS-Reference-Update-6-22-2023.pdf\" target=\"_blank\" rel=\"noopener\">MPOG sustainability toolkit<\/a>. For background see <a href=\"https://doi.org/10.1213/ANE.0b013e31824d6150\" target=\"_blank\" rel=\"noopener\">Sulbaek Andersen 2012<\/a>.<\/p><h3 class=\"nb-h\">Why desflurane stands out<\/h3><ul><li>Per molecule it is the strongest greenhouse gas of the group, and it is used at about three to four times the volume percent of sevoflurane, so an hour of desflurane has many times the impact of an hour of sevoflurane at the same fresh gas flow.<\/li><\/ul><h3 class=\"nb-h\">Nitrous oxide<\/h3><ul><li>It persists for over a century and is described as the single most important ozone-depleting emission of this century.<\/li><li>Central N2O pipeline systems leak; hospitals that switched to portable cylinders cut losses.<\/li><\/ul><h3 class=\"nb-h\">What clinicians can do<\/h3><ul><li>Use low fresh gas flows during maintenance. For sevoflurane, the label limits still apply: 1 L/min or more, and no more than 2 MAC-hours at 1 to 2 L/min (see <a href=\"#i-a-4-b-7\">I.A.4.b.7<\/a>).<\/li><li>Avoid desflurane unless there is a clear clinical reason, and avoid routine nitrous oxide.<\/li><li>Consider TIVA or regional anesthesia when appropriate. Propofol's footprint is far smaller, though unused drug must be disposed of properly rather than poured down drains.<\/li><\/ul><h3 class=\"nb-h\">Policy<\/h3><ul><li>The EU prohibits desflurane from 1 January 2026 \"unless its use is required on medical grounds\" (<a href=\"https://www.anaesthesia.ie/sustainability/desflurance-guidance/\" target=\"_blank\" rel=\"noopener\">College of Anaesthesiologists of Ireland<\/a>).<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-12\">I.A.4.b.12 Trace Concentrations, OR Pollution<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a><\/p>","b":"Inhaled anesthetics are exhaled almost unchanged and vented to the atmosphere, where they act as potent greenhouse gases. Desflurane and nitrous oxide have the largest impact; low fresh gas flows, choosing sevoflurane over desflurane, and TIVA or regional techniques reduce it.","u":"2026-11-05"}}</script>
<script>
(function () {
  "use strict";
  var RAW = JSON.parse(document.getElementById("outline-data").textContent);
  var EXAM = { I: "BASIC", II: "ADVANCED" };
  var nodes = [], bySlug = new Map();

  function base(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function words(s) { return base(s).replace(/[^a-z0-9]+/g, " ").trim(); }
  /* index text: words split at punctuation, plus a copy with hyphens joined ("non depolarizing" and "nondepolarizing") */
  function norm(s) { return " " + words(s) + " " + base(s).replace(/[-‐‑]/g, "").replace(/[^a-z0-9]+/g, " ").trim() + " "; }
  function build(arr, parent, depth) {
    return arr.map(function (a) {
      var key = a[0].replace(/[.()]/g, "");
      var n = { m: a[0], t: a[1], p: a[2], depth: depth, parent: parent, idx: nodes.length };
      n.code = parent ? parent.code + "." + key : key;
      n.slug = n.code.toLowerCase().replace(/\./g, "-");
      n.part = parent ? parent.part : n;
      n.exam = EXAM[n.part.code];
      n.norm = norm(n.t);
      n.pathNorm = parent ? parent.pathNorm + " " + parent.norm : "";
      nodes.push(n); bySlug.set(n.slug, n);
      n.kids = build(a[3] || [], n, depth + 1);
      return n;
    });
  }
  var tree = build(RAW, null, 0);
  (function stats(list) {
    list.forEach(function (n) {
      stats(n.kids);
      n.count = n.kids.reduce(function (s, k) { return s + 1 + k.count; }, 0);
      n.p0 = n.kids.reduce(function (m, k) { return Math.min(m, k.p0); }, n.p);
      n.p1 = n.kids.reduce(function (m, k) { return Math.max(m, k.p1); }, n.p);
    });
  })(tree);
  var TOTAL = tree.reduce(function (s, p) { return s + p.count; }, 0);
  var sameDepth = {};
  nodes.forEach(function (n) {
    if (n.depth > 3) return;
    var k = n.part.code + ":" + n.depth;
    (sameDepth[k] = sameDepth[k] || []).push(n);
  });

  /* ---------- study notes written for this guide (filled in by build_site.py from ../notes) ---------- */
  var NOTES = {};
  try { NOTES = JSON.parse(document.getElementById("notes-data").textContent) || {}; } catch (e) { NOTES = {}; }
  nodes.forEach(function (n) { var s = NOTES[n.code]; if (s && typeof s.h === "string") n.sn = s; });
  (function countNotes(list) {
    list.forEach(function (n) { countNotes(n.kids); n.snCount = (n.sn ? 1 : 0) + n.kids.reduce(function (s, k) { return s + k.snCount; }, 0); });
  })(tree);
  /* items below a subtopic get their own page only when they have study notes */
  function hasPage(n) { return n.depth <= 3 || !!n.sn; }
  function pageFor(n) { while (n && !hasPage(n)) n = n.parent; return n; }
  function decodeEnt(s) { return s.replace(/&(amp|lt|gt|quot|#x27|#39);/g, function (m, e) { return { amp: "&", lt: "<", gt: ">", quot: '"', "#x27": "'", "#39": "'" }[e]; }); }
  function snPlain(n) {
    if (n.snPlain === undefined) n.snPlain = decodeEnt(n.sn.h.replace(/<[^>]+>/g, " ")).replace(/ +/g, " ").trim();
    return n.snPlain;
  }
  function snNorm(n) { if (n.snNorm === undefined) n.snNorm = norm(snPlain(n)); return n.snNorm; }
  function snip(n, terms) {
    var t = snPlain(n), low = base(t), i = -1;
    var cands = (terms.length > 1 ? [terms.join(" ")] : []).concat(terms.filter(function (x) { return x.length > 1; }).sort(function (x, y) { return y.length - x.length; }));
    for (var k = 0; k < cands.length && i < 0; k++) {
      var m = new RegExp("(^|[^a-z0-9])" + escRe(cands[k])).exec(low);
      if (m) i = m.index + m[1].length;
    }
    if (i < 0) i = 0;
    var start = Math.max(0, i - 70);
    if (start > 0) { var sp = t.indexOf(" ", start); if (sp >= 0 && sp < i) start = sp + 1; }
    var end = Math.min(t.length, start + 200);
    if (end < t.length) { var sp2 = t.lastIndexOf(" ", end); if (sp2 > i) end = sp2; }
    return (start > 0 ? "…" : "") + t.slice(start, end) + (end < t.length ? "…" : "");
  }
  /* a search matches study notes when every term is there; one-letter terms (like the A in "compound A") only count as part of the whole phrase */
  function snHit(n, terms) {
    var t = snNorm(n), phrase = terms.length > 1 && t.indexOf(" " + terms.join(" ")) >= 0;
    var ok = terms.every(function (x) { return x.length > 1 ? t.indexOf(" " + x) >= 0 : phrase; });
    return ok ? (phrase ? 1.5 : 1) : 0;
  }
  function snSection(n) {
    var s = n.sn, when = longDate(s.u);
    return '<section class="sn' + (n.exam === "ADVANCED" ? " adv" : "") + '" aria-labelledby="sn-h"><div class="sn-head"><h2 id="sn-h">Study notes</h2>' +
      (s.d ? '<span class="badge b-draft">Draft</span>' : "") + (when ? '<span class="sn-meta">Updated ' + esc(when) + "</span>" : "") + "</div>" +
      '<div class="sn-body">' + s.h + "</div></section>";
  }
  function snPanel() {
    var groups = new Map(), total = 0, draft = false;
    nodes.forEach(function (n) {
      if (!n.sn || !visiblePart(n.part)) return;
      if (n.sn.d) draft = true;
      var g = n.depth <= 3 ? n : ancestorAt(n, 3);
      groups.set(g, (groups.get(g) || 0) + 1); total++;
    });
    if (!groups.size) return "";
    return '<section class="panel"><div class="panel-head"><h2>Study notes</h2><span class="n">' + plural(total, "topic", "topics") + "</span></div>" +
      '<p class="panel-note">' + (draft ? "Drafts for review. Residents see study notes only after they’re approved." : "Written for this guide. Look for the Notes tag in any topic list." + (FB.mode ? " If something looks wrong, tell your attending with the Feedback button." : "")) + "</p>" +
      '<ul class="links sn-links">' + Array.from(groups.keys()).sort(function (a, b) { return a.idx - b.idx; }).map(function (g) {
        return '<li><a href="#' + g.slug + '"><span class="mk">' + esc(g.code) + "</span><span>" + esc(g.t) + '</span><span class="n">' + groups.get(g) + "</span></a></li>";
      }).join("") + "</ul></section>";
  }

  var $ = function (s) { return document.querySelector(s); };
  var main = $("#main"), status = $("#status"), q = $("#q"), side = $("#sidebar"), scrim = $("#scrim"), menuBtn = $("#menu-btn"), treeEl = $("#tree");
  var filter = "all";
  try { var saved = localStorage.getItem("exam-filter"); if (saved === "BASIC" || saved === "ADVANCED") filter = saved; } catch (e) {}

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function hl(text, re) {
    if (!re) return esc(text);
    var out = "", last = 0;
    text.replace(re, function (m, pre, word, off) { out += esc(text.slice(last, off)) + esc(pre) + "<mark>" + esc(word) + "</mark>"; last = off + m.length; return m; });
    return out + esc(text.slice(last));
  }
  function splitHead(t) {
    var i = t.indexOf(": ");
    return (i > 0 && i <= 70) ? [t.slice(0, i), t.slice(i + 2)] : [t, null];
  }
  function fmt(t, re) {
    var s = splitHead(t);
    return s[1] === null ? hl(t, re) : "<strong>" + hl(s[0], re) + ":</strong> " + hl(s[1], re);
  }
  function short(t, max) {
    max = max || 54;
    var s = splitHead(t)[0];
    if (s.length <= max) return s;
    var cut = s.lastIndexOf(" ", max);
    return s.slice(0, cut > 20 ? cut : max).replace(/[,;:]$/, "") + "…";
  }
  function badge(n) { return '<span class="badge ' + (n.exam === "BASIC" ? "b-basic" : "b-adv") + '">' + n.exam + "</span>"; }
  function pages(n) { return n.p0 === n.p1 ? "Outline p. " + n.p0 : "Outline pp. " + n.p0 + "–" + n.p1; }
  function plural(k, one, many) { return k.toLocaleString() + " " + (k === 1 ? one : many); }
  function ancestorAt(n, d) { while (n.depth > d) n = n.parent; return n; }
  function label(n) { return n.depth === 0 ? n.t.replace(/ in Anesthesiology$/, "") : n.m + " " + short(n.t); }
  function visiblePart(p) { return filter === "all" || p.exam === filter; }

  /* ---------- sidebar ---------- */
  var chevron = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function sideList(kids, depth) {
    if (!kids.length || depth > 3) return "";
    return '<ul class="side-ul d' + depth + '"' + (depth >= 3 ? " hidden" : "") + ">" + kids.map(function (k) {
      var has = depth < 3 && k.kids.length > 0;
      return '<li data-slug="' + k.slug + '"><div class="side-row">' +
        (has ? '<button class="twisty" type="button" aria-expanded="' + (depth < 2) + '" aria-label="Show subtopics of ' + esc(short(k.t, 40)) + '">' + chevron + "</button>" : '<span class="twisty-sp"></span>') +
        '<a href="#' + k.slug + '" data-slug="' + k.slug + '" title="' + esc(k.t) + '"><span class="mk">' + esc(k.m) + '</span><span class="lbl">' + esc(k.t) + "</span></a></div>" +
        (depth < 3 ? sideList(k.kids, depth + 1) : "") + "</li>";
    }).join("") + "</ul>";
  }
  treeEl.innerHTML = tree.map(function (p) {
    return '<section class="side-part" data-exam="' + p.exam + '"><a class="side-part-head" href="#' + p.slug + '" data-slug="' + p.slug + '">' + badge(p) +
      "<span>" + esc(p.t) + "</span></a>" + sideList(p.kids, 1) + "</section>";
  }).join("");
  function setOpen(li, open) {
    var ul = li.querySelector(":scope > ul"), b = li.querySelector(":scope > .side-row > .twisty");
    if (ul) ul.hidden = !open;
    if (b) b.setAttribute("aria-expanded", String(open));
  }
  treeEl.addEventListener("click", function (e) {
    var b = e.target.closest(".twisty");
    if (b) { var li = b.closest("li"); setOpen(li, b.getAttribute("aria-expanded") !== "true"); }
  });
  $("#expand-all").addEventListener("click", function () { treeEl.querySelectorAll("li").forEach(function (li) { setOpen(li, true); }); });
  $("#collapse-all").addEventListener("click", function () {
    treeEl.querySelectorAll(".side-ul.d1 > li").forEach(function (li) { setOpen(li, false); });
    treeEl.querySelectorAll(".side-ul.d2 > li").forEach(function (li) { setOpen(li, false); });
  });
  function setActive(n) {
    if (n && n.depth > 3) n = ancestorAt(n, 3);
    treeEl.querySelectorAll('[aria-current="page"]').forEach(function (a) { a.removeAttribute("aria-current"); });
    if (!n) return;
    var a = treeEl.querySelector('a[data-slug="' + n.slug + '"]');
    if (!a) return;
    a.setAttribute("aria-current", "page");
    var li = a.closest("li");
    if (li && n.depth === 2) setOpen(li, true);
    for (var p = li && li.parentElement.closest("li"); p; p = p.parentElement.closest("li")) setOpen(p, true);
    var r = a.getBoundingClientRect(), s = side.getBoundingClientRect();
    if (r.top < s.top + 60 || r.bottom > s.bottom - 20) side.scrollTop += r.top - s.top - s.height / 3;
  }

  /* ---------- filter ---------- */
  function applyFilter() {
    document.querySelectorAll('input[name="exam"]').forEach(function (r) { r.checked = r.value === filter; });
    treeEl.querySelectorAll(".side-part").forEach(function (s) { s.hidden = !(filter === "all" || s.dataset.exam === filter); });
  }
  document.querySelectorAll('input[name="exam"]').forEach(function (r) {
    r.addEventListener("change", function () {

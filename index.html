<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anesthesia Boards Navigator</title>
<meta name="description" content="Unofficial study guide for residents, built on the ABA Initial Certification Content Outline (BASIC and ADVANCED).">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131c1a" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Anesthesia Boards Navigator">
<meta property="og:description" content="Every topic in the ABA Initial Certification content outline, organized for study, with private notes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311704c'/%3E%3Crect x='11' y='10' width='10' height='17' rx='5' fill='%23fff'/%3E%3Crect x='14' y='5' width='4' height='5.5' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* base reset */
:root { color-scheme: light; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* Layout: a sticky search bar over a two-pane reader. The outline tree sits on the left and one topic at a time reads on the right; on phones the tree slides in as a drawer. */
:root {
  /* Color: cool clinical paper; accents borrow US medical gas cylinder colors (oxygen green = BASIC, nitrous blue = ADVANCED, medical-air yellow = search highlight) */
  --bg: #f2f5f4;
  --surface: #ffffff;
  --sunken: #e7eeeb;
  --ink: #14221f;
  --muted: #56675f;
  --line: #d6e0dc;
  --line-strong: #b7c7c1;
  --o2: #11704c;
  --o2-tint: #dff0e8;
  --n2o: #2350a0;
  --n2o-tint: #e2e9f7;
  --air: #f4dd7c;
  --air-ink: #14221f;
  --shadow: 0 1px 2px rgb(20 34 31 / 0.06), 0 10px 28px rgb(20 34 31 / 0.10);
  --shadow-sm: 0 1px 2px rgb(20 34 31 / 0.12);
  --scrim: rgb(10 20 18 / 0.45);
  --on-accent: #ffffff;
  --danger: #b42318;

  /* Type: Newsreader for headings (textbook voice), Atkinson Hyperlegible for dense medical terms, IBM Plex Mono for outline codes */
  --font-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-ui: 0.9375rem;
  --fs-body: 1rem;
  --fs-h3: 1.125rem;
  --fs-h2: 1.375rem;
  --fs-h1: clamp(1.75rem, 1.35rem + 1.5vw, 2.375rem);

  --hdr: 64px;
  --side: 300px;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1412; --surface: #131c1a; --sunken: #1a2522; --ink: #e1eae6; --muted: #98aaa3;
    --line: #24312d; --line-strong: #364843; --o2: #55c495; --o2-tint: #15302a; --n2o: #95b4f3; --n2o-tint: #1a2541;
    --air: #5f5013; --air-ink: #f7eecf; --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 10px 28px rgb(0 0 0 / 0.4);
    --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.5); --scrim: rgb(0 0 0 / 0.6); --on-accent: #0d1412; --danger: #f19185;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1412; --surface: #131c1a; --sunken: #1a2522; --ink: #e1eae6; --muted: #98aaa3;
  --line: #24312d; --line-strong: #364843; --o2: #55c495; --o2-tint: #15302a; --n2o: #95b4f3; --n2o-tint: #1a2541;
  --air: #5f5013; --air-ink: #f7eecf; --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 10px 28px rgb(0 0 0 / 0.4);
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.5); --scrim: rgb(0 0 0 / 0.6); --on-accent: #0d1412; --danger: #f19185;
  color-scheme: dark;
}

html { scroll-padding-top: calc(var(--hdr) + 24px); }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--fs-ui)/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--surface);
}
a { color: var(--o2); }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--o2); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
kbd {
  font: 500 var(--fs-xs)/1 var(--font-mono); color: var(--muted); background: var(--sunken);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 3px 6px;
}
@media (hover: none) { .kbd-hint { display: none; } }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in {
  display: flex; align-items: center; gap: 10px 16px; min-height: var(--hdr); box-sizing: border-box;
  max-width: 1360px; margin: 0 auto; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; flex-direction: column; gap: 1px; text-decoration: none; color: var(--ink); min-width: 0; flex: 0 0 calc(var(--side) + 24px); }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 1.3125rem; line-height: 1.1; letter-spacing: -0.01em; }
.brand-sub { font-size: var(--fs-xs); color: var(--muted); letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { position: relative; flex: 1 1 320px; max-width: 760px; }
.search input {
  width: 100%; box-sizing: border-box; height: 42px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink);
  padding: 0 46px 0 42px; font: inherit; font-size: var(--fs-body);
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: 2px solid var(--o2); outline-offset: 1px; background: var(--surface); }
.search .s-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search kbd { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.search input:not(:placeholder-shown) ~ kbd { display: none; }
.icon-btn {
  display: none; flex: none; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; place-items: center; padding: 0;
}

/* ---------- layout ---------- */
.layout {
  display: grid; grid-template-columns: var(--side) minmax(0, 1fr); gap: 40px; box-sizing: border-box;
  max-width: 1360px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sidebar {
  position: sticky; top: calc(var(--hdr) + env(safe-area-inset-top, 0px)); align-self: start;
  max-height: calc(100vh - var(--hdr)); max-height: calc(100dvh - var(--hdr) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; overscroll-behavior: contain; padding-block: 20px 40px; box-sizing: border-box;
}
main { min-width: 0; max-width: 760px; padding-block: 30px 72px; }
.scrim { display: none; }

/* ---------- sidebar ---------- */
.side-tools { display: grid; gap: 8px; margin-bottom: 8px; }
.side-label { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; border-radius: 9px; background: var(--sunken); position: relative; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.seg label { text-align: center; padding: 6px 4px; border-radius: 7px; font-size: var(--fs-sm); font-weight: 700; color: var(--muted); cursor: pointer; letter-spacing: 0.02em; }
.seg input:checked + label { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.seg input:focus-visible + label { outline: 2px solid var(--o2); outline-offset: 1px; }
.side-actions { display: flex; gap: 12px; justify-content: flex-end; }
.linkish { border: 0; background: none; padding: 2px 0; font: inherit; font-size: var(--fs-xs); color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.linkish:hover { color: var(--ink); }
.side-part { margin-top: 16px; }
.side-part-head { display: flex; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 7px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: var(--fs-ui); line-height: 1.3; }
.side-part-head:hover { background: var(--sunken); }
.side-ul { list-style: none; margin: 0; padding: 0; }
.side-ul.d2, .side-ul.d3 { padding-left: 14px; }
.side-row { display: flex; align-items: flex-start; }
.twisty { flex: none; width: 24px; height: 28px; display: grid; place-items: center; border: 0; background: none; color: var(--muted); border-radius: 5px; cursor: pointer; padding: 0; }
.twisty:hover { color: var(--ink); background: var(--sunken); }
.twisty svg { transition: transform 0.15s ease; }
.twisty[aria-expanded="true"] svg { transform: rotate(90deg); }
.twisty-sp { flex: none; width: 24px; }
.side-row a { flex: 1; min-width: 0; display: flex; gap: 6px; padding: 5px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: var(--fs-sm); line-height: 1.35; }
.side-row a .mk { flex: none; min-width: 1.7em; font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--muted); padding-top: 1px; }
.side-row a .lbl { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.side-ul.d1 > li > .side-row a { font-weight: 700; }
.side-row a:hover { background: var(--sunken); }
.side-row a[aria-current="page"], .side-part-head[aria-current="page"] { background: var(--o2-tint); color: var(--o2); font-weight: 700; }
.side-part[data-exam="ADVANCED"] a[aria-current="page"] { background: var(--n2o-tint); color: var(--n2o); }
.side-row a[aria-current="page"] .mk { color: inherit; }

/* ---------- badges, crumbs, headings ---------- */
.badge { display: inline-flex; align-items: center; flex: none; font: 500 0.6875rem/1 var(--font-mono); letter-spacing: 0.08em; padding: 4px 7px 3px; border-radius: 4px; text-transform: uppercase; }
.b-basic { color: var(--o2); background: var(--o2-tint); }
.b-adv { color: var(--n2o); background: var(--n2o-tint); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: var(--fs-sm); color: var(--muted); margin-bottom: 16px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.crumbs .sep { opacity: 0.55; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 10px; font-size: var(--fs-sm); color: var(--muted); }
.code { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--muted); }
h1, h2, h3 { text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-h1); line-height: 1.15; letter-spacing: -0.015em; margin: 0; }
h1.long { font-size: clamp(1.5rem, 1.25rem + 0.9vw, 1.875rem); }
h1 .h-mk { color: var(--muted); font-weight: 500; }
.lead { font-size: 1.0625rem; line-height: 1.55; color: var(--muted); max-width: 65ch; margin: 12px 0 0; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 14px 0 0; padding: 0; list-style: none; font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.facts b { color: var(--ink); font-weight: 700; }

/* ---------- outline lists ---------- */
.ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.ol .ol { margin: 5px 0 3px 0.55em; padding-left: 0.95em; border-left: 1px solid var(--line); }
.ol .row { display: grid; grid-template-columns: minmax(1.9em, auto) minmax(0, 1fr); column-gap: 6px; font-size: var(--fs-body); line-height: 1.5; border-radius: 6px; scroll-margin-top: calc(var(--hdr) + 32px); }
.ol .mk { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--muted); padding-top: 0.17em; white-space: nowrap; }
.ol .tx { min-width: 0; overflow-wrap: anywhere; }
.ol .tx strong { font-weight: 700; }
.ol li.target > .row { background: var(--air); color: var(--air-ink); box-shadow: 0 0 0 5px var(--air); }
.ol li.target > .row .mk { color: inherit; }
mark { background: var(--air); color: var(--air-ink); border-radius: 3px; padding: 0 1px; }

/* ---------- topic and section pages ---------- */
.blocks { display: grid; gap: 0; margin-top: 30px; }
.block { padding-block: 22px; border-top: 1px solid var(--line); }
.block:first-child { border-top: 0; padding-top: 4px; }
.block h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-h2); line-height: 1.25; margin: 0 0 12px; }
.block h2 a { color: inherit; text-decoration: none; }
.block h2 a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.block h2 .mk { font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 500; color: var(--muted); margin-right: 4px; vertical-align: 0.2em; }
.block h2 .rest { display: block; margin-top: 4px; font: 400 var(--fs-ui)/1.5 var(--font-body); color: var(--muted); }
.block .meta { margin: -6px 0 12px; font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.links a { display: grid; grid-template-columns: 1.9em minmax(0, 1fr) auto; gap: 6px; align-items: baseline; padding: 6px 8px; margin-inline: -8px; border-radius: 7px; text-decoration: none; color: var(--ink); font-size: var(--fs-body); }
.links a:hover { background: var(--sunken); }
.links .mk { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--muted); }
.links .n { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.empty-note { color: var(--muted); font-style: italic; margin: 22px 0 0; }

.sibs { margin-top: 40px; }
.sibs h2, .about h2 { font: 700 var(--fs-xs)/1.4 var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
.sibs ul { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; }
.sibs a { display: inline-flex; gap: 6px; align-items: baseline; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); text-decoration: none; color: var(--ink); font-size: var(--fs-sm); max-width: 100%; box-sizing: border-box; }
.sibs a .mk { font-family: var(--font-mono); color: var(--muted); font-size: var(--fs-xs); }
.sibs a:hover { border-color: var(--line-strong); }
.sibs a[aria-current="page"] { border-color: var(--o2); color: var(--o2); font-weight: 700; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 44px; }
.pn a { display: grid; gap: 3px; padding: 13px 15px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0; }
.pn a:hover { border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
.pn .dir { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.pn .t { font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.pn .next { grid-column: 2; text-align: right; }

/* ---------- home ---------- */
.home-intro .kicker { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.1em; color: var(--o2); font-weight: 700; margin: 0 0 10px; }
.panel { margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px 14px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
.panel-head h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-h2); line-height: 1.2; margin: 0; flex: 1 1 auto; min-width: 0; }
.panel-head h2 a { color: inherit; text-decoration: none; }
.panel-head h2 a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.panel-head .n { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.sec-cols { columns: 2 270px; column-gap: 32px; }
.sec { break-inside: avoid; padding-bottom: 14px; }
.sec h3 { font: 700 var(--fs-xs)/1.4 var(--font-body); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0 0 4px; }
.sec h3 a { color: inherit; text-decoration: none; }
.sec h3 a:hover { color: var(--ink); text-decoration: underline; }
.sec .links a { font-size: var(--fs-ui); padding: 4px 8px; }
.about { margin-top: 36px; padding-top: 22px; border-top: 1px solid var(--line); font-size: var(--fs-sm); color: var(--muted); max-width: 65ch; }
.about p { margin: 0 0 8px; }
.about ul { margin: 0 0 8px; padding-left: 1.2em; }
.swatch { display: inline-block; width: 0.7em; height: 0.7em; border-radius: 50%; vertical-align: -0.02em; margin-right: 3px; }

/* ---------- search results ---------- */
.results-head h1 { font-size: clamp(1.5rem, 1.3rem + 0.8vw, 1.875rem); }
.filter-note { margin: 8px 0 0; font-size: var(--fs-sm); color: var(--muted); }
.results { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 8px; }
.res { display: block; padding: 12px 15px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-decoration: none; color: var(--ink); }
.res:hover { border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
.res-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 5px; }
.res-text { font-size: var(--fs-body); line-height: 1.45; overflow-wrap: anywhere; }
.res-path { margin-top: 5px; font-size: var(--fs-sm); color: var(--muted); overflow-wrap: anywhere; }
.more-btn { margin-top: 14px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 16px; font: inherit; font-weight: 700; cursor: pointer; }
.more-btn:hover { background: var(--sunken); }

/* ---------- header tools ---------- */
.top-actions { display: flex; gap: 6px; flex: none; }
.top-btn {
  position: relative; display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 12px; box-sizing: border-box;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: inherit; font-size: var(--fs-sm); font-weight: 700; text-decoration: none; cursor: pointer; white-space: nowrap;
}
.top-btn:hover { background: var(--sunken); }
.top-btn svg { flex: none; color: var(--muted); }
.top-btn .count {
  min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px;
  background: var(--o2); color: var(--on-accent); font: 700 11px/18px var(--font-body); text-align: center; font-variant-numeric: tabular-nums;
}
@media (max-width: 1100px) {
  .top-btn .t { display: none; }
  .top-btn { width: 42px; padding: 0; justify-content: center; }
  .top-btn .count { position: absolute; top: -6px; right: -6px; }
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 7px 14px; font: inherit; font-size: var(--fs-sm); font-weight: 700; cursor: pointer;
}
.btn:hover { background: var(--sunken); }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn-primary { background: var(--o2); border-color: var(--o2); color: var(--on-accent); padding: 9px 20px; font-size: var(--fs-ui); }
.btn-primary:hover { background: var(--o2); filter: brightness(1.08); }
.btn-danger { color: var(--danger); }

/* ---------- my notes box ---------- */
.notes { margin-top: 22px; padding: 14px 16px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.notes-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 8px; }
.notes-head h2 { font: 700 var(--fs-xs)/1.4 var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--o2); margin: 0; }
.notes-where { font-size: var(--fs-xs); color: var(--muted); }
.notes textarea {
  display: block; width: 100%; box-sizing: border-box; min-height: 4.75em; max-height: 60vh; resize: vertical;
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 12px; background: var(--bg); color: var(--ink);
  font: inherit; font-size: var(--fs-body); line-height: 1.5;
}
.notes textarea::placeholder, #fb-text::placeholder { color: var(--muted); }
.notes textarea:focus { outline: 2px solid var(--o2); outline-offset: 1px; background: var(--surface); }
.notes textarea:disabled { opacity: 0.7; }
.notes-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-top: 6px; font-size: var(--fs-xs); color: var(--muted); }
.notes-foot a { color: var(--muted); }
.notes-foot a:hover { color: var(--ink); }
.side-row a.has-note::after { content: ""; flex: none; width: 7px; height: 7px; margin: 5px 0 0 auto; border-radius: 50%; background: var(--o2); }
.side-part[data-exam="ADVANCED"] .side-row a.has-note::after { background: var(--n2o); }
.tip { margin: 12px 0 0; font-size: var(--fs-ui); color: var(--muted); max-width: 65ch; }

/* ---------- my notes page ---------- */
.notes-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 18px; }
.tools-status { font-size: var(--fs-sm); color: var(--muted); }
.note-list { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 8px; }
.note-snip { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); font-size: var(--fs-ui); line-height: 1.5; }

/* ---------- feedback dialog ---------- */
.dlg {
  width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); box-sizing: border-box; margin: auto; padding: 0;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
}
.dlg::backdrop { background: rgb(0 0 0 / 0.5); }
.dlg form { padding: 20px 22px 18px; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dlg-head h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-h2); line-height: 1.2; margin: 0; }
.dlg-sub { margin: 6px 0 16px; color: var(--muted); font-size: var(--fs-ui); line-height: 1.5; }
.fb-about { border: 0; padding: 0; margin: 0 0 16px; display: grid; gap: 8px; min-width: 0; }
.fb-about legend, .fb-label { display: block; font: 700 var(--fs-xs)/1.4 var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; padding: 0; }
.fb-about label { display: flex; gap: 8px; align-items: baseline; font-size: var(--fs-ui); cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
.fb-about input { accent-color: var(--o2); flex: none; }
#fb-text {
  display: block; width: 100%; box-sizing: border-box; min-height: 8em; resize: vertical; border: 1px solid var(--line-strong);
  border-radius: 8px; padding: 10px 12px; background: var(--bg); color: var(--ink); font: inherit; font-size: var(--fs-body); line-height: 1.5;
}
#fb-text:focus { outline: 2px solid var(--o2); outline-offset: 1px; background: var(--surface); }
.dlg-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
#fb-status { margin: 0; font-size: var(--fs-sm); color: var(--muted); line-height: 1.4; }
#fb-status.ok { color: var(--o2); font-weight: 700; }
#fb-status.err { color: var(--danger); }

/* ---------- my notes page: backup tools ---------- */
.tools-status.err { color: var(--danger); }
.callout { margin-top: 18px; padding: 12px 15px; max-width: 65ch; border: 1px solid var(--line); border-radius: var(--radius); background: var(--sunken); font-size: var(--fs-ui); line-height: 1.5; }
.callout p { margin: 0; }
.callout p + p { margin-top: 6px; }
.callout strong { font-weight: 700; }
.file-in { position: fixed; left: -9999px; width: 1px; height: 1px; opacity: 0; }

/* ---------- feedback dialog: name field ---------- */
.fb-field { margin-top: 14px; }
.fb-label .opt { font-weight: 400; text-transform: none; letter-spacing: 0; }
#fb-name {
  display: block; width: 100%; box-sizing: border-box; height: 42px; border: 1px solid var(--line-strong); border-radius: 8px;
  padding: 0 12px; background: var(--bg); color: var(--ink); font: inherit; font-size: var(--fs-body);
}
#fb-name:focus { outline: 2px solid var(--o2); outline-offset: 1px; background: var(--surface); }
#fb-status a { color: inherit; font-weight: 700; }
.dlg-foot .btn { flex: none; white-space: nowrap; }

.drawer-head { display: none; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.drawer-head .t { font-family: var(--font-display); font-weight: 600; font-size: 1.125rem; }
.close-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }

/* ---------- study notes ---------- */
.sn { margin-top: 26px; }
.sn-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 12px; }
.sn-head h2 { font: 700 var(--fs-xs)/1.4 var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--o2); margin: 0; }
.sn.adv .sn-head h2 { color: var(--n2o); }
.sn-meta { font-size: var(--fs-xs); color: var(--muted); }
.b-draft { color: var(--air-ink); background: var(--air); }
.sn-body { font-size: var(--fs-body); line-height: 1.6; max-width: 70ch; overflow-wrap: break-word; }
.sn-body p { margin: 0 0 12px; }
.sn-body .nb-bl { margin-bottom: 18px; padding: 12px 15px; border-left: 4px solid var(--o2); border-radius: 0 8px 8px 0; background: var(--o2-tint); font-size: 1.0625rem; line-height: 1.55; }
.sn.adv .nb-bl { border-left-color: var(--n2o); background: var(--n2o-tint); }
.sn-body .nb-h { font-family: var(--font-display); font-weight: 600; font-size: 1.1875rem; line-height: 1.3; margin: 24px 0 8px; }
.sn-body .nb-h .nb-cite { font: 400 var(--fs-sm)/1.4 var(--font-body); color: var(--muted); }
.sn-body .nb-h4 { font-size: var(--fs-body); font-weight: 700; margin: 18px 0 6px; }
.sn-body ul, .sn-body ol { margin: 0 0 14px; padding-left: 1.3em; }
.sn-body li { margin: 5px 0; padding-left: 2px; }
.sn-body li::marker { color: var(--muted); }
.sn-body code { font-family: var(--font-mono); font-size: 0.9em; }
.nb-table { overflow-x: auto; margin: 6px 0 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.nb-table:focus-visible { outline: 2px solid var(--o2); outline-offset: 2px; }
.nb-table table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); line-height: 1.45; }
.nb-table th, .nb-table td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); min-width: 6.5em; }
.nb-table thead th { background: var(--sunken); font-weight: 700; }
.nb-table tbody tr:last-child > * { border-bottom: 0; }
.nb-table th:first-child { position: sticky; left: 0; z-index: 1; box-shadow: inset -1px 0 0 var(--line); }
.nb-table tbody th { font-weight: 700; background: var(--surface); }
.nb-callout { margin: 6px 0 16px; padding: 11px 15px; border-left: 4px solid var(--air); border-radius: 0 8px 8px 0; background: var(--sunken); }
.nb-callout p { margin: 0; }
.nb-related, .nb-src { margin-top: 16px; font-size: var(--fs-sm); line-height: 1.55; color: var(--muted); }
.nb-qa { margin: 8px 0 14px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.nb-qa .nb-q { margin: 0; }
.nb-qa details { margin-top: 6px; }
.nb-qa summary { cursor: pointer; color: var(--o2); font-weight: 700; font-size: var(--fs-sm); }
.nb-qa details p { margin: 6px 0 0; }
.pill { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font: 700 0.6875rem/1.5 var(--font-body); letter-spacing: 0.04em; color: var(--o2); background: var(--o2-tint); vertical-align: 0.12em; white-space: nowrap; }
.pill.adv { color: var(--n2o); background: var(--n2o-tint); }
.ol-link { color: inherit; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.ol-link:hover { text-decoration-color: currentColor; }
.ol-bl { display: block; margin-top: 2px; color: var(--muted); font-size: var(--fs-sm); line-height: 1.45; }
.ol li.target > .row .ol-bl { color: inherit; }
.panel-note { margin: -6px 0 10px; font-size: var(--fs-sm); color: var(--muted); }
.sn-links a { grid-template-columns: auto minmax(0, 1fr) auto; }
.res-snip { margin-top: 6px; font-size: var(--fs-sm); line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }

/* ---------- phones and narrow windows ---------- */
@media (max-width: 900px) {
  :root { --hdr: 112px; }
  .topbar-in { flex-wrap: wrap; }
  .brand { flex: 1 1 calc(100% - 60px); }
  .kbd-hint { display: none; }
  .icon-btn { display: grid; }
  .search { flex: 1 1 0; min-width: 0; max-width: none; order: 3; }
  .top-actions { order: 4; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 0; }
  main { padding-block: 22px 56px; }
  .sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 40; width: min(88vw, 340px); max-height: none; align-self: stretch;
    background: var(--surface); box-shadow: var(--shadow);
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px;
    transform: translateX(-104%); visibility: hidden;
    transition: transform 0.22s ease, visibility 0s linear 0.22s;
  }
  .sidebar.open { transform: none; visibility: visible; transition: transform 0.22s ease, visibility 0s; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: var(--scrim); border: 0; padding: 0; opacity: 0; pointer-events: none; transition: opacity 0.22s ease; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .drawer-head { display: flex; }
  .side-row a { font-size: var(--fs-ui); padding-block: 7px; }
  .twisty { height: 34px; width: 30px; }
  .twisty-sp { width: 30px; }
}
@media (max-width: 520px) {
  .pn { grid-template-columns: minmax(0, 1fr); }
  .pn .next { grid-column: 1; text-align: left; }
  .panel { padding: 16px 16px 8px; }
  .ol .row { font-size: var(--fs-ui); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

(Professional Standing, Lifelong Learning, Cognitive Knowledge, Clinical Practice Assessment, Systems-Based Practice)",48],["e.","Research Ethics",48,[["1)","Principles of Justice, Autonomy, Beneficence, Nonmalfeasance",48],["2)","Ethical Standards in Research Design: Scientific Validity, Fair Subject Selection, Favorable Risk-Benefit Profile",48],["3)","Rigor in Ethical Design, Implementation, and Analysis of Interventional Studies: Roles of the Institutional Review Board, DSMB, clinicaltrials.gov, Publication of Protocols",48],["4)","Statistics: Data Dredging, Selection of Covariates A Priori, Bonferroni Correction",48],["5)","Informed Consent in research",48],["6)","Conflicts of Interest and Financial Disclosure",48],["7)","Academic Integrity, Publication Bias, Fraud",48]]],["f.","Clinician Wellness and Self-Care",48,[["1)","Diagnosis and Treatment of Burnout",48],["2)","Sleep Deprivation",48],["3)","Adaptations for Clinical Disability",48],["4)","Substance Use Disorder",49]]]]],["5.","Practice Management",49,[["a.","Costs of Medical/Anesthesia Care",49,[["1)","Understanding Principles of Healthcare Funding and Payment",49],["2)","Cost-Conscious Practice",49]]],["b.","Efficient OR Staffing and Scheduling",49,[["1)","Subspecialization Issues: Pediatrics, Cardiac, Regional, Obstetric Coverage",49],["2)","Anesthesia Care Team and Scope of Practice",49]]],["c.","Population Health: Perioperative Surgical Home and Enhanced Recovery",49,[["1)","Population Based Health Determinants, Resources to Improve Access",49],["2)","Health Care Disparities Between Populations",49]]],["d.","Clinical Informatics",49,[["1)","Electronic Medical Record Systems: Costs and Benefits",49],["2)","Artificial Intelligence and Machine Learning",49]]],["e.","Documentation, Coding, and Billing",49,[["1)","Compliance with Documentation requirements",49],["2)","Accuracy, Clarity, Specificity of Medical Records",49],["3)","Coding Integrity, Audits, and Insurance Denials",49]]]]],["6.","Quality Impro <script type="application/json" id="notes-data">{"I.A.1.a":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Surface landmarks tell you where deep structures lie before you scan or puncture. Learn which vertebral level each landmark marks, and expect palpation to be off by a level.<\/p><h3 class=\"nb-h\">Levels at a glance<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Landmark<\/th><th scope=\"col\">Vertebral level<\/th><th scope=\"col\">Why it matters<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Hyoid bone<\/th><td>C3<\/td><td>Superior laryngeal nerve block just below its greater horn<\/td><\/tr><tr><th scope=\"row\">Upper border of thyroid cartilage<\/th><td>C4<\/td><td>Carotid bifurcation and carotid sinus<\/td><\/tr><tr><th scope=\"row\">Cricoid cartilage; Chassaignac's tubercle<\/th><td>C6<\/td><td>Start of trachea and esophagus; stellate ganglion and interscalene blocks; vertebral artery enters its foramen<\/td><\/tr><tr><th scope=\"row\">Vertebra prominens<\/th><td>C7<\/td><td>Most prominent spinous process at the base of the neck; start counting down for thoracic epidurals<\/td><\/tr><tr><th scope=\"row\">Suprasternal notch<\/th><td>T2–T3<\/td><td>Top of the manubrium<\/td><\/tr><tr><th scope=\"row\">Root of the scapular spine<\/th><td>T3<\/td><td>Thoracic counting<\/td><\/tr><tr><th scope=\"row\">Sternal angle (2nd rib)<\/th><td>T4–T5<\/td><td>Carina, start and end of the aortic arch, azygos vein joins the SVC<\/td><\/tr><tr><th scope=\"row\">Inferior angle of the scapula, arms at sides<\/th><td>T7<\/td><td>Thoracic counting<\/td><\/tr><tr><th scope=\"row\">Iliac crests (intercristal or Tuffier's line)<\/th><td>L4 or L4–L5<\/td><td>Lumbar puncture below the conus; often misjudged<\/td><\/tr><tr><th scope=\"row\">Umbilicus<\/th><td>L3–L4 vertebra, T10 dermatome<\/td><td>Vertebral level and dermatome differ<\/td><\/tr><tr><th scope=\"row\">Posterior superior iliac spines<\/th><td>S2<\/td><td>Dural sac ends near here in adults<\/td><\/tr><tr><th scope=\"row\">Sacral hiatus<\/th><td>S4–S5<\/td><td>Caudal block entry<\/td><\/tr><\/tbody><\/table><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-b\">I.A.1.b Radiological and Ultrasound Anatomy<\/a> · <a href=\"#i-a-1-c\">I.A.1.c Clinical Anatomy<\/a> · <a href=\"#i-a-1-a-5\">I.A.1.a.5 Dermatome Anatomy<\/a><\/p>","b":"Surface landmarks tell you where deep structures lie before you scan or puncture. Learn which vertebral level each landmark marks, and expect palpation to be off by a level.","u":"2026-11-05"},"I.A.1.a.1":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Find C6 first: the cricoid cartilage in front and Chassaignac's tubercle at the side. The cricothyroid membrane, carotid sheath, stellate ganglion and vertebral artery are all located from that level.<\/p><h3 class=\"nb-h\">Cricothyroid membrane<\/h3><ul><li>It spans the gap between the thyroid cartilage above and the cricoid ring below, about 1 cm high and 2 to 3 cm wide in adults.<\/li><li>The cricothyroid arteries cross its upper part, so puncture or incise its lower half, just above the cricoid.<\/li><li>Palpation is unreliable, especially in women and obese patients; ultrasound finds it more accurately (see <a href=\"#i-a-1-b-4\">I.A.1.b.4<\/a>). In a predicted difficult airway, mark it before induction.<\/li><li>In small children the membrane is tiny, and needle techniques are generally preferred to a scalpel.<\/li><\/ul><h3 class=\"nb-h\">Jugular veins<\/h3><ul><li>The internal jugular vein runs in the carotid sheath with the common carotid artery (medial) and the vagus nerve (behind, between them). The vein usually lies lateral and slightly anterior to the artery.<\/li><li>Landmark approach: enter at the apex of the triangle formed by the two heads of the sternocleidomastoid and the clavicle, aiming toward the ipsilateral nipple while feeling the carotid pulse medially.<\/li><li>Turning the head far to the opposite side makes the vein overlie the artery more often; a modest turn is safer.<\/li><li>The right side is usually preferred: it has a straight path to the SVC and a lower pleural dome, and the thoracic duct is on the left.<\/li><li>The external jugular vein crosses the sternocleidomastoid superficially, from the angle of the jaw toward the middle of the clavicle, and drains into the subclavian vein. It is easy to cannulate, but wires often fail to pass centrally because of valves and its sharp angle at the subclavian.<\/li><\/ul><h3 class=\"nb-h\">Thoracic duct<\/h3><ul><li>It ascends on the left and arches over the pleural dome to enter the junction of the left internal jugular and subclavian veins. Left-sided internal jugular or subclavian punctures can injure it and cause a chylothorax.<\/li><\/ul><h3 class=\"nb-h\">Carotid and vertebral arteries<\/h3><ul><li>The common carotid lies medial to the internal jugular vein, deep to the sternocleidomastoid, and divides at about the upper border of the thyroid cartilage (C3–C4).<\/li><li>The carotid sinus at the bifurcation holds baroreceptors supplied by the glossopharyngeal nerve. Pressure or surgery there can cause bradycardia and hypotension.<\/li><li>The vertebral artery, the first branch of the subclavian, enters the transverse foramen of C6 in most people and ascends to C1. It lies close to interscalene and stellate ganglion needles, and even a small injection into it reaches the brain and can cause an immediate seizure.<\/li><\/ul><h3 class=\"nb-h\">Stellate ganglion<\/h3><ul><li>It is the fused inferior cervical and first thoracic ganglia, lying in front of the C7 transverse process and the neck of the first rib.<\/li><li>It is blocked at C6 (Chassaignac's tubercle) with the carotid pushed laterally, because at C7 the vertebral artery lies unprotected in front of the ganglion and the pleura is close.<\/li><li>Signs of success: Horner syndrome (ptosis, miosis, anhidrosis), facial flushing, nasal congestion and a rise in arm skin temperature.<\/li><li>Complications: vertebral artery injection (seizure), recurrent laryngeal nerve block (hoarseness), phrenic nerve block, pneumothorax, neuraxial spread and hematoma.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> Horner syndrome shows that the cervical sympathetic chain is blocked, not that the arm's sympathetic supply is. Check for a rise in hand temperature.<\/p><\/div><h3 class=\"nb-h\">Cervical spine landmarks<\/h3><ul><li>Vertebra prominens: the C7 spinous process, the most prominent at the base of the neck (sometimes T1 is more prominent).<\/li><li>Chassaignac's (carotid) tubercle: the large anterior tubercle of the C6 transverse process, felt at the level of the cricoid once the carotid is moved laterally.<\/li><\/ul><h3 class=\"nb-h\">Hyoid bone<\/h3><ul><li>It lies at C3. The internal branch of the superior laryngeal nerve pierces the thyrohyoid membrane just below it and supplies sensation above the vocal cords; it is blocked below the greater horn of the hyoid for awake intubation. The external branch supplies the cricothyroid muscle.<\/li><li>Hyomental and thyromental distances belong to the airway exam; a thyromental distance under about 6 cm suggests difficult laryngoscopy.<\/li><\/ul><h3 class=\"nb-h\">Superficial cervical plexus<\/h3><ul><li>It forms from C2–C4, and its four branches (lesser occipital, great auricular, transverse cervical and supraclavicular nerves) emerge at the midpoint of the posterior border of the sternocleidomastoid.<\/li><li>Infiltration there numbs the skin of the anterolateral neck, the ear, and the area over the clavicle and top of the shoulder. Uses: carotid endarterectomy (often with a deep or intermediate cervical block), clavicle surgery with an interscalene block, and other neck surgery.<\/li><li>Deep cervical plexus blocks often block the phrenic nerve (C3–C5) as well.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-b-4\">I.A.1.b.4 Neck ultrasound<\/a> · <a href=\"#i-b-3-c-5\">I.B.3.c.5 Transcutaneous or Surgical Airway<\/a> · <a href=\"#ii-c-3-b-10-b\">II.C.3.b.10.b Carotid Endarterectomy<\/a> · <a href=\"#i-a-1-a-2\">I.A.1.a.2 Chest<\/a><\/p>","b":"Find C6 first: the cricoid cartilage in front and Chassaignac's tubercle at the side. The cricothyroid membrane, carotid sheath, stellate ganglion and vertebral artery are all located from that level.","u":"2026-11-05"},"I.A.1.a.2":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> The sternal angle (2nd rib, T4–T5) marks the carina and the top of the heart. The subclavian vein crosses the first rib in front of the anterior scalene, with the artery behind it, and the pleural dome rises above the clavicle.<\/p><h3 class=\"nb-h\">Lungs and pleura<\/h3><ul><li>Right lung: three lobes (upper, middle, lower) and 10 segments. Left lung: two lobes (the lingula belongs to the upper lobe), usually counted as 8 to 10 segments.<\/li><li>Oblique fissure: from about the T3 spinous process behind to the 6th costal cartilage in front. Horizontal fissure (right only): along the 4th costal cartilage and rib to the midaxillary line.<\/li><li>In quiet breathing the lungs reach the 6th rib at the midclavicular line, the 8th at the midaxillary line and the 10th at the back; the pleura reaches two ribs lower (8th, 10th, 12th).<\/li><li>The pleural dome rises 2 to 3 cm above the medial third of the clavicle, so supraclavicular, interscalene, low internal jugular, subclavian and stellate needles can cause a pneumothorax.<\/li><li>Listening points: the upper lobes are heard mainly from the front, the lower lobes mainly from the back, and the right middle lobe over the right anterior chest and axilla.<\/li><\/ul><h3 class=\"nb-h\">Airways in the chest<\/h3><ul><li>The adult trachea is about 11 cm long and divides at the carina, behind the sternal angle.<\/li><li>The right main bronchus is shorter (about 2.5 cm), wider and more vertical than the left (about 5 cm), so a tube advanced too far usually enters the right side.<\/li><li>The right upper lobe bronchus leaves only about 2 cm below the carina. Right-sided double-lumen tubes therefore need a side slot for it and are harder to position.<\/li><\/ul><h3 class=\"nb-h\">Cardiac landmarks<\/h3><ul><li>Sternal angle (angle of Louis): the 2nd costal cartilage, at T4–T5. It marks the carina, the start and end of the aortic arch, and the azygos vein entering the SVC.<\/li><li>The right heart border runs along the right sternal edge from the 3rd to the 6th costal cartilage; the apex lies in the left 5th intercostal space at the midclavicular line.<\/li><li>Lead V5 sits in the anterior axillary line at the level of V4 (5th intercostal space). It is the single precordial lead most often used to watch for ischemia during anesthesia.<\/li><li>Pericardiocentesis uses a subxiphoid approach with the needle aimed at the left shoulder.<\/li><li>The internal thoracic (mammary) arteries run about 1 to 2 cm lateral to the sternal edge, a hazard for parasternal needles.<\/li><\/ul><h3 class=\"nb-h\">Subclavian vein<\/h3><ul><li>It continues from the axillary vein at the lateral border of the first rib, arches over the rib behind the medial third of the clavicle, and lies in front of the anterior scalene muscle, which separates it from the subclavian artery.<\/li><li>It joins the internal jugular vein behind the sternoclavicular joint to form the brachiocephalic vein.<\/li><li>Landmark (infraclavicular) approach: puncture about 1 cm below the clavicle at the junction of its medial and middle thirds, and advance beneath the clavicle toward the suprasternal notch.<\/li><li>Its attachments to the clavicle and first rib keep it open even in hypovolemia.<\/li><li>Compared with internal jugular and femoral sites, it carries the lowest rates of catheter infection and thrombosis but more pneumothorax, and bleeding from the artery beneath the clavicle cannot be compressed.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-b-1\">I.A.1.b.1 Chest imaging<\/a> · <a href=\"#i-b-3-c-6\">I.B.3.c.6 Endobronchial Intubation<\/a> · <a href=\"#i-a-1-a-1\">I.A.1.a.1 Neck<\/a> · <a href=\"#i-a-1-c-1-b\">I.A.1.c.1.b Upper extremity vasculature<\/a><\/p>","b":"The sternal angle (2nd rib, T4–T5) marks the carina and the top of the heart. The subclavian vein crosses the first rib in front of the anterior scalene, with the artery behind it, and the pleural dome rises above the clavicle.","u":"2026-11-05"},"I.A.1.a.3":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Count spinal levels from bony landmarks, but expect palpation to miss by a level, usually upward. Aim low enough that an error cannot reach the conus, which ends at L1–L2 in adults and near L3 in newborns.<\/p><h3 class=\"nb-h\">Landmarks and levels<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Landmark<\/th><th scope=\"col\">Level<\/th><th scope=\"col\">Use<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Vertebra prominens<\/th><td>C7<\/td><td>Start counting down for cervical and thoracic epidurals<\/td><\/tr><tr><th scope=\"row\">Root of the scapular spine<\/th><td>T3<\/td><td>Thoracic levels<\/td><\/tr><tr><th scope=\"row\">Inferior angle of the scapula, arms at sides<\/th><td>T7<\/td><td>Thoracic levels<\/td><\/tr><tr><th scope=\"row\">Intercristal (Tuffier's) line<\/th><td>L4 or L4–L5<\/td><td>Lumbar puncture; often lies higher than assumed<\/td><\/tr><tr><th scope=\"row\">Posterior superior iliac spines<\/th><td>S2<\/td><td>End of the adult dural sac<\/td><\/tr><tr><th scope=\"row\">Sacral hiatus<\/th><td>S4–S5<\/td><td>Caudal entry<\/td><\/tr><\/tbody><\/table><\/div><ul><li>When anesthesiologists mark a lumbar interspace by palpation, imaging often shows it is one or more levels higher than intended.<\/li><\/ul><h3 class=\"nb-h\">Spinal cord and dural sac<\/h3><ul><li>The conus medullaris ends at L1–L2 in most adults (range about T12 to L3) and near L3 at birth, reaching the adult level by about 1 year.<\/li><li>The dural sac ends near S2 in adults and lower, about S3, in infants.<\/li><li>Spinal anesthesia is therefore done at L3–L4 or below in adults, and at L4–L5 or L5–S1 in newborns and infants.<\/li><\/ul><h3 class=\"nb-h\">From skin to the subarachnoid space<\/h3><ul><li>Midline path: skin, subcutaneous fat, supraspinous ligament, interspinous ligament, ligamentum flavum, epidural space, dura, arachnoid, subarachnoid space. A paramedian needle bypasses the supraspinous and interspinous ligaments.<\/li><li>The ligamentum flavum is thickest in the lumbar region and may have midline gaps, most often in the cervical and upper thoracic spine, where loss of resistance can be less distinct.<\/li><li>The lumbar epidural space is commonly 4 to 6 cm from the skin in adults, deeper in obesity.<\/li><li>Mid-thoracic spinous processes (about T5–T8) angle steeply downward, so a paramedian approach is often easier there.<\/li><li>The epidural space holds fat, nerve roots and valveless veins (Batson's plexus), which engorge in pregnancy and with raised intra-abdominal pressure.<\/li><\/ul><h3 class=\"nb-h\">Caudal space<\/h3><ul><li>The sacral hiatus forms where the S5 (sometimes S4) laminae fail to fuse. It lies between the two sacral cornua and is covered by the sacrococcygeal ligament.<\/li><li>The hiatus and the two posterior superior iliac spines form a roughly equilateral triangle, which helps find it.<\/li><li>The caudal canal continues up into the lumbar epidural space and holds the sacral nerve roots, fat and a venous plexus.<\/li><li>In children the hiatus is easy to feel and the dural sac sits close to it, so the needle goes only a few millimeters past the ligament. In adults the hiatus is more variable and harder to feel; ultrasound helps.<\/li><li>Risks: injection into the venous plexus, dural puncture with a total spinal, and intraosseous injection.<\/li><\/ul><h3 class=\"nb-h\">Pelvic landmarks<\/h3><ul><li>The anterior superior iliac spine (ASIS) and the pubic tubercle mark the ends of the inguinal ligament. The femoral artery passes beneath it at the midinguinal point, halfway between the ASIS and the pubic symphysis.<\/li><li>The greater trochanter and ischial tuberosity guide sciatic approaches in the buttock (see <a href=\"#i-a-1-c-2-a\">I.A.1.c.2.a<\/a>).<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> the intercristal line is not a reliable L4 marker. If unsure of the level, choose a lower interspace.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-b-3\">I.A.1.b.3 Spine imaging<\/a> · <a href=\"#i-b-2-b\">I.B.2.b Spinal, Epidural, Caudal, Combined Spinal/Epidural<\/a> · <a href=\"#i-c-1-b-3\">I.C.1.b.3 Meninges<\/a> · <a href=\"#i-a-1-a-5\">I.A.1.a.5 Dermatome Anatomy<\/a><\/p>","b":"Count spinal levels from bony landmarks, but expect palpation to miss by a level, usually upward. Aim low enough that an error cannot reach the conus, which ends at L1–L2 in adults and near L3 in newborns.","u":"2026-11-05"},"I.A.1.a.4":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> At most block and line sites a nerve runs beside an artery, so the pulse is the landmark. Know which side of the artery the nerve lies on, and which bones put nerves at risk from fractures and pressure.<\/p><h3 class=\"nb-h\">Nerve and artery pairs<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Site<\/th><th scope=\"col\">Artery<\/th><th scope=\"col\">Where the nerves lie<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Axilla<\/th><td>Axillary artery<\/td><td>Median usually superficial and lateral, ulnar superficial and medial, radial deep (posterior); the musculocutaneous has already left for the coracobrachialis<\/td><\/tr><tr><th scope=\"row\">Antecubital fossa<\/th><td>Brachial artery<\/td><td>Median nerve just medial to the artery; biceps tendon lateral to it<\/td><\/tr><tr><th scope=\"row\">Wrist<\/th><td>Radial artery lateral to the flexor carpi radialis tendon; ulnar artery beside the flexor carpi ulnaris tendon<\/td><td>Median nerve between the flexor carpi radialis and palmaris longus tendons; ulnar nerve between the ulnar artery and the flexor carpi ulnaris tendon<\/td><\/tr><tr><th scope=\"row\">Groin<\/th><td>Femoral artery at the midinguinal point<\/td><td>Femoral nerve lateral, beneath the fascia iliaca and outside the femoral sheath; femoral vein medial<\/td><\/tr><tr><th scope=\"row\">Mid-thigh (adductor canal)<\/th><td>Superficial femoral artery<\/td><td>Saphenous nerve beside the artery, beneath the sartorius<\/td><\/tr><tr><th scope=\"row\">Popliteal fossa<\/th><td>Popliteal artery, deepest, against the femur<\/td><td>Tibial nerve most superficial, then the popliteal vein, then the artery<\/td><\/tr><tr><th scope=\"row\">Medial ankle<\/th><td>Posterior tibial artery, behind the medial malleolus<\/td><td>Tibial nerve just behind the artery<\/td><\/tr><tr><th scope=\"row\">Front of the ankle<\/th><td>Dorsalis pedis (anterior tibial) artery<\/td><td>Deep peroneal nerve lateral to the artery, between the extensor hallucis longus and extensor digitorum longus tendons<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Bones that put nerves at risk<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Bone or landmark<\/th><th scope=\"col\">Nerve<\/th><th scope=\"col\">How it gets hurt<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Surgical neck of the humerus<\/th><td>Axillary nerve<\/td><td>Shoulder dislocation, proximal humerus fracture<\/td><\/tr><tr><th scope=\"row\">Spiral groove of the humerus<\/th><td>Radial nerve<\/td><td>Midshaft fracture; compression against a table edge or arm board, causing wrist drop<\/td><\/tr><tr><th scope=\"row\">Medial epicondyle (cubital tunnel)<\/th><td>Ulnar nerve<\/td><td>Pressure on the elbow or prolonged flexion, causing weak finger spreading and a numb little finger<\/td><\/tr><tr><th scope=\"row\">Supracondylar humerus in children<\/th><td>Median (anterior interosseous) nerve, brachial artery<\/td><td>Displaced fracture<\/td><\/tr><tr><th scope=\"row\">First rib<\/th><td>Brachial plexus, subclavian vessels<\/td><td>They cross it, with the pleura just beneath<\/td><\/tr><tr><th scope=\"row\">Fibular neck<\/th><td>Common peroneal nerve<\/td><td>Pressure from a lithotomy stirrup or the lateral position, causing foot drop<\/td><\/tr><tr><th scope=\"row\">Medial malleolus<\/th><td>Saphenous nerve, great saphenous vein<\/td><td>Venous cutdown<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Practical points<\/h3><ul><li>Arteries pulse and resist compression; veins collapse. With ultrasound, ease the probe pressure before injecting so veins reappear.<\/li><li>Behind the medial malleolus, front to back: tibialis posterior, flexor digitorum longus, artery, vein, nerve, flexor hallucis longus (\"Tom, Dick And Very Nervous Harry\").<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> the musculocutaneous nerve leaves the sheath high in the axilla, so an axillary block placed only around the artery misses it and spares the lateral forearm. Block it separately in the coracobrachialis.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-b-6\">I.A.1.b.6 Extremities ultrasound<\/a> · <a href=\"#i-a-1-c-1-c\">I.A.1.c.1.c Upper extremity innervation<\/a> · <a href=\"#i-a-1-c-2-c\">I.A.1.c.2.c Lower extremity innervation<\/a> · <a href=\"#i-b-6-a-5\">I.B.6.a.5 Nerve injuries from pressure and position<\/a><\/p>","b":"At most block and line sites a nerve runs beside an artery, so the pulse is the landmark. Know which side of the artery the nerve lies on, and which bones put nerves at risk from fractures and pressure.","u":"2026-11-05"},"I.A.1.a.5":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> A few dermatome landmarks set block height: T4 at the nipples, T6 at the xiphoid, T10 at the umbilicus and L1 at the groin. Myotomes and reflexes test motor block and localize nerve root problems.<\/p><h3 class=\"nb-h\">Dermatome landmarks<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Dermatome<\/th><th scope=\"col\">Skin area<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">C4<\/th><td>Top of the shoulder<\/td><\/tr><tr><th scope=\"row\">C5<\/th><td>Lateral upper arm, over the deltoid<\/td><\/tr><tr><th scope=\"row\">C6<\/th><td>Thumb and radial forearm<\/td><\/tr><tr><th scope=\"row\">C7<\/th><td>Middle finger<\/td><\/tr><tr><th scope=\"row\">C8<\/th><td>Little finger and ulnar side of the hand<\/td><\/tr><tr><th scope=\"row\">T1<\/th><td>Medial forearm<\/td><\/tr><tr><th scope=\"row\">T2<\/th><td>Medial upper arm and axilla<\/td><\/tr><tr><th scope=\"row\">T4<\/th><td>Nipple line<\/td><\/tr><tr><th scope=\"row\">T6<\/th><td>Xiphoid process<\/td><\/tr><tr><th scope=\"row\">T10<\/th><td>Umbilicus<\/td><\/tr><tr><th scope=\"row\">L1<\/th><td>Inguinal ligament and groin<\/td><\/tr><tr><th scope=\"row\">L2–L3<\/th><td>Anterior thigh<\/td><\/tr><tr><th scope=\"row\">L4<\/th><td>Knee and medial leg to the medial malleolus<\/td><\/tr><tr><th scope=\"row\">L5<\/th><td>Lateral leg, top of the foot, big toe<\/td><\/tr><tr><th scope=\"row\">S1<\/th><td>Lateral foot, little toe, sole and heel<\/td><\/tr><tr><th scope=\"row\">S2–S5<\/th><td>Back of the thigh (S2) and perineum (S3–S5)<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Block height needed<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Procedure<\/th><th scope=\"col\">Sensory level<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Cesarean delivery, upper abdominal surgery<\/th><td>T4<\/td><\/tr><tr><th scope=\"row\">Bowel, gynecologic pelvic, ureter and renal pelvis surgery<\/th><td>T6<\/td><\/tr><tr><th scope=\"row\">Transurethral resection of the prostate, vaginal delivery, hip surgery<\/th><td>T10<\/td><\/tr><tr><th scope=\"row\">Thigh surgery, lower leg amputation<\/th><td>L1<\/td><\/tr><tr><th scope=\"row\">Foot and ankle surgery<\/th><td>L2<\/td><\/tr><tr><th scope=\"row\">Perineal and perianal surgery<\/th><td>S2–S5<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Cesarean delivery needs T4 because handling the peritoneum and uterus hurts even when the skin of the incision is numb.<\/li><li>Labor pain: the first stage travels with T10–L1 (contractions, cervical dilation); the second stage adds S2–S4 (birth canal and perineum, via the pudendal nerves).<\/li><\/ul><h3 class=\"nb-h\">Myotomes and reflexes<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Root<\/th><th scope=\"col\">Movement<\/th><th scope=\"col\">Reflex<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">C5<\/th><td>Shoulder abduction, elbow flexion<\/td><td>Biceps<\/td><\/tr><tr><th scope=\"row\">C6<\/th><td>Wrist extension<\/td><td>Brachioradialis<\/td><\/tr><tr><th scope=\"row\">C7<\/th><td>Elbow extension<\/td><td>Triceps<\/td><\/tr><tr><th scope=\"row\">C8<\/th><td>Finger flexion<\/td><td><\/td><\/tr><tr><th scope=\"row\">T1<\/th><td>Spreading the fingers<\/td><td><\/td><\/tr><tr><th scope=\"row\">L2<\/th><td>Hip flexion<\/td><td><\/td><\/tr><tr><th scope=\"row\">L3<\/th><td>Knee extension<\/td><td>Knee jerk (with L4)<\/td><\/tr><tr><th scope=\"row\">L4<\/th><td>Ankle dorsiflexion<\/td><td>Knee jerk<\/td><\/tr><tr><th scope=\"row\">L5<\/th><td>Big toe extension<\/td><td><\/td><\/tr><tr><th scope=\"row\">S1<\/th><td>Ankle plantar flexion<\/td><td>Ankle jerk<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Testing a neuraxial block<\/h3><ul><li>Sympathetic block usually extends about two segments above the sensory (pinprick) level, and sensory block about two segments above motor block.<\/li><li>Cold sensation is lost a segment or two above pinprick, and light touch a little below it, so record which test you used.<\/li><li>Leg motor block is graded on the Bromage scale: 0, full movement; 1, cannot raise the straight leg but can bend the knee; 2, cannot bend the knee but can move the foot; 3, cannot move the foot.<\/li><li>Dermatomes are root territories. Peripheral nerve territories (median, ulnar, saphenous and others) differ; see <a href=\"#i-a-1-c-1-c\">I.A.1.c.1.c<\/a> and <a href=\"#i-a-1-c-2-c\">I.A.1.c.2.c<\/a>.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> the umbilicus is the T10 dermatome but sits at the L3–L4 vertebral level. Dermatome levels are not vertebral levels.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#ii-c-1-b-1\">II.C.1.b.1 Sensory and Motor Distributions of Peripheral Nerves<\/a> · <a href=\"#ii-b-1-b\">II.B.1.b Neuraxial Blocks<\/a> · <a href=\"#ii-d-3-g\">II.D.3.g Cesarean Delivery Anesthesia<\/a> · <a href=\"#i-a-1-a-3\">I.A.1.a.3 Pelvis and Back<\/a><\/p>","b":"A few dermatome landmarks set block height: T4 at the nipples, T6 at the xiphoid, T10 at the umbilicus and L1 at the groin. Myotomes and reflexes test motor block and localize nerve root problems.","u":"2026-11-05"},"I.A.1.b":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Imaging lets you confirm anatomy instead of inferring it: chest films for tubes and lines, CT and MRI for problems that change the anesthetic plan, and ultrasound for needles and catheters.<\/p><h3 class=\"nb-h\">Ultrasound terms used in this section<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Term<\/th><th scope=\"col\">Meaning<\/th><th scope=\"col\">Examples<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Hyperechoic (bright)<\/th><td>Strong reflector<\/td><td>Fascia, tendon, bone surface, pleura, needle<\/td><\/tr><tr><th scope=\"row\">Hypoechoic (gray)<\/th><td>Weak reflector<\/td><td>Muscle; nerve roots near the spine<\/td><\/tr><tr><th scope=\"row\">Anechoic (black)<\/th><td>No echoes<\/td><td>Blood in vessels, local anesthetic, effusions<\/td><\/tr><tr><th scope=\"row\">Acoustic shadow<\/th><td>Dark band behind a strong reflector<\/td><td>Bone, calcified plaque<\/td><\/tr><tr><th scope=\"row\">Anisotropy<\/th><td>Brightness changes with probe angle<\/td><td>Tendons most, nerves less<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Probe choice: high-frequency linear (about 6 to 15 MHz) for structures within about 4 cm of the skin; low-frequency curvilinear (about 2 to 5 MHz) for deep targets such as the neuraxis, the sciatic nerve in the buttock and obese patients; phased array for the heart. Higher frequency gives sharper images but less depth.<\/li><li>Needle approach: in-plane shows the whole shaft and tip. Out-of-plane shows only a bright dot, which may be the shaft rather than the tip.<\/li><li>Color Doppler shows flow toward the probe as red and away from it as blue (\"BART\": blue away, red toward), whatever the vessel. Color alone does not tell artery from vein.<\/li><li>The physics of frequency, resolution and Doppler shift is in <a href=\"#i-a-2-a-3\">I.A.2.a.3<\/a> and <a href=\"#i-a-2-b-3\">I.A.2.b.3<\/a>.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-a-3\">I.A.2.a.3 Principles of Ultrasound<\/a> · <a href=\"#i-a-2-b-3\">I.A.2.b.3 Principles of Doppler Ultrasound<\/a> · <a href=\"#ii-a-1-b-4\">II.A.1.b.4 Ultrasound-Guided Vascular Catheters and Nerve Blocks<\/a> · <a href=\"#ii-a-1-b-5\">II.A.1.b.5 Point-of-Care Ultrasound<\/a><\/p>","b":"Imaging lets you confirm anatomy instead of inferring it: chest films for tubes and lines, CT and MRI for problems that change the anesthetic plan, and ultrasound for needles and catheters.","u":"2026-11-05"},"I.A.1.b.1":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Read every chest film for tubes and lines first, then for air, fluid and the mediastinum. CT shows how much a mass narrows the airway, and lung ultrasound finds a pneumothorax at the bedside.<\/p><h3 class=\"nb-h\">Tubes and lines on the chest x-ray<\/h3><ul><li>Endotracheal tube: tip in the mid-trachea, about 3 to 5 cm above the carina in adults with the head neutral. The tip moves about 2 cm toward the carina when the neck flexes and away when it extends (\"the hose follows the nose\").<\/li><li>Central venous catheter: tip in the lower SVC, above the right atrium. A tip at or above the carina lies outside the pericardium. Left-sided catheters should reach the SVC rather than end against its wall.<\/li><li>Pulmonary artery catheter: tip in a proximal pulmonary artery, within about 2 cm of the hilum.<\/li><li>Gastric tube: follows the midline esophagus, crosses the diaphragm and ends in the stomach. A tube that follows a bronchus is in the airway.<\/li><\/ul><h3 class=\"nb-h\">Air and fluid<\/h3><ul><li>Pneumothorax: a thin pleural line with no lung markings beyond it. On a supine film the air collects in front, so look for a deep sulcus sign, an unusually sharp heart border or a lucent upper abdomen.<\/li><li>Tension pneumothorax shifts the mediastinum away and flattens the diaphragm, but it is a clinical diagnosis; treat it without waiting for a film.<\/li><li>Pleural effusion blunts the costophrenic angle on an upright film once a few hundred milliliters collect; on a supine film it looks like a haze over the lower lung.<\/li><li>Atelectasis loses volume and pulls structures toward it (shifted fissure, raised diaphragm, mediastinum moving toward the collapse). Consolidation keeps its volume and often shows air bronchograms.<\/li><li>Silhouette sign: a lost right heart border points to the right middle lobe, a lost left heart border to the lingula, and a lost diaphragm outline to a lower lobe.<\/li><li>Pulmonary edema: blood diverted to upper-lobe vessels, Kerley B lines, peribronchial cuffing and perihilar (\"bat-wing\") opacity.<\/li><li>Free air under the diaphragm on an upright film means a perforated viscus or recent surgery.<\/li><\/ul><h3 class=\"nb-h\">CT and MRI<\/h3><ul><li>Anterior mediastinal mass: CT shows compression of the trachea, bronchi, heart and great vessels. Tracheal narrowing of more than about half its cross-sectional area, or symptoms when lying flat, mark a high risk of airway or circulatory collapse under general anesthesia (see <a href=\"#ii-d-2-j-3\">II.D.2.j.3<\/a>).<\/li><li>CT also shows small or loculated pneumothoraces, pulmonary emboli (CT angiography), and the exact level and length of a tracheal or bronchial narrowing for planning tube size and lung isolation.<\/li><li>MRI is used for the heart, great vessels and mediastinal tumors; working in the scanner is covered in <a href=\"#ii-e-3\">II.E.3<\/a>.<\/li><\/ul><h3 class=\"nb-h\">Lung ultrasound<\/h3><ul><li>Normal lung: the pleural line slides with breathing, and horizontal reverberations (A-lines) repeat below it. On M-mode this gives the \"seashore\" sign.<\/li><li>Pneumothorax: no sliding and no B-lines; M-mode shows the \"barcode\" (stratosphere) sign. The lung point, where sliding lung meets the pneumothorax, confirms it.<\/li><li>No sliding but a lung pulse (the pleura twitching with each heartbeat) means the lung touches the chest wall but is not ventilated, as in a mainstem intubation, rather than a pneumothorax.<\/li><li>B-lines: bright vertical lines from the pleura to the bottom of the screen that move with sliding. Three or more in one rib space suggest interstitial fluid such as pulmonary edema.<\/li><li>Consolidation looks like solid tissue, often with air bronchograms; an effusion is a dark space above the diaphragm.<\/li><li>Diaphragm ultrasound shows paresis after an interscalene block: reduced or paradoxical movement when the patient sniffs.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-a-2\">I.A.1.a.2 Chest<\/a> · <a href=\"#ii-d-2-j-3\">II.D.2.j.3 Thoracic Surgery: Anterior Mediastinal Mass<\/a> · <a href=\"#ii-a-1-b-5\">II.A.1.b.5 Point-of-Care Ultrasound<\/a> · <a href=\"#ii-c-2-d-1-b-4\">II.C.2.d.1.b.4 Pleural and Mediastinal Disease<\/a><\/p>","b":"Read every chest film for tubes and lines first, then for air, fluid and the mediastinum. CT shows how much a mass narrows the airway, and lung ultrasound finds a pneumothorax at the bedside.","u":"2026-11-05"},"I.A.1.b.2":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Noncontrast CT is the first scan after an acute neurologic change because it shows blood, mass effect and hydrocephalus within minutes. MRI is better for ischemia, the posterior fossa and the brainstem, but takes longer and needs MRI-safe equipment.<\/p><h3 class=\"nb-h\">Reading a head CT<\/h3><ul><li>Densities: bone white, acute blood bright (hyperdense) for about the first week, brain gray, CSF dark, air black. Blood then fades to the gray of brain and later darker.<\/li><li>An early ischemic stroke often looks normal for the first several hours; CT is done first to exclude hemorrhage before thrombolysis.<\/li><li>Mass effect: midline shift, effaced sulci and basal cisterns, compressed ventricles. Hydrocephalus: enlarged ventricles, especially the temporal horns.<\/li><\/ul><h3 class=\"nb-h\">Hemorrhage patterns<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Type<\/th><th scope=\"col\">Shape on CT<\/th><th scope=\"col\">Usual source<\/th><th scope=\"col\">Clinical clue<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Epidural<\/th><td>Biconvex (lens-shaped); does not cross sutures<\/td><td>Middle meningeal artery, often with a temporal bone fracture<\/td><td>Lucid interval, then rapid decline<\/td><\/tr><tr><th scope=\"row\">Subdural<\/th><td>Crescent; crosses sutures<\/td><td>Torn bridging veins; older, anticoagulated or alcohol-using patients<\/td><td>Acute after trauma, or chronic with gradual confusion<\/td><\/tr><tr><th scope=\"row\">Subarachnoid<\/th><td>Blood in the basal cisterns, fissures and sulci<\/td><td>Ruptured aneurysm (most spontaneous cases), trauma<\/td><td>Sudden severe headache; vasospasm risk from about day 3 to day 14<\/td><\/tr><tr><th scope=\"row\">Intraparenchymal<\/th><td>Bright mass within the brain<\/td><td>Hypertension (basal ganglia, thalamus, pons, cerebellum); amyloid angiopathy (lobar)<\/td><td>Focal deficit, raised ICP<\/td><\/tr><tr><th scope=\"row\">Intraventricular<\/th><td>Blood within the ventricles<\/td><td>Extension of the above; germinal matrix in preterm infants<\/td><td>Hydrocephalus<\/td><\/tr><\/tbody><\/table><\/div><ul><li>In trauma, an acute subdural hematoma thicker than 10 mm or causing more than 5 mm of midline shift is usually evacuated whatever the Glasgow Coma Scale.<\/li><\/ul><h3 class=\"nb-h\">Herniation<\/h3><ul><li>Subfalcine: the cingulate gyrus slides under the falx and can compress the anterior cerebral artery.<\/li><li>Uncal (transtentorial): the medial temporal lobe compresses the third nerve, giving a fixed, dilated pupil on the same side, and the cerebral peduncle, giving hemiparesis, usually on the opposite side.<\/li><li>Tonsillar: the cerebellar tonsils pass through the foramen magnum and compress the medulla. The Cushing response (hypertension, bradycardia, irregular breathing) is a late sign.<\/li><\/ul><h3 class=\"nb-h\">Skull and skull base<\/h3><ul><li>Signs of a basilar skull fracture: bruising around the eyes (raccoon eyes) or over the mastoid (Battle sign), CSF leaking from the nose or ear, and blood behind the eardrum. Avoid nasal tubes and nasal airways, which can enter the cranium.<\/li><li>Pneumocephalus is expected after craniotomy and can last days to weeks. Nitrous oxide expands it and can create a tension pneumocephalus (see <a href=\"#i-a-4-b-1\">I.A.4.b.1<\/a>).<\/li><\/ul><h3 class=\"nb-h\">MRI<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Sequence<\/th><th scope=\"col\">Shows bright<\/th><th scope=\"col\">Use<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">T1<\/th><td>Fat; subacute blood<\/td><td>Anatomy; with gadolinium, tumors and abscesses where the blood–brain barrier has broken down<\/td><\/tr><tr><th scope=\"row\">T2<\/th><td>Water and CSF<\/td><td>Edema and most lesions<\/td><\/tr><tr><th scope=\"row\">FLAIR<\/th><td>Edema, with CSF signal suppressed<\/td><td>Lesions next to the ventricles and cortex<\/td><\/tr><tr><th scope=\"row\">Diffusion-weighted (DWI)<\/th><td>Acute infarct within minutes<\/td><td>Early stroke<\/td><\/tr><\/tbody><\/table><\/div><ul><li>MRI shows the posterior fossa and brainstem without the bone artifact that limits CT there.<\/li><li>Scans are long and loud, the patient is far away, and only MRI-conditional monitors and pumps may enter (see <a href=\"#ii-e-3\">II.E.3<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Vascular imaging<\/h3><ul><li>CT and MR angiography show aneurysms, arteriovenous malformations, dissections and vasospasm. Catheter (digital subtraction) angiography remains the reference standard and allows coiling.<\/li><li>Transcranial Doppler tracks vasospasm at the bedside: a middle cerebral artery mean velocity above about 120 cm/s suggests it (see <a href=\"#ii-a-1-a-3\">II.A.1.a.3<\/a>).<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#ii-c-1-a-2\">II.C.1.a.2 Intracranial Pressure<\/a> · <a href=\"#ii-c-1-d-1-f-1\">II.C.1.d.1.f.1 Increased Intracranial Pressure<\/a> · <a href=\"#ii-c-1-d-1-b-1\">II.C.1.d.1.b.1 Glasgow Coma Scale and Traumatic Brain Injury<\/a> · <a href=\"#ii-e-3\">II.E.3 Radiologic Procedures, CT and MRI<\/a><\/p>","b":"Noncontrast CT is the first scan after an acute neurologic change because it shows blood, mass effect and hydrocephalus within minutes. MRI is better for ischemia, the posterior fossa and the brainstem, but takes longer and needs MRI-safe equipment.","u":"2026-11-05"},"I.A.1.b.3":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Spine imaging matters to anesthesiologists in two ways: an unstable or narrowed cervical spine changes airway management, and ultrasound of the lumbar spine finds the midline, the level and the depth before a neuraxial block.<\/p><h3 class=\"nb-h\">Cervical spine<\/h3><ul><li>After trauma, clinical rules (NEXUS, the Canadian C-spine rule) decide who needs imaging, and CT is the standard first test in adults. MRI shows ligament and cord injury.<\/li><li>Atlantoaxial instability: the atlanto-dens interval is normally up to 3 mm in adults and up to about 4 to 5 mm in young children. Larger gaps, especially on flexion views, mean instability. Causes include rheumatoid arthritis and Down syndrome.<\/li><li>Rheumatoid arthritis can also cause cranial settling and subluxation lower in the neck. Ask about neck pain and arm symptoms before positioning or laryngoscopy.<\/li><li>Cervical stenosis and myelopathy: extension narrows the canal, so avoid hyperextension during laryngoscopy and positioning.<\/li><li>Ankylosing spondylitis: a rigid, often flexed spine that fractures with minor force. Awake fiberoptic intubation and careful positioning are common choices, and neuraxial access is difficult.<\/li><li>Manual in-line stabilization limits movement during laryngoscopy (see <a href=\"#ii-c-1-d-1-d-1\">II.C.1.d.1.d.1<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Thoracic and lumbar spine<\/h3><ul><li>MRI is the test for a suspected epidural hematoma or abscess after a neuraxial block. Get it urgently: recovery is best when decompression happens within about 8 hours of symptoms.<\/li><li>Scoliosis: the vertebral bodies rotate toward the convex side and the spinous processes toward the concave side, so the interlaminar gap opens toward the convexity. A paramedian approach from the convex side often works.<\/li><li>Prior surgery: fusion, hardware and scar block the midline. Choose a level above or below, and expect patchy epidural spread.<\/li><li>Spinal stenosis and spondylolisthesis narrow the canal; a tethered cord or spina bifida occulta can place the conus abnormally low.<\/li><li>Transitional vertebrae (a sacralized L5 or lumbarized S1) make counting levels unreliable on films and on ultrasound.<\/li><\/ul><h3 class=\"nb-h\">Neuraxial ultrasound<\/h3><ul><li>Use a low-frequency curvilinear probe.<\/li><li>Parasagittal view: the sacrum is a continuous bright line, and the laminae above it form a sawtooth. Count up from the sacrum to name each interspace.<\/li><li>In each interlaminar window, the bright posterior complex (ligamentum flavum and posterior dura) and the deeper anterior complex (anterior dura, posterior longitudinal ligament and the back of the vertebral body) confirm a clear path.<\/li><li>Transverse view: the midline is where the spinous process shadow gives way to an interspace with symmetric articular processes on each side.<\/li><li>The depth from skin to the posterior complex approximates the needle depth to the epidural space, often slightly underestimating it.<\/li><li>Compared with palpation, ultrasound identifies the intended interspace more often and reduces needle passes and failed blocks, most of all with obesity, scoliosis or prior spine surgery.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-a-3\">I.A.1.a.3 Pelvis and Back<\/a> · <a href=\"#ii-c-1-d-1-d-1\">II.C.1.d.1.d.1 Airway Management in Cervical Spine Disease<\/a> · <a href=\"#ii-b-1-b\">II.B.1.b Neuraxial Blocks<\/a> · <a href=\"#i-b-2-b-5\">I.B.2.b.5 Neuraxial Complications and Anticoagulants<\/a><\/p>","b":"Spine imaging matters to anesthesiologists in two ways: an unstable or narrowed cervical spine changes airway management, and ultrasound of the lumbar spine finds the midline, the level and the depth before a neuraxial block.","u":"2026-11-05"},"I.A.1.b.4":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> On ultrasound the internal jugular vein is the thin-walled, compressible vessel beside the round, pulsatile carotid. Real-time guidance cuts arterial punctures and complications compared with landmarks, provided you keep the needle tip in view and confirm the wire is in the vein before you dilate.<\/p><h3 class=\"nb-h\">Vein or artery<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Feature<\/th><th scope=\"col\">Internal jugular vein<\/th><th scope=\"col\">Common carotid artery<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Usual position<\/th><td>Lateral and slightly in front<\/td><td>Medial and deeper<\/td><\/tr><tr><th scope=\"row\">Shape and wall<\/th><td>Oval, thin wall; size changes with breathing<\/td><td>Round, thick bright wall<\/td><\/tr><tr><th scope=\"row\">Light probe pressure<\/th><td>Flattens<\/td><td>Stays round<\/td><\/tr><tr><th scope=\"row\">Head-down tilt, Valsalva or PEEP<\/th><td>Gets bigger<\/td><td>No change<\/td><\/tr><tr><th scope=\"row\">Pulsation<\/th><td>Soft flicker with breathing and heartbeat<\/td><td>Brisk, with each systole<\/td><\/tr><tr><th scope=\"row\">Pulsed-wave Doppler<\/th><td>Slower flow toward the heart that varies with breathing<\/td><td>Fast, sharp systolic peaks<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Doppler for line placement<\/h3><ul><li>Color Doppler shows direction relative to the probe, not artery versus vein. By convention red is toward the probe and blue is away (\"BART\": blue away, red toward), so tilting the probe can flip the colors. Never call a vessel a vein because it is blue.<\/li><li>The Doppler shift is proportional to the cosine of the angle between the beam and the flow. At 90 degrees, as in a flat transverse view, it is close to zero and flow may not show, so tilt the probe. Velocity readings are reliable only at angles of about 60 degrees or less.<\/li><li>Pulsed-wave (spectral) Doppler separates t

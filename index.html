he vessels best: sharp arterial peaks with every beat, against slower venous flow that varies with breathing.<\/li><li>A flat venous signal that no longer varies with breathing suggests a blockage further in, such as thrombus or stenosis in the brachiocephalic vein or SVC.<\/li><li>In the Cochrane review below, Doppler-guided puncture raised first-attempt success but showed no clear drop in complications or arterial punctures, and the authors called the Doppler results uncertain. 2D imaging is the standard.<\/li><\/ul><h3 class=\"nb-h\">Scan before you prep<\/h3><ul><li>Scan both sides before prepping and draping. Note the vein's size, depth and position against the carotid, and look for what you cannot feel: a small or absent vein, a vein lying right over the artery, or thrombus.<\/li><li>Press along the length of the vein. A vein that does not flatten holds thrombus until proven otherwise. Fresh clot can look black, so trust compressibility more than echoes.<\/li><li>Turning the head far to the opposite side makes the vein overlie the carotid more often, so keep the turn modest (see <a href=\"#i-a-1-a-1\">I.A.1.a.1<\/a>).<\/li><li>To enlarge a small vein, tilt the patient head-down, ask an awake patient to perform a Valsalva maneuver, or add PEEP under anesthesia.<\/li><li>Know the neighbors in a transverse view at the cricoid: the sternocleidomastoid on top, the thyroid medial to the carotid, the vagus nerve as a small round structure behind and between the vessels, and, deeper and lateral, the anterior scalene with the phrenic nerve on its surface. Brachial plexus views are in <a href=\"#i-a-1-b-6\">I.A.1.b.6<\/a>.<\/li><\/ul><h3 class=\"nb-h\">Real-time needle guidance<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">View<\/th><th scope=\"col\">Probe<\/th><th scope=\"col\">Strengths<\/th><th scope=\"col\">Weaknesses<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Short axis (out of plane)<\/th><td>Across the vessels<\/td><td>Vein and carotid side by side; quick to learn<\/td><td>The needle is only a bright dot, which may be the shaft rather than the tip<\/td><\/tr><tr><th scope=\"row\">Long axis (in plane)<\/th><td>Along the vein<\/td><td>Whole needle, tip and back wall in view<\/td><td>Carotid out of view; the needle easily slips out of the thin beam<\/td><\/tr><tr><th scope=\"row\">Oblique<\/th><td>About 45 degrees between the two<\/td><td>More of the needle, with the carotid still in view<\/td><td>Harder to learn<\/td><\/tr><\/tbody><\/table><\/div><ul><li>In short axis, track the tip: slide the probe ahead until the bright dot disappears, advance the needle until the dot reappears, and repeat.<\/li><li>Watch the front wall tent and then spring back as the needle enters. In a small or empty vein the needle can press both walls together and exit through the back wall.<\/li><li>Dark, non-pulsatile blood is an unreliable sign of venous placement in hypoxemia and shock.<\/li><li>Before dilating, see the wire inside the vein in both short and long axis and follow it down toward the clavicle. Pressure transduction or a manometer column through a small catheter, TEE showing the wire in the SVC or right atrium, and fluoroscopy are other ways to confirm it.<\/li><li>The <a href=\"https://doi.org/10.1097/ALN.0000000000002864\" target=\"_blank\" rel=\"noopener\">ASA practice guidelines for central venous access (2020)<\/a> recommend real-time ultrasound when the internal jugular is chosen, a static scan before prepping, and confirming that the wire is in the vein before a dilator or large-bore catheter goes in. They allow ultrasound for subclavian and femoral access when feasible.<\/li><li>A <a href=\"https://doi.org/10.1002/14651858.CD006962.pub2\" target=\"_blank\" rel=\"noopener\">Cochrane review (Brass 2015)<\/a> of 35 trials and 5,108 patients found that 2D ultrasound for internal jugular lines cut total complications by 71%, arterial punctures by 72% and hematomas by 73%, and raised first-attempt success by 57%, compared with landmarks. The quality of the evidence was very low for most outcomes.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a needle in the carotid is usually managed with pressure, but a dilator or large catheter in the carotid is not. Leave it in place and get a surgeon or interventional radiologist to remove it, as the ASA guidelines advise for adults.<\/p><\/div><h3 class=\"nb-h\">After the line<\/h3><ul><li>Confirm the catheter tip position as soon as is clinically appropriate. For a line placed in the operating room, the ASA guidelines call for a chest film no later than the early postoperative period (where the tip belongs: see <a href=\"#i-a-1-b-1\">I.A.1.b.1<\/a>).<\/li><li>After a low jugular or a subclavian attempt, check lung sliding on that side to exclude a pneumothorax.<\/li><\/ul><h3 class=\"nb-h\">Which vein<\/h3><ul><li>Internal jugular: the easiest to see and to compress, so it is the usual ultrasound-guided choice.<\/li><li>Subclavian: the fewest infections and clots, but the clavicle hides it from ultrasound and bleeding there is hard to compress. Ultrasound-guided \"subclavian\" access is often really the axillary vein, just outside the first rib.<\/li><li>Femoral: quick, and away from the airway and chest, but it had the most infections and clots in the trial below (see <a href=\"#i-a-1-c-2-b\">I.A.1.c.2.b<\/a>).<\/li><li>In the <a href=\"https://doi.org/10.1056/NEJMoa1500964\" target=\"_blank\" rel=\"noopener\">3SITES trial (Parienti 2015)<\/a> in adult ICU patients, bloodstream infection or symptomatic deep vein thrombosis occurred at 1.5 (subclavian), 3.6 (jugular) and 4.6 (femoral) per 1,000 catheter-days. Pneumothorax needing a chest tube occurred in 1.5% of subclavian and 0.5% of jugular insertions.<\/li><\/ul><h3 class=\"nb-h\">Other neck scans<\/h3><ul><li>Cricothyroid membrane: hold a linear probe lengthwise in the midline. The tracheal rings look like a row of dark beads on a bright air line (\"string of pearls\"). Slide up: the cricoid is a larger, longer bead, and the membrane is the bright line between it and the thyroid cartilage. Mark it before induction when a difficult airway is predicted.<\/li><li>Esophageal intubation: with a transverse probe just above the suprasternal notch, the trachea is a bright curved air line with a shadow behind it. A tube in the esophagus, which usually lies to the left, creates a second air line beside the trachea (the \"double tract sign\"). Capnography remains the standard check.<\/li><li>Stellate ganglion block: at C6 the transverse process has a large anterior tubercle (Chassaignac's tubercle). The injection goes under the prevertebral fascia over the longus colli, medial to the carotid; check first with color Doppler for the vertebral and inferior thyroid arteries. C7 has no anterior tubercle and the vertebral artery lies in front of it, so a C7 approach carries more vascular risk. On the left the esophagus may lie in the path.<\/li><li>Superficial cervical plexus block: the nerves emerge at the middle of the posterior border of the sternocleidomastoid, at about C4. Inject just under that border, superficial to the prevertebral fascia, for carotid surgery or, with an interscalene block, clavicle surgery.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#ii-a-1-b-4\">II.A.1.b.4 Ultrasound-Guided Vascular Catheters and Nerve Blocks<\/a> · <a href=\"#i-a-1-a-1\">I.A.1.a.1 Neck<\/a> · <a href=\"#i-b-6-a-4\">I.B.6.a.4 Vascular complications<\/a> · <a href=\"#i-b-3-c-5\">I.B.3.c.5 Transcutaneous or Surgical Airway<\/a> · <a href=\"#i-a-1-b-1\">I.A.1.b.1 Chest imaging<\/a><\/p>","b":"On ultrasound the internal jugular vein is the thin-walled, compressible vessel beside the round, pulsatile carotid. Real-time guidance cuts arterial punctures and complications compared with landmarks, provided you keep the needle tip in view and confirm the wire is in the vein before you dilate.","u":"2026-11-05"},"I.A.1.b.5":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Abdominal wall blocks are fascial plane blocks: on ultrasound you look for a layer, not a nerve. Name the muscles, keep the needle tip above the peritoneum, and remember that these blocks cover the incision, not the viscera.<\/p><h3 class=\"nb-h\">The layers on screen<\/h3><p>With a linear probe across the flank in the midaxillary line, from the skin down:<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Layer<\/th><th scope=\"col\">Appearance<\/th><th scope=\"col\">Why it matters<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Skin and fat<\/th><td>Dark and speckled; thickness varies widely<\/td><td>Obese patients may need a curved, lower-frequency probe<\/td><\/tr><tr><th scope=\"row\">External oblique<\/th><td>Striated muscle that turns into aponeurosis toward the front<\/td><td>The most superficial muscle<\/td><\/tr><tr><th scope=\"row\">Internal oblique<\/th><td>Usually the thickest of the three<\/td><td>The roof of the transversus abdominis plane<\/td><\/tr><tr><th scope=\"row\">Transversus abdominis<\/th><td>Usually the thinnest and darkest<\/td><td>The nerves run on its outer surface<\/td><\/tr><tr><th scope=\"row\">Transversalis fascia and peritoneum<\/th><td>Thin bright lines<\/td><td>The last layers before the bowel<\/td><\/tr><tr><th scope=\"row\">Bowel<\/th><td>Moving loops with bright air and shadows<\/td><td>Liver or spleen may lie here in the upper quadrants<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Where the nerves run<\/h3><ul><li>The anterior rami of T6 to L1 run forward between the internal oblique and transversus abdominis, in the transversus abdominis plane (TAP). T7 to T11 are the lower intercostal nerves, T12 is the subcostal nerve, and L1 splits into the iliohypogastric and ilioinguinal nerves.<\/li><li>Each nerve gives off a lateral cutaneous branch near the midaxillary line, so a block placed in front of that line often misses the lateral wall.<\/li><li>The upper nerves (T6 to T9) reach the plane only close to the costal margin, which is why the upper abdomen needs a subcostal approach.<\/li><li>Near the midline the nerves pass behind the rectus muscle, inside its sheath, and then come out through the front as anterior cutaneous branches.<\/li><li>Above the arcuate line, which lies between the umbilicus and the pubis, the rectus has a posterior sheath. Below it, all the aponeuroses pass in front of the muscle, leaving only transversalis fascia behind it. So a rectus sheath block is placed at or above the umbilicus, where the posterior sheath lies between the needle and the peritoneum.<\/li><li>The inferior epigastric artery runs up the back of the rectus, entering the sheath near the arcuate line, and the deep circumflex iliac artery runs in the TAP near the anterior superior iliac spine (ASIS). Look for both with color Doppler.<\/li><\/ul><h3 class=\"nb-h\">Block views<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Block<\/th><th scope=\"col\">Probe position<\/th><th scope=\"col\">Target plane<\/th><th scope=\"col\">Usual coverage<\/th><th scope=\"col\">Used for<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Lateral TAP<\/th><td>Across the flank in the midaxillary line, between the costal margin and the iliac crest<\/td><td>Between internal oblique and transversus abdominis<\/td><td>Anterior wall below the umbilicus, roughly T10 to T12<\/td><td>Lower abdominal incisions; cesarean delivery when intrathecal morphine was not given<\/td><\/tr><tr><th scope=\"row\">Subcostal TAP<\/th><td>Along the costal margin, from near the midline outward<\/td><td>Between the rectus (or its posterior sheath) and transversus abdominis<\/td><td>Upper abdominal wall, roughly T6 to T9<\/td><td>Upper abdominal incisions and port sites<\/td><\/tr><tr><th scope=\"row\">Rectus sheath<\/th><td>Across the lateral rectus at or above the umbilicus, on both sides<\/td><td>Between the rectus and its posterior sheath<\/td><td>The midline around the injection level<\/td><td>Midline laparotomy, umbilical hernia<\/td><\/tr><tr><th scope=\"row\">Ilioinguinal–iliohypogastric<\/th><td>Just above and medial to the ASIS, pointing toward the umbilicus<\/td><td>Between internal oblique and transversus abdominis<\/td><td>Groin (L1)<\/td><td>Inguinal hernia, orchidopexy<\/td><\/tr><tr><th scope=\"row\">Quadratus lumborum<\/th><td>Across the flank, behind the TAP view, at the quadratus lumborum muscle<\/td><td>Beside or through the quadratus lumborum, depending on the approach<\/td><td>Wider than a TAP and variable, often about T7 to L1<\/td><td>Abdominal surgery and cesarean delivery when wider spread is wanted<\/td><\/tr><\/tbody><\/table><\/div><ul><li>The genital branch of the genitofemoral nerve (L1 and L2) runs in the spermatic cord and is missed by an ilioinguinal–iliohypogastric block, so surgeons often infiltrate the cord or hernia sac as well.<\/li><li>A small test injection should peel the two muscle layers apart. Fluid that stays inside a muscle means the tip is too shallow; fluid that disappears or spreads among bowel loops means the tip is in the peritoneum.<\/li><\/ul><h3 class=\"nb-h\">Hazards<\/h3><ul><li>Peritoneum and bowel: in a thin patient the peritoneum may lie only a centimeter or two under the skin. Use an in-plane approach and keep the tip in view.<\/li><li>Liver and spleen: an enlarged organ can sit under a subcostal or flank view, so scan for it before you insert the needle.<\/li><li>Vessels: the inferior epigastric and deep circumflex iliac arteries (above). A rectus sheath hematoma stays contained within the sheath above the arcuate line but can spread into the pelvis below it, and ultrasound or CT shows it as a collection in or behind the muscle.<\/li><li>Femoral nerve: local anesthetic can track under the transversalis fascia to the femoral nerve after a TAP or ilioinguinal block, causing quadriceps weakness. Warn the patient and the nurses about falls.<\/li><li>Dose: bilateral plane blocks need large volumes, so add up the total for both sides before you start (see <a href=\"#ii-b-1-g\">II.B.1.g<\/a>).<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> TAP and rectus sheath blocks numb the abdominal wall, not the viscera. They reduce incision pain but do not replace neuraxial or systemic analgesia for visceral pain.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-c-3-b\">I.A.1.c.3.b Abdominal wall anatomy<\/a> · <a href=\"#ii-b-1-a-3\">II.B.1.a.3 Trunk blocks<\/a> · <a href=\"#i-a-1-a-5\">I.A.1.a.5 Dermatome Anatomy<\/a> · <a href=\"#ii-d-3-g-4-b\">II.D.3.g.4.b Pain management after cesarean delivery<\/a> · <a href=\"#ii-b-1-g\">II.B.1.g Diagnosis and Management of LAST<\/a><\/p>","b":"Abdominal wall blocks are fascial plane blocks: on ultrasound you look for a layer, not a nerve. Name the muscles, keep the needle tip above the peritoneum, and remember that these blocks cover the incision, not the viscera.","u":"2026-11-05"},"I.A.1.b.6":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Most extremity blocks use an artery as the landmark and find the nerves as bundles beside it. Learn the signature view for each block, and watch the local anesthetic spread around the nerve, not into it.<\/p><h3 class=\"nb-h\">What things look like<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Structure<\/th><th scope=\"col\">Appearance<\/th><th scope=\"col\">How to tell it apart<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Peripheral nerve<\/th><td>Honeycomb: dark round fascicles in bright connective tissue; streaks in long axis<\/td><td>Can be followed up and down the limb; no flow on Doppler<\/td><\/tr><tr><th scope=\"row\">Roots and trunks in the neck<\/th><td>Dark round or oval dots with little bright tissue<\/td><td>Look like small vessels, so check with color Doppler<\/td><\/tr><tr><th scope=\"row\">Tendon<\/th><td>Bright and fibrous<\/td><td>Moves with the joint, turns into muscle, and darkens a lot when the probe tilts slightly (anisotropy)<\/td><\/tr><tr><th scope=\"row\">Artery<\/th><td>Round, dark, pulsatile<\/td><td>Does not flatten under pressure; flow on Doppler<\/td><\/tr><tr><th scope=\"row\">Vein<\/th><td>Dark, often paired with the artery<\/td><td>Flattens with light pressure<\/td><\/tr><tr><th scope=\"row\">Muscle<\/th><td>Dark with bright streaks<\/td><td>Contracts when the patient moves<\/td><\/tr><tr><th scope=\"row\">Bone<\/th><td>Bright line with a black shadow below<\/td><td>Nothing deeper is visible<\/td><\/tr><tr><th scope=\"row\">Fascia<\/th><td>Thin bright line<\/td><td>The target of plane blocks<\/td><\/tr><tr><th scope=\"row\">Local anesthetic<\/th><td>Dark fluid<\/td><td>Should surround the nerve like a doughnut<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Probe and needle<\/h3><ul><li>Higher frequency gives better resolution but less penetration. Use a linear probe for shallow targets (most arm blocks, femoral, adductor canal) and a curved, lower-frequency probe for deep ones (subgluteal sciatic, lumbar plexus, infraclavicular in a large patient).<\/li><li>In plane, the whole shaft and tip are visible; out of plane, the needle is a dot that may be the shaft rather than the tip.<\/li><li>The needle reflects best when it lies parallel to the probe. A steep needle reflects the beam away and looks faint, so flatten the angle or move the probe farther from the target.<\/li><li>A small test injection shows where the tip is. A nerve that swells, or high resistance to injection, suggests an intraneural injection: stop and withdraw slightly.<\/li><\/ul><h3 class=\"nb-h\">Signature views: upper limb<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Block<\/th><th scope=\"col\">Probe position<\/th><th scope=\"col\">What you see<\/th><th scope=\"col\">Watch out for<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Interscalene<\/th><td>Across the neck at about C6, lateral to the carotid<\/td><td>Two or three dark circles (C5, C6 and sometimes C7) stacked between the anterior and middle scalene, the \"stoplight\"<\/td><td>Phrenic nerve on the anterior scalene; vertebral artery; spread toward the epidural or intrathecal space<\/td><\/tr><tr><th scope=\"row\">Supraclavicular<\/th><td>Just above the middle of the clavicle, aimed down toward the first rib<\/td><td>A \"bunch of grapes\" (trunks and divisions) lateral and superficial to the subclavian artery, which lies on the first rib<\/td><td>The pleura next to the rib; dorsal scapular and transverse cervical arteries crossing the plexus<\/td><\/tr><tr><th scope=\"row\">Infraclavicular<\/th><td>Lengthwise just medial to the coracoid process<\/td><td>The axillary artery under the pectoralis major and minor, with the lateral, posterior and medial cords around it<\/td><td>Deep target and steep needle; the axillary vein; the pleura is farther away than above the clavicle<\/td><\/tr><tr><th scope=\"row\">Axillary<\/th><td>Across the axilla near the pectoralis major insertion<\/td><td>The median (usually superficial and lateral), ulnar (superficial and medial) and radial (deep) nerves around the axillary artery, and the musculocutaneous nerve in the coracobrachialis or between it and the biceps<\/td><td>Positions vary; several veins; the musculocutaneous nerve needs its own injection<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Confirm the interscalene level by tracing the roots to their transverse processes: C6 has a prominent anterior tubercle (Chassaignac's tubercle) and C7 has only a posterior one.<\/li><li>Supraclavicular: the first rib is a bright line with a shadow below it, while the pleura is a bright line that slides with breathing and has no shadow. Keep the needle tip over the rib. An injection in the \"corner pocket\" between the artery and the rib helps reach the lower trunk and the ulnar side of the hand.<\/li><li>Infraclavicular: an injection behind the artery that spreads in a U shape around it usually reaches all three cords.<\/li><li>Forearm rescue blocks: the median nerve lies between the superficial and deep finger flexors at mid-forearm, the ulnar nerve beside the ulnar artery in the distal forearm, and the radial nerve between the brachialis and brachioradialis at the elbow.<\/li><\/ul><h3 class=\"nb-h\">Signature views: lower limb<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Block<\/th><th scope=\"col\">Probe position<\/th><th scope=\"col\">What you see<\/th><th scope=\"col\">Watch out for<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Femoral<\/th><td>Across the inguinal crease, just below the inguinal ligament<\/td><td>From lateral to medial: nerve, artery, vein. The nerve is a flat triangle under the fascia iliaca, on the iliopsoas<\/td><td>Inject under the fascia iliaca; scan above the deep femoral artery branch; quadriceps weakness and falls<\/td><\/tr><tr><th scope=\"row\">Suprainguinal fascia iliaca<\/th><td>Lengthwise just above the inguinal ligament, medial to the ASIS<\/td><td>The \"bow tie\" where the sartorius and internal oblique meet over the iliacus<\/td><td>A large volume under the fascia iliaca reaches the femoral and lateral femoral cutaneous nerves; obturator spread is variable<\/td><\/tr><tr><th scope=\"row\">Adductor canal<\/th><td>Across the mid-thigh<\/td><td>The femoral artery under the sartorius, with the saphenous nerve and the nerve to vastus medialis beside it<\/td><td>Injecting higher, in the femoral triangle, weakens the quadriceps more<\/td><\/tr><tr><th scope=\"row\">Popliteal sciatic<\/th><td>Across the back of the thigh above the popliteal crease<\/td><td>From superficial to deep at the crease: tibial nerve, popliteal vein, popliteal artery. Trace the tibial and common peroneal nerves up to where they join<\/td><td>The split happens at a variable height; inject inside the common sheath around both branches<\/td><\/tr><tr><th scope=\"row\">Subgluteal sciatic<\/th><td>Across the back of the thigh between the greater trochanter and the ischial tuberosity, curved probe<\/td><td>A flat oval nerve under the gluteus maximus, between the two bones<\/td><td>Deep, so the needle is hard to see<\/td><\/tr><tr><th scope=\"row\">Lumbar plexus (psoas)<\/th><td>Across the flank at about L3 to L4, curved probe<\/td><td>The \"shamrock\": the transverse process with the psoas in front, the quadratus lumborum to the side and the erector spinae behind; the plexus lies in the back of the psoas<\/td><td>Epidural spread, kidney injury and retroperitoneal bleeding; treat it as a deep block when the patient takes anticoagulants<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Popliteal \"seesaw\" sign: when the patient flexes and extends the ankle, the tibial and common peroneal nerves rock against each other, which identifies them.<\/li><li>Ankle: the tibial nerve lies beside the posterior tibial artery behind the medial malleolus, and the deep peroneal nerve beside the anterior tibial artery at the front of the ankle.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> nerve roots in the neck look like small vessels, and vessels cross the plexus there. Check every dark circle with color Doppler before you inject.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-a-4\">I.A.1.a.4 Extremities landmarks<\/a> · <a href=\"#i-a-1-c-1-c\">I.A.1.c.1.c Upper extremity innervation<\/a> · <a href=\"#i-a-1-c-2-c\">I.A.1.c.2.c Lower extremity innervation<\/a> · <a href=\"#ii-b-1-a-2\">II.B.1.a.2 Extremity blocks<\/a> · <a href=\"#ii-b-1-e\">II.B.1.e Nerve stimulators, ultrasound and catheters<\/a><\/p>","b":"Most extremity blocks use an artery as the landmark and find the nerves as bundles beside it. Learn the signature view for each block, and watch the local anesthetic spread around the nerve, not into it.","u":"2026-11-05"},"I.A.1.c":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Clinical anatomy is the anatomy you use: which nerves supply an incision, where you can block them, and where positioning can injure them. For each limb and the trunk, know the bones, the vessels and the nerves, and the nerves most at risk on the operating table.<\/p><h3 class=\"nb-h\">Nerves injured by positioning<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Nerve<\/th><th scope=\"col\">Site of injury<\/th><th scope=\"col\">Typical cause<\/th><th scope=\"col\">Deficit<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Ulnar<\/th><td>Behind the medial epicondyle (ulnar groove, cubital tunnel)<\/td><td>Pressure on the elbow, worse with the forearm pronated; prolonged elbow flexion<\/td><td>Numb little finger and half of the ring finger; weak finger spreading and grip<\/td><\/tr><tr><th scope=\"row\">Brachial plexus<\/th><td>Between the neck and the axilla<\/td><td>Arm abducted beyond 90 degrees, head turned away, shoulder braces in steep head-down tilt, sternal retraction<\/td><td>Root or trunk pattern; after sternotomy usually the lower trunk, which mimics an ulnar injury<\/td><\/tr><tr><th scope=\"row\">Radial<\/th><td>Spiral groove of the humerus<\/td><td>Pressure on the lateral upper arm from an arm board edge, a screen bar or a hanging arm<\/td><td>Wrist drop; numb back of the hand near the thumb<\/td><\/tr><tr><th scope=\"row\">Median<\/th><td>Elbow<\/td><td>Elbow extended beyond its comfortable range; needle injury in the antecubital fossa<\/td><td>Weak thumb opposition and finger flexion; numb thumb side of the palm<\/td><\/tr><tr><th scope=\"row\">Common peroneal (fibular)<\/th><td>Head of the fibula<\/td><td>Lateral knee against a stirrup post in lithotomy; the dependent leg in the lateral position<\/td><td>Foot drop; numb top of the foot and lateral calf<\/td><\/tr><tr><th scope=\"row\">Sciatic<\/th><td>Hip and back of the thigh<\/td><td>Lithotomy with the hip flexed and the knee straight (hamstring stretch); buttock pressure or injection<\/td><td>Foot drop plus weak knee flexion<\/td><\/tr><tr><th scope=\"row\">Femoral<\/th><td>Under the inguinal ligament or in the pelvis<\/td><td>Extreme hip flexion, abduction and external rotation in lithotomy; self-retaining pelvic retractors<\/td><td>Weak quadriceps (buckling knee, falls); numb front of the thigh<\/td><\/tr><tr><th scope=\"row\">Obturator<\/th><td>Pelvic side wall<\/td><td>Pelvic surgery; extreme hip abduction<\/td><td>Weak hip adduction; numb medial thigh<\/td><\/tr><tr><th scope=\"row\">Lateral femoral cutaneous<\/th><td>Near the anterior superior iliac spine<\/td><td>Prolonged hip flexion; pressure on the iliac spines when prone<\/td><td>Numb, burning lateral thigh with no weakness (meralgia paresthetica)<\/td><\/tr><tr><th scope=\"row\">Saphenous<\/th><td>Medial knee<\/td><td>Medial knee pressed against a leg holder<\/td><td>Numb medial calf and ankle<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">What the closed claims show<\/h3><ul><li>In the ASA Closed Claims database (<a href=\"https://doi.org/10.1097/00000542-199904000-00020\" target=\"_blank\" rel=\"noopener\">Cheney 1999<\/a>), nerve injury made up 16% of 4,183 claims. The most common sites were the ulnar nerve (28%), brachial plexus (20%), lumbosacral roots (16%) and spinal cord (13%).<\/li><li>Ulnar injuries mostly followed general anesthesia (85%), mostly affected men (75%), and often appeared only after a delay (62%). Their mechanism was usually not apparent.<\/li><li>Spinal cord (58%) and lumbosacral root (92%) injuries were mostly linked to regional techniques.<\/li><\/ul><h3 class=\"nb-h\">Prevention<\/h3><p>The <a href=\"https://doi.org/10.1097/ALN.0000000000001937\" target=\"_blank\" rel=\"noopener\">ASA practice advisory on perioperative peripheral neuropathies (2018)<\/a> advises:<\/p><ul><li>When possible, limit arm abduction to 90 degrees in a supine patient.<\/li><li>On an arm board, keep the forearm supinated or neutral; with arms tucked, keep it neutral. Keep pressure off the ulnar groove and off the radial nerve in the spiral groove.<\/li><li>Do not extend the elbow beyond the range the patient found comfortable before surgery (median nerve).<\/li><li>Padded arm boards, elbow padding and padding at the fibular head may reduce risk, but padding must not be applied too tightly.<\/li><li>In the lateral position, a chest roll may reduce upper extremity neuropathy. When possible, avoid shoulder braces in a steep head-down position.<\/li><li>Avoid stretching the hamstrings beyond a comfortable range; because the sciatic nerve crosses both the hip and the knee, consider both joints. Avoid prolonged pressure on the peroneal nerve at the fibular head.<\/li><li>Do a simple check of extremity nerve function after surgery.<\/li><\/ul><h3 class=\"nb-h\">A new deficit after surgery<\/h3><ul><li>Examine and record motor and sensory function, then map it to a nerve, plexus or root (see <a href=\"#i-a-1-c-1-c\">I.A.1.c.1.c<\/a> and <a href=\"#i-a-1-c-2-c\">I.A.1.c.2.c<\/a>).<\/li><li>A block wears off on schedule and stays within the block's territory. A deficit that outlasts the block or falls outside its territory needs a workup.<\/li><li>New or worsening leg weakness after a neuraxial block or catheter removal suggests a spinal hematoma or abscess. Get an MRI and a neurosurgeon at once (see <a href=\"#i-b-2-b-5\">I.B.2.b.5<\/a>).<\/li><li>Sensory deficits usually recover over weeks to months; motor deficits recover less often, so involve neurology early.<\/li><li>Electromyography shows denervation only after about 2 to 3 weeks. An early study mainly shows whether a neuropathy existed before surgery.<\/li><li>A nerve already damaged by diabetes, alcohol, chemotherapy or compression tolerates a second insult poorly (\"double crush\").<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> an ulnar neuropathy can appear days after surgery and despite good padding. Document positioning and padding, and examine the patient early.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-b-6-a-5\">I.B.6.a.5 Neurological injuries from position and pressure<\/a> · <a href=\"#ii-c-1-b-1\">II.C.1.b.1 Peripheral nerve distributions<\/a> · <a href=\"#ii-b-1-a\">II.B.1.a Peripheral Nerve Blocks<\/a> · <a href=\"#i-a-1-a-4\">I.A.1.a.4 Extremities landmarks<\/a> · <a href=\"#ii-c-1-d-1-f-2\">II.C.1.d.1.f.2 Positioning<\/a><\/p>","b":"Clinical anatomy is the anatomy you use: which nerves supply an incision, where you can block them, and where positioning can injure them. For each limb and the trunk, know the bones, the vessels and the nerves, and the nerves most at risk on the operating table.","u":"2026-11-05"},"I.A.1.c.1.a":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Choose a block by the nerves that supply the bone and joint, not just the skin. The shoulder and clavicle depend on the C5 and C6 roots (interscalene), while the elbow and everything below need the whole plexus (supraclavicular, infraclavicular or axillary).<\/p><h3 class=\"nb-h\">Who supplies the bones and joints<\/h3><ul><li>Hilton's law: the nerves that move a joint also supply the joint itself and the skin over it. Bone and joint territories (sclerotomes) do not match the skin's dermatomes.<\/li><li>Shoulder joint: mainly the suprascapular nerve (most of the upper and back of the joint) and the axillary nerve (the lower capsule), with small branches from the lateral pectoral and subscapular nerves. All come from C5 and C6.<\/li><li>Clavicle: the skin over it is supplied by the supraclavicular nerves (C3 and C4, superficial cervical plexus), and the bone also receives C5 and C6 branches.<\/li><li>Humerus and elbow: all four terminal nerves (musculocutaneous, radial, median and ulnar) contribute.<\/li><li>Wrist and hand: median, ulnar and radial nerves, plus the lateral cutaneous nerve of the forearm (the end of the musculocutaneous) over the radial side of the forearm and wrist.<\/li><li>Medial upper arm skin: the medial cutaneous nerve of the arm (T1) and the intercostobrachial nerve (T2, not part of the brachial plexus).<\/li><\/ul><h3 class=\"nb-h\">Matching the surgery to the block<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Surgery<\/th><th scope=\"col\">Block<\/th><th scope=\"col\">What it covers<\/th><th scope=\"col\">Gaps and cautions<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Shoulder (arthroscopy, arthroplasty, proximal humerus)<\/th><td>Interscalene<\/td><td>The C5 to C7 roots, including the suprascapular and axillary nerves<\/td><td>Phrenic paresis is almost certain; C8 and T1 are often spared, which does not matter for the shoulder<\/td><\/tr><tr><th scope=\"row\">Shoulder in a patient who cannot lose a hemidiaphragm<\/th><td>Suprascapular plus axillary nerve blocks; superior trunk or low-volume supraclavicular block<\/td><td>Most of the joint<\/td><td>Less phrenic block (little with suprascapular plus axillary), but somewhat less analgesia<\/td><\/tr><tr><th scope=\"row\">Clavicle<\/th><td>Interscalene or superior trunk, plus superficial cervical plexus<\/td><td>Bone (C5 and C6) and skin (C3 and C4)<\/td><td>Phrenic paresis<\/td><\/tr><tr><th scope=\"row\">Humerus shaft and elbow<\/th><td>Supraclavicular or infraclavicular<\/td><td>The whole plexus<\/td><td>Medial upper arm skin (T1 and T2)<\/td><\/tr><tr><th scope=\"row\">Forearm, wrist and hand<\/th><td>Supraclavicular, infraclavicular or axillary<\/td><td>All terminal nerves<\/td><td>An axillary block needs its own musculocutaneous injection<\/td><\/tr><tr><th scope=\"row\">Short hand procedures<\/th><td>Axillary, forearm nerve blocks, IV regional, or local anesthetic with epinephrine injected by the surgeon (wide-awake surgery)<\/td><td>The operative field<\/td><td>IV regional details are in <a href=\"#i-b-2-c\">I.B.2.c<\/a><\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Shoulder surgery in the beach chair position<\/h3><ul><li>Brain perfusion pressure is lower than the arm cuff reads: about 0.75 mmHg for every centimeter (about 2 mmHg per inch) that the brain sits above the cuff. Measure or correct blood pressure to the level of the brain (the external ear).<\/li><li>Strokes after beach chair surgery have followed hypotension, so treat low pressure early.<\/li><li>Sudden hypotension and bradycardia can occur in a sitting patient with an interscalene block. It is thought to be a Bezold–Jarisch-type reflex from an underfilled, vigorously contracting ventricle. Treat with fluids, ephedrine or epinephrine, and atropine for the bradycardia.<\/li><\/ul><h3 class=\"nb-h\">Fractures and compartment syndrome<\/h3><ul><li>Forearm and supracondylar fractures and crush injuries can cause compartment syndrome. Its early signs are pain out of proportion and pain on passive finger stretch, which a dense block can hide.<\/li><li>In a high-risk injury, agree a plan with the surgeon: often a dilute local anesthetic, regular checks, and a low threshold to measure compartment pressures.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> brachial plexus blocks do not cover the medial upper arm (T1 and T2). A medial elbow incision or an upper arm tourniquet may need a subcutaneous intercostobrachial block across the inner arm.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-a-4\">I.A.1.a.4 Extremities landmarks<\/a> · <a href=\"#i-a-1-c-1-c\">I.A.1.c.1.c Upper extremity innervation<\/a> · <a href=\"#ii-b-1-a-2\">II.B.1.a.2 Extremity blocks<\/a> · <a href=\"#ii-d-8\">II.D.8 Orthopedic Anesthesia<\/a> · <a href=\"#ii-d-8-c\">II.D.8.c Regional vs. General Anesthesia<\/a><\/p>","b":"Choose a block by the nerves that supply the bone and joint, not just the skin. The shoulder and clavicle depend on the C5 and C6 roots (interscalene), while the elbow and everything below need the whole plexus (supraclavicular, infraclavicular or axillary).","u":"2026-11-05"},"I.A.1.c.1.b":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> The radial artery is the usual arterial line site because the hand has a second supply through the ulnar artery and the palmar arches. Know the arm's arterial path, which sites have collateral flow, and which nerves and arteries lie beside the veins you puncture.<\/p><h3 class=\"nb-h\">Arterial path<\/h3><ul><li>The subclavian artery becomes the axillary artery at the lateral border of the first rib, and the brachial artery at the lower border of the teres major.<\/li><li>The brachial artery divides in the antecubital fossa into the radial and ulnar arteries, which join in the hand through the superficial palmar arch (mainly ulnar) and the deep palmar arch (mainly radial).<\/li><li>In some people the brachial artery divides high in the arm, leaving a superficial artery in the forearm or antecubital fossa that can be mistaken for a vein.<\/li><\/ul><h3 class=\"nb-h\">Arterial line sites<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Site<\/th><th scope=\"col\">Advantages<\/th><th scope=\"col\">Disadvantages<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Radial<\/th><td>Superficial, easy to compress, collateral flow through the ulnar artery<\/td><td>Small and prone to spasm; reads higher systolic pressure than the aorta, and may read low after cardiopulmonary bypass or with high-dose vasopressors<\/td><\/tr><tr><th scope=\"row\">Ulnar<\/th><td>Collateral flow through the radial artery<\/td><td>Deeper, beside the ulnar nerve; avoid it after failed attempts on the same-side radial<\/td><\/tr><tr><th scope=\"row\">Brachial<\/th><td>Large; closer to central pressure<\/td><td>Less collateral flow around the elbow, so thrombosis threatens the forearm; the median nerve lies beside it; kinks when the elbow bends<\/td><\/tr><tr><th scope=\"row\">Axillary<\/th><td>Large and close to the aorta, so less affected by vasoconstriction<\/td><td>Surrounded by the brachial plexus, so a hematoma can compress it; flushed air or clot can travel toward the brain<\/td><\/tr><\/tbody><\/table><\/div><ul><li>The farther the site from the heart, the higher the systolic pressure and the wider the pulse pressure, while the mean pressure stays almost the same (distal pulse amplification).<\/li><li>Femoral lines are covered in <a href=\"#i-a-1-c-2-b\">I.A.1.c.2.b<\/a>.<\/li><\/ul><h3 class=\"nb-h\">The Allen test<\/h3><ul><li>The patient makes a fist, you press on both the radial and ulnar arteries, the patient opens the pale hand, and you release the ulnar artery. Quick return of color suggests good ulnar collateral flow; a slow return suggests poor flow.<\/li><li>It predicts hand ischemia poorly: ischemia after radial cannulation is rare and has followed normal tests. Many centers no longer require it, but it is still examined. A thumb pulse oximeter or Doppler during radial compression is a more objective check.<\/li><\/ul><h3 class=\"nb-h\">Radial technique and complications<\/h3><ul><li>Extend the wrist slightly over a roll. Overextension flattens the artery and stretches the median nerve.<\/li><li>Ultrasound improves first-pass success over palpation, especially in small or nonpulsatile arteries (see <a href=\"#ii-a-1-b-4\">II.A.1.b.4<\/a>).<\/li><li>Thrombosis is common and usually silent; its risk rises with larger catheters, longer use and repeated punctures. Other complications are hematoma, infection, pseudoaneurysm, and air or clot flushed back toward the brain, so flush gently with small volumes.<\/li><li>Accidental intra-arterial injection of a drug causes pain, blanching and possible ischemia. Leave the catheter in place, flush with saline, and treat with heparin, vasodilators and sympathetic block (stellate ganglion or brachial plexus) as needed (see <a href=\"#i-b-6-a-4\">I.B.6.a.4<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Veins of the arm<\/h3><ul><li>The cephalic vein runs up the lateral arm in the deltopectoral groove and joins the axillary vein at a sharp angle, where wires and catheters often catch.<\/li><li>The basilic vein runs up the medial arm, dives deep in the mid-arm and joins the brachial veins to form the axillary vein. It is larger and straighter, so it is the usual route for a peripherally inserted central catheter.<\/li><li>The median cubital vein joins the two in the antecubital fossa; the brachial artery and median nerve lie just beneath it, deep to the bicipital aponeurosis.<\/li><li>The cephalic vein at the radial side of the wrist lies on the superficial radial nerve, which a needle can injure, leaving numbness on the back of the thumb.<\/li><li>Infusing under pressure into an infiltrated IV, especially with arms tucked, can cause forearm compartment syndrome. Check tucked IVs regularly.<\/li><li>Avoid cuffs, IVs and arterial lines in an arm with a dialysis fistula; protect it and check its thrill.<\/li><\/ul><h3 class=\"nb-h\">IV regional anesthesia (Bier block)<\/h3><ul><li>Drain the arm with an elastic bandage, inflate a double-cuff tourniquet, and inject dilute plain lidocaine (commonly 0.5%, about 3 mg/kg) through a distal IV. Never use bupivacaine.<\/li><li>When tourniquet pain starts, inflate the distal cuff (over numb skin) and then release the proximal one.<\/li><li>Keep the cuff up for at least about 20 minutes. Releasing it early, or a failing cuff, can deliver the whole dose into the circulation and cause local anesthetic toxicity; before about 40 minutes, release it in stages. Details are in <a href=\"#i-b-2-c\">I.B.2.c<\/a>.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a radial line reads a higher systolic and a wider pulse pressure than the aorta, but nearly the same mean. Base decisions on the mean, and expect the radial to read low after cardiopulmonary bypass.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-b-6-a-4\">I.B.6.a.4 Vascular complications<\/a> · <a href=\"#ii-a-1-a-1\">II.A.1.a.1 Vascular Pressures<\/a> · <a href=\"#ii-a-1-b-4\">II.A.1.b.4 Ultrasound-guided vascular catheters<\/a> · <a href=\"#i-b-2-c\">I.B.2.c IV Regional<\/a> · <a href=\"#i-a-1-a-4\">I.A.1.a.4 Extremities landmarks<\/a><\/p>","b":"The radial artery is the usual arterial line site because the hand has a second supply through the ulnar artery and the palmar arches. Know the arm's arterial path, which sites have collateral flow, and which nerves and arteries lie beside the veins you puncture.","u":"2026-11-05"},"I.A.1.c.1.c":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> The brachial plexus (C5 to T1) runs as roots, trunks, divisions, cords and terminal branches from the neck to the axilla. Each block meets it at a different level and has a typical gap: an interscalene block spares the ulnar side, and an axillary block misses the musculocutaneous nerve unless you block it separately.<\/p><h3 class=\"nb-h\">How the plexus is built<\/h3><ul><li>Roots: the ventral rami of C5 to T1, between the anterior and middle scalene muscles. Some plexuses also take C4 (prefixed) or T2 (postfixed).<\/li><li>Trunks, above the clavicle: upper (C5 and C6), middle (C7) and lower (C8 and T1).<\/li><li>Divisions, behind the clavicle: each trunk splits into an anterior division (flexor side) and a posterior division (extensor side).<\/li><li>Cords, behind the pectoralis minor and named by their position around the axillary artery: lateral (anterior divisions of the upper and middle trunks), posterior (all three posterior divisions) and medial (anterior division of the lower trunk).<\/li><li>Terminal branches: musculocutaneous (lateral cord), median (lateral and medial cords), ulnar (medial cord), and axillary and radial (posterior cord).<\/li><\/ul><h3 class=\"nb-h\">Branches that leave early<\/h3><ul><li>From the roots: dorsal scapular (C5, rhomboids), long thoracic (C5 to C7, serratus anterior; injury causes a winged scapula) and a contribution to the phrenic nerve (C5).<\/li><li>From the upper trunk: the suprascapular nerve (C5 and C6) to the supraspinatus, the infraspinatus and most of the shoulder joint.<\/li><li>From the cords: the lateral and medial pectoral nerves, the medial cutaneous nerves of the arm and forearm (medial cord), and the subscapular and thoracodorsal nerves (posterior cord).<\/li><\/ul><h3 class=\"nb-h\">Terminal nerves<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Nerve<\/th><th scope=\"col\">Roots<\/th><th scope=\"col\">Main motor<\/th><th scope=\"col\">Skin<\/th><th scope=\"col\">Quick test<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Musculocutaneous<\/th><td>C5 to C7<\/td><td>Elbow flexion (biceps, brachialis)<\/td><td>Lateral forearm<\/td><td>Flex the elbow with the palm up<\/td><\/tr><tr><th scope=\"row\">Axillary<\/th><td>C5, C6<\/td><td>Deltoid (abduction), teres minor<\/td><td>Skin over the lower deltoid<\/td><td>Lift the arm out to the side<\/td><\/tr><tr><th scope=\"row\">Radial<\/th><td>C5 to T1<\/td><td>Extension of the elbow, wrist and fingers<\/td><td>Back of the arm and forearm; back of the hand on the thumb side<\/td><td>Extend the wrist and fingers<\/td><\/tr><tr><th scope=\"row\">Median<\/th><td>C6 to T1<\/td><td>Forearm pronation, wrist and finger flexion, thumb opposition<\/td><td>Palm side of the thumb, index, middle and half of the ring finger<\/td><td>Make a fist; make an \"OK\" sign (anterior interosseous branch)<\/td><\/tr><tr><th scope=\"row\">Ulnar<\/th><td>C8, T1<\/td><td>Most small hand muscles; flexor carpi ulnaris<\/td><td>Little finger and half of the ring finger<\/td><td>Spread the fingers apart<\/td><\/tr><\/tbody><\/table><\/div><ul><li>\"Rock, paper, scissors, OK\" checks the hand quickly: a fist (median), an open hand with extended wrist and fingers (radial), spread fingers (ulnar) and an \"OK\" circle (anterior interosseous branch of the median).<\/li><li>Reliable skin spots: the back of the first web space (radial), the tip of the index finger (median) and the tip of the little finger (ulnar).<\/li><\/ul><h3 class=\"nb-h\">Blocks by level<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Block<\/th><th scope=\"col\">Plexus level<\/th><th scope=\"col\">Covers well<\/th><th scope=\"col\">Usual gap<\/th><th scope=\"col\">Phrenic block<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Interscalene<\/th><td>Roots and upper trunk<\/td><td>Shoulder, upper arm, clavicle (with a superficial cervical plexus block)<\/td><td>Lower trunk (C8, T1): ulnar side of the forearm and hand<\/td><td>Almost always, at standard volumes<\/td><\/tr><tr><th scope=\"row\">Supraclavicular<\/th><td>Trunks and divisions<\/td><td>Whole arm from mid-humerus down<\/td><td>Sometimes the lower trunk; the medial upper arm<\/td><td>Common, but less than interscalene<\/td><\/tr><tr><th scope=\"row\">Infraclavicular<\/th><td>Cords<\/td><td>Elbow, forearm and hand; holds a catheter well<\/td><td>Shoulder; medial upper arm<\/td><td>Uncommon<\/td><\/tr><tr><th scope=\"row\">Axillary<\/th><td>Terminal nerves<\/td><td>Forearm and hand<\/td><td>Musculocutaneous unless blocked separately; medial upper arm; shoulder<\/td><td>Essentially none<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">The phrenic nerve and interscalene block<\/h3><ul><li>The phrenic nerve (C3 to C5) runs down the front of the anterior scalene, beneath the prevertebral fascia, only millimeters from the plexus at C6, and moves away from it lower in the neck.<\/li><li>In <a href=\"https://doi.org/10.1213/00000539-199104000-00014\" target=\"_blank\" rel=\"noopener\">Urmey 1991<\/a>, all 13 patients given an interscalene block (34 to 52 mL of 1.5% mepivacaine) developed paradoxical movement of the hemidiaphragm on ultrasound within 5 minutes. Movement returned between 3 and 4 hours in 10 of the 11 patients followed, and by 5 hours in the last.<\/li><li>Smaller volumes and lower injections reduce phrenic block but do not abolish it. Healthy patients tolerate the loss of vital capacity; patients with severe lung disease, obesity or a weak diaphragm on the other side may not. Never block both sides.<\/li><\/ul><h3 class=\"nb-h\">Other interscalene problems<\/h3><ul><li>Horner syndrome (ptosis, miosis, anhidrosis) from cervical sympathetic spread, and hoarseness from recurrent laryngeal nerve block, are common and harmless; warn the patient.<\/li><li>Injection into the vertebral artery causes an immediate seizure even with a tiny dose.<\/li><li>A needle aimed too far medially can reach the epidural or intrathecal space or the spinal cord. General anesthesia removes the patient's warning of pain on injection.<\/li><\/ul><h3 class=\"nb-h\">Nerves outside the plexus<\/h3><ul><li>The intercostobrachial nerve (T2) supplies the medial upper arm and the axilla. No brachial plexus block covers it; a line of subcutaneous local anesthetic across the inner arm does.<\/li><li>The supraclavicular nerves (C3 and C4) supply the skin over the clavicle and the top of the shoulder.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> an interscalene block often spares C8 and T1, so it is a poor choice for hand or forearm surgery on the ulnar side. Use a supraclavicular, infraclavicular or axillary block instead.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-c-1-a\">I.A.1.c.1.a Upper extremity bones<\/a> · <a href=\"#i-a-1-b-6\">I.A.1.b.6 Extremities ultrasound<\/a> · <a href=\"#ii-b-1-a-2\">II.B.1.a.2 Extremity blocks<\/a> · <a href=\"#ii-c-1-b-1\">II.C.1.b.1 Peripheral nerve distributions<\/a> · <a href=\"#i-a-1-a-5\">I.A.1.a.5 Dermatome Anatomy<\/a><\/p>","b":"The brachial plexus (C5 to T1) runs as roots, trunks, divisions, cords and terminal branches from the neck to the axilla. Each block meets it at a different level and has a typical gap: an interscalene block spares the ulnar side, and an axillary block misses the musculocutaneous nerve unless you block it separately.","u":"2026-11-05"},"I.A.1.c.2.a":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> The hip and knee get nerves from both the lumbar plexus (femoral and obturator) and the sacral plexus (sciatic), so no single block covers either joint completely. Match the block to the joint, and protect quadriceps strength when the patient needs to walk early.<\/p><h3 class=\"nb-h\">Who supplies the bones and joints<\/h3><ul><li>Hip: the anterior capsule, the most pain-sensitive part, is supplied by the femoral and obturator nerves and the accessory obturator nerve when present. The posterior capsule is supplied by sacral plexus branches (the nerve to quadratus femoris, the superior gluteal nerve and the sciatic nerve).<\/li><li>Femur: mainly femoral and sciatic branches, with some obturator supply.<\/li><li>Knee: the front by femoral branches (the nerves to the vasti and the saphenous nerve), the medial side by the saphenous and obturator nerves, the lateral side by the common peroneal nerve, and the back of the capsule by the popliteal plexus (tibial nerve and the posterior division of the obturator nerve).<\/li><li>Below the knee: almost all sciatic (tibial, superficial and deep peroneal, sural), except the medial leg and ankle (saphenous, from the femoral nerve).<\/li><li>The lateral thigh skin belongs to the lateral femoral cutaneous nerve (L2 and L3).<\/li><\/ul><h3 class=\"nb-h\">Matching the surgery to the block<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Surgery<\/th><th scope=\"col\">Common choices<\/th><th scope=\"col\">Covers<\/th><th scope=\"col\">Gaps and cautions<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Hip fracture, for pain before and after surgery<\/th><td>Suprainguinal fascia iliaca, femoral, or PENG block<\/td><td>Femoral nerve, often the lateral femoral cutaneous, sometimes obturator branches<\/td><td>Femoral and fascia iliaca blocks weaken the quadriceps<\/td><\/tr><tr><th scope=\"row\">Hip arthroplasty<\/th><td>Spinal, plus PENG with or without a lateral femoral cutaneous block, or surgeon infiltration<\/td><td>Anterior capsule<\/td><td>Posterior capsule and incision; large PENG volumes can reach the femoral nerve<\/td><\/tr><tr><th scope=\"row\">Femoral shaft fracture<\/th><td>Femoral or fascia iliaca<\/td><td>Most femur pain and quadriceps spasm<\/td><td>Sciatic territory<\/td><\/tr><tr><th scope=\"row\">Knee arthroplasty<\/th><td>Adductor canal plus IPACK, often with surgeon infiltration and a spinal<\/td><td>Front and medial knee (adductor canal) and the back of the capsule (IPACK)<\/td><td>A femoral block weakens the quadriceps more and raises fall risk<\/td><\/tr><tr><th scope=\"row\">Below the knee, ankle and foot<\/th><td>Popliteal sciatic plus saphenous (adductor canal)<\/td><td>Everything below the knee<\/td><td>A thigh tourniquet needs neuraxial or general anesthesia<\/td><\/tr><tr><th scope=\"row\">Forefoot<\/th><td>Ankle block<\/td><td>Five nerves at the ankle<\/td><td>Not enough for a calf or thigh tourniquet<\/td><\/tr><\/tbody><\/table><\/div><ul><li>PENG (pericapsular nerve group) block: local anesthetic between the iliopsoas tendon and the superior pubic ramus, aimed at the articular branches to the anterior hip capsule.<\/li><li>IPACK: local anesthetic in the interspace between the popliteal artery and the back of the knee capsule, aimed at the popliteal plexus while sparing the main tibial and peroneal nerves.<\/li><\/ul><h3 class=\"nb-h\">Bone cement implantation syndrome<\/h3><ul><li>Around cementing, femoral reaming, prosthesis insertion or tourniquet release, emboli of fat, marrow, cement and air, plus released mediators, raise pulmonary vascular resistance. The result is hypoxemia, hypotension, arrhythmia, right heart failure and sometimes cardiac arrest.<\/li><li>Higher risk: cemented hemiarthroplasty for hip fracture, pathologic fractures, long-stem prostheses, pulmonary hypertension, poor heart function and frailty.<\/li><li>Prevent and treat: tell the surgeon about high-risk patients, keep the patient well filled, raise the inspired oxygen before cementing, and ask about lavage and gentle cement pressurization. Treat collapse as acute right heart failure with oxygen, fluids and vasopressors or inotropes, and CPR if needed.<\/li><\/ul><h3 class=\"nb-h\">Fractures and bleeding<\/h3><ul><li>A femoral shaft fracture can hide 1 to 1.5 liters of blood in the thigh, and a pelvic fracture several liters.<\/li><li>Fat embolism syndrome after long-bone fractures appears 1 to 3 days later as hypoxemia, confusion and a petechial rash (armpits, chest, conjunctivae). Care is supportive, and early fracture fixation lowers the risk.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a sciatic or popliteal block hides foot drop from a surgical peroneal nerve injury and can delay the diagnosis of compartment syndrome after a tibial fracture. Agree a plan with the surgeon before you block a high-risk case.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-c-2-c\">I.A.1.c.2.c Lower extremity innervation<\/a> · <a href=\"#i-a-1-b-6\">I.A.1.b.6 Extremities ultrasound<\/a> · <a href=\"#ii-b-1-a-2\">II.B.1.a.2 Extremity blocks<\/a> · <a href=\"#ii-d-8-b\">II.D.8.b Complications of Orthopedic Surgery<\/a> · <a href=\"#ii-d-8-a\">II.D.8.a Tourniquet Management<\/a><\/p>","b":"The hip and knee get nerves from both the lumbar plexus (femoral and obturator) and the sacral plexus (sciatic), so no single block covers either joint completely. Match the block to the joint, and protect quadriceps strength when the patient needs to walk early.","u":"2026-11-05"},"I.A.1.c.2.b":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Femoral access is fast and away from the airway, but puncture the vessels below the inguinal ligament and above the femoral bifurcation. Too high risks a retroperitoneal bleed you cannot compress; too low reaches smaller vessels where the vein lies behind the artery.<\/p><h3 class=\"nb-h\">Arterial path<\/h3><ul><li>The external iliac artery becomes the common femoral artery as it passes under the inguinal ligament, at the midpoint between the anterior superior iliac spine and the pubic symphysis.<\/li><li>Several centimeters below the ligament it divides into the deep femoral (profunda) and superficial femoral arteries. The superficial femoral runs through the adductor canal and becomes the popliteal artery behind the knee.<\/li><li>Below the knee the popliteal divides into the anterior tibial artery (which becomes the dorsalis pedis) and the tibioperoneal trunk (posterior tibial and peroneal arteries).<\/li><li>In the femoral triangle, from lateral to medial: nerve, artery, vein, then lymphatics (\"NAVEL\" with an empty space before the lymphatics). Farther down the thigh the vein moves behind the artery.<\/li><\/ul><h3 class=\"nb-h\">Femoral lines<\/h3><ul><li>The inguinal ligament runs from the anterior superior iliac spine to the pubic tubercle. The skin crease often lies below it, especially in obese patients, so find the ligament, not the crease.<\/li><li>With ultrasound, puncture the common femoral vein or artery above the bifurcation and above the saphenofemoral junction.<\/li><li>Above the ligament you reach the external iliac vessels, where bleeding tracks into the retroperitoneum unseen and cannot be compressed. Suspect it with unexplained hypotension, back or flank pain, or a falling hemoglobin after a high puncture.<\/li><li>Too low, the vein lies behind the artery, so needles pass through the artery and can cause an arteriovenous fistula or pseudoaneurysm.<\/li><li>In the <a href=\"https://doi.org/10.1056/NEJMoa1500964\" target=\"_blank\" rel=\"noopener\">3SITES trial (Parienti 2015)<\/a>, femoral central lines had the highest rate of bloodstream infection or symptomatic thrombosis (4.6 per 1,000 catheter-days, against 3.6 jugular and 1.5 subclavian).<\/li><li>In abdominal or pelvic trauma, place at least one large line above the diaphragm, because an injured or compressed inferior vena cava can stop femoral infusions from reaching the heart.<\/li><\/ul><h3 class=\"nb-h\">Other arteries<\/h3><ul><li>Dorsalis pedis: on the top of the foot, lateral to the extensor hallucis longus tendon. It reads a higher systolic pressure than the radial and is sometimes absent.<\/li><li>Posterior tibial: behind the medial malleolus, just in front of the tibial nerve.<\/li><li>Popliteal: the deepest structure in the popliteal fossa, lying against the femur, so a knee dislocation or a fracture just above the knee can injure it. Check distal pulses after these injuries.<\/li><\/ul><h3 class=\"nb-h\">Veins<\/h3><ul><li>The great saphenous vein starts in front of the medial malleolus beside the saphenous nerve, which makes it the classic site for an emergency cutdown. It runs up the medial leg and thigh and joins the femoral vein just below the inguinal ligament.<\/li><li>The small saphenous vein starts behind the lateral malleolus beside the sural nerve and joins the popliteal vein.<\/li><li>The deep veins are the paired tibial and peroneal veins, then the popliteal and femoral veins. Thrombosis is most common after hip and knee arthroplasty and hip fracture, and clots at or above the popliteal vein carry most of the risk of pulmonary embolism.<\/li><\/ul><h3 class=\"nb-h\">Tourniquets and leg position<\/h3><ul><li>Deflating a thigh tourniquet returns cold, acidotic, potassium-rich blood: expect a brief rise in end-tidal CO2 and a fall in blood pressure and temperature. Pressure and time limits are in <a href=\"#ii-d-8-a\">II.D.8.a<\/a>.<\/li><li>Raised legs are perfused at lower pressure, about 0.75 mmHg less for every centimeter above the heart. Long cases in lithotomy, especially with head-down tilt, can cause compartment syndrome of the calf, so consider lowering the legs periodically.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> the \"superficial\" femoral vein is a deep vein. A clot there is a proximal deep vein thrombosis that needs treatment, not a superficial thrombophlebitis.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-b-4\">I.A.1.b.4 Neck ultrasound and central access<\/a> · <a href=\"#i-b-6-a-4\">I.B.6.a.4 Vascular complications<\/a> · <a href=\"#ii-a-1-b-4\">II.A.1.b.4 Ultrasound-guided vascular catheters<\/a> · <a href=\"#ii-d-8-a\">II.D.8.a Tourniquet Management<\/a> · <a href=\"#i-a-1-a-4\">I.A.1.a.4 Extremities landmarks<\/a><\/p>","b":"Femoral access is fast and away from the airway, but puncture the vessels below the inguinal ligament and above the femoral bifurcation. Too high risks a retroperitoneal bleed you cannot compress; too low reaches smaller vessels where the vein lies behind the artery.","u":"2026-11-05"},"I.A.1.c.2.c":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> The leg has two plexuses: the lumbar plexus (L1 to L4) supplies the front and medial thigh through the femoral, obturator and lateral femoral cutaneous nerves, and the sacral plexus (L4 to S3) supplies the back of the thigh and almost everything below the knee through the sciatic nerve. Most leg surgery needs a block of each, and every femoral-type block weakens the quadriceps.<\/p><h3 class=\"nb-h\">Lumbar plexus (L1 to L4)<\/h3><ul><li>It forms inside the psoas major from the ventral rami of L1 to L4, often with a small T12 contribution.<\/li><li>Iliohypogastric and ilioinguinal (L1): lower abdominal wall and groin.<\/li><li>Genitofemoral (L1, L2): the genital branch to the cremaster and scrotum or labia, and the femoral branch to the skin over the femoral triangle.<\/li><li>Lateral femoral cutaneous (L2, L3): the lateral thigh. It passes under or through the inguinal ligament just medial to the anterior superior iliac spine.<\/li><li>Femoral (L2 to L4): the quadriceps, sartorius and iliacus, the skin of the front of the thigh, and the saphenous nerve to the medial leg and ankle.<\/li><li>Obturator (L2 to L4): the hip adductors, a variable patch of medial thigh skin (often small or absent), and branches to the hip and knee.<\/li><li>A single femoral injection rarely reaches the obturator nerve, despite the old \"3-in-1\" idea.<\/li><\/ul><h3 class=\"nb-h\">Sacral plexus (L4 to S4)<\/h3><ul><li>The lumbosacral trunk (L4, L5) joins the S1 to S3 rami on the piriformis.<\/li><li>Sciatic nerve (L4 to S3): leaves the pelvis below the piriformis, passes between the greater trochanter and the ischial tuberosity, supplies the hamstrings, and splits at a variable height above the knee into the tibial and common peroneal nerves.<\/li><li>Posterior femoral cutaneous nerve (S1 to S3): the skin of the back of the thigh. It travels with the sciatic nerve high up, so a popliteal block misses it.<\/li><li>Gluteal nerves (gluteal muscles) and the pudendal nerve (S2 to S4, perineum) also come from this plexus.<\/li><\/ul><h3 class=\"nb-h\">Terminal nerves<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Nerve<\/th><th scope=\"col\">Roots<\/th><th scope=\"col\">Main motor<\/th><th scope=\"col\">Skin<\/th><th scope=\"col\">Quick test<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Femoral<\/th><td>L2 to L4<\/td><td>Knee extension, hip flexion<\/td><td>Front of the thigh<\/td><td>Straighten the knee against resistance<\/td><\/tr><tr><th scope=\"row\">Saphenous (from femoral)<\/th><td>L3, L4<\/td><td>None<\/td><td>Medial leg, ankle and arch<\/td><td>Pinprick at the medial ankle<\/td><\/tr><tr><th scope=\"row\">Obturator<\/th><td>L2 to L4<\/td><td>Hip adduction<\/td><td>Small medial thigh patch, if any<\/td><td>Squeeze the knees together<\/td><\/tr><tr><th scope=\"row\">Lateral femoral cutaneous<\/th><td>L2, L3<\/td><td>None<\/td><td>Lateral thigh<\/td><td>Pinprick on the lateral thigh<\/td><\/tr><tr><th scope=\"row\">Tibial<\/th><td>L4 to S3<\/td><td>Plantar flexion, toe flexion<\/td><td>Sole and heel<\/td><td>Point the foot down<\/td><\/tr><tr><th scope=\"row\">Deep peroneal<\/th><td>L4 to S1<\/td><td>Dorsiflexion of the ankle and toes<\/td><td>First web space on the top of the foot<\/td><td>Pull the foot up<\/td><\/tr><tr><th scope=\"row\">Superficial peroneal<\/th><td>L4 to S1<\/td><td>Eversion<\/td><td>Most of the top of the foot<\/td><td>Turn the foot out<\/td><\/tr><tr><th scope=\"row\">Sural<\/th><td>S1, S2<\/td><td>None<\/td><td>Lateral ankle and foot<\/td><td>Pinprick at the lateral foot<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Ankle block: five nerves<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Nerve<\/th><th scope=\"col\">From<\/th><th scope=\"col\">Where to inject<\/th><th scope=\"col\">Supplies<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Tibial<\/th><td>Sciatic<\/td><td>Deep, behind the medial malleolus beside the posterior tibial artery<\/td><td>Sole and heel<\/td><\/tr><tr><th scope=\"row\">Deep peroneal<\/th><td>Sciatic (common peroneal)<\/td><td>Deep, at the front of the ankle beside the dorsalis pedis artery, between the extensor hallucis longus and extensor digitorum longus tendons<\/td><td>First web space<\/td><\/tr><tr><th scope=\"row\">Superficial peroneal<\/th><td>Sciatic (common peroneal)<\/td><td>Subcutaneous ring across the front of the ankle, toward the lateral malleolus<\/td><td>Top of the foot<\/td><\/tr><tr><th scope=\"row\">Sural<\/th><td>Sciatic (tibial and peroneal branches)<\/td><td>Subcutaneous, between the lateral malleolus and the Achilles tendon<\/td><td>Lateral foot and fifth toe<\/td><\/tr><tr><th scope=\"row\">Saphenous<\/th><td>Femoral<\/td><td>Subcutaneous, in front of the medial malleolus beside the great saphenous vein<\/td><td>Medial ankle and arch<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Two injections are deep (tibial and deep peroneal) and three are subcutaneous. Four of the five nerves come from the sciatic; only the saphenous comes from the femoral.<\/li><\/ul><h3 class=\"nb-h\">Lower limb blocks<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Block<\/th><th scope=\"col\">Nerves reached<\/th><th scope=\"col\">Good for<\/th><th scope=\"col\">Motor effect and cautions<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Lumbar plexus (psoas)<\/th><td>Femoral, obturator, lateral femoral cutaneous<\/td><td>Hip and thigh<\/td><td>Quadriceps and adductor weakness; deep block with epidural spread, kidney injury and hidden bleeding, so follow neuraxial anticoagulation rules<\/td><\/tr><tr><th scope=\"row\">Femoral<\/th><td>Femoral<\/td><td>Front of the thigh, femur, front of the knee<\/td><td>Quadriceps weakness<\/td><\/tr><tr><th scope=\"row\">Fascia iliaca<\/th><td>Femoral, lateral femoral cutaneous, sometimes obturator<\/td><td>Hip and front of the thigh<\/td><td>Quadriceps weakness; large volume of dilute local anesthetic<\/td><\/tr><tr><th scope=\"row\">Adductor canal<\/th><td>Saphenous and the nerve to vastus medialis<\/td><td>Medial knee and leg; knee arthroplasty<\/td><td>Largely preserves quadriceps strength<\/td><\/tr><tr><th scope=\"row\">Obturator<\/th><td>Obturator<\/td><td>Preventing adductor jerks during resection of lateral bladder wall tumors<\/td><td>A spinal does not stop the jerk; an obturator block or neuromuscular blockade does<\/td><\/tr><tr><th scope=\"row\">Sciatic (subgluteal or popliteal)<\/th><td>Sciatic; higher approaches also the posterior femoral cutaneous<\/td><td>Below the knee (popliteal); back of the thigh (higher approaches)<\/td><td>Foot drop; the popliteal approach misses the saphenous<\/td><\/tr><tr><th scope=\"row\">Ankle<\/th><td>Five nerves above<\/td><td>Forefoot surgery<\/td><td>Little motor block<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Quadriceps weakness and falls<\/h3><ul><li>Femoral, fascia iliaca and lumbar plexus blocks weaken knee extension, and catheters prolong it. Patients may fall the first time they stand.<\/li><li>Test strength before walking, warn the patient and nurses, and use a knee brace and assisted walking. An adductor canal block largely preserves strength.<\/li><li>The nerves most often injured by positioning (common peroneal, sciatic, femoral, obturator, lateral femoral cutaneous and saphenous) are tabled in <a href=\"#i-a-1-c\">I.A.1.c<\/a>.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a popliteal sciatic block does not cover the medial ankle or arch, which the saphenous nerve (from the femoral) supplies. Add an adductor canal or saphenous block for ankle and medial foot surgery.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-c-2-a\">I.A.1.c.2.a Lower extremity bones<\/a> · <a href=\"#i-a-1-b-6\">I.A.1.b.6 Extremities ultrasound<\/a> · <a href=\"#ii-b-1-a-2\">II.B.1.a.2 Extremity blocks<\/a> · <a href=\"#ii-c-1-b-1\">II.C.1.b.1 Peripheral nerve distributions<\/a> · <a href=\"#i-a-1-a-4\">I.A.1.a.4 Extremities landmarks<\/a><\/p>","b":"The leg has two plexuses: the lumbar plexus (L1 to L4) supplies the front and medial thigh through the femoral, obturator and lateral femoral cutaneous nerves, and the sacral plexus (L4 to S3) supplies the back of the thigh and almost everything below the knee through the sciatic nerve. Most leg surgery needs a block of each, and every femoral-type block weakens the quadriceps.","u":"2026-11-05"},"I.A.1.c.3.a":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Each intercostal nerve runs in the groove under its rib, below the vein and artery. Chest wall blocks reach these nerves at different points, from the paravertebral space beside the spine to plane blocks at the front, and intercostal blocks produce the highest blood levels of local anesthetic of any block.<\/p><h3 class=\"nb-h\">Course of an intercostal nerve<\/h3><ul><li>The ventral rami of T1 to T11 are the intercostal nerves; T12 is the subcostal nerve. Each leaves its intervertebral foramen, crosses the paravertebral space and runs forward in its intercostal space between the internal and innermost intercostal muscles.<\/li><li>In the groove under each rib the order from top to bottom is vein, artery, nerve (\"VAN\"). The nerve is the least sheltered by the rib, so a needle walked off the lower edge of the rib meets it.<\/li><li>Near the spine, medial to the angle of the rib, the intercostal artery winds across the middle of the space instead of hiding in the groove.<\/li><li>Each nerve gives off a lateral cutaneous branch near the midaxillary line and ends as an anterior cutaneous branch beside the sternum (or, for T7 to T11, through the rectus; see <a href=\"#i-a-1-c-3-b\">I.A.1.c.3.b<\/a>). A block in front of the midaxillary line misses the lateral branch.<\/li><li>T1 joins the brachial plexus, and T2 gives the intercostobrachial nerve to the medial arm. The dorsal rami supply the back muscles and the skin near the spine.<\/li><\/ul><h3 class=\"nb-h\">The paravertebral space<\/h3><ul><li>A wedge beside each vertebral body, bounded behind by the superior costotransverse ligament, in front and to the side by the parietal pleura, and medially by the vertebral body, disc and intervertebral foramen.<\/li><li>It holds the spinal nerve as it divides into its rami, the sympathetic chain and the intercostal vessels.<\/li><li>It opens into the epidural space through the foramen, into the intercostal space laterally, and into the spaces above and below, so one injection can spread over several levels.<\/li><\/ul><h3 class=\"nb-h\">Chest wall blocks<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Block<\/th><th scope=\"col\">Where the local anesthetic goes<\/th><th scope=\"col\">Nerves reached<\/th><th scope=\"col\">Typical uses<\/th><th scope=\"col\">Cautions<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Intercostal<\/th><td>Under the lower edge of each rib, at or behind the posterior axillary line<\/td><td>One nerve per injection<\/td><td>Rib fractures, chest drains<\/td><td>Highest blood levels of any block; pneumothorax<\/td><\/tr><tr><th scope=\"row\">Thoracic paravertebral<\/th><td>Beside the vertebra, in front of the costotransverse ligament<\/td><td>Spinal nerves and the sympathetic chain over several levels, on one side<\/td><td>Breast surgery, thoracotomy, thoracoscopy, rib fractures<\/td><td>Pneumothorax; epidural spread; hypotension<\/td><\/tr><tr><th scope=\"row\">Erector spinae plane<\/th><td>Under the erector spinae muscle, on the transverse process<\/td><td>Dorsal rami reliably; spread to ventral rami and the paravertebral space varies<\/td><td>Rib fractures, spine and thoracic surgery, breast surgery<\/td><td>Far from the pleura and spinal canal, so safer, but less predictable<\/td><\/tr><tr><th scope=\"row\">Serratus anterior plane<\/th><td>Above or below the serratus anterior, near the midaxillary line<\/td><td>Lateral cutaneous branches of the upper and middle intercostal nerves<\/td><td>Lateral chest wall: rib fractures, thoracoscopy ports, breast<\/td><td>Spares the front of the chest<\/td><\/tr><tr><th scope=\"row\">PECS I<\/th><td>Between the pectoralis major and minor<\/td><td>Medial and lateral pectoral nerves<\/td><td>Breast expanders and implants under the muscle<\/td><td>No intercostal nerves on its own<\/td><\/tr><tr><th scope=\"row\">PECS II<\/th><td>PECS I plus between the pectoralis minor and serratus anterior<\/td><td>Adds the lateral cutaneous branches, the intercostobrachial and the long thoracic nerves<\/td><td>Mastectomy, axillary surgery<\/td><td>Misses the medial breast (anterior cutaneous branches)<\/td><\/tr><tr><th scope=\"row\">Parasternal intercostal plane<\/th><td>Beside the sternum, in front of or behind the internal intercostal muscle<\/td><td>Anterior cutaneous branches<\/td><td>Sternotomy, medial breast<\/td><td>The internal thoracic vessels lie close<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Local anesthetic absorption by site<\/h3><ul><li>Peak blood levels follow the blood supply of the site: intravenous, then tracheal, intercostal, caudal, epidural, brachial plexus, sciatic and femoral, and subcutaneous.<\/li><li>Large-volume plane blocks (erector spinae, serratus, transversus abdominis) also produce high levels, especially when done on both sides.<\/li><li>Epinephrine lowers peak levels, more for lidocaine than for bupivacaine or ropivacaine.<\/li><\/ul><h3 class=\"nb-h\">Rib fractures and chest drains<\/h3><ul><li>Pain control is about breathing: good analgesia improves coughing and vital capacity. Thoracic epidural and paravertebral catheters give the most reliable relief; erector spinae and serratus catheters are simpler and suit patients on anticoagulants or with spine injuries.<\/li><li>Place chest drains in the \"safe triangle\": between the lateral edge of the pectoralis major, the front edge of the latissimus dorsi and the level of the nipple (fifth intercostal space), with its apex below the armpit. Enter just above a rib to stay clear of the bundle under the rib above.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> intercostal blocks give the highest blood levels for a given dose. Several levels, or both sides, can reach toxic levels quickly, so add up the total dose first.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-1-c-3-b\">I.A.1.c.3.b Abdominal wall anatomy<\/a> · <a href=\"#ii-b-1-a-3\">II.B.1.a.3 Trunk blocks<\/a> · <a href=\"#i-a-1-a-2\">I.A.1.a.2 Chest<\/a> · <a href=\"#i-a-1-b-1\">I.A.1.b.1 Chest imaging<\/a> · <a href=\"#ii-b-1-g\">II.B.1.g Diagnosis and Management of LAST<\/a><\/p>","b":"Each intercostal nerve runs in the groove under its rib, below the vein and artery. Chest wall blocks reach these nerves at different points, from the paravertebral space beside the spine to plane blocks at the front, and intercostal blocks produce the highest blood levels of local anesthetic of any block.","u":"2026-11-05"},"I.A.1.c.3.b":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> The abdominal wall is supplied by T6 to L1, nerves that run between the internal oblique and transversus abdominis and then through the rectus sheath. Wall blocks treat incision pain only, because visceral pain travels with autonomic nerves; that is why a cesarean delivery under spinal needs a T4 level although the incision lies near L1.<\/p><h3 class=\"nb-h\">Layers, from skin to peritoneum<\/h3><ul><li>Skin, then the fatty (Camper's) and membranous (Scarpa's) layers of superficial fascia.<\/li><li>At the side, three flat muscles: external oblique, internal oblique and transversus abdominis. Then the transversalis fascia, extraperitoneal fat and parietal peritoneum.<\/li><li>Toward the midline the flat muscles become aponeuroses that wrap the rectus abdominis as the rectus sheath and meet in the linea alba, a tough, nearly bloodless midline seam. The curved lateral edge of the rectus is the linea semilunaris.<\/li><\/ul><h3 class=\"nb-h\">The rectus sheath<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Level<\/th><th scope=\"col\">In front of the rectus<\/th><th scope=\"col\">Behind the rectus<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Above the arcuate line<\/th><td>External oblique aponeurosis and the front layer of the internal oblique aponeurosis<\/td><td>Back layer of the internal oblique aponeurosis and the transversus abdominis aponeurosis, then transversalis fascia<\/td><\/tr><tr><th scope=\"row\">Below the arcuate line<\/th><td>All three aponeuroses<\/td><td>Transversalis fascia only<\/td><\/tr><\/tbody><\/table><\/div><ul><li>The arcuate line lies between the umbilicus and the pubis, which is why rectus sheath blocks are placed at or above the umbilicus (see <a href=\"#i-a-1-b-5\">I.A.1.b.5<\/a>).<\/li><li>Inside the sheath the superior epigastric artery (from the internal thoracic) meets the inferior epigastric artery (from the external iliac). This link carries collateral flow around an aortic coarctation, and the inferior epigastric is the vessel a lateral laparoscopic port can tear.<\/li><\/ul><h3 class=\"nb-h\">Nerves and dermatomes<\/h3><ul><li>T6 to T11 (the lower intercostal nerves), T12 (subcostal) and L1 (iliohypogastric and ilioinguinal). Their course through the wall is in <a href=\"#i-a-1-b-5\">I.A.1.b.5<\/a>.<\/li><li>Landmarks: xiphoid T6, umbilicus T10, groin L1 (see <a href=\"#i-a-1-a-5\">I.A.1.a.5<\/a>).<\/li><li>Each side has its own supply with little crossover, so a midline incision needs blocks on both sides.<\/li><li>The genital branch of the genitofemoral nerve (L1, L2) supplies the spermatic cord and the scrotum or labia.<\/li><\/ul><h3 class=\"nb-h\">Incisions and blocks<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Incision or surgery<\/th><th scope=\"col\">Nerves<\/th><th scope=\"col\">Block options<\/th><th scope=\"col\">Notes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Upper midline or subcostal (liver, stomach, pancreas)<\/th><td>T6 to T10<\/td><td>Thoracic epidural; subcostal TAP, rectus sheath, erector spinae or paravertebral<\/td><td>A subcostal incision cuts across the nerves<\/td><\/tr><tr><th scope=\

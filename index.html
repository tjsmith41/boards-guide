 placed<\/td><\/tr><tr><th scope=\"row\">Pneumocephalus<\/th><td>Pressure rises<\/td><td>Tension pneumocephalus<\/td><td>Intracranial air can persist for weeks after a craniotomy<\/td><\/tr><tr><th scope=\"row\">Eye with an intraocular gas bubble (air, SF6 or C3F8 after retinal surgery)<\/th><td>Pressure rises<\/td><td>Intraocular pressure can rise enough to close the central retinal artery and cause blindness<\/td><td>Avoid until the gas is gone, which takes days to weeks depending on the gas; patients may wear a warning bracelet<\/td><\/tr><tr><th scope=\"row\">Tracheal tube and laryngeal mask cuffs<\/th><td>Volume and pressure rise<\/td><td>Mucosal injury and sore throat<\/td><td>Check cuff pressure during the case (about 20 to 30 cm H2O for a tracheal tube cuff)<\/td><\/tr><\/tbody><\/table><\/div><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> in a stiff space the danger is a pressure rise you cannot see. Before giving nitrous oxide, ask about recent retinal surgery, because the rise in eye pressure can cause permanent blindness.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-f-3\">I.A.2.f.3 Second Gas Effect<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a> · <a href=\"#i-a-2-d\">I.A.2.d Gas Laws<\/a> · <a href=\"#ii-c-1-d-1-f-3\">II.C.1.d.1.f.3 Air Embolism<\/a> · <a href=\"#ii-d-7\">II.D.7 Ophthalmologic Anesthesia<\/a><\/p>","b":"Nitrous oxide is about 30 times more soluble in blood than nitrogen, so it enters an air-filled space much faster than nitrogen can leave. A compliant space grows; a stiff space rises in pressure. Avoid nitrous oxide wherever trapped gas matters, and never give it while an intraocular gas bubble remains.","u":"2026-11-05"},"I.A.2.g":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> The anesthesia machine reduces gas from pipeline or cylinder pressure, meters it through flowmeters and a vaporizer, and sends it to a breathing system that must deliver it with little resistance and dead space, remove CO2, and let you ventilate by hand or by ventilator. Its safety features guard against a hypoxic mixture and loss of oxygen pressure, but only the oxygen analyzer and the capnograph confirm what the patient actually receives.<\/p><h3 class=\"nb-h\">The machine's three pressure zones<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Zone<\/th><th scope=\"col\">Pressure<\/th><th scope=\"col\">Parts<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">High pressure<\/th><td>Cylinder pressure, up to about 2,200 psi for oxygen<\/td><td>Cylinders, hanger yokes with pin index, cylinder gauges, cylinder regulators<\/td><\/tr><tr><th scope=\"row\">Intermediate pressure<\/th><td>Pipeline about 50 psi; regulated cylinder gas about 45 psi<\/td><td>Pipeline inlets, check valves, oxygen pressure failure devices, oxygen flush, flow control valves, second-stage regulators on some machines, ventilator drive gas<\/td><\/tr><tr><th scope=\"row\">Low pressure<\/th><td>Just above atmospheric<\/td><td>Flowmeters, vaporizers, an outlet check valve on some machines, common gas outlet<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">The path of fresh gas<\/h3><ol><li>Gas arrives from the pipeline or from a cylinder through its regulator.<\/li><li>Flow control valves and flowmeters set each flow. The proportioning system and the oxygen-last flowmeter order protect the oxygen fraction.<\/li><li>The selected vaporizer adds agent.<\/li><li>Fresh gas leaves at the common gas outlet for the breathing system.<\/li><li>The oxygen flush bypasses steps 2 and 3 and sends 35 to 75 L/min of pure oxygen straight to the common gas outlet.<\/li><\/ol><h3 class=\"nb-h\">What the breathing system must do<\/h3><ul><li>Deliver oxygen and anesthetic, remove CO2 by absorption or by washout with fresh gas, and allow spontaneous, assisted or controlled ventilation.<\/li><li>Keep resistance, dead space and leaks low, and conserve heat and humidity (see <a href=\"#i-a-2-g-1\">I.A.2.g.1<\/a>).<\/li><li>Systems differ in whether exhaled gas is rebreathed and whether CO2 is absorbed: circle systems (<a href=\"#i-a-2-g-3-a\">I.A.2.g.3.a<\/a>), Mapleson and other non-circle systems (<a href=\"#i-a-2-g-3-b\">I.A.2.g.3.b<\/a>) and self-inflating bags (<a href=\"#i-a-2-g-3-c\">I.A.2.g.3.c<\/a>).<\/li><li>Check the machine before every case. Most modern machines run an automated self-test, but it does not confirm everything, such as a working self-inflating bag and suction.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> the oxygen flush bypasses the vaporizer and enters at intermediate pressure. Repeated flushing dilutes the anesthetic and risks awareness, and flushing during a ventilator breath can cause barotrauma on machines without fresh gas decoupling.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-a-2\">I.A.2.a.2 Transducers, Regulators, Medical Gas Cylinders<\/a> · <a href=\"#i-a-2-b-2\">I.A.2.b.2 Flowmeters: Rotameter<\/a> · <a href=\"#i-a-2-e-2\">I.A.2.e.2 Vaporizer Types and Safety Features<\/a> · <a href=\"#i-a-2-g-6\">I.A.2.g.6 Safety Features<\/a> · <a href=\"#i-a-2-j\">I.A.2.j Ventilators<\/a><\/p>","b":"The anesthesia machine reduces gas from pipeline or cylinder pressure, meters it through flowmeters and a vaporizer, and sends it to a breathing system that must deliver it with little resistance and dead space, remove CO2, and let you ventilate by hand or by ventilator. Its safety features guard against a hypoxic mixture and loss of oxygen pressure, but only the oxygen analyzer and the capnograph confirm what the patient actually receives.","u":"2026-11-05"},"I.A.2.g.1":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> A good breathing system has low resistance, little apparatus dead space, no unintended rebreathing of CO2, no leaks, and some way to keep inspired gas warm and moist. Most problems show up first on the capnogram, the airway pressure and the oxygen analyzer.<\/p><h3 class=\"nb-h\">Resistance and turbulent flow<\/h3><ul><li>Resistance rises steeply as a tube narrows: with the fourth power of the radius in laminar flow and about the fifth power in turbulent flow (details in <a href=\"#i-a-2-b-1\">I.A.2.b.1<\/a>).<\/li><li>In a breathing system the tracheal tube is usually the largest resistance. Sharp bends, small connectors, filters and kinks add turbulence.<\/li><li>Breathing tubes are wide (22 mm) and corrugated, which keeps resistance low and resists kinking.<\/li><li>High expiratory resistance slows exhalation and can trap gas (auto-PEEP); high inspiratory resistance raises the work of spontaneous breathing.<\/li><\/ul><h3 class=\"nb-h\">Mechanical (apparatus) dead space<\/h3><ul><li>The volume in which exhaled gas is rebreathed unchanged with the next breath. In a circle with working valves it runs from the Y-piece to the patient: elbow, heat and moisture exchanger, capnography adapter, extensions and the mask.<\/li><li>The breathing tubes of a circle are not dead space, because the unidirectional valves send exhaled gas the other way.<\/li><li>It matters most with small tidal volumes, as in infants, where it raises PaCO2 for a given minute ventilation.<\/li><li>A tracheal tube bypasses the anatomic dead space of the upper airway but adds its own connectors; a face mask adds more.<\/li><\/ul><h3 class=\"nb-h\">Rebreathing<\/h3><ul><li>Rebreathing exhaled gas is useful once CO2 is removed: it conserves heat, water and anesthetic. Rebreathing CO2 is the problem.<\/li><li>In a circle the absorbent removes CO2. In Mapleson systems only enough fresh gas flow prevents rebreathing.<\/li><li>Sign: inspired CO2 above zero, so the capnogram baseline does not return to zero.<\/li><li>Causes: exhausted or channeled absorbent, an incompetent inspiratory or expiratory valve, too little fresh gas in a Mapleson system, or too much apparatus dead space.<\/li><\/ul><h3 class=\"nb-h\">Dilution<\/h3><ul><li>The breathing system's volume dilutes fresh gas, so a change at the dial reaches the patient with a time constant of circuit volume ÷ fresh gas flow (see <a href=\"#i-a-2-f-1\">I.A.2.f.1<\/a>).<\/li><li>Air drawn in through a leak, a loose mask or an open system dilutes oxygen and agent.<\/li><li>A hole in a ventilator bellows lets drive gas into the breathing circuit. It dilutes the anesthetic and shifts FiO2 up with oxygen drive gas or toward 21% with air.<\/li><li>The oxygen flush dilutes the anesthetic (see <a href=\"#i-a-2-g\">I.A.2.g<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Leaks<\/h3><ul><li>Low-pressure system leaks, between the flowmeters and the common gas outlet (flowmeter tubes, vaporizer mounts, filler caps), can cause a hypoxic mixture or awareness. The negative-pressure leak test checks this part even on machines with an outlet check valve: a suction bulb on the common gas outlet should stay collapsed for at least 10 seconds. Follow the manufacturer's checkout; most modern machines run an automated leak test.<\/li><li>Breathing system leaks: close the APL valve, occlude the Y-piece and pressurize to 30 cm H2O; the pressure should hold for at least 10 seconds. Common sites are absorber canister seals, the Y-piece, gas sampling lines and cracked tubing.<\/li><li>During a case a leak shows as a falling bellows, low exhaled tidal volume, a low airway pressure alarm, a smell of agent, or a bag that will not fill.<\/li><\/ul><h3 class=\"nb-h\">Gas mixtures<\/h3><ul><li>Inspired oxygen from mixed flows: FiO2 = (oxygen flow + 0.21 × air flow) ÷ total flow (examples in <a href=\"#i-a-2-g-4\">I.A.2.g.4<\/a>).<\/li><li>At low fresh gas flows with nitrous oxide, inspired oxygen can fall below the fraction you set. The patient keeps consuming about 200 to 250 mL/min of oxygen while nitrous oxide uptake falls as tissues fill. The oxygen analyzer catches this.<\/li><li>In closed or very low flow systems, nitrogen washed out of the patient builds up in the circuit, along with traces of gases such as acetone and methane. Raising the flow for a few minutes clears them.<\/li><li>Flowmeters are calibrated for one gas, so unusual mixtures such as heliox are misread (see <a href=\"#i-a-2-b-2\">I.A.2.b.2<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Humidity and heat<\/h3><ul><li>Pipeline and cylinder gases are dry. Normally the upper airway warms and humidifies inspired gas, so it reaches 37 °C and full saturation (about 44 mg of water per liter) just below the carina.<\/li><li>A tracheal tube bypasses the nose and pharynx. Dry gas thickens secretions, impairs ciliary function, can block small tubes, and costs heat as water evaporates from the airway.<\/li><li>Ways to add heat and moisture:<ul><li>Circle system at low flows: CO2 absorption makes water and heat, and rebreathing keeps them in the circuit.<\/li><li>Heat and moisture exchanger (HME): passive; it captures exhaled heat and water and returns much of it. It adds dead space and resistance and can clog with secretions. Many include a filter.<\/li><li>Active heated humidifier: the most effective. Risks include airway burns from overheating, overhydration in infants, condensation in the tubing and infection.<\/li><\/ul><\/li><li>Breathing accounts for only a small part of total heat loss during surgery, so humidifying gas helps the airway more than it helps body temperature.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> inspired CO2 above zero means rebreathing. If fresh absorbent does not fix it, look at the unidirectional valves.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-b-1\">I.A.2.b.1 Viscosity-Density, Laminar-Turbulent Flow<\/a> · <a href=\"#i-a-2-g-2\">I.A.2.g.2 Components<\/a> · <a href=\"#i-a-2-g-3-a\">I.A.2.g.3.a Circle Systems: Closed and Semi-Closed<\/a> · <a href=\"#i-a-2-g-3-d\">I.A.2.g.3.d CO2 Absorption<\/a> · <a href=\"#i-a-2-f-1\">I.A.2.f.1 Uptake and Elimination Curves<\/a><\/p>","b":"A good breathing system has low resistance, little apparatus dead space, no unintended rebreathing of CO2, no leaks, and some way to keep inspired gas warm and moist. Most problems show up first on the capnogram, the airway pressure and the oxygen analyzer.","u":"2026-11-05"},"I.A.2.g.2":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Each part of the breathing system has a physical job and a typical failure. Standard 15 mm and 22 mm connectors let everything fit together, which also makes disconnections and misconnections possible. The reservoir bag's stretch limits pressure, the unidirectional valves keep gas moving one way around a circle, and the APL valve sets the pressure at which excess gas leaves.<\/p><h3 class=\"nb-h\">Connectors and adaptors<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Connector<\/th><th scope=\"col\">Size<\/th><th scope=\"col\">Where it fits<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Tracheal tube and supraglottic airway<\/th><td>15 mm male<\/td><td>The 15 mm port inside the elbow or Y-piece<\/td><\/tr><tr><th scope=\"row\">Face mask<\/th><td>22 mm female<\/td><td>Over the 22 mm outside of the elbow or Y-piece<\/td><\/tr><tr><th scope=\"row\">Breathing tubes<\/th><td>22 mm<\/td><td>The machine's inspiratory and expiratory ports and the Y-piece<\/td><\/tr><tr><th scope=\"row\">Scavenging hoses<\/th><td>19 mm or 30 mm<\/td><td>Deliberately different, so they cannot be plugged into the breathing system<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Disconnection, most often where the tube meets the Y-piece, is one of the commonest breathing system incidents. Capnography and the low pressure and low volume alarms detect it.<\/li><li>Other failures: misconnection, cracked or loose parts, and obstruction by a foreign body or manufacturing defect inside a connector, filter or tube. Look through each new part.<\/li><\/ul><h3 class=\"nb-h\">Face mask<\/h3><ul><li>Transparent, so you can see the lips, condensation and vomit. The cushion seals over the nasal bridge, cheeks and chin.<\/li><li>It adds apparatus dead space.<\/li><li>Keep inflation pressure low, ideally under about 20 cm H2O, to limit gastric inflation.<\/li><li>Pressure from the mask or straps can injure the eyes and branches of the trigeminal and facial nerves.<\/li><\/ul><h3 class=\"nb-h\">Tracheal tube<\/h3><ul><li>Sized by internal diameter in millimeters, marked in centimeters from the tip, with a radiopaque line. A Murphy eye (side hole) gives gas a path if the bevel is blocked.<\/li><li>Most adult tubes have a high-volume, low-pressure cuff. Keep cuff pressure at about 20 to 30 cm H2O: higher pressure reduces tracheal mucosal blood flow, and lower pressure allows leaks and aspiration.<\/li><li>It is usually the largest resistance in the system, and resistance rises sharply as the tube gets smaller (see <a href=\"#i-a-2-b-1\">I.A.2.b.1<\/a>).<\/li><li>Nitrous oxide diffuses into an air-filled cuff and raises its pressure (see <a href=\"#i-a-2-f-4\">I.A.2.f.4<\/a>). Tube materials, laser-resistant tubes and tip designs are in <a href=\"#i-b-3-c-8\">I.B.3.c.8<\/a>.<\/li><\/ul><h3 class=\"nb-h\">Laryngeal mask airway<\/h3><ul><li>A supraglottic airway whose cuff seals around the laryngeal inlet in the hypopharynx.<\/li><li>Seal pressure is roughly 20 cm H2O for first-generation devices and higher, often 25 to 30 cm H2O, for second-generation devices with a gastric drain channel.<\/li><li>Keep cuff pressure at or below 60 cm H2O. Overinflation can worsen the seal and raises the risk of sore throat and of injury to the lingual, hypoglossal and recurrent laryngeal nerves.<\/li><li>It does not reliably protect against aspiration; second-generation designs reduce the risk but do not remove it (see <a href=\"#i-b-3-c-4\">I.B.3.c.4<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Reservoir bag<\/h3><ul><li>Holds gas for inspiration, lets you ventilate by hand, and shows spontaneous breathing at a glance.<\/li><li>Adult bags are usually 3 L and children's 0.5 to 2 L; the bag should hold more than the patient's inspiratory capacity.<\/li><li>It is very compliant. When overfilled, its pressure levels off instead of climbing, which limits, but does not prevent, barotrauma if the APL valve is closed by mistake.<\/li><\/ul><h3 class=\"nb-h\">Unidirectional valves<\/h3><ul><li>An inspiratory and an expiratory valve, each a light disk on a seat under a clear dome, keep gas moving one way around a circle so exhaled CO2 passes through the absorber.<\/li><li>Stuck open or incompetent: exhaled gas flows backward and is rebreathed, so inspired CO2 rises.<\/li><li>Stuck closed: an inspiratory valve stops inspiration; an expiratory valve stops exhalation, so pressure builds and breaths stack.<\/li><li>Moisture can make a disk stick. Watch both move during the pre-use flow test with a test lung.<\/li><\/ul><h3 class=\"nb-h\">Corrugated breathing tubes<\/h3><ul><li>The wide bore (22 mm) keeps resistance low, and the corrugations stop kinking.<\/li><li>The tubes stretch and the gas in them compresses during positive pressure breaths, so part of each set tidal volume never reaches the patient (compression volume). Modern ventilators measure circuit compliance during their self-test and compensate. It matters most in small children.<\/li><li>In a circle they are not dead space (see <a href=\"#i-a-2-g-1\">I.A.2.g.1<\/a>).<\/li><\/ul><h3 class=\"nb-h\">APL (adjustable pressure-limiting) valve<\/h3><ul><li>A spring-loaded valve that lets excess gas escape to the scavenger once circuit pressure exceeds its setting.<\/li><li>Fully open for spontaneous breathing, so the patient exhales against almost no pressure; partly closed during hand ventilation to build pressure.<\/li><li>In ventilator mode it is switched out of the circuit, and the ventilator's own relief (spill) valve vents excess gas.<\/li><li>Closing it fully with a high fresh gas flow raises pressure quickly and can cause barotrauma.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> during mechanical ventilation the APL valve is out of the circuit, so its setting does not limit airway pressure. The ventilator's pressure limit and alarms do.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-g-1\">I.A.2.g.1 Principles<\/a> · <a href=\"#i-a-2-g-3-a\">I.A.2.g.3.a Circle Systems: Closed and Semi-Closed<\/a> · <a href=\"#i-a-2-g-5\">I.A.2.g.5 Waste Gas Evacuation Systems<\/a> · <a href=\"#i-a-2-f-4\">I.A.2.f.4 Nitrous Oxide and Closed Spaces<\/a> · <a href=\"#i-b-3-c-4\">I.B.3.c.4 Laryngeal Mask Airway<\/a> · <a href=\"#i-b-3-c-8\">I.B.3.c.8 Endotracheal Tube Types<\/a><\/p>","b":"Each part of the breathing system has a physical job and a typical failure. Standard 15 mm and 22 mm connectors let everything fit together, which also makes disconnections and misconnections possible. The reservoir bag's stretch limits pressure, the unidirectional valves keep gas moving one way around a circle, and the APL valve sets the pressure at which excess gas leaves.","u":"2026-11-05"},"I.A.2.g.3.a":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> A circle system recirculates exhaled gas through a CO2 absorber, and unidirectional valves keep the gas moving one way. Fresh gas flow decides how it behaves: with flow above the patient's uptake it is semi-closed and the excess leaves through the APL or ventilator relief valve; with flow equal to uptake it is closed. Lower flows save agent, heat and moisture, but changes in concentration are slower and gas monitoring becomes essential.<\/p><h3 class=\"nb-h\">Layout rules<\/h3><ul><li>A unidirectional valve must sit between the patient and the reservoir bag on both the inspiratory and the expiratory limb.<\/li><li>Fresh gas must not enter between the expiratory valve and the patient.<\/li><li>The APL valve must not sit between the patient and the inspiratory valve.<\/li><li>Most efficient arrangement: fresh gas enters between the absorber and the inspiratory valve, and the APL valve vents just before the absorber, so the gas thrown away is exhaled gas rich in CO2 rather than fresh gas.<\/li><li>Break any rule and CO2 is rebreathed or fresh gas is wasted.<\/li><\/ul><h3 class=\"nb-h\">Classifying breathing systems<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Class<\/th><th scope=\"col\">Reservoir<\/th><th scope=\"col\">Rebreathing<\/th><th scope=\"col\">Examples<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Open<\/th><td>No<\/td><td>No<\/td><td>Open drop, insufflation<\/td><\/tr><tr><th scope=\"row\">Semi-open<\/th><td>Yes<\/td><td>No<\/td><td>Mapleson systems at high fresh gas flow; a circle at flows above minute ventilation<\/td><\/tr><tr><th scope=\"row\">Semi-closed<\/th><td>Yes<\/td><td>Partial<\/td><td>A circle at usual flows, with excess gas vented<\/td><\/tr><tr><th scope=\"row\">Closed<\/th><td>Yes<\/td><td>Complete, with CO2 absorbed<\/td><td>A circle with fresh gas flow equal to uptake and the APL valve closed<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Running a circle at low flow<\/h3><ul><li>Low flow is usually taken as about 1 L/min and minimal flow as about 0.5 L/min. Closed-circuit flow equals oxygen consumption (about 200 to 250 mL/min in an adult) plus agent uptake.<\/li><li>Benefits: less agent used and released, which lowers cost and environmental impact (see <a href=\"#i-a-4-b-14\">I.A.4.b.14<\/a>), and warmer, moister inspired gas.<\/li><li>Inspired concentrations differ from the dial and change slowly (time constant = circuit volume ÷ fresh gas flow), so agent and oxygen monitoring are essential.<\/li><li>Inspired oxygen can drift down when nitrous oxide is used (see <a href=\"#i-a-2-g-1\">I.A.2.g.1<\/a>).<\/li><li>More exhaled gas passes through the absorber instead of being vented, so absorbent is used up faster.<\/li><li>Sevoflurane: the US label does not recommend flows below 1 L/min, because of compound A (see <a href=\"#i-a-2-g-3-e\">I.A.2.g.3.e<\/a>).<\/li><li>A closed system must be leak-free, and nitrogen and other gases slowly build up in it.<\/li><\/ul><h3 class=\"nb-h\">Strengths and weaknesses<\/h3><ul><li>Strengths: stable inspired concentrations, conservation of heat, moisture and agent, little pollution, and use at any flow.<\/li><li>Weaknesses: many connections (leaks, disconnections, misconnections), valves that can stick, absorbent that can be exhausted or react with agents, and compression volume in the tubing. Its slightly higher resistance rarely matters with modern circles, even in small children.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> at low fresh gas flow the dial is not what the patient breathes. To change depth quickly, raise the fresh gas flow as well as the vaporizer setting.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-g-1\">I.A.2.g.1 Principles<\/a> · <a href=\"#i-a-2-g-2\">I.A.2.g.2 Components<\/a> · <a href=\"#i-a-2-g-3-b\">I.A.2.g.3.b Non-Circle Systems<\/a> · <a href=\"#i-a-2-g-3-d\">I.A.2.g.3.d CO2 Absorption<\/a> · <a href=\"#i-a-2-f-1\">I.A.2.f.1 Uptake and Elimination Curves<\/a> · <a href=\"#i-a-4-b-14\">I.A.4.b.14 Environmental Implications<\/a><\/p>","b":"A circle system recirculates exhaled gas through a CO2 absorber, and unidirectional valves keep the gas moving one way. Fresh gas flow decides how it behaves: with flow above the patient's uptake it is semi-closed and the excess leaves through the APL or ventilator relief valve; with flow equal to uptake it is closed. Lower flows save agent, heat and moisture, but changes in concentration are slower and gas monitoring becomes essential.","u":"2026-11-05"},"I.A.2.g.3.b":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Non-circle systems have no CO2 absorber, so only fresh gas flow clears CO2. Insufflation and open-drop techniques put gas or vapor near the face without a seal. The Mapleson systems are light and simple, but each needs its own fresh gas flow to prevent rebreathing, which depends on its layout and on whether breathing is spontaneous or controlled.<\/p><h3 class=\"nb-h\">Insufflation<\/h3><ul><li>Blowing oxygen or anesthetic gas across the face without touching the airway, for example during an inhaled induction in a child or under drapes for eye, head and neck surgery.<\/li><li>The inspired concentration is unpredictable because room air is drawn in, and ventilation cannot be controlled.<\/li><li>Under drapes, a high gas flow (often quoted as more than 10 L/min) washes out exhaled CO2. Oxygen pooling under drapes near electrosurgery is a fire risk (see <a href=\"#i-a-2-m-5\">I.A.2.m.5<\/a>).<\/li><li>Apneic oxygenation through nasal cannulas is also a form of insufflation (see <a href=\"#i-c-2-a-4-b\">I.C.2.a.4.b<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Open drop<\/h3><ul><li>Historical: a volatile agent such as ether was dripped onto gauze over a wire mask.<\/li><li>The concentration is uncontrolled, the mask cools as the agent evaporates, and the room is polluted.<\/li><\/ul><h3 class=\"nb-h\">Mapleson systems<\/h3><p>All are built from the same parts: a fresh gas inlet, corrugated reservoir tubing, a reservoir bag, an APL (expiratory) valve and the mask or tube. They differ in where the fresh gas inlet and the APL valve sit, which decides how well fresh gas flushes out exhaled CO2.<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">System<\/th><th scope=\"col\">Layout<\/th><th scope=\"col\">Best use<\/th><th scope=\"col\">Fresh gas flow to prevent rebreathing (approximate)<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">A (Magill)<\/th><td>APL valve at the patient end, fresh gas at the bag end<\/td><td>Spontaneous breathing<\/td><td>About 1 × minute ventilation when spontaneous; impractically high for controlled ventilation<\/td><\/tr><tr><th scope=\"row\">B and C<\/th><td>Fresh gas and APL valve both at the patient end; C has very short tubing<\/td><td>Little used; C for brief hand ventilation and transport<\/td><td>About 2 to 2.5 × minute ventilation<\/td><\/tr><tr><th scope=\"row\">D, and the coaxial Bain<\/th><td>Fresh gas at the patient end, APL valve at the bag end<\/td><td>Controlled ventilation<\/td><td>About 70 mL/kg/min controlled in adults; 2 to 3 × minute ventilation when spontaneous<\/td><\/tr><tr><th scope=\"row\">E (Ayre's T-piece)<\/th><td>T-piece with an open expiratory limb, no bag or valve<\/td><td>Spontaneous breathing in children (historical)<\/td><td>2 to 3 × minute ventilation<\/td><\/tr><tr><th scope=\"row\">F (Jackson-Rees)<\/th><td>Mapleson E with an open-tailed bag on the expiratory limb<\/td><td>Children, spontaneous or controlled<\/td><td>2 to 3 × minute ventilation<\/td><\/tr><\/tbody><\/table><\/div><p>Order of efficiency (least fresh gas needed first):<\/p><ul><li>Spontaneous breathing: A, then D, F and E, then C and B.<\/li><li>Controlled ventilation: D, F and E, then B and C, then A.<\/li><\/ul><h3 class=\"nb-h\">The Bain circuit<\/h3><ul><li>A coaxial Mapleson D. Fresh gas runs through a narrow inner tube to the patient end, and exhaled gas returns through the outer tube, which slightly warms the incoming gas.<\/li><li>Light and convenient, with the bag and APL valve away from the patient.<\/li><li>If the inner tube disconnects or kinks, the whole outer tube becomes dead space and the patient rebreathes CO2.<\/li><li>Pethick test: occlude the patient end and fill the bag, then release the end and press the oxygen flush. With an intact inner tube, the jet at the patient end creates a Venturi effect that empties the bag.<\/li><\/ul><h3 class=\"nb-h\">Strengths and weaknesses of Mapleson systems<\/h3><ul><li>Strengths: simple, light and cheap, low resistance with no unidirectional valves, and fast changes in inspired concentration.<\/li><li>Weaknesses: high fresh gas flows (cost, pollution, cold and dry gas), rebreathing if the flow is too low, and difficult scavenging, especially for E and F.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> Mapleson A is the most efficient system for spontaneous breathing and the least efficient for controlled ventilation. Mapleson D and the Bain are the reverse.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-g-3-a\">I.A.2.g.3.a Circle Systems: Closed and Semi-Closed<\/a> · <a href=\"#i-a-2-g-3-c\">I.A.2.g.3.c Portable Ventilation Devices<\/a> · <a href=\"#i-a-2-g-1\">I.A.2.g.1 Principles<\/a> · <a href=\"#i-a-2-m-5\">I.A.2.m.5 Risk Factors for Intraoperative Fire<\/a><\/p>","b":"Non-circle systems have no CO2 absorber, so only fresh gas flow clears CO2. Insufflation and open-drop techniques put gas or vapor near the face without a seal. The Mapleson systems are light and simple, but each needs its own fresh gas flow to prevent rebreathing, which depends on its layout and on whether breathing is spontaneous or controlled.","u":"2026-11-05"},"I.A.2.g.3.c":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> A self-inflating bag refills through its own intake valve, so it works with no gas supply at all. With an oxygen reservoir and high oxygen flow it delivers close to 100% oxygen, and without one much less. A flow-inflating bag, such as a Mapleson C or Jackson-Rees, needs fresh gas to fill but lets you feel lung compliance and give CPAP and free-flow oxygen. A non-rebreathing valve sends each breath to the patient and vents exhaled gas to the room.<\/p><h3 class=\"nb-h\">Self-inflating bag (bag-valve-mask)<\/h3><ul><li>Parts: a bag that re-expands by its own elasticity, an intake valve with an oxygen inlet and reservoir, and a non-rebreathing valve at the patient end. Infant and child bags usually have a pressure-relief valve.<\/li><li>It works without oxygen or electricity, so every anesthetizing location needs one as a backup for machine or pipeline failure. It is also used for transport and resuscitation.<\/li><li>FiO2: 21% without oxygen, roughly 40 to 60% with oxygen but no reservoir, and close to 100% with a reservoir and 10 to 15 L/min of oxygen.<\/li><li>It cannot give free-flow oxygen or CPAP unless a PEEP valve is added, and a spontaneously breathing patient has to work to open the valve.<\/li><li>Risks: high pressures and volumes (barotrauma, gastric inflation), and a valve that sticks or is assembled wrongly.<\/li><\/ul><h3 class=\"nb-h\">Flow-inflating (non-self-inflating) bag<\/h3><ul><li>Fills only with fresh gas flow, like the reservoir bag of an anesthesia circuit. The Mapleson C and the Jackson-Rees (Mapleson F) are examples.<\/li><li>It delivers the FiO2 of the fresh gas, gives free-flow oxygen and CPAP or PEEP by adjusting the valve or the bag's tail, and lets you feel compliance and spontaneous breaths.<\/li><li>It needs a gas supply, a good seal and practice to balance flow and valve.<\/li><\/ul><h3 class=\"nb-h\">Comparison<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Feature<\/th><th scope=\"col\">Self-inflating bag<\/th><th scope=\"col\">Flow-inflating bag<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Needs gas flow to work<\/th><td>No<\/td><td>Yes<\/td><\/tr><tr><th scope=\"row\">FiO2<\/th><td>21% on air; near 100% only with a reservoir and high oxygen flow<\/td><td>That of the fresh gas<\/td><\/tr><tr><th scope=\"row\">CPAP or PEEP<\/th><td>Only with an added PEEP valve<\/td><td>Yes<\/td><\/tr><tr><th scope=\"row\">Free-flow oxygen to a breathing patient<\/th><td>Not reliable<\/td><td>Yes<\/td><\/tr><tr><th scope=\"row\">Feel of lung compliance<\/th><td>Poor<\/td><td>Good<\/td><\/tr><tr><th scope=\"row\">Skill needed<\/th><td>Less<\/td><td>More<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Non-rebreathing valves<\/h3><ul><li>One-way valves at the patient connection. During inspiration they send gas from the bag to the patient and close the exhaust port; during exhalation they close toward the bag and vent exhaled gas to the room. Designs use a spring-loaded disk or a flexible duckbill or leaf.<\/li><li>While the valve works there is little dead space and no CO2 rebreathing, whatever the flow.<\/li><li>Failures: sticking from moisture or secretions, which causes rebreathing or obstruction, and misassembly, which can make ventilation impossible.<\/li><li>Before use, block the patient port and squeeze: the bag should resist, apart from any relief valve opening. Then check that gas leaves the patient port when you squeeze.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a self-inflating bag without its oxygen reservoir delivers well under 100% oxygen even at high oxygen flow, because it refills partly with room air.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-g-3-b\">I.A.2.g.3.b Non-Circle Systems<\/a> · <a href=\"#i-a-2-g-4\">I.A.2.g.4 Oxygen Supply Systems: FiO2<\/a> · <a href=\"#i-a-2-g-2\">I.A.2.g.2 Components<\/a> · <a href=\"#i-a-2-k\">I.A.2.k Alarms and Safety Features<\/a><\/p>","b":"A self-inflating bag refills through its own intake valve, so it works with no gas supply at all. With an oxygen reservoir and high oxygen flow it delivers close to 100% oxygen, and without one much less. A flow-inflating bag, such as a Mapleson C or Jackson-Rees, needs fresh gas to fill but lets you feel lung compliance and give CPAP and free-flow oxygen. A non-rebreathing valve sends each breath to the patient and vents exhaled gas to the room.","u":"2026-11-05"},"I.A.2.g.3.d":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> CO2 absorbents neutralize carbonic acid with a hydroxide base. Water is needed for the reaction, which in turn makes heat and water. A pH indicator changes color as the base is used up, but color is unreliable; inspired CO2 above zero on the capnogram is the real sign of exhaustion. Modern absorbents contain little or no strong base (sodium or potassium hydroxide), which reduces their reactions with volatile agents.<\/p><h3 class=\"nb-h\">Chemistry of soda lime<\/h3><ol><li>CO2 + H2O → H2CO3<\/li><li>H2CO3 + 2 NaOH → Na2CO3 + 2 H2O + heat<\/li><li>Na2CO3 + Ca(OH)2 → CaCO3 + 2 NaOH<\/li><\/ol><ul><li>Calcium hydroxide is the main absorber. Sodium hydroxide speeds the reaction and is regenerated in step 3.<\/li><li>Water, about 15% of soda lime, is essential because the reaction takes place in solution. Dry absorbent takes up CO2 poorly and reacts with volatile agents (see <a href=\"#i-a-2-g-3-e\">I.A.2.g.3.e<\/a>).<\/li><li>The reaction is exothermic, so a working canister is warm and adds water to the circuit.<\/li><\/ul><h3 class=\"nb-h\">Absorbent types<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Absorbent<\/th><th scope=\"col\">Composition<\/th><th scope=\"col\">Reactions with volatile agents<\/th><th scope=\"col\">Notes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Soda lime<\/th><td>Mostly calcium hydroxide, with water and a little sodium hydroxide; older types also had potassium hydroxide<\/td><td>Yes, more when dry: compound A with sevoflurane, carbon monoxide with desflurane<\/td><td>Modern versions have little or no potassium hydroxide<\/td><\/tr><tr><th scope=\"row\">Barium hydroxide lime (Baralyme)<\/th><td>Barium hydroxide and calcium hydroxide<\/td><td>The most reactive; fires with dry absorbent and sevoflurane<\/td><td>Withdrawn from the US market<\/td><\/tr><tr><th scope=\"row\">Calcium hydroxide lime (for example Amsorb)<\/th><td>Calcium hydroxide with calcium chloride, no strong base<\/td><td>Little or none<\/td><td>Somewhat lower capacity<\/td><\/tr><tr><th scope=\"row\">Lithium hydroxide-based<\/th><td>Lithium hydroxide, no strong base<\/td><td>Little or none<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Indicator<\/h3><ul><li>Ethyl violet is colorless above pH 10.3 and turns purple as the base is used up.<\/li><li>The color is unreliable. Purple granules can fade back to white after resting without regaining much capacity, and light can bleach the dye, so exhausted absorbent may look fresh.<\/li><li>Rely on the capnogram (inspired CO2 above zero, rising end-tidal CO2) and change the absorbent as the manufacturer directs.<\/li><\/ul><h3 class=\"nb-h\">Canisters and efficiency<\/h3><ul><li>Granules are 4 to 8 mesh (the number of openings per inch of the sieve), a compromise: smaller granules absorb better but resist flow more.<\/li><li>About half of a packed canister is space between granules. That space should at least equal the patient's tidal volume, so each breath meets fresh absorbent.<\/li><li>Channeling: gas takes the easiest path, along the walls or through loosely packed areas, bypasses much of the absorbent and exhausts it early. Proper packing, baffles and prefilled cartridges prevent it.<\/li><li>More exhaled gas passes through the canister at low fresh gas flows, so absorbent is used up faster.<\/li><li>Older machines had two canisters in series; most modern machines use one prefilled canister, and some allow it to be changed during a case.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> white granules do not prove the absorbent is working. The dye can fade back after rest or be bleached by light, so rely on inspired CO2 on the capnogram.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-g-3-e\">I.A.2.g.3.e Toxicity: Compound A, Carbon Monoxide<\/a> · <a href=\"#i-a-2-g-3-a\">I.A.2.g.3.a Circle Systems: Closed and Semi-Closed<\/a> · <a href=\"#i-a-2-g-1\">I.A.2.g.1 Principles<\/a> · <a href=\"#i-a-2-h-3\">I.A.2.h.3 Gas Concentrations<\/a><\/p>","b":"CO2 absorbents neutralize carbonic acid with a hydroxide base. Water is needed for the reaction, which in turn makes heat and water. A pH indicator changes color as the base is used up, but color is unreliable; inspired CO2 above zero on the capnogram is the real sign of exhaustion. Modern absorbents contain little or no strong base (sodium or potassium hydroxide), which reduces their reactions with volatile agents.","u":"2026-11-05"},"I.A.2.g.3.e":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Strong bases in CO2 absorbents break down volatile agents. Sevoflurane forms compound A, most at low fresh gas flow; desflurane, and less so enflurane and isoflurane, form carbon monoxide when the absorbent has dried out. Absorbents without strong bases largely avoid both.<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Product<\/th><th scope=\"col\">Agent<\/th><th scope=\"col\">What increases it<\/th><th scope=\"col\">Effect<\/th><th scope=\"col\">Prevention<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Compound A (a vinyl ether)<\/th><td>Sevoflurane<\/td><td>Low fresh gas flow, high sevoflurane concentration, long exposure, a warm absorbent, strong bases (potassium more than sodium hydroxide)<\/td><td>Kidney injury in rats; in people only transient markers, with no clinically significant injury shown<\/td><td>Follow the label's flow and MAC-hour limits (quoted in <a href=\"#i-a-4-b-7\">I.A.4.b.7<\/a>); use absorbents without strong bases<\/td><\/tr><tr><th scope=\"row\">Carbon monoxide<\/th><td>Desflurane most, then enflurane and isoflurane; very little from sevoflurane or halothane<\/td><td>Dry absorbent, strong bases (worst with barium hydroxide lime), higher temperature and agent concentration<\/td><td>Carboxyhemoglobin, which standard pulse oximetry misses<\/td><td>Turn off fresh gas when the machine is idle; replace absorbent that may be dry; use absorbents without strong bases<\/td><\/tr><tr><th scope=\"row\">Heat and fire<\/th><td>Sevoflurane<\/td><td>Dry barium hydroxide lime<\/td><td>Canister temperatures high enough to cause fires and airway burns<\/td><td>Barium hydroxide lime was withdrawn from the US market<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Carbon monoxide in practice<\/h3><ul><li>Desflurane, enflurane and isoflurane share a difluoromethoxy group, the source of the carbon monoxide; sevoflurane and halothane lack it.<\/li><li>Classic scenario: the first case on a Monday, after fresh gas ran through the machine all weekend and dried out the absorbent.<\/li><li>Standard pulse oximetry reads carboxyhemoglobin as oxyhemoglobin, so SpO2 stays normal; co-oximetry measures it (see <a href=\"#i-a-2-h-5\">I.A.2.h.5<\/a>). Standard anesthetic gas monitors do not measure carbon monoxide.<\/li><li>Clues to dry absorbent: an unusually hot canister, and inspired agent that rises more slowly than expected at induction because the absorbent is taking it up.<\/li><\/ul><h3 class=\"nb-h\">Compound A in practice<\/h3><ul><li>Concentrations rise as fresh gas flow falls, because more gas is rebreathed through the warm absorbent.<\/li><li>Absorbents without strong bases produce little or none.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> carbon monoxide from dry absorbent does not lower the pulse oximeter reading. Suspect it after a machine has had gas flowing through it while idle, and check co-oximetry.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-g-3-d\">I.A.2.g.3.d CO2 Absorption<\/a> · <a href=\"#i-a-4-b-7\">I.A.4.b.7 Effects on Renal Function<\/a> · <a href=\"#i-a-4-b-10\">I.A.4.b.10 Biotransformation and Toxicity<\/a> · <a href=\"#i-a-2-h-5\">I.A.2.h.5 Oxygen: Oximetry, Co-Oximetry, Pulse Oximetry<\/a><\/p>","b":"Strong bases in CO2 absorbents break down volatile agents. Sevoflurane forms compound A, most at low fresh gas flow; desflurane, and less so enflurane and isoflurane, form carbon monoxide when the absorbent has dried out. Absorbents without strong bases largely avoid both.","u":"2026-11-05"},"I.A.2.g.4":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Most hospitals store oxygen as a liquid in a bulk tank and pipe it as a gas at about 50 psi, with reserve tanks or cylinder banks and an E cylinder on each anesthesia machine as backup. Outside the anesthesia circuit, the FiO2 a patient gets depends on the device: fixed-performance devices deliver a set FiO2 however the patient breathes, while variable-performance devices let the patient draw in room air, more of it the harder they breathe.<\/p><h3 class=\"nb-h\">Central supply<\/h3><ul><li>Bulk oxygen is stored as a liquid, below its critical temperature of −119 °C, in an insulated tank. One liter of liquid makes about 860 L of gas.<\/li><li>It evaporates, is warmed and is regulated to about 50 psi in the pipeline, which runs to wall outlets with gas-specific connectors.<\/li><li>Reserve supply: a second liquid tank or banks of large H cylinders (about 6,900 L each).<\/li><li>Oxygen concentrators use pressure-swing adsorption: a zeolite sieve holds back nitrogen, giving about 90 to 96% oxygen with argon making up most of the rest. At low flows in a circle, argon can build up and lower inspired oxygen.<\/li><li>Pipeline failures: low pressure sets off the alarm, so open the machine's oxygen cylinder. A crossed or contaminated pipeline is detected only by the oxygen analyzer: open the cylinder and disconnect the pipeline hose (see <a href=\"#i-a-2-a-2\">I.A.2.a.2<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Oxygen delivery devices<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Device<\/th><th scope=\"col\">Oxygen flow<\/th><th scope=\"col\">Approximate FiO2<\/th><th scope=\"col\">Performance<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Nasal cannula<\/th><td>1 to 6 L/min<\/td><td>About 24 to 44%, roughly 4% per L/min<\/td><td>Variable<\/td><\/tr><tr><th scope=\"row\">Simple face mask<\/th><td>5 to 10 L/min, at least 5 to wash out CO2<\/td><td>About 35 to 55%<\/td><td>Variable<\/td><\/tr><tr><th scope=\"row\">Nonrebreathing mask with reservoir<\/th><td>10 to 15 L/min<\/td><td>Often quoted as 60 to 90%; lower when the patient breathes hard<\/td><td>Variable<\/td><\/tr><tr><th scope=\"row\">Venturi (air-entrainment) mask<\/th><td>Set for each color-coded jet<\/td><td>24 to 60%, steady<\/td><td>Fixed<\/td><\/tr><tr><th scope=\"row\">High-flow nasal cannula<\/th><td>Up to 60 L/min, heated and humidified<\/td><td>21 to 100%, set on a blender<\/td><td>Fixed while flow exceeds the patient's inspiratory flow<\/td><\/tr><tr><th scope=\"row\">Anesthesia circuit with a sealed mask, supraglottic airway or tube<\/th><td>Fresh gas flow<\/td><td>Up to 100%, measured by the oxygen analyzer<\/td><td>Fixed<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Why performance varies<\/h3><ul><li>Peak inspiratory flow is roughly 30 L/min in a resting adult and several times higher in respiratory distress. When a device supplies less than this, the patient draws in room air and FiO2 falls.<\/li><li>Fixed-performance devices supply a total flow at or above inspiratory flow, either by entraining a set proportion of air (Venturi) or by delivering a high blended flow (high-flow nasal cannula).<\/li><\/ul><h3 class=\"nb-h\">Mixing calculations<\/h3><ul><li>Air and oxygen: FiO2 = (oxygen flow + 0.21 × air flow) ÷ total flow. 1 L/min of oxygen plus 1 L/min of air gives (1 + 0.21) ÷ 2, about 60%; 1 L/min of oxygen plus 3 L/min of air gives (1 + 0.63) ÷ 4, about 41%.<\/li><li>Venturi entrainment: air-to-oxygen ratio = (100 − FiO2) ÷ (FiO2 − 21), with FiO2 in percent. For 40%, the ratio is 60 ÷ 19, about 3:1, so 8 L/min of oxygen gives a total flow of about 33 L/min. For 24%, the ratio is about 25:1.<\/li><\/ul><h3 class=\"nb-h\">Monitoring<\/h3><ul><li>The machine's oxygen analyzer sits in the breathing circuit with a low-oxygen alarm. It is the only device that detects a wrong gas in the oxygen supply (how analyzers work: <a href=\"#i-a-2-h-3\">I.A.2.h.3<\/a>).<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a nonrebreathing mask does not deliver a fixed 100%. A patient who breathes fast draws room air around the mask and through its ports, so the real FiO2 can be far lower than expected.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-a-2\">I.A.2.a.2 Transducers, Regulators, Medical Gas Cylinders<\/a> · <a href=\"#i-a-2-c-3\">I.A.2.c.3 Critical Temperature, Critical Pressure<\/a> · <a href=\"#i-a-2-b-1\">I.A.2.b.1 Viscosity-Density, Laminar-Turbulent Flow<\/a> · <a href=\"#i-a-2-g-6\">I.A.2.g.6 Safety Features<\/a> · <a href=\"#i-a-2-h-3\">I.A.2.h.3 Gas Concentrations<\/a><\/p>","b":"Most hospitals store oxygen as a liquid in a bulk tank and pipe it as a gas at about 50 psi, with reserve tanks or cylinder banks and an E cylinder on each anesthesia machine as backup. Outside the anesthesia circuit, the FiO2 a patient gets depends on the device: fixed-performance devices deliver a set FiO2 however the patient breathes, while variable-performance devices let the patient draw in room air, more of it the harder they breathe.","u":"2026-11-05"},"I.A.2.g.5":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> A scavenging system collects the excess gas leaving the APL valve and the ventilator's relief valve and carries it out of the operating room. Its key part is the interface, which protects the breathing circuit from both positive pressure, if the disposal line blocks, and negative pressure, if suction is too strong. Exposure limits and work habits are in <a href=\"#i-a-4-b-12\">I.A.4.b.12<\/a>.<\/p><h3 class=\"nb-h\">The five parts<\/h3><ol><li>Gas-collecting assembly: captures gas at the APL valve and the ventilator relief valve.<\/li><li>Transfer tubing: 19 mm or 30 mm hoses, deliberately unlike breathing system connectors.<\/li><li>Interface: protects the circuit from pressure swings (below).<\/li><li>Gas-disposal tubing: carries gas from the interface to the disposal assembly.<\/li><li>Gas-disposal assembly: active (hospital suction) or passive (the room's exhaust ventilation or a duct to the outside).<\/li><\/ol><h3 class=\"nb-h\">Open and closed interfaces<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Interface<\/th><th scope=\"col\">How it works<\/th><th scope=\"col\">Protection<\/th><th scope=\"col\">Notes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Open<\/th><td>A reservoir canister open to the room through relief ports, with suction drawing gas out; no valves<\/td><td>Pressure cannot build up or fall far, because the canister is open to the room<\/td><td>Needs active suction; if suction draws less than the waste flow, gas spills into the room<\/td><\/tr><tr><th scope=\"row\">Closed, passive<\/th><td>Open to the room only through a positive-pressure relief valve<\/td><td>The valve opens at about 5 cm H2O if the outflow is blocked<\/td><td>No suction; the patient's exhaled gas pressure drives flow<\/td><\/tr><tr><th scope=\"row\">Closed, active<\/th><td>Adds a negative-pressure relief valve and a reservoir bag<\/td><td>The negative-pressure valve opens at about −0.5 cm H2O and lets in room air if suction is too strong; the positive-pressure valve still guards against blockage<\/td><td>Set suction so the reservoir bag is neither collapsed nor overdistended<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Hazards<\/h3><ul><li>A blocked or kinked hose between the breathing system and the interface backs pressure up into the circuit and can cause barotrauma. The interface's relief valves lie downstream of this segment and cannot help.<\/li><li>Excess suction through a closed interface whose negative-pressure valve fails pulls negative pressure on the breathing circuit: the reservoir bag collapses and room air can be drawn in.<\/li><li>The scavenging hose can be misconnected to a breathing system port.<\/li><li>A failed or disconnected scavenger spills gas into the room, often noticed as a smell of agent.<\/li><li>Side-stream gas analyzers draw roughly 50 to 250 mL/min of sampled gas. Their exhaust must go back to the breathing circuit or to the scavenger.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> the dangerous kink is in the transfer hose between the APL valve and the interface, because the interface's relief valves sit downstream of it and cannot vent the pressure.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-12\">I.A.4.b.12 Trace Concentrations, OR Pollution, Personnel Hazards<\/a> · <a href=\"#i-a-2-g-2\">I.A.2.g.2 Components<\/a> · <a href=\"#i-a-2-g-6\">I.A.2.g.6 Safety Features<\/a> · <a href=\"#i-a-4-b-14\">I.A.4.b.14 Environmental Implications<\/a><\/p>","b":"A scavenging system collects the excess gas leaving the APL valve and the ventilator's relief valve and carries it out of the operating room. Its key part is the interface, which protects the breathing circuit from both positive pressure, if the disposal line blocks, and negative pressure, if suction is too strong. Exposure limits and work habits are in I.A.4.b.12.","u":"2026-11-05"},"I.A.2.g.6":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Three features guard against a hypoxic fresh gas mixture. Oxygen pressure failure devices sound an alarm and cut or reduce other gases when oxygen supply pressure falls; the proportioning system keeps oxygen at about 25% or more of an oxygen and nitrous oxide mixture; and the oxygen flowmeter sits last in line, so a leak upstream loses other gases rather than oxygen. None of them detects a wrong gas in the oxygen pipeline, a third gas diluting the oxygen, or a leak downstream of the flowmeters. The oxygen analyzer does.<\/p><h3 class=\"nb-h\">Oxygen pressure failure devices (the fail-safe)<\/h3><ul><li>An alarm sounds when oxygen supply pressure falls below a set threshold.<\/li><li>A pressure-sensing valve in the supply line of each other gas (nitrous oxide, and air on some machines) either shuts that gas off below a threshold oxygen pressure or reduces its flow in proportion to the falling oxygen pressure, depending on the design.<\/li><li>These devices respond to oxygen pressure, not to oxygen flow or concentration. They cannot detect a non-oxygen gas in the oxygen pipeline, which arrives at normal pressure.<\/li><\/ul><h3 class=\"nb-h\">Proportioning systems<\/h3><ul><li>Mechanical: a chain links the nitrous oxide and oxygen flow control knobs (for example the Link-25 system), so turning up nitrous oxide turns up oxygen too and the mixture stays at about 25% oxygen or more.<\/li><li>Pneumatic: a valve senses the oxygen and nitrous oxide flows and limits nitrous oxide to keep oxygen at about 23 to 25% (for example Dräger's oxygen ratio controllers).<\/li><li>Electronic machines enforce the ratio in software, and many deliver a minimum oxygen flow whenever the machine is on.<\/li><li>Limits: a wrong gas in the oxygen supply, a leak downstream of the flow control valves, a third gas such as helium diluting the mixture, and mechanical or pneumatic faults.<\/li><\/ul><h3 class=\"nb-h\">Flowmeter (rotameter) order<\/h3><ul><li>The oxygen flowmeter sits downstream of the others, nearest the outlet to the common manifold. If an upstream tube for air or nitrous oxide leaks, mostly that gas is lost, not oxygen.<\/li><li>With oxygen upstream, a leak in a downstream tube would lose oxygen preferentially and could produce a hypoxic mixture.<\/li><li>A leak in the oxygen tube itself can still cause a hypoxic mixture, whatever the order.<\/li><\/ul><h3 class=\"nb-h\">Other safeguards<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Feature<\/th><th scope=\"col\">What it prevents<\/th><th scope=\"col\">Blind spot<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Pin Index and Diameter Index Safety Systems<\/th><td>Wrong cylinder or hose on the machine<\/td><td>Adapters, damaged pins, crossed pipelines in the wall<\/td><\/tr><tr><th scope=\"row\">Minimum oxygen flow while the machine is on<\/th><td>Oxygen turned off completely<\/td><td>Does not guarantee an adequate FiO2<\/td><\/tr><tr><th scope=\"row\">Vaporizer interlock<\/th><td>Two vaporizers on at once<\/td><td>The wrong agent in a vaporizer<\/td><\/tr><tr><th scope=\"row\">Pipeline and cylinder pressure gauges<\/th><td>Unnoticed loss of supply<\/td><td>They show pressure, not which gas<\/td><\/tr><tr><th scope=\"row\">Oxygen analyzer with low-oxygen alarm<\/th><td>Any hypoxic inspired mixture<\/td><td>Must be calibrated, with its alarm on<\/td><\/tr><\/tbody><\/table><\/div><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> the fail-safe and proportioning systems watch oxygen pressure and flow, not oxygen concentration. With nitrous oxide or nitrogen in the oxygen pipeline every device reads normal, and only the inspired oxygen analyzer alarms.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-b-2\">I.A.2.b.2 Flowmeters: Rotameter<\/a> · <a href=\"#i-a-2-a-2\">I.A.2.a.2 Transducers, Regulators, Medical Gas Cylinders<\/a> · <a href=\"#i-a-2-g-4\">I.A.2.g.4 Oxygen Supply Systems: FiO2<\/a> · <a href=\"#i-a-2-k\">I.A.2.k Alarms and Safety Features<\/a> · <a href=\"#i-a-2-e-2\">I.A.2.e.2 Vaporizer Types and Safety Features<\/a><\/p>","b":"Three features guard against a hypoxic fresh gas mixture. Oxygen pressure failure devices sound an alarm and cut or reduce other gases when oxygen supply pressure falls; the proportioning system keeps oxygen at about 25% or more of an oxygen and nitrous oxide mixture; and the oxygen flowmeter sits last in line, so a leak upstream loses other gases rather than oxygen. None of them detects a wrong gas in the oxygen pipeline, a third gas diluting the oxygen, or a leak downstream of the flowmeters. The oxygen analyzer does.","u":"2026-11-05"},"I.A.2.h":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> The ASA's basic monitoring standards require qualified anesthesia personnel in the room throughout every anesthetic and continual evaluation of oxygenation, ventilation, circulation and temperature. Each monitor turns a physical signal into a number by a known principle, and each principle fails in predictable ways; knowing them tells you when to trust the number.<\/p><h3 class=\"nb-h\">ASA basic monitoring standards <span class=\"nb-cite\">(<a href=\"https://www.asahq.org/standards-and-practice-parameters/standards-for-basic-anesthetic-monitoring\" target=\"_blank\" rel=\"noopener\">ASA standards, last amended October 15, 2025<\/a>)<\/span><\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Function<\/th><th scope=\"col\">What the standard requires<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Personnel<\/th><td>Qualified anesthesia personnel in the room throughout all general anesthetics, regional anesthetics and monitored anesthesia care<\/td><\/tr><tr><th scope=\"row\">Oxygenation<\/th><td>During general anesthesia with an anesthesia machine, an oxygen analyzer in the breathing system with a low-oxygen alarm; pulse oximetry with an audible variable-pitch pulse tone and low-threshold alarm<\/td><\/tr><tr><th scope=\"row\">Ventilation<\/th><td>Continual end-tidal CO2 analysis by a quantitative method such as capnography from placement of a tracheal tube or supraglottic airway, with an audible alarm; during mechanical ventilation, a disconnection monitor with an audible alarm<\/td><\/tr><tr><th scope=\"row\">Circulation<\/th><td>ECG continuously displayed; blood pressure and heart rate at least every 5 minutes; during general anesthesia, also at least one of pulse palpation, heart sounds, an arterial pressure tracing, ultrasound pulse monitoring, or pulse plethysmography or oximetry<\/td><\/tr><tr><th scope=\"row\">Temperature<\/th><td>Monitored when clinically significant changes in body temperature are intended, anticipated or suspected<\/td><\/tr><\/tbody><\/table><\/div><ul><li>During moderate or deep sedation, the standard asks that every effort be made to monitor exhaled CO2 continually.<\/li><li>Items marked with an asterisk in the standard can be waived under extenuating circumstances.<\/li><\/ul><h3 class=\"nb-h\">Judging any monitor<\/h3><ul><li>Each has a sensor, signal processing and a display with alarms. Errors can enter at every step: a misplaced sensor, motion or electrical interference, averaging that hides fast changes, and alarm limits set too wide or silenced.<\/li><li>Know what each monitor is compared against, such as arterial blood gases for pulse oximetry, an arterial line for cuff pressure and PaCO2 for end-tidal CO2, and what widens the gap.<\/li><li>Monitors only warn. The outcome depends on a clinician who notices and acts.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a normal SpO2 does not prove adequate ventilation, especially with supplemental oxygen. PaCO2 can rise dangerously before saturation falls, which is why end-tidal CO2 is required as well.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-h-3\">I.A.2.h.3 Gas Concentrations<\/a> · <a href=\"#i-a-2-h-5\">I.A.2.h.5 Oxygen: Oximetry, Co-Oximetry, Pulse Oximetry<\/a> · <a href=\"#i-a-2-i\">I.A.2.i Instrumentation<\/a> · <a href=\"#i-a-2-k\">I.A.2.k Alarms and Safety Features<\/a><\/p>","b":"The ASA's basic monitoring standards require qualified anesthesia personnel in the room throughout every anesthetic and continual evaluation of oxygenation, ventilation, circulation and temperature. Each monitor turns a physical signal into a number by a known principle, and each principle fails in predictable ways; knowing them tells you when to trust the number.","u":"2026-11-05"},"I.A.2.h.1":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Clinical signs, and judging fade by eye or touch, cannot rule out residual block. The 2023 ASA guideline recommends quantitative monitoring at the adductor pollicis and a train-of-four (TOF) ratio of at least 0.9 before extubation. A nerve stimulator delivers a supramaximal current in set patterns, and acceleromyography or electromyography measures the response.<\/p><h3 class=\"nb-h\">The 2023 ASA guideline <span class=\"nb-cite\">(<a href=\"https://doi.org/10.1097/ALN.0000000000004379\" target=\"_blank\" rel=\"noopener\">Thilen 2023<\/a>)<\/span><\/h3><ul><li>Do not rely on clinical assessment alone, such as head lift, grip strength or tidal volume; it is insensitive.<\/li><li>Prefer quantitative monitoring to qualitative (subjective) assessment.<\/li><li>Confirm a TOF ratio of at least 0.9 before extubation.<\/li><li>Monitor the adductor pollicis, not the eye muscles.<\/li><li>For rocuronium or vecuronium, sugammadex is recommended over neostigmine at deep, moderate and shallow depths of block; neostigmine is a reasonable alternative at minimal depth (drug details in <a href=\"#i-a-4-e-7\">I.A.4.e.7<\/a>).<\/li><li>For atracurium or cisatracurium with only qualitative assessment, it suggests neostigmine at minimal depth and at least 10 minutes from antagonism to extubation.<\/li><\/ul><h3 class=\"nb-h\">The stimulus<\/h3><ul><li>Supramaximal, comfortably above the current that recruits every nerve fiber (often 50 to 60 mA in adults), with each pulse lasting 0.1 to 0.3 ms.<\/li><li>Ulnar nerve at the wrist: two electrodes along the nerve, a few centimeters apart, with the negative (black) electrode distal. The thumb adducts (adductor pollicis).<\/li><li>Electrodes over a muscle rather than its nerve stimulate the muscle directly, producing twitches even during deep block. This is a classic error with facial electrodes.<\/li><\/ul><h3 class=\"nb-h\">Stimulation patterns<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Pattern<\/th><th scope=\"col\">How it is given<\/th><th scope=\"col\">Use<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Single twitch<\/th><td>One stimulus at 0.1 to 1 Hz<\/td><td>Needs a baseline taken before the relaxant<\/td><\/tr><tr><th scope=\"row\">Train-of-four (TOF)<\/th><td>Four stimuli at 2 Hz, with trains at least 10 seconds apart<\/td><td>The count (0 to 4) grades moderate block; the ratio of the fourth to the first twitch grades recovery<\/td><\/tr><tr><th scope=\"row\">Tetanus<\/th><td>50 Hz for 5 seconds<\/td><td>Fade shows nondepolarizing block; painful when awake<\/td><\/tr><tr><th scope=\"row\">Post-tetanic count (PTC)<\/th><td>Tetanus, a 3-second pause, then single twitches at 1 Hz; count the responses<\/td><td>Grades deep block when the TOF count is zero; repeat only every few minutes, because tetanus itself speeds local recovery<\/td><\/tr><tr><th scope=\"row\">Double-burst stimulation (DBS)<\/th><td>Two short 50 Hz bursts 750 ms apart<\/td><td>Fade is easier to feel than with TOF but is still missed above a ratio of about 0.6<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Depth of block (commonly used definitions)<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Depth<\/th><th scope=\"col\">Finding<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Intense<\/th><td>PTC 0<\/td><\/tr><tr><th scope=\"row\">Deep<\/th><td>PTC 1 or more, TOF count 0<\/td><\/tr><tr><th scope=\"row\">Moderate<\/th><td>TOF count 1 to 3<\/td><\/tr><tr><th scope=\"row\">Shallow<\/th><td>TOF count 4, ratio below 0.4<\/td><\/tr><tr><th scope=\"row\">Minimal<\/th><td>TOF ratio 0.4 to below 0.9<\/td><\/tr><tr><th scope=\"row\">Acceptable recovery<\/th><td>TOF ratio 0.9 or more<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Nondepolarizing versus depolarizing block<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Response<\/th><th scope=\"col\">Nondepolarizing<\/th><th scope=\"col\">Succinylcholine, phase I<\/th><th scope=\"col\">Phase II<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">TOF and tetanic fade<\/th><td>Yes<\/td><td>No; all twitches fall equally<\/td><td>Yes<\/td><\/tr><tr><th scope=\"row\">Post-tetanic potentiation<\/th><td>Yes<\/td><td>No<\/td><td>Yes<\/td><\/tr><tr><th scope=\"row\">Cholinesterase inhibitor<\/th><td>Antagonizes<\/td><td>Prolongs<\/td><td>Variable<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Muscles differ<\/h3><ul><li>Central muscles (diaphragm, larynx, corrugator supercilii and other facial muscles) have more blood flow and resist block more. Onset is faster and recovery earlier than at the thumb.<\/li><li>So the eye can look recovered while the thumb, and the pharynx, are still weak. Eye monitoring overestimates recovery.<\/li><li>Pharyngeal muscles are among the most sensitive. Residual block impairs swallowing and airway protection even at TOF ratios of 0.7 to 0.9, raising the risk of aspiration and hypoxemia.<\/li><li>When the arms are not available, the posterior tibial nerve (big toe flexion) is an alternative.<\/li><\/ul><h3 class=\"nb-h\">Quantitative monitors<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Monitor<\/th><th scope=\"col\">What it measures<\/th><th scope=\"col\">Notes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Acceleromyography<\/th><td>Acceleration of the thumb (force = mass × acceleration)<\/td><td>Common and portable; the thumb must move freely; baseline TOF ratios often exceed 1.0, so normalizing to a value taken before the relaxant is advised<\/td><\/tr><tr><th scope=\"row\">Electromyography<\/th><td>Compound muscle action potential over the adductor pollicis or hypothenar muscles<\/td><td>Works with the hand tucked; affected by electrocautery and electrode position<\/td><\/tr><tr><th scope=\"row\">Mechanomyography<\/th><td>Isometric force of thumb adduction<\/td><td>The research reference standard; bulky<\/td><\/tr><\/tbody><\/table><\/div><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> four twitches with no fade you can see or feel does not mean recovery. Fade becomes undetectable to the senses at a TOF ratio of about 0.4, far below the 0.9 needed before extubation.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-e\">I.A.4.e Muscle Relaxants (Depolarizing, Non-Depolarizing)<\/a> · <a href=\"#i-a-4-e-7\">I.A.4.e.7 Antagonism of Blockade<\/a> · <a href=\"#i-b-7-e\">I.B.7.e Neuromuscular Consequences: Residual Paralysis<\/a> · <a href=\"#i-c-8\">I.C.8 Anatomy and Physiology of Neuromuscular Junction<\/a><\/p>","b":"Clinical signs, and judging fade by eye or touch, cannot rule out residual block. The 2023 ASA guideline recommends quantitative monitoring at the adductor pollicis and a train-of-four (TOF) ratio of at least 0.9 before extubation. A nerve stimulator delivers a supramaximal current in set patterns, and acceleromyography or electromyography measures the response.","u":"2026-11-05"},"I.A.2.h.2":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Ventilation monitors measure flow and volume (respirometers and flow sensors), pressure (airway pressure, negative inspiratory force) and the relation between them (spirometry and pressure-volume and flow-volume loops). Flow-volume loops tell fixed, variable extrathoracic and variable intrathoracic obstruction apart, and inspiratory force and vital capacity gauge respiratory muscle strength.<\/p><h3 class=\"nb-h\">Measuring flow and volume<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Device<\/th><th scope=\"col\">Principle<\/th><th scope=\"col\">Notes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Vane respirometer (Wright)<\/th><td>Gas spins a light vane and the turns are counted<\/td><td>Reads one direction only; under-reads at low flows and over-reads at high flows because of the vane's inertia<\/td><\/tr><tr><th scope=\"row\">Pneumotachograph<\/th><td>Pressure drop across a known resistance, or across a pitot tube facing the flow, is converted to flow<\/td><td>Common at the Y-piece; moisture and gas composition affect it<\/td><\/tr><tr><th scope=\"row\">Hot-wire anemometer<\/th><td>Flowing gas cools a heated wire; the current needed to keep it hot tracks flow<\/td><td>Used in many ventilators; must be compensated for gas composition<\/td><\/tr><tr><th scope=\"row\">Ultrasonic flowmeter<\/th><td>Ultrasound travels faster with the flow than against it<\/td><td>Accurate and little affected by gas composition<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Volume measured near the machine includes gas that compressed in the tubing, so it overestimates what the patient received. Sensors at the Y-piece measure what reaches the patient.<\/li><li>Peak and plateau airway pressures, compliance and the related alarms are in <a href=\"#i-a-2-j-3\">I.A.2.j.3<\/a>.<\/li><\/ul><h3 class=\"nb-h\">Respiratory muscle strength and readiness to wean<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Test<\/th><th scope=\"col\">How it is done<\/th><th scope=\"col\">Commonly used threshold<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Negative inspiratory force (maximal inspiratory pressure)<\/th><td>Maximal inspiratory effort against an occluded airway, usually through a one-way valve that allows exhalation only<\/td><td>More negative than about −20 to −30 cm H2O<\/td><\/tr><tr><th scope=\"row\">Vital capacity<\/th><td>Maximal exhalation after a maximal inspiration<\/td><td>At least 10 to 15 mL/kg (normal about 65 to 75 mL/kg)<\/td><\/tr><tr><th scope=\"row\">Rapid shallow breathing index<\/th><td>Breathing rate ÷ tidal volume in liters during spontaneous breathing<\/td><td>Below about 105 favors successful weaning<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Spirometry<\/h3><ul><li>Spirometry measures tidal volume, vital capacity and the inspiratory and expiratory reserve volumes. Residual volume, and so FRC and total lung capacity, need helium dilution, nitrogen washout or body plethysmography.<\/li><li>Obstruction: FEV1/FVC below about 0.7. Restriction: FEV1 and FVC both reduced with a normal or high ratio, confirmed by a low total lung capacity.<\/li><li>Mid-expiratory flow (FEF25–75) is a sensitive marker of small-airway disease.<\/li><\/ul><h3 class=\"nb-h\">Flow-volume loops<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Pattern<\/th><th scope=\"col\">Inspiratory limb<\/th><th scope=\"col\">Expiratory limb<\/th><th scope=\"col\">Examples<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Fixed upper airway obstruction<\/th><td>Flattened<\/td><td>Flattened<\/td><td>Tracheal stenosis, a rigid narrowing from tumor or scar<\/td><\/tr><tr><th scope=\"row\">Variable extrathoracic obstruction<\/th><td>Flattened<\/td><td>Normal<\/td><td>Vocal cord paralysis, laryngeal tumor<\/td><\/tr><tr><th scope=\"row\">Variable intrathoracic obstruction<\/th><td>Normal<\/td><td>Flattened<\/td><td>Intrathoracic tracheal tumor, tracheomalacia, mediastinal mass<\/td><\/tr><tr><th scope=\"row\">Obstructive lung disease<\/th><td>Near normal<\/td><td>Scooped (concave), low peak flow<\/td><td>Asthma, COPD<\/td><\/tr><tr><th scope=\"row\">Restrictive lung disease<\/th><td>Small but normally shaped<\/td><td>Small, normally shaped, tall and narrow<\/td><td>Fibrosis, chest wall disease<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Loops on the anesthesia monitor<\/h3><ul><li>Pressure-volume loop: the slope is compliance, and a wider loop means more resistance. A flattened \"beak\" at the top suggests overdistension.<\/li><li>A loop that does not close, with exhaled volume smaller than inspired, means a leak.<\/li><li>Expiratory flow that has not returned to zero before the next breath means gas trapping (auto-PEEP).<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a variable extrathoracic obstruction flattens the inspiratory limb and a variable intrathoracic one flattens the expiratory limb. Pressure inside the extrathoracic trachea falls below atmospheric on inspiration, while positive pleural pressure squeezes the intrathoracic trachea on forced expiration.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-c-2-a-1-b\">I.C.2.a.1.b Spirometry; Static and Dynamic Volumes<\/a> · <a href=\"#i-c-2-a-2-a\">I.C.2.a.2.a Static and Dynamic Compliance, Flow-Volume Loops<\/a> · <a href=\"#i-a-2-j-3\">I.A.2.j.3 Monitors<\/a> · <a href=\"#i-a-2-b-1\">I.A.2.b.1 Viscosity-Density, Laminar-Turbulent Flow<\/a><\/p>","b":"Ventilation monitors measure flow and volume (respirometers and flow sensors), pressure (airway pressure, negative inspiratory force) and the relation between them (spirometry and pressure-volume and flow-volume loops). Flow-volume loops tell fixed, variable extrathoracic and variable intrathoracic obstruction apart, and inspiratory force and vital capacity gauge respiratory muscle strength.","u":"2026-11-05"},"I.A.2.h.3":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Gas monitoring shows what the patient breathes in and out: inspired oxygen (the last defense against a hypoxic mixture), end-tidal CO2 (ventilation, circulation and tube position), nitrogen (washout and air embolism) and agent concentrations (depth and vaporizer function). The measuring techniques, such as infrared absorption, are in <a href=\"#i-a-2-i-2\">I.A.2.i.2<\/a>.<\/p><h3 class=\"nb-h\">Oxygen analyzers<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Type<\/th><th scope=\"col\">Principle<\/th><th scope=\"col\">Notes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Galvanic (fuel cell)<\/th><td>Oxygen is reduced at a cathode, generating a current proportional to its partial pressure<\/td><td>Slow, not breath by breath; the cell is used up over months; calibrate to room air<\/td><\/tr><tr><th scope=\"row\">Polarographic (Clark electrode)<\/th><td>An applied voltage drives oxygen reduction at a platinum cathode; the current is proportional to partial pressure<\/td><td>Also used in blood gas analyzers (<a href=\"#i-a-2-i-1\">I.A.2.i.1<\/a>)<\/td><\/tr><tr><th scope=\"row\">Paramagnetic<\/th><td>Oxygen, which has unpaired electrons, is drawn into a magnetic field; the resulting pressure or force difference gives its concentration<\/td><td>Fast enough for breath-by-breath inspired and expired oxygen; used in multigas monitors<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Capnography: the normal waveform<\/h3><ul><li>Phase I: inspiratory baseline, dead space gas with no CO2.<\/li><li>Phase II: the expiratory upstroke as alveolar gas mixes with dead space gas.<\/li><li>Phase III: the alveolar plateau, rising slightly; end-tidal CO2 is read at its end.<\/li><li>Phase 0: the inspiratory downstroke.<\/li><li>End-tidal CO2 is normally about 2 to 5 mmHg below PaCO2. More alveolar dead space (low cardiac output, pulmonary embolism, COPD) widens the gap.<\/li><\/ul><h3 class=\"nb-h\">What changes in end-tidal CO2 mean<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Change<\/th><th scope=\"col\">Common causes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Sudden fall to near zero<\/th><td>Disconnection, extubation, esophageal intubation, complete obstruction, a disconnected sampling line, cardiac arrest<\/td><\/tr><tr><th scope=\"row\">Sudden fall, not to zero<\/th><td>Pulmonary embolism (thrombus, air, fat), a sudden fall in cardiac output, a large leak<\/td><\/tr><tr><th scope=\"row\">Gradual rise<\/th><td>Hypoventilation, more CO2 production (fever, sepsis, malignant hyperthermia), CO2 absorbed during laparoscopy<\/td><\/tr><tr><th scope=\"row\">Brief rise<\/th><td>Tourniquet release, sodium bicarbonate<\/td><\/tr><tr><th scope=\"row\">Gradual fall<\/th><td>Hyperventilation, hypothermia, falling cardiac output<\/td><\/tr><tr><th scope=\"row\">Baseline above zero<\/th><td>Rebreathing: exhausted absorbent, an incompetent valve, too little fresh gas in a Mapleson system<\/td><\/tr><tr><th scope=\"row\">Up-sloping plateau (shark fin)<\/th><td>Bronchospasm, COPD, a kinked or partly blocked tube<\/td><\/tr><tr><th scope=\"row\">Cleft in the plateau<\/th><td>Spontaneous breaths during mechanical ventilation<\/td><\/tr><tr><th scope=\"row\">Small oscillations at the end of exhalation<\/th><td>Heartbeats moving gas at slow breathing rates (cardiogenic oscillations)<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Esophageal intubation can show CO2 for a few breaths, from gas pushed into the stomach, but it fades within about six breaths. Sustained CO2 confirms tracheal placement.<\/li><li>During CPR, end-tidal CO2 tracks cardiac output: persistently low values suggest poor compressions, and a sudden rise suggests return of circulation.<\/li><\/ul><h3 class=\"nb-h\">Nitrogen<\/h3><ul><li>Infrared cannot measure nitrogen; mass spectrometry and Raman scattering can.<\/li><li>Preoxygenation: denitrogenation is adequate when end-tidal oxygen reaches about 90% and end-tidal nitrogen is low.<\/li><li>Venous air embolism: a sudden rise in end-tidal nitrogen is specific for air, and usually comes with a fall in end-tidal CO2.<\/li><\/ul><h3 class=\"nb-h\">Anesthetic agents<\/h3><ul><li>Monitors show inspired and end-tidal concentrations of volatile agents and nitrous oxide, often with an age-adjusted MAC value.<\/li><li>Uses: confirming vaporizer output, detecting a wrong or mixed agent (on monitors that identify agents), titrating depth and following wash-in and wash-out.<\/li><li>End-tidal concentration reflects brain partial pressure only near steady state; during rapid changes the brain lags behind.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a falling end-tidal CO2 with an unchanged PaCO2 means more dead space, not hyperventilation. A sudden fall with hypotension suggests embolism or a sudden drop in cardiac output.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-i-2\">I.A.2.i.2 Gas Concentrations: Infrared Absorption, Mass Spectrometry, Raman Scatter Analysis<\/a> · <a href=\"#i-a-2-g-4\">I.A.2.g.4 Oxygen Supply Systems: FiO2<\/a> · <a href=\"#i-a-4-b-11\">I.A.4.b.11 MAC<\/a> · <a href=\"#ii-c-1-d-1-f-3\">II.C.1.d.1.f.3 Air Embolism<\/a> · <a href=\"#i-a-2-i-1\">I.A.2.i.1 Arterial and Venous Blood Gases<\/a><\/p>","b":"Gas monitoring shows what the patient breathes in and out: inspired oxygen (the last defense against a hypoxic mixture), end-tidal CO2 (ventilation, circulation and tube position), nitrogen (washout and air embolism) and agent concentrations (depth and vaporizer function). The measuring techniques, such as infrared absorption, are in I.A.2.i.2.","u":"2026-11-05"},"I.A.2.h.4":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Core temperature is best measured in the pulmonary artery, distal esophagus, nasopharynx or at the tympanic membrane. Bladder and rectal readings lag during rapid changes, and skin reads below core. Thermistors and thermocouples are the usual sensors. The ASA standard calls for temperature monitoring whenever clinically significant changes are intended, anticipated or suspected.<\/p><h3 class=\"nb-h\">Sensors<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Sensor<\/th><th scope=\"col\">Principle<\/th><th scope=\"col\">Notes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Thermistor<\/th><td>A semicond

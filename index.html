-d\">I.B.6.d Bronchospasm<\/a> · <a href=\"#ii-c-2-d-1-c-3-b-3\">II.C.2.d.1.c.3.b.3 Complications and Side Effects of Mechanical Ventilation<\/a><\/p>","b":"Peak pressure reflects resistance plus compliance; plateau pressure, measured during an end-inspiratory pause with no flow, reflects compliance alone. A higher peak with the same plateau points to the tube or airways, and a rise in both points to the lungs, chest wall or abdomen. Disconnection and apnea are caught by airway pressure, exhaled volume and capnography together.","u":"2026-11-05"},"I.A.2.k":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Built-in safety features block many errors before they reach the patient, such as a wrong gas connection or a hypoxic mixture, and alarms catch what gets past them. An alarm protects the patient only if it is on, loud enough to hear and set to limits that fit this patient. Capnography and airway pressure detect a disconnection within seconds, while pulse oximetry can take minutes in a preoxygenated patient.<\/p><h3 class=\"nb-h\">Making alarms work<\/h3><ul><li>At the start of every case, check that alarms are on, audible and set for this patient; default limits may not fit a child or a patient with an abnormal baseline.<\/li><li>International standards (IEC 60601-1-8) grade alarms as high, medium or low priority, with distinct sounds and lights; a high-priority alarm needs an immediate response.<\/li><li>Most alarms during anesthesia are false or need no action. The result is alarm fatigue: alarms get silenced, limits widened or alarms switched off. The Joint Commission has made clinical alarm safety a national patient safety goal.<\/li><li>Silence an alarm only briefly while you fix its cause; most monitors re-arm after a short pause. Keep the oxygen, disconnect and end-tidal CO2 alarms on during mechanical ventilation.<\/li><li>When an alarm sounds, look at the patient first and confirm with a second monitor; movement, electrocautery and poor perfusion cause many artifacts.<\/li><li>The daily machine checkout includes calibrating the oxygen analyzer and testing its low-oxygen alarm.<\/li><\/ul><h3 class=\"nb-h\">Operating room<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Feature<\/th><th scope=\"col\">What it does<\/th><th scope=\"col\">Notes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Medical gas pipeline alarms<\/th><td>Master alarms (in at least two places, one staffed around the clock) and area alarms (in the operating suite) warn when line pressure rises or falls about 20% from normal<\/td><td>Check the machine's pipeline gauges and open the backup cylinder if supply is failing<\/td><\/tr><tr><th scope=\"row\">Zone valves<\/th><td>Shut off gas to one area, for example during a fire<\/td><td>Know where they are; once one is closed, every machine in that area runs on its cylinders<\/td><\/tr><tr><th scope=\"row\">Emergency power<\/th><td>Generators restore power to critical outlets (often red) within 10 seconds of a failure<\/td><td>Anesthesia machines and many monitors have batteries, but only for a limited time<\/td><\/tr><tr><th scope=\"row\">Fire safety<\/th><td>Alarms, extinguishers and evacuation routes<\/td><td>See <a href=\"#i-a-2-m-5\">I.A.2.m.5<\/a><\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Electrical<\/h3><ul><li>Line isolation monitor: on an isolated (ungrounded) power system, it continuously checks how well each line is isolated from ground and alarms when a fault, usually a faulty device, has partly grounded the system. The alarm means the protection against a second fault is gone, not that anyone is being shocked; unplug the device most recently plugged in, unless it is life support (see <a href=\"#i-a-2-m-2\">I.A.2.m.2<\/a>).<\/li><li>Ground fault circuit interrupter: cuts power within a fraction of a second when the current out on the hot wire and back on the neutral differ by about 5 mA. Common in wet locations.<\/li><li>Electrosurgical return electrode monitoring: a split dispersive pad lets the generator measure skin contact, and it alarms and stops output when contact is poor, which prevents burns at the pad.<\/li><\/ul><h3 class=\"nb-h\">Anesthesia machine<\/h3><ul><li>The oxygen supply pressure alarm, pressure-sensing fail-safe, proportioning system, flowmeter order, pin and diameter index systems, vaporizer interlock and minimum oxygen flow are covered in <a href=\"#i-a-2-g-6\">I.A.2.g.6<\/a>.<\/li><li>Other machine alarms include low pipeline or cylinder pressure, power failure or running on battery, electronic vaporizer faults, and high or low agent concentration from the gas analyzer.<\/li><li>A self-inflating bag and a full oxygen cylinder with a regulator should be at hand for every case.<\/li><\/ul><h3 class=\"nb-h\">Ventilator alarms<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Alarm<\/th><th scope=\"col\">What it means<\/th><th scope=\"col\">Common causes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Low airway pressure (disconnect)<\/th><td>Pressure did not rise above the threshold within a set time<\/td><td>Disconnection, a large leak (cuff, circuit, absorber), extubation, a ventilator that is not delivering<\/td><\/tr><tr><th scope=\"row\">High airway pressure<\/th><td>Pressure reached the upper limit; in volume control the breath is cut short or gas is vented<\/td><td>Kinked or blocked tube, bronchospasm, coughing, endobronchial tube, pneumothorax (see <a href=\"#i-a-2-j-3\">I.A.2.j.3<\/a>)<\/td><\/tr><tr><th scope=\"row\">Sustained (continuing) pressure<\/th><td>Pressure stayed high for longer than a set time<\/td><td>Blocked expiratory limb or scavenging, a stuck expiratory or PEEP valve, a closed APL valve during bag ventilation, oxygen flush held down<\/td><\/tr><tr><th scope=\"row\">Subatmospheric (negative) pressure<\/th><td>Pressure fell below atmospheric<\/td><td>Spontaneous breathing against a blocked circuit or too little fresh gas, active scavenging pulling on the circuit, suction through a bronchoscope or a misplaced gastric tube<\/td><\/tr><tr><th scope=\"row\">Low exhaled tidal or minute volume<\/th><td>Less gas is returning than expected<\/td><td>Leak or disconnection; stiffer lungs or a narrower airway in pressure control<\/td><\/tr><tr><th scope=\"row\">High minute volume or rate<\/th><td>More ventilation than set<\/td><td>Patient breathing above the set rate; autotriggering from a leak or cardiac oscillations<\/td><\/tr><tr><th scope=\"row\">Apnea<\/th><td>No breath detected for a set time<\/td><td>No effort in a spontaneous mode, disconnection<\/td><\/tr><tr><th scope=\"row\">Low supply (drive gas) pressure<\/th><td>Pipeline or cylinder failure<\/td><td>A bellows ventilator stops without drive gas; ventilate by hand with cylinder oxygen or a self-inflating bag<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Capnometer<\/h3><ul><li>Alarms: high and low end-tidal CO2, high inspired CO2 (rebreathing) and apnea (no CO2 waveform). Their causes are in <a href=\"#i-a-2-h-3\">I.A.2.h.3<\/a>.<\/li><li>Loss of the waveform is the earliest warning of disconnection, esophageal intubation, extubation or complete obstruction. Also check the sampling line, which can kink, fill with water or come off.<\/li><li>ASA standards require the end-tidal CO2 alarm to be audible whenever capnography is used (see <a href=\"#i-a-2-h\">I.A.2.h<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Oxygen<\/h3><ul><li>Oxygen analyzer: its low-oxygen alarm is required during general anesthesia with an anesthesia machine, and it is the only alarm that catches a wrong gas in the oxygen pipeline (see <a href=\"#i-a-2-g-6\">I.A.2.g.6<\/a>). A high-oxygen limit helps when oxygen must be kept low, as in premature infants or airway surgery with a fire risk (see <a href=\"#i-a-2-m-5\">I.A.2.m.5<\/a>).<\/li><li>Pulse oximetry: a low-saturation alarm and a pulse tone whose pitch falls with saturation, both audible (required). Desaturation is a late sign of apnea or disconnection after preoxygenation.<\/li><li>Supply: the machine's oxygen supply pressure alarm and the pipeline area alarms above.<\/li><\/ul><h3 class=\"nb-h\">Hemodynamic monitors<\/h3><ul><li>ECG: rate limits, arrhythmia and ST-segment alarms, and leads-off alarms. Electrocautery and movement mimic arrhythmias, so check a pulse, the arterial trace or the pleth before treating.<\/li><li>Noninvasive blood pressure: high and low limits, cycling at least every 5 minutes.<\/li><li>Arterial line: a low or zero reading with a flat trace can mean the line is disconnected or open to air, which can bleed fast; a damped trace understates systolic pressure (see <a href=\"#i-a-2-i-3\">I.A.2.i.3<\/a>).<\/li><li>Pulmonary artery catheter: a trace that turns into a wedge pattern without the balloon inflated means the catheter has migrated forward; pull it back to avoid pulmonary artery injury.<\/li><li>Infusion pump alarms (occlusion, air in line, end of infusion) are covered in <a href=\"#i-a-2-n\">I.A.2.n<\/a>.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> after preoxygenation, pulse oximetry may not fall for minutes after a disconnection or esophageal intubation. Capnography and the airway pressure alarm detect it first, so a normal saturation does not rule it out.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-g-6\">I.A.2.g.6 Safety Features<\/a> · <a href=\"#i-a-2-j-3\">I.A.2.j.3 Monitors<\/a> · <a href=\"#i-a-2-h-3\">I.A.2.h.3 Gas Concentrations<\/a> · <a href=\"#i-b-3-d\">I.B.3.d ASA Monitoring Standards<\/a> · <a href=\"#i-a-2-m-2\">I.A.2.m.2 Prevention: Grounding, Isolation Transformers<\/a> · <a href=\"#i-a-2-m-5\">I.A.2.m.5 Risk Factors for Intraoperative Fire<\/a> · <a href=\"#i-a-2-n\">I.A.2.n IV Pumps and Infusers<\/a><\/p>","b":"Built-in safety features block many errors before they reach the patient, such as a wrong gas connection or a hypoxic mixture, and alarms catch what gets past them. An alarm protects the patient only if it is on, loud enough to hear and set to limits that fit this patient. Capnography and airway pressure detect a disconnection within seconds, while pulse oximetry can take minutes in a preoxygenated patient.","u":"2026-11-05"},"I.A.2.l":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> A defibrillator discharges a capacitor through the heart to depolarize enough myocardium at once to stop fibrillation. Biphasic shocks work at lower energy than monophasic ones and are preferred. Defibrillation is unsynchronized; cardioversion of an organized rhythm is synchronized to the R wave so the shock avoids the T wave.<\/p><h3 class=\"nb-h\">How it works<\/h3><ul><li>The device charges a capacitor and discharges it through the chest. The stored energy, set in joules, is ½ × capacitance × voltage².<\/li><li>Current, not energy, defibrillates. Current = voltage ÷ transthoracic impedance, so lowering the impedance delivers more current for the same energy.<\/li><li>Impedance falls with larger pads, firm paddle pressure, conductive gel or gel pads, shocking at end expiration and repeated shocks. Most biphasic devices measure impedance and adjust the shock to it.<\/li><li>A shock depolarizes a critical mass of myocardium at once, so the sinus node or another pacemaker can take over.<\/li><\/ul><h3 class=\"nb-h\">Waveforms<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Waveform<\/th><th scope=\"col\">Current flow<\/th><th scope=\"col\">Adult energy for VF<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Monophasic (damped sine or truncated exponential)<\/th><td>One direction<\/td><td>360 J<\/td><\/tr><tr><th scope=\"row\">Biphasic (truncated exponential or rectilinear)<\/th><td>Reverses direction partway through the shock<\/td><td>The manufacturer's recommended dose, commonly 120 to 200 J; the maximum if that dose is unknown<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Biphasic shocks end VF at lower energy with less myocardial injury, and the 2025 AHA guidelines prefer them over monophasic shocks (<a href=\"https://doi.org/10.1161/CIR.0000000000001376\" target=\"_blank\" rel=\"noopener\">AHA 2025<\/a>).<\/li><li>For later shocks, follow the device's fixed or escalating protocol; a higher energy may be considered if the first shock fails. The same guidelines found the value of changing pad position or of double sequential defibrillation for refractory VF not established.<\/li><\/ul><h3 class=\"nb-h\">Defibrillation versus cardioversion<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Feature<\/th><th scope=\"col\">Defibrillation<\/th><th scope=\"col\">Synchronized cardioversion<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Rhythms<\/th><td>VF, pulseless VT, sustained polymorphic VT<\/td><td>Tachycardia with a pulse and an organized QRS (atrial fibrillation, flutter, SVT, monomorphic VT) when unstable or for elective conversion<\/td><\/tr><tr><th scope=\"row\">Timing<\/th><td>As soon as the button is pressed<\/td><td>On the R wave, avoiding the vulnerable period on the T wave<\/td><\/tr><tr><th scope=\"row\">Adult starting energy<\/th><td>Biphasic per the manufacturer; monophasic 360 J<\/td><td>Atrial fibrillation at least 200 J biphasic; flutter 200 J may be reasonable; monomorphic VT commonly about 100 J<\/td><\/tr><tr><th scope=\"row\">Pediatric energy<\/th><td>2 J/kg, then 4 J/kg; later shocks 4 J/kg or more, up to 10 J/kg or the adult dose<\/td><td>0.5 to 1 J/kg, then 2 J/kg<\/td><\/tr><\/tbody><\/table><\/div><ul><li>The 2025 AHA energies for atrial fibrillation and flutter are higher than older teaching, which started flutter and other SVTs at 50 to 100 J.<\/li><li>Elective cardioversion of atrial fibrillation lasting 48 hours or more, or of unknown duration, needs 3 weeks of anticoagulation or a TEE that excludes left atrial thrombus first, and anticoagulation for at least 4 weeks afterward.<\/li><li>Cardioversion usually needs brief deep sedation or general anesthesia, often with propofol or etomidate, and airway support.<\/li><li>Digoxin toxicity and hypokalemia raise the risk of ventricular arrhythmias after cardioversion.<\/li><\/ul><h3 class=\"nb-h\">Pads and paddles<\/h3><ul><li>Anterolateral: one pad below the right clavicle beside the sternum, the other over the left lower ribs in the midaxillary line, toward the apex. Anteroposterior: one pad over the left precordium, the other on the left back below the scapula. Both put the heart in the current path.<\/li><li>Size: larger pads lower impedance and spread the current, reducing burns; adult pads are about 8 to 12 cm across. Use adult pads in children over about 10 kg (around 1 year) if they fit without touching; otherwise use infant pads, front and back if needed.<\/li><li>Self-adhesive pads allow hands-off shocks and transcutaneous pacing. Paddles need firm pressure and gel, and gel smeared between them lets current arc across the skin instead of through the heart.<\/li><li>Remove medication patches under the pads, dry the chest, keep pads off the generator of an implanted device (front and back placement often works best), and keep free-flowing oxygen away from the pads during a shock.<\/li><\/ul><h3 class=\"nb-h\">Internal and implantable devices<\/h3><ul><li>Internal (open-chest) paddles applied directly to the heart in cardiac surgery need far less energy, about 10 to 20 J in adults.<\/li><li>Implantable cardioverter-defibrillator (ICD; older name automatic implantable cardioverter-defibrillator, AICD): senses VT or VF and treats it with antitachycardia pacing or a shock of up to about 40 J from inside the heart. Most also pace for bradycardia.<\/li><li>Subcutaneous ICD: a lead under the skin beside the sternum and none in the heart. Its shocks are larger, up to 80 J, and it cannot provide ongoing pacing.<\/li><li>Wearable cardioverter-defibrillator: a vest worn for a limited time, for example while awaiting an ICD.<\/li><li>Monopolar electrocautery can be sensed as VF and trigger an inappropriate shock, so tachycardia therapies are usually suspended for surgery, by reprogramming or, for most ICDs, a magnet, with external pads on. Restore them and have the device checked afterward, and after any external shock (see <a href=\"#ii-c-3-b-3-c\">II.C.3.b.3.c<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Automated external defibrillators (AEDs)<\/h3><ul><li>An AED analyzes the rhythm itself and advises a shock (semi-automatic) or delivers one (fully automatic) only for VF or fast VT. It does not shock asystole or PEA.<\/li><li>Voice prompts guide untrained rescuers. Public-access AEDs shorten the time to the first shock, the factor that matters most for survival in VF.<\/li><li>Children under 8 years: use pediatric pads with a dose attenuator if available. Infants: a manual defibrillator is preferred, then an AED with an attenuator, then a standard AED.<\/li><li>Pause compressions only for analysis and the shock, and restart CPR right after the shock without a pulse check.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> many defibrillators return to unsynchronized mode after a synchronized shock, so select sync again before every cardioversion. In polymorphic VT the device may never find an R wave to fire on, so give an unsynchronized shock.<\/p><\/div><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a magnet over an ICD suspends its shocks but usually does not switch its pacing to an asynchronous mode, so a pacing-dependent patient still needs a plan for electrocautery interference.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-c-3-a-8\">I.C.3.a.8 Basics of Cardiopulmonary Resuscitation<\/a> · <a href=\"#ii-c-3-b-11-b\">II.C.3.b.11.b Adult Management: Drugs, Defibrillators, Monitors, ACLS Algorithms<\/a> · <a href=\"#ii-c-3-b-11-d\">II.C.3.b.11.d Pediatric Management<\/a> · <a href=\"#ii-c-3-b-3-c\">II.C.3.b.3.c Perioperative Implications of Pacemaker and AICD<\/a> · <a href=\"#ii-a-1-d\">II.A.1.d Pacemakers: Design and Function<\/a> · <a href=\"#i-a-2-m-3\">I.A.2.m.3 Macro and Micro Current Hazards<\/a><\/p>","b":"A defibrillator discharges a capacitor through the heart to depolarize enough myocardium at once to stop fibrillation. Biphasic shocks work at lower energy than monophasic ones and are preferred. Defibrillation is unsynchronized; cardioversion of an organized rhythm is synchronized to the R wave so the shock avoids the T wave.","u":"2026-11-05"},"I.A.4.b.1":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Blood:gas solubility sets how fast an agent comes on and wears off, oil:gas solubility tracks potency, and vapor pressure decides what vaporizer it needs.<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Agent<\/th><th scope=\"col\">Blood:gas<\/th><th scope=\"col\">Oil:gas<\/th><th scope=\"col\">Vapor pressure at 20 °C (mmHg)<\/th><th scope=\"col\">Boiling point (°C)<\/th><th scope=\"col\">Pungent<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Desflurane<\/th><td>0.42–0.45<\/td><td>~19<\/td><td>~669<\/td><td>~23<\/td><td>Yes<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide<\/th><td>0.46–0.47<\/td><td>~1.4<\/td><td>Gas, stored as liquid<\/td><td>−88<\/td><td>No<\/td><\/tr><tr><th scope=\"row\">Sevoflurane<\/th><td>0.65–0.69<\/td><td>~50<\/td><td>~157<\/td><td>~59<\/td><td>No<\/td><\/tr><tr><th scope=\"row\">Isoflurane<\/th><td>1.4–1.46<\/td><td>~90–98<\/td><td>~238<\/td><td>~49<\/td><td>Yes<\/td><\/tr><tr><th scope=\"row\">Halothane<\/th><td>2.4–2.5<\/td><td>~224<\/td><td>~243<\/td><td>~50<\/td><td>No<\/td><\/tr><\/tbody><\/table><\/div><p>Values are approximate; textbooks differ slightly.<\/p><h3 class=\"nb-h\">Solubility and speed<\/h3><ul><li>A low blood:gas coefficient means little agent is taken up by blood, so the alveolar concentration (FA/FI) rises quickly. Induction, emergence and changes in depth are faster.<\/li><li>Speed, fastest first: desflurane and nitrous oxide, then sevoflurane, isoflurane, halothane.<\/li><li>After long cases, tissue (fat and muscle) solubility matters too: desflurane washes out fastest.<\/li><\/ul><h3 class=\"nb-h\">Potency (Meyer–Overton)<\/h3><ul><li>Higher oil:gas solubility means higher potency and a lower MAC. MAC multiplied by the oil:gas coefficient is roughly constant across agents.<\/li><li>Exceptions to this rule are part of the case for protein targets (see <a href=\"#i-a-4-b-2\">I.A.4.b.2<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Vapor pressure and vaporizers<\/h3><ul><li>Desflurane boils near room temperature, so it needs a heated, pressurized vaporizer (about 39 °C and 2 atm).<\/li><li>Variable-bypass vaporizers are agent-specific. Filling one with an agent of higher vapor pressure than it was built for delivers more vapor than dialed; desflurane in a standard vaporizer is the extreme case. Keyed fillers prevent most mix-ups.<\/li><li>Altitude: variable-bypass vaporizers deliver a constant partial pressure and need no correction. The desflurane vaporizer delivers a constant volume percent, so at altitude the dial must be turned up to keep the same partial pressure.<\/li><\/ul><h3 class=\"nb-h\">Pungency<\/h3><ul><li>Desflurane and isoflurane irritate the airway (coughing, breath-holding, laryngospasm), so they are not used for mask induction. Sevoflurane is the agent of choice for inhalational induction.<\/li><\/ul><h3 class=\"nb-h\">Nitrous oxide specifics<\/h3><ul><li>Its critical temperature is 36.5 °C, so it is stored as a liquid. Cylinder pressure stays near 745 psi until the liquid is gone; only weight shows how full the cylinder is.<\/li><li>It is about 30 times more soluble in blood than nitrogen, so it enters air-filled spaces faster than nitrogen leaves. Compliant spaces (bowel, pneumothorax, air embolus) expand: at equilibrium, 50% N2O can double the volume and 75% can quadruple it. Eger and Saidman first showed this hazard in bowel obstruction and pneumothorax (<a href=\"https://doi.org/10.1097/00000542-196501000-00011\" target=\"_blank\" rel=\"noopener\">Eger and Saidman 1965<\/a>).<\/li><li>Noncompliant spaces rise in pressure instead: middle ear, pneumocephalus, and the eye while an intraocular gas bubble remains.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-f\">I.A.2.f Uptake and Distribution of Inhalation Agents<\/a> · <a href=\"#i-a-4-b-11\">I.A.4.b.11 MAC<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a><\/p>","b":"Blood:gas solubility sets how fast an agent comes on and wears off, oil:gas solubility tracks potency, and vapor pressure decides what vaporizer it needs.","u":"2026-11-05"},"I.A.4.b.2":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> There is no single mechanism. Immobility comes mainly from the spinal cord, unconsciousness and amnesia come from the brain, and the agents act on several ion channels rather than on cell membranes in general.<\/p><h3 class=\"nb-h\">Where they act<\/h3><ul><li>Immobility, the MAC endpoint, is produced mainly in the spinal cord. In animal studies, removing the brain's influence barely changes the dose needed to stop movement, while delivering agent to the brain alone takes far more.<\/li><li>Unconsciousness involves the cortex, the thalamus and brainstem arousal networks.<\/li><li>Amnesia involves the hippocampus and amygdala, and it occurs at lower concentrations than loss of consciousness.<\/li><li>Rough order as concentration rises: amnesia, then unconsciousness (MAC-awake, about 0.3 to 0.4 MAC for volatile agents), then immobility (1 MAC), then blunting of the sympathetic response to incision (MAC-BAR, about 1.5 MAC).<\/li><\/ul><h3 class=\"nb-h\">Molecular targets<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Agents<\/th><th scope=\"col\">Main targets<\/th><th scope=\"col\">Effect<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Volatile agents<\/th><td>GABA-A receptors (potentiated)<\/td><td>More inhibitory chloride current<\/td><\/tr><tr><th scope=\"row\">Volatile agents<\/th><td>Glycine receptors (potentiated), mainly in the spinal cord<\/td><td>Contributes to immobility<\/td><\/tr><tr><th scope=\"row\">Volatile agents<\/th><td>Two-pore-domain K+ channels such as TREK-1 and TASK (activated)<\/td><td>Neuronal hyperpolarization<\/td><\/tr><tr><th scope=\"row\">Volatile agents<\/th><td>Presynaptic Na+ channels and neuronal nicotinic receptors (inhibited)<\/td><td>Less excitatory transmitter release<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide, xenon<\/th><td>NMDA receptors (blocked); little GABA-A effect<\/td><td>Analgesia and anesthesia by a different route, like ketamine<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Meyer–Overton and its exceptions<\/h3><ul><li>Potency tracks lipid solubility across a huge range of compounds, which led to the old lipid theory.<\/li><li>Evidence for protein targets instead: anesthetics inhibit a lipid-free protein (firefly luciferase) at clinical concentrations; mirror-image forms (enantiomers) of some agents act differently at ion channels; some lipid-soluble compounds predicted to anesthetize do not (nonimmobilizers); and potency disappears beyond a certain molecular size (cutoff effect).<\/li><\/ul><h3 class=\"nb-h\">Clinical tie-ins<\/h3><ul><li>Because immobility is mostly spinal, MAC does not measure hypnosis. When neuromuscular blockers remove movement as a warning sign, rely on end-tidal agent monitoring and, where useful, processed EEG.<\/li><li>Opioids, alpha-2 agonists and IV anesthetics reduce MAC by acting at spinal and supraspinal sites, each through its own receptors.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-11\">I.A.4.b.11 MAC<\/a> · <a href=\"#i-b-3-a\">I.B.3.a Stages and Signs of Anesthesia; Awareness under Anesthesia<\/a> · <a href=\"#i-a-4-b-3\">I.A.4.b.3 Effects on CNS<\/a><\/p>","b":"There is no single mechanism. Immobility comes mainly from the spinal cord, unconsciousness and amnesia come from the brain, and the agents act on several ion channels rather than on cell membranes in general.","u":"2026-11-05"},"I.A.4.b.3":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Volatile agents lower brain metabolism but dilate cerebral vessels. Below about 1 MAC the two roughly cancel; above it, cerebral blood flow and ICP rise. Nitrous oxide raises metabolism, blood flow and ICP.<\/p><h3 class=\"nb-h\">Metabolism and blood flow<\/h3><ul><li>CMRO2 falls with dose, by up to about 50% once the EEG is isoelectric (isoflurane, sevoflurane and desflurane at roughly 1.5 to 2 MAC). Halothane rarely reaches an isoelectric EEG at tolerable doses.<\/li><li>Direct cerebral vasodilation raises CBF. Around 0.5 MAC the fall in metabolism offsets it; above about 1 MAC vasodilation wins, so flow rises while metabolism falls (flow–metabolism uncoupling).<\/li><li>Vasodilating potency: halothane &gt; isoflurane ≈ desflurane &gt; sevoflurane.<\/li><li>Autoregulation is impaired with dose; sevoflurane preserves it best.<\/li><li>CO2 reactivity is preserved, so modest hyperventilation can blunt the rise in CBF and ICP.<\/li><\/ul><h3 class=\"nb-h\">Raised ICP in practice<\/h3><ul><li>Keep volatile agents at or below about 1 MAC, or use propofol-based TIVA when ICP is critical.<\/li><li>Nitrous oxide increases CMRO2, CBF and ICP; IV anesthetics blunt this. Avoid it with pneumocephalus, which counts as a closed gas space.<\/li><\/ul><h3 class=\"nb-h\">EEG<\/h3><ul><li>Low doses cause fast (beta) activation. Deeper levels bring slower, higher-amplitude waves, then burst suppression, then an isoelectric EEG.<\/li><li>Epileptiform activity: enflurane, especially with hypocapnia, is the classic cause. Sevoflurane can cause epileptiform EEG during high-concentration induction, particularly in children. Isoflurane and desflurane are anticonvulsant.<\/li><\/ul><h3 class=\"nb-h\">Evoked potentials<\/h3><ul><li>Volatile agents reduce amplitude and prolong latency of SSEPs and MEPs in a dose-dependent way. MEPs are the most sensitive, and nitrous oxide adds to the depression.<\/li><li>Common practice for MEP monitoring is 0.5 MAC or less of volatile agent, or TIVA.<\/li><li>Brainstem auditory evoked potentials are resistant to anesthetics.<\/li><\/ul><h3 class=\"nb-h\">Emergence and the developing brain<\/h3><ul><li>Emergence delirium in children is more common after sevoflurane and desflurane.<\/li><li>In 2016 the FDA warned that repeated or lengthy (over 3 hours) anesthetic exposure in children under 3 years or in the third trimester may affect brain development.<\/li><li>In the GAS trial, about an hour of sevoflurane anesthesia in infancy gave the same IQ at age 5 as awake-regional anesthesia (<a href=\"https://doi.org/10.1016/S0140-6736%2818%2932485-1\" target=\"_blank\" rel=\"noopener\">McCann 2019<\/a>).<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#ii-a-1-a-3\">II.A.1.a.3 Brain and Spinal Cord Function monitoring (EEG, evoked potentials)<\/a> · <a href=\"#i-a-4-b-2\">I.A.4.b.2 Mechanism of Action<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a><\/p>","b":"Volatile agents lower brain metabolism but dilate cerebral vessels. Below about 1 MAC the two roughly cancel; above it, cerebral blood flow and ICP rise. Nitrous oxide raises metabolism, blood flow and ICP.","u":"2026-11-05"},"I.A.4.b.4":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> All volatile agents lower blood pressure with dose. Isoflurane, desflurane and sevoflurane do it mainly by lowering SVR; halothane does it mainly by depressing contractility and cardiac output.<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Effect<\/th><th scope=\"col\">Sevoflurane<\/th><th scope=\"col\">Desflurane<\/th><th scope=\"col\">Isoflurane<\/th><th scope=\"col\">Halothane<\/th><th scope=\"col\">Nitrous oxide<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">MAP<\/th><td>Down<\/td><td>Down<\/td><td>Down<\/td><td>Down<\/td><td>Little change<\/td><\/tr><tr><th scope=\"row\">SVR<\/th><td>Down<\/td><td>Down<\/td><td>Down<\/td><td>Little change<\/td><td>Little change<\/td><\/tr><tr><th scope=\"row\">Heart rate<\/th><td>Little change<\/td><td>Up; surges with rapid increases<\/td><td>Up<\/td><td>Down<\/td><td>Little change<\/td><\/tr><tr><th scope=\"row\">Cardiac output<\/th><td>Maintained<\/td><td>Maintained<\/td><td>Maintained<\/td><td>Down<\/td><td>Little change<\/td><\/tr><tr><th scope=\"row\">Contractility<\/th><td>Down<\/td><td>Down<\/td><td>Down<\/td><td>Down most<\/td><td>Direct depression, offset by sympathetic stimulation<\/td><\/tr><tr><th scope=\"row\">Epinephrine arrhythmias<\/th><td>Low risk<\/td><td>Low risk<\/td><td>Low risk<\/td><td>High risk<\/td><td>None<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Key points<\/h3><ul><li>Desflurane: raising the concentration quickly above about 1 MAC triggers a transient sympathetic surge (tachycardia, hypertension). Opioids, beta-blockers or slower increases blunt it.<\/li><li>Halothane sensitizes the myocardium to catecholamines. With submucosal epinephrine, the dose causing ventricular ectopy in half of patients was 2.1 mcg/kg under halothane, 6.7 under isoflurane and 10.9 under enflurane; adding lidocaine raised the halothane figure to 3.7 (<a href=\"https://doi.org/10.1213/00000539-197609000-00021\" target=\"_blank\" rel=\"noopener\">Johnston 1976<\/a>).<\/li><li>Halothane also slows the SA node, so bradycardia and junctional rhythms are common.<\/li><li>Volatile agents, sevoflurane included, prolong the QTc. Take care in congenital long QT syndrome.<\/li><li>The baroreceptor reflex is depressed with dose, most by halothane.<\/li><li>Isoflurane dilates small coronary arterioles, which raised a theoretical worry about coronary steal. Clinical studies have not shown it to matter.<\/li><li>Volatile agents precondition the myocardium against ischemia in laboratory models. In the MYRIAD trial of 5,400 CABG patients, volatile anesthesia did not lower 1-year mortality compared with TIVA (2.8% vs 3.0%) (<a href=\"https://doi.org/10.1056/NEJMoa1816476\" target=\"_blank\" rel=\"noopener\">Landoni 2019<\/a>).<\/li><li>Nitrous oxide raises pulmonary vascular resistance, most in patients with pulmonary hypertension. Added to a high-dose opioid technique, it can depress cardiac output and blood pressure.<\/li><li>Hypovolemic or shocked patients drop their pressure more with any volatile agent, so titrate carefully.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a> · <a href=\"#i-a-4-b-11\">I.A.4.b.11 MAC<\/a> · <a href=\"#i-a-4-b-5\">I.A.4.b.5 Effects on Respiration<\/a><\/p>","b":"All volatile agents lower blood pressure with dose. Isoflurane, desflurane and sevoflurane do it mainly by lowering SVR; halothane does it mainly by depressing contractility and cardiac output.","u":"2026-11-05"},"I.A.4.b.5":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Volatile agents cause dose-dependent respiratory depression with rapid, shallow breathing and a rising PaCO2. They blunt the response to CO2 and, even more, the response to hypoxemia, and they relax airway smooth muscle.<\/p><h3 class=\"nb-h\">Ventilation<\/h3><ul><li>Tidal volume falls and respiratory rate rises, but minute and alveolar ventilation fall, so PaCO2 rises. Dead space makes up a larger share of each breath.<\/li><li>The CO2 response curve flattens and shifts right, and the apneic threshold rises.<\/li><li>The hypoxic ventilatory response, driven by the carotid bodies, is depressed even at subanesthetic concentrations (around 0.1 MAC); studies differ on how much. This matters in PACU, where leftover agent meets hypoxemia.<\/li><li>Surgical stimulation partly offsets the depression.<\/li><\/ul><h3 class=\"nb-h\">Airways<\/h3><ul><li>Volatile agents are bronchodilators. Sevoflurane is a common choice in asthma and during bronchospasm.<\/li><li>Desflurane can raise airway resistance in smokers and in reactive airways, especially above 1 MAC.<\/li><li>Pungent agents (desflurane more than isoflurane) cause coughing, breath-holding and laryngospasm when given by mask.<\/li><li>Mucociliary clearance is depressed, worse with dry gases.<\/li><\/ul><h3 class=\"nb-h\">Pulmonary circulation and lung volume<\/h3><ul><li>Volatile agents inhibit hypoxic pulmonary vasoconstriction with dose. At 1 MAC or less the effect during one-lung ventilation is small. Propofol does not inhibit it.<\/li><li>Functional residual capacity falls under general anesthesia with any agent, promoting atelectasis.<\/li><\/ul><h3 class=\"nb-h\">Nitrous oxide<\/h3><ul><li>It causes only modest respiratory depression but also blunts the hypoxic response.<\/li><li>Diffusion hypoxia (Fink effect): when N2O is stopped, it floods from blood into the alveoli and dilutes oxygen. Give 100% oxygen for the first several minutes of emergence.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-4\">I.A.4.b.4 Effects on Cardiovascular System<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a><\/p>","b":"Volatile agents cause dose-dependent respiratory depression with rapid, shallow breathing and a rising PaCO2. They blunt the response to CO2 and, even more, the response to hypoxemia, and they relax airway smooth muscle.","u":"2026-11-05"},"I.A.4.b.6":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Volatile agents relax skeletal muscle and potentiate nondepolarizing neuromuscular blockers, and every potent volatile agent can trigger malignant hyperthermia. Nitrous oxide does neither in any meaningful way.<\/p><h3 class=\"nb-h\">Skeletal muscle<\/h3><ul><li>Relaxation is dose-dependent and comes from actions on spinal motor neurons and at the neuromuscular junction.<\/li><li>Volatile agents potentiate nondepolarizing blockers, lowering the dose needed and prolonging the block. A commonly cited order of potentiation is desflurane &gt; sevoflurane &gt; isoflurane &gt; halothane &gt; nitrous oxide-opioid or propofol anesthesia.<\/li><li>The effect grows with concentration and with time of exposure. Leftover agent at the end of a case can deepen an apparently fading block, so use quantitative twitch monitoring before extubation.<\/li><\/ul><h3 class=\"nb-h\">Malignant hyperthermia<\/h3><ul><li>Triggers: all potent volatile agents and succinylcholine.<\/li><li>Safe: nitrous oxide, propofol and other IV induction agents, opioids, benzodiazepines, ketamine, nondepolarizing blockers and local anesthetics.<\/li><li>For susceptible patients, use a vapor-free machine: remove or disable vaporizers, change the absorbent and flush the machine as the manufacturer directs (or fit activated charcoal filters).<\/li><\/ul><h3 class=\"nb-h\">Myopathies<\/h3><ul><li>In Duchenne and Becker muscular dystrophy, succinylcholine can cause hyperkalemic arrest, and volatile agents have been linked to rhabdomyolysis. Many clinicians prefer TIVA.<\/li><\/ul><h3 class=\"nb-h\">Smooth muscle note<\/h3><ul><li>Volatile agents relax uterine muscle with dose, which can worsen atony after delivery. Many clinicians lower the volatile dose after delivery and add nitrous oxide or IV agents. The same effect can help when uterine relaxation is needed, although nitroglycerin acts faster.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-b-6-i\">I.B.6.i Malignant Hyperthermia<\/a> · <a href=\"#ii-a-2-a-1-a\">II.A.2.a.1.a Malignant Hyperthermia (Including Diagnosis and Therapy)<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a><\/p>","b":"Volatile agents relax skeletal muscle and potentiate nondepolarizing neuromuscular blockers, and every potent volatile agent can trigger malignant hyperthermia. Nitrous oxide does neither in any meaningful way.","u":"2026-11-05"},"I.A.4.b.7":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Volatile agents lower renal blood flow, GFR and urine output mostly by lowering blood pressure and cardiac output. True nephrotoxicity came from fluoride with methoxyflurane; with sevoflurane the theoretical concern is compound A.<\/p><h3 class=\"nb-h\">Hemodynamic effects<\/h3><ul><li>Renal blood flow, GFR and urine output fall with dose. The changes are reversible and are limited by keeping blood pressure and volume up.<\/li><\/ul><h3 class=\"nb-h\">Fluoride<\/h3><ul><li>Methoxyflurane, heavily metabolized inside the kidney, caused vasopressin-resistant, high-output renal failure. Risk rose when serum fluoride passed about 50 µmol/L.<\/li><li>Sevoflurane also produces fluoride, and peaks can pass 50 µmol/L, yet it has not caused this injury. Its metabolism is hepatic rather than intrarenal, and it is eliminated quickly.<\/li><li>Enflurane produces modest fluoride; prolonged exposure plus enzyme induction (for example isoniazid) raises levels.<\/li><\/ul><h3 class=\"nb-h\">Compound A<\/h3><ul><li>A vinyl ether formed when sevoflurane reacts with strong bases (sodium or potassium hydroxide) in CO2 absorbents.<\/li><li>More forms with low fresh gas flow, high sevoflurane concentration and a warm absorbent.<\/li><li>It is nephrotoxic in rats. In humans, some studies found transient proteinuria or glycosuria but no clinically significant renal injury.<\/li><li>The US label says exposure \"should not exceed 2 MAC·hours at flow rates of 1 to 2 L/min\", that \"fresh gas flow rates &lt;1 L/min are not recommended\", and that KOH-containing absorbents are not recommended (<a href=\"https://medlibrary.org/lib/rx/meds/sevoflurane-1/page/6/\" target=\"_blank\" rel=\"noopener\">sevoflurane label<\/a>).<\/li><li>Absorbents without strong bases (calcium hydroxide lime) produce little or no compound A.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-10\">I.A.4.b.10 Biotransformation and Toxicity<\/a> · <a href=\"#i-a-4-b-14\">I.A.4.b.14 Environmental Implications<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a><\/p>","b":"Volatile agents lower renal blood flow, GFR and urine output mostly by lowering blood pressure and cardiac output. True nephrotoxicity came from fluoride with methoxyflurane; with sevoflurane the theoretical concern is compound A.","u":"2026-11-05"},"I.A.4.b.8":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Modern agents preserve hepatic blood flow well. The hepatotoxicity story is halothane, mostly through an immune reaction to its oxidative metabolites.<\/p><h3 class=\"nb-h\">Blood flow<\/h3><ul><li>Portal flow falls as cardiac output falls. Isoflurane, sevoflurane and desflurane keep hepatic arterial flow and hepatic oxygen delivery better than halothane, because the hepatic arterial buffer response is preserved.<\/li><li>With liver disease, protect hepatic oxygen delivery by keeping blood pressure and cardiac output up. Isoflurane, sevoflurane and desflurane are all acceptable.<\/li><\/ul><h3 class=\"nb-h\">Halothane hepatitis<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Feature<\/th><th scope=\"col\">Type I<\/th><th scope=\"col\">Type II<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Severity<\/th><td>Mild, transient rise in transaminases<\/td><td>Fulminant hepatic necrosis, often fatal<\/td><\/tr><tr><th scope=\"row\">How common<\/th><td>Up to about 1 in 5 patients<\/td><td>Roughly 1 in 10,000 to 35,000 adult exposures<\/td><\/tr><tr><th scope=\"row\">Mechanism<\/th><td>Reductive metabolism and hepatic hypoxia<\/td><td>Immune reaction to trifluoroacetyl (TFA) protein adducts formed by CYP2E1 oxidation<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Type II risk factors: repeated exposures, especially at short intervals; middle age; female sex; obesity; prior unexplained fever or jaundice after halothane; a family history. Children are rarely affected.<\/li><\/ul><h3 class=\"nb-h\">Cross-sensitivity<\/h3><ul><li>Enflurane, isoflurane and desflurane also form TFA or similar protein adducts, in proportion to how much of each is metabolized: halothane about 20%, enflurane about 2%, isoflurane about 0.2%, desflurane about 0.02%. Rare cases of hepatitis have followed each.<\/li><li>Sevoflurane is metabolized to hexafluoroisopropanol, not TFA, so it lacks this mechanism.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-10\">I.A.4.b.10 Biotransformation and Toxicity<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a><\/p>","b":"Modern agents preserve hepatic blood flow well. The hepatotoxicity story is halothane, mostly through an immune reaction to its oxidative metabolites.","u":"2026-11-05"},"I.A.4.b.9":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Nitrous oxide inactivates vitamin B12 and, with it, methionine synthase. Volatile agents suppress immune cells in the laboratory, but trials have not shown a clinical effect on infection or cancer recurrence.<\/p><h3 class=\"nb-h\">Nitrous oxide and vitamin B12<\/h3><ul><li>N2O oxidizes the cobalt in vitamin B12, irreversibly inactivating methionine synthase. Folate metabolism and DNA synthesis suffer, and homocysteine rises.<\/li><li>Prolonged or repeated exposure causes megaloblastic bone marrow changes; exposures lasting days can cause agranulocytosis.<\/li><li>Patients with B12 deficiency (pernicious anemia, malabsorption, strict vegan diet) or severe MTHFR deficiency can develop subacute combined degeneration of the spinal cord after a single anesthetic. The same myeloneuropathy is seen in recreational N2O users.<\/li><li>In ENIGMA-II, 7,112 at-risk patients having major noncardiac surgery: N2O did not increase death or cardiovascular complications (8% vs 8%) or wound infection, but severe nausea and vomiting rose (15% vs 11%) (<a href=\"https://doi.org/10.1016/S0140-6736%2814%2960893-X\" target=\"_blank\" rel=\"noopener\">Myles 2014<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Volatile agents and immunity<\/h3><ul><li>In laboratory and animal studies, volatile agents suppress neutrophil, natural killer cell and lymphocyte function.<\/li><li>Retrospective studies suggested better cancer outcomes with propofol TIVA. In a trial of 2,108 women having breast cancer surgery, recurrence was 10% with paravertebral block plus propofol and 10% with sevoflurane plus opioids (<a href=\"https://doi.org/10.1016/S0140-6736%2819%2932313-X\" target=\"_blank\" rel=\"noopener\">Sessler 2019<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Coagulation<\/h3><ul><li>Small in-vitro effects on platelet aggregation (halothane, sevoflurane) are not clinically important.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-10\">I.A.4.b.10 Biotransformation and Toxicity<\/a> · <a href=\"#i-a-4-b-12\">I.A.4.b.12 Personnel Hazards<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a><\/p>","b":"Nitrous oxide inactivates vitamin B12 and, with it, methionine synthase. Volatile agents suppress immune cells in the laboratory, but trials have not shown a clinical effect on infection or cancer recurrence.","u":"2026-11-05"},"I.A.4.b.10":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> The more an agent is metabolized, the more toxic products it can make. Today most toxicity comes from reactions with CO2 absorbents rather than from metabolism.<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Agent<\/th><th scope=\"col\">Share metabolized<\/th><th scope=\"col\">Main products<\/th><th scope=\"col\">Key toxicity<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Methoxyflurane (historical)<\/th><td>~50–70%<\/td><td>Fluoride, formed partly inside the kidney<\/td><td>High-output renal failure<\/td><\/tr><tr><th scope=\"row\">Halothane<\/th><td>~20%<\/td><td>Trifluoroacetic acid, bromide, chloride; fluoride by reductive metabolism<\/td><td>Hepatitis<\/td><\/tr><tr><th scope=\"row\">Sevoflurane<\/th><td>~2–5%<\/td><td>Hexafluoroisopropanol (then glucuronidated) and fluoride<\/td><td>No TFA; compound A comes from absorbents, not metabolism<\/td><\/tr><tr><th scope=\"row\">Enflurane (historical)<\/th><td>~2.5%<\/td><td>Fluoride<\/td><td>Fluoride with long exposure<\/td><\/tr><tr><th scope=\"row\">Isoflurane<\/th><td>~0.2%<\/td><td>Small amounts of TFA and fluoride<\/td><td>Rare hepatitis; CO with dry absorbent<\/td><\/tr><tr><th scope=\"row\">Desflurane<\/th><td>~0.02%<\/td><td>Trace TFA<\/td><td>CO with dry absorbent<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide<\/th><td>~0.004%<\/td><td>Reduced by gut bacteria<\/td><td>B12 inactivation, which is not metabolic<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Enzymes<\/h3><ul><li>CYP2E1 does most of the oxidative metabolism. Ethanol and isoniazid induce it.<\/li><\/ul><h3 class=\"nb-h\">Carbon monoxide<\/h3><ul><li>Desiccated absorbents containing strong bases degrade desflurane (most), enflurane and isoflurane to carbon monoxide. Sevoflurane produces little.<\/li><li>Classic scenario: the first case on Monday morning, after fresh gas flowed through the machine all weekend and dried out the absorbent.<\/li><li>Prevention: turn off fresh gas flow when the machine is idle, change absorbent that may be dry, and use absorbents without strong bases.<\/li><\/ul><h3 class=\"nb-h\">Heat and fire<\/h3><ul><li>Sevoflurane with desiccated barium hydroxide lime (Baralyme) reacted exothermically, with extreme heat and fires reported. Baralyme was withdrawn from the US market.<\/li><\/ul><h3 class=\"nb-h\">Other points<\/h3><ul><li>Compound A and fluoride nephrotoxicity: see <a href=\"#i-a-4-b-7\">I.A.4.b.7<\/a>.<\/li><li>Halothane hepatitis: see <a href=\"#i-a-4-b-8\">I.A.4.b.8<\/a>.<\/li><li>Nitrous oxide is teratogenic in rodents after prolonged exposure; no human effect has been proven.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-7\">I.A.4.b.7 Effects on Renal Function<\/a> · <a href=\"#i-a-4-b-8\">I.A.4.b.8 Effects on Hepatic Function<\/a> · <a href=\"#i-a-4-b-9\">I.A.4.b.9 Hematologic and Immune Systems<\/a><\/p>","b":"The more an agent is metabolized, the more toxic products it can make. Today most toxicity comes from reactions with CO2 absorbents rather than from metabolism.","u":"2026-11-05"},"I.A.4.b.11":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> MAC is the alveolar concentration, at 1 atm, that prevents movement in response to surgical incision in 50% of patients. It is the standard measure of inhaled anesthetic potency, and many patient and drug factors shift it.<\/p><h3 class=\"nb-h\">Definitions<\/h3><ul><li>MAC is an ED50, measured as end-tidal concentration at steady state. The dose-response curve is steep: about 1.2 to 1.3 MAC prevents movement in roughly 95% of patients.<\/li><li>MAC-awake, the concentration at which half of patients open their eyes to command, is roughly 0.3 to 0.4 MAC for volatile agents.<\/li><li>MAC-BAR, which blocks the adrenergic response to incision in half of patients, is about 1.5 MAC.<\/li><li>Fractions of MAC roughly add: 0.5 MAC of nitrous oxide plus 0.5 MAC of sevoflurane is close to 1 MAC.<\/li><\/ul><h3 class=\"nb-h\">Values at age 40, in oxygen <span class=\"nb-cite\">(<a href=\"https://doi.org/10.1093/bja/76.2.179\" target=\"_blank\" rel=\"noopener\">Mapleson 1996<\/a>)<\/span><\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Agent<\/th><th scope=\"col\">MAC<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Halothane<\/th><td>0.75%<\/td><\/tr><tr><th scope=\"row\">Isoflurane<\/th><td>1.17%<\/td><\/tr><tr><th scope=\"row\">Sevoflurane<\/th><td>1.80%<\/td><\/tr><tr><th scope=\"row\">Desflurane<\/th><td>6.6%<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide<\/th><td>104%<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Other studies give slightly different figures; sevoflurane is often quoted near 2% and desflurane near 6%.<\/li><li>Nitrous oxide cannot reach 1 MAC at normal atmospheric pressure.<\/li><\/ul><h3 class=\"nb-h\">Age<\/h3><ul><li>MAC is highest in infancy. After the first year it falls about 6% per decade (Mapleson 1996), so an 80-year-old needs about 22% less than a 40-year-old.<\/li><\/ul><h3 class=\"nb-h\">Factors that lower MAC<\/h3><ul><li>Patient: increasing age, hypothermia, pregnancy, hyponatremia, acute alcohol intoxication.<\/li><li>Severe physiologic derangement: PaO2 below about 40 mmHg, MAP below about 40 mmHg, PaCO2 above about 95 mmHg, severe anemia.<\/li><li>Drugs: opioids, benzodiazepines, propofol and other IV anesthetics, ketamine, alpha-2 agonists (dexmedetomidine, clonidine), IV lidocaine, lithium, chronic amphetamine use.<\/li><\/ul><h3 class=\"nb-h\">Factors that raise MAC<\/h3><ul><li>Hyperthermia, hypernatremia, chronic alcohol use, acute amphetamine or cocaine use.<\/li><li>Red hair: in women with natural red hair, the desflurane requirement was about 19% higher (6.2% vs 5.2%), linked to melanocortin-1 receptor variants (<a href=\"https://doi.org/10.1097/00000542-200408000-00006\" target=\"_blank\" rel=\"noopener\">Liem 2004<\/a>).<\/li><\/ul><h3 class=\"nb-h\">No meaningful change<\/h3><ul><li>Sex, duration of anesthesia, thyroid status, serum potassium, and PaCO2 within roughly 15 to 95 mmHg.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> hyperthyroidism sounds as if it should raise MAC, but thyroid status does not meaningfully change it.<\/p><\/div><h3 class=\"nb-h\">Clinical use<\/h3><ul><li>MAC measures immobility, which is mostly spinal, not awareness. Age-adjusted MAC readouts and end-tidal alarms help avoid awareness when neuromuscular blockers hide movement.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-2\">I.A.4.b.2 Mechanism of Action<\/a> · <a href=\"#i-b-3-a\">I.B.3.a Stages and Signs of Anesthesia; Awareness under Anesthesia<\/a> · <a href=\"#i-a-4-c-7\">I.A.4.c.7 Dexmedetomidine<\/a><\/p>","b":"MAC is the alveolar concentration, at 1 atm, that prevents movement in response to surgical incision in 50% of patients. It is the standard measure of inhaled anesthetic potency, and many patient and drug factors shift it.","u":"2026-11-05"},"I.A.4.b.12":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Waste anesthetic gas is controlled by scavenging, leak checks and careful work habits. NIOSH recommends exposure limits; OSHA has no enforceable limit. With modern scavenging no risk to OR staff has been proven, but heavy unscavenged nitrous oxide exposure has been linked to lower fertility.<\/p><h3 class=\"nb-h\">Exposure limits <span class=\"nb-cite\">(<a href=\"https://www.osha.gov/waste-anesthetic-gases/workplace-exposures-guidelines\" target=\"_blank\" rel=\"noopener\">OSHA guidance<\/a>)<\/span><\/h3><ul><li>Nitrous oxide: NIOSH recommends 25 ppm as a time-weighted average during anesthetic administration.<\/li><li>Halogenated agents: no worker should be exposed to a ceiling above 2 ppm, over a sampling period of no more than 1 hour.<\/li><li>OSHA has no permissible exposure limits for these agents.<\/li><\/ul><h3 class=\"nb-h\">Where waste gas comes from<\/h3><ul><li>Mask induction and poor mask seals; uncuffed tubes and supraglottic airway leaks.<\/li><li>Turning on gas before the airway is secured; flushing the circuit; disconnections.<\/li><li>Filling vaporizers; leaks in the high-pressure (pipeline and cylinder) and low-pressure parts of the machine.<\/li><li>Patients exhaling agent in the PACU.<\/li><\/ul><h3 class=\"nb-h\">Scavenging systems<\/h3><ul><li>Active systems use hospital suction; passive systems rely on the patient's exhaled pressure.<\/li><li>Open interfaces are vented to the room and have no valves. Closed interfaces have a positive-pressure relief valve, plus a negative-pressure relief valve and reservoir bag when suction is used.<\/li><li>Failure modes: a blocked transfer hose can push pressure back into the breathing circuit and cause barotrauma; excess suction through a closed interface can pull negative pressure on the circuit.<\/li><\/ul><h3 class=\"nb-h\">Habits that cut exposure<\/h3><ul><li>Leak-check the machine daily, use cuffed airways where appropriate, and start gas flow only once the mask seal or airway is in place.<\/li><li>Turn off fresh gas flow, not just the vaporizer, before disconnecting the circuit.<\/li><li>Use keyed vaporizer fillers and keep room ventilation working.<\/li><\/ul><h3 class=\"nb-h\">Health evidence<\/h3><ul><li>Older studies from before scavenging linked chronic exposure to miscarriage and birth defects, but bias and confounding weaken them, and no causal link is established.<\/li><li>Female dental assistants exposed to unscavenged N2O for 5 or more hours a week were 41% as likely to conceive per cycle as unexposed women (<a href=\"https://doi.org/10.1056/NEJM199210013271405\" target=\"_blank\" rel=\"noopener\">Rowland 1992<\/a>).<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-14\">I.A.4.b.14 Environmental Implications<\/a> · <a href=\"#i-a-4-b-9\">I.A.4.b.9 Hematologic and Immune Systems<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a><\/p>","b":"Waste anesthetic gas is controlled by scavenging, leak checks and careful work habits. NIOSH recommends exposure limits; OSHA has no enforceable limit. With modern scavenging no risk to OR staff has been proven, but heavy unscavenged nitrous oxide exposure has been linked to lower fertility.","u":"2026-11-05"},"I.A.4.b.13":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Choose by speed, airway irritability and side effects: sevoflurane for mask induction, desflurane for the fastest wake-up (not with reactive airways), isoflurane when cost matters, and nitrous oxide as an adjunct.<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Feature<\/th><th scope=\"col\">Sevoflurane<\/th><th scope=\"col\">Desflurane<\/th><th scope=\"col\">Isoflurane<\/th><th scope=\"col\">Nitrous oxide<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">MAC at age 40<\/th><td>1.80%<\/td><td>6.6%<\/td><td>1.17%<\/td><td>104%<\/td><\/tr><tr><th scope=\"row\">Blood:gas<\/th><td>~0.65<\/td><td>~0.45<\/td><td>~1.4<\/td><td>~0.47<\/td><\/tr><tr><th scope=\"row\">Mask induction<\/th><td>Smooth; agent of choice<\/td><td>Airway irritant; avoid<\/td><td>Airway irritant; avoid<\/td><td>Fast, but too weak alone<\/td><\/tr><tr><th scope=\"row\">Emergence<\/th><td>Fast<\/td><td>Fastest volatile<\/td><td>Slower<\/td><td>Fast; give oxygen to prevent diffusion hypoxia<\/td><\/tr><tr><th scope=\"row\">Blood pressure<\/th><td>Down, via SVR<\/td><td>Down, via SVR<\/td><td>Down, via SVR<\/td><td>Little change<\/td><\/tr><tr><th scope=\"row\">Heart rate<\/th><td>Stable<\/td><td>Up; surges with rapid increases<\/td><td>Up<\/td><td>Stable<\/td><\/tr><tr><th scope=\"row\">Airways<\/th><td>Bronchodilator<\/td><td>May raise resistance in smokers<\/td><td>Bronchodilator<\/td><td>Little effect<\/td><\/tr><tr><th scope=\"row\">Share metabolized<\/th><td>~2–5%<\/td><td>~0.02%<\/td><td>~0.2%<\/td><td>~0.004%<\/td><\/tr><tr><th scope=\"row\">Watch for<\/th><td>Compound A; epileptiform EEG at high doses in children; emergence delirium<\/td><td>CO with dry absorbent; heated vaporizer; largest climate impact<\/td><td>Slower wake-up after long cases<\/td><td>Closed gas spaces; B12 inactivation; nausea<\/td><\/tr><tr><th scope=\"row\">MH trigger<\/th><td>Yes<\/td><td>Yes<\/td><td>Yes<\/td><td>No<\/td><\/tr><\/tbody><\/table><\/div><p>MAC values are from <a href=\"https://doi.org/10.1093/bja/76.2.179\" target=\"_blank\" rel=\"noopener\">Mapleson 1996<\/a>.<\/p><h3 class=\"nb-h\">Other agents<\/h3><ul><li>Halothane, no longer used in the US but still used elsewhere: slow onset, nonpungent, myocardial depression, bradycardia, epinephrine-induced arrhythmias, hepatitis.<\/li><li>Xenon: blood:gas about 0.115 and MAC roughly 60 to 70%. An NMDA antagonist with minimal cardiovascular effects, but costly and rarely available.<\/li><\/ul><h3 class=\"nb-h\">Putting it together<\/h3><ul><li>Inhalational induction, including in children: sevoflurane.<\/li><li>Fast emergence after long cases or in obesity: desflurane, unless the airway is reactive; weigh its climate impact (<a href=\"#i-a-4-b-14\">I.A.4.b.14<\/a>).<\/li><li>Lowest cost maintenance: isoflurane.<\/li><li>Cutting the volatile dose: add nitrous oxide, unless a closed gas space, B12 deficiency or high nausea risk argues against it.<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a> · <a href=\"#i-a-4-b-4\">I.A.4.b.4 Effects on Cardiovascular System<\/a> · <a href=\"#i-a-4-b-11\">I.A.4.b.11 MAC<\/a> · <a href=\"#i-a-4-b-14\">I.A.4.b.14 Environmental Implications<\/a><\/p>","b":"Choose by speed, airway irritability and side effects: sevoflurane for mask induction, desflurane for the fastest wake-up (not with reactive airways), isoflurane when cost matters, and nitrous oxide as an adjunct.","u":"2026-11-05"},"I.A.4.b.14":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Inhaled anesthetics are exhaled almost unchanged and vented to the atmosphere, where they act as potent greenhouse gases. Desflurane and nitrous oxide have the largest impact; low fresh gas flows, choosing sevoflurane over desflurane, and TIVA or regional techniques reduce it.<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Agent<\/th><th scope=\"col\">Atmospheric lifetime<\/th><th scope=\"col\">100-year global warming potential (CO2 = 1)<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Desflurane<\/th><td>~14 years<\/td><td>~2,540 (published range 1,620–2,720)<\/td><\/tr><tr><th scope=\"row\">Isoflurane<\/th><td>~3.2 years<\/td><td>~510<\/td><\/tr><tr><th scope=\"row\">Sevoflurane<\/th><td>~1.1–1.4 years<\/td><td>~130<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide<\/th><td>~114 years<\/td><td>~265–300, and it depletes ozone<\/td><\/tr><\/tbody><\/table><\/div><p>Values vary by source; these are the ranges compiled in the <a href=\"https://mpog.org/wp-content/uploads/2023/06/MPOGSustainabilityToolkit_FGS-Reference-Update-6-22-2023.pdf\" target=\"_blank\" rel=\"noopener\">MPOG sustainability toolkit<\/a>. For background see <a href=\"https://doi.org/10.1213/ANE.0b013e31824d6150\" target=\"_blank\" rel=\"noopener\">Sulbaek Andersen 2012<\/a>.<\/p><h3 class=\"nb-h\">Why desflurane stands out<\/h3><ul><li>Per molecule it is the strongest greenhouse gas of the group, and it is used at about three to four times the volume percent of sevoflurane, so an hour of desflurane has many times the impact of an hour of sevoflurane at the same fresh gas flow.<\/li><\/ul><h3 class=\"nb-h\">Nitrous oxide<\/h3><ul><li>It persists for over a century and is described as the single most important ozone-depleting emission of this century.<\/li><li>Central N2O pipeline systems leak; hospitals that switched to portable cylinders cut losses.<\/li><\/ul><h3 class=\"nb-h\">What clinicians can do<\/h3><ul><li>Use low fresh gas flows during maintenance. For sevoflurane, the label limits still apply: 1 L/min or more, and no more than 2 MAC-hours at 1 to 2 L/min (see <a href=\"#i-a-4-b-7\">I.A.4.b.7<\/a>).<\/li><li>Avoid desflurane unless there is a clear clinical reason, and avoid routine nitrous oxide.<\/li><li>Consider TIVA or regional anesthesia when appropriate. Propofol's footprint is far smaller, though unused drug must be disposed of properly rather than poured down drains.<\/li><\/ul><h3 class=\"nb-h\">Policy<\/h3><ul><li>The EU prohibits desflurane from 1 January 2026 \"unless its use is required on medical grounds\" (<a href=\"https://www.anaesthesia.ie/sustainability/desflurance-guidance/\" target=\"_blank\" rel=\"noopener\">College of Anaesthesiologists of Ireland<\/a>).<\/li><\/ul><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-4-b-12\">I.A.4.b.12 Trace Concentrations, OR Pollution<\/a> · <a href=\"#i-a-4-b-13\">I.A.4.b.13 Comparative Pharmacodynamics<\/a> · <a href=\"#i-a-4-b-1\">I.A.4.b.1 Physical Properties<\/a><\/p>","b":"Inhaled anesthetics are exhaled almost unchanged and vented to the atmosphere, where they act as potent greenhouse gases. Desflurane and nitrous oxide have the largest impact; low fresh gas flows, choosing sevoflurane over desflurane, and TIVA or regional techniques reduce it.","u":"2026-11-05"}}</script>
<script>
(function () {
  "use strict";
  var RAW = JSON.parse(document.getElementById("outline-data").textContent);
  var EXAM = { I: "BASIC", II: "ADVANCED" };
  var nodes = [], bySlug = new Map();

  function base(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function words(s) { return base(s).replace(/[^a-z0-9]+/g, " ").trim(); }
  /* index text: words split at punctuation, plus a copy with hyphens joined ("non depolarizing" and "nondepolarizing") */
  function norm(s) { return " " + words(s) + " " + base(s).replace(/[-‐‑]/g, "").replace(/[^a-z0-9]+/g, " ").trim() + " "; }
  function build(arr, parent, depth) {
    return arr.map(function (a) {
      var key = a[0].replace(/[.()]/g, "");
      var n = { m: a[0], t: a[1], p: a[2], depth: depth, parent: parent, idx: nodes.length };
      n.code = parent ? parent.code + "." + key : key;
      n.slug = n.code.toLowerCase().replace(/\./g, "-");
      n.part = parent ? parent.part : n;
      n.exam = EXAM[n.part.code];
      n.norm = norm(n.t);
      n.pathNorm = parent ? parent.pathNorm + " " + parent.norm : "";
      nodes.push(n); bySlug.set(n.slug, n);
      n.kids = build(a[3] || [], n, depth + 1);
      return n;
    });
  }
  var tree = build(RAW, null, 0);
  (function stats(list) {
    list.forEach(function (n) {
      stats(n.kids);
      n.count = n.kids.reduce(function (s, k) { return s + 1 + k.count; }, 0);
      n.p0 = n.kids.reduce(function (m, k) { return Math.min(m, k.p0); }, n.p);
      n.p1 = n.kids.reduce(function (m, k) { return Math.max(m, k.p1); }, n.p);
    });
  })(tree);
  var TOTAL = tree.reduce(function (s, p) { return s + p.count; }, 0);
  var sameDepth = {};
  nodes.forEach(function (n) {
    if (n.depth > 3) return;
    var k = n.part.code + ":" + n.depth;
    (sameDepth[k] = sameDepth[k] || []).push(n);
  });

  /* ---------- study notes written for this guide (filled in by build_site.py from ../notes) ---------- */
  var NOTES = {};
  try { NOTES = JSON.parse(document.getElementById("notes-data").textContent) || {}; } catch (e) { NOTES = {}; }
  nodes.forEach(function (n) { var s = NOTES[n.code]; if (s && typeof s.h === "string") n.sn = s; });
  (function countNotes(list) {
    list.forEach(function (n) { countNotes(n.kids); n.snCount = (n.sn ? 1 : 0) + n.kids.reduce(function (s, k) { return s + k.snCount; }, 0); });
  })(tree);
  /* items below a subtopic get their own page only when they have study notes */
  function hasPage(n) { return n.depth <= 3 || !!n.sn; }
  function pageFor(n) { while (n && !hasPage(n)) n = n.parent; return n; }
  function decodeEnt(s) { return s.replace(/&(amp|lt|gt|quot|#x27|#39);/g, function (m, e) { return { amp: "&", lt: "<", gt: ">", quot: '"', "#x27": "'", "#39": "'" }[e]; }); }
  function snPlain(n) {
    if (n.snPlain === undefined) n.snPlain = decodeEnt(n.sn.h.replace(/<[^>]+>/g, " ")).replace(/ +/g, " ").trim();
    return n.snPlain;
  }
  function snNorm(n) { if (n.snNorm === undefined) n.snNorm = norm(snPlain(n)); return n.snNorm; }
  function snip(n, terms) {
    var t = snPlain(n), low = base(t), i = -1;
    var cands = (terms.length > 1 ? [terms.join(" ")] : []).concat(terms.filter(function (x) { return x.length > 1; }).sort(function (x, y) { return y.length - x.length; }));
    for (var k = 0; k < cands.length && i < 0; k++) {
      var m = new RegExp("(^|[^a-z0-9])" + escRe(cands[k])).exec(low);
      if (m) i = m.index + m[1].length;
    }
    if (i < 0) i = 0;
    var start = Math.max(0, i - 70);
    if (start > 0) { var sp = t.indexOf(" ", start); if (sp >= 0 && sp < i) start = sp + 1; }
    var end = Math.min(t.length, start + 200);
    if (end < t.length) { var sp2 = t.lastIndexOf(" ", end); if (sp2 > i) end = sp2; }
    return (start > 0 ? "…" : "") + t.slice(start, end) + (end < t.length ? "…" : "");
  }
  /* a search matches study notes when every term is there; one-letter terms (like the A in "compound A") only count as part of the whole phrase */
  function snHit(n, terms) {
    var t = snNorm(n), phrase = terms.length > 1 && t.indexOf(" " + terms.join(" ")) >= 0;
    var ok = terms.every(function (x) { return x.length > 1 ? t.indexOf(" " + x) >= 0 : phrase; });
    return ok ? (phrase ? 1.5 : 1) : 0;
  }
  function snSection(n) {
    var s = n.sn, when = longDate(s.u);
    return '<section class="sn' + (n.exam === "ADVANCED" ? " adv" : "") + '" aria-labelledby="sn-h"><div class="sn-head"><h2 id="sn-h">Study notes</h2>' +
      (s.d ? '<span class="badge b-draft">Draft</span>' : "") + (when ? '<span class="sn-meta">Updated ' + esc(when) + "</span>" : "") + "</div>" +
      '<div class="sn-body">' + s.h + "</div></section>";
  }
  function snPanel() {
    var groups = new Map(), total = 0, draft = false;
    nodes.forEach(function (n) {
      if (!n.sn || !visiblePart(n.part)) return;
      if (n.sn.d) draft = true;
      var g = n.depth <= 3 ? n : ancestorAt(n, 3);
      groups.set(g, (groups.get(g) || 0) + 1); total++;
    });
    if (!groups.size) return "";
    return '<section class="panel"><div class="panel-head"><h2>Study notes</h2><span class="n">' + plural(total, "topic", "topics") + "</span></div>" +
      '<p class="panel-note">' + (draft ? "Drafts for review. Residents see study notes only after they’re approved." : "Written for this guide. Look for the Notes tag in any topic list." + (FB.mode ? " If something looks wrong, tell your attending with the Feedback button." : "")) + "</p>" +
      '<ul class="links sn-links">' + Array.from(groups.keys()).sort(function (a, b) { return a.idx - b.idx; }).map(function (g) {
        return '<li><a href="#' + g.slug + '"><span class="mk">' + esc(g.code) + "</span><span>" + esc(g.t) + '</span><span class="n">' + groups.get(g) + "</span></a></li>";
      }).join("") + "</ul></section>";
  }

  var $ = function (s) { return document.querySelector(s); };
  var main = $("#main"), status = $("#status"), q = $("#q"), side = $("#sidebar"), scrim = $("#scrim"), menuBtn = $("#menu-btn"), treeEl = $("#tree");
  var filter = "all";
  try { var saved = localStorage.getItem("exam-filter"); if (saved === "BASIC" || saved === "ADVANCED") filter = saved; } catch (e) {}

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function hl(text, re) {
    if (!re) return esc(text);
    var out = "", last = 0;
    text.replace(re, function (m, pre, word, off) { out += esc(text.slice(last, off)) + esc(pre) + "<mark>" + esc(word) + "</mark>"; last = off + m.length; return m; });
    return out + esc(text.slice(last));
  }
  function splitHead(t) {
    var i = t.indexOf(": ");
    return (i > 0 && i <= 70) ? [t.slice(0, i), t.slice(i + 2)] : [t, null];
  }
  function fmt(t, re) {
    var s = splitHead(t);
    return s[1] === null ? hl(t, re) : "<strong>" + hl(s[0], re) + ":</strong> " + hl(s[1], re);
  }
  function short(t, max) {
    max = max || 54;
    var s = splitHead(t)[0];
    if (s.length <= max) return s;
    var cut = s.lastIndexOf(" ", max);
    return s.slice(0, cut > 20 ? cut : max).replace(/[,;:]$/, "") + "…";
  }
  function badge(n) { return '<span class="badge ' + (n.exam === "BASIC" ? "b-basic" : "b-adv") + '">' + n.exam + "</span>"; }
  function pages(n) { return n.p0 === n.p1 ? "Outline p. " + n.p0 : "Outline pp. " + n.p0 + "–" + n.p1; }
  function plural(k, one, many) { return k.toLocaleString() + " " + (k === 1 ? one : many); }
  function ancestorAt(n, d) { while (n.depth > d) n = n.parent; return n; }
  function label(n) { return n.depth === 0 ? n.t.replace(/ in Anesthesiology$/, "") : n.m + " " + short(n.t); }
  function visiblePart(p) { return filter === "all" || p.exam === filter; }

  /* ---------- sidebar ---------- */
  var chevron = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function sideList(kids, depth) {
    if (!kids.length || depth > 3) return "";
    return '<ul class="side-ul d' + depth + '"' + (depth >= 3 ? " hidden" : "") + ">" + kids.map(function (k) {
      var has = depth < 3 && k.kids.length > 0;
      return '<li data-slug="' + k.slug + '"><div class="side-row">' +
        (has ? '<button class="twisty" type="button" aria-expanded="' + (depth < 2) + '" aria-label="Show subtopics of ' + esc(short(k.t, 40)) + '">' + chevron + "</button>" : '<span class="twisty-sp"></span>') +
        '<a href="#' + k.slug + '" data-slug="' + k.slug + '" title="' + esc(k.t) + '"><span class="mk">' + esc(k.m) + '</span><span class="lbl">' + esc(k.t) + "</span></a></div>" +
        (depth < 3 ? sideList(k.kids, depth + 1) : "") + "</li>";
    }).join("") + "</ul>";
  }
  treeEl.innerHTML = tree.map(function (p) {
    return '<section class="side-part" data-exam="' + p.exam + '"><a class="side-part-head" href="#' + p.slug + '" data-slug="' + p.slug + '">' + badge(p) +
      "<span>" + esc(p.t) + "</span></a>" + sideList(p.kids, 1) + "</section>";
  }).join("");
  function setOpen(li, open) {
    var ul = li.querySelector(":scope > ul"), b = li.querySelector(":scope > .side-row > .twisty");
    if (ul) ul.hidden = !open;
    if (b) b.setAttribute("aria-expanded", String(open));
  }
  treeEl.addEventListener("click", function (e) {
    var b = e.target.closest(".twisty");
    if (b) { var li = b.closest("li"); setOpen(li, b.getAttribute("aria-expanded") !== "true"); }
  });
  $("#expand-all").addEventListener("click", function () { treeEl.querySelectorAll("li").forEach(function (li) { setOpen(li, true); }); });
  $("#collapse-all").addEventListener("click", function () {
    treeEl.querySelectorAll(".side-ul.d1 > li").forEach(function (li) { setOpen(li, false); });
    treeEl.querySelectorAll(".side-ul.d2 > li").forEach(function (li) { setOpen(li, false); });
  });
  function setActive(n) {
    if (n && n.depth > 3) n = ancestorAt(n, 3);
    treeEl.querySelectorAll('[aria-current="page"]').forEach(function (a) { a.removeAttribute("aria-current"); });
    if (!n) return;
    var a = treeEl.querySelector('a[data-slug="' + n.slug + '"]');
    if (!a) return;
    a.setAttribute("aria-current", "page");
    var li = a.closest("li");
    if (li && n.depth === 2) setOpen(li, true);
    for (var p = li && li.parentElement.closest("li"); p; p = p.parentElement.closest("li")) setOpen(p, true);
    var r = a.getBoundingClientRect(), s = side.getBoundingClientRect();
    if (r.top < s.top + 60 || r.bottom > s.bottom - 20) side.scrollTop += r.top - s.top - s.height / 3;
  }

  /* ---------- filter ---------- */
  function applyFilter() {
    document.querySelectorAll('input[name="exam"]').forEach(function (r) { r.checked = r.value === filter; });
    treeEl.querySelectorAll(".side-part").forEach(function (s) { s.hidden = !(filter === "all" || s.dataset.exam === filter); });
  }
  document.querySelectorAll('input[name="exam"]').forEach(function (r) {
    r.addEventListener("change", function () {
      filter = r.value;
      try { localStorage.setItem("exam-filter", filter); } catch (e) {}
      applyFilter();
      if (q.value.trim()) renderResults(q.value); else if (!currentPage()) route(true);
    });
  });

  /* ---------- views ---------- */
  function crumbs(n) {
    var chain = [];
    for (var a = n.parent; a; a = a.parent) chain.unshift(a);
    return '<nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Home</a>' + chain.map(function (a) {
      return '<span class="sep" aria-hidden="true">/</span><a href="#' + a.slug + '">' + esc(label(a)) + "</a>";
    }).join("") + "</nav>";
  }
  function head(n, facts) {
    var s = splitHead(n.t), title = n.depth === 0 ? n.t : s[0];
    return crumbs(n) +
      '<div class="eyebrow">' + badge(n) + '<span class="code">' + esc(n.code) + "</span><span>" + pages(n) + "</span></div>" +
      "<h1" + (title.length > 90 ? ' class="long"' : "") + ">" + (n.depth ? '<span class="h-mk">' + esc(n.m) + "</span> " : "") + esc(title) + "</h1>" +
      (n.depth && s[1] ? '<p class="lead">' + esc(s[1]) + "</p>" : "") +
      (facts && facts.length ? '<ul class="facts">' + facts.map(function (f) { return "<li>" + f + "</li>"; }).join("") + "</ul>" : "");
  }
  function pill(n) { return '<span class="pill' + (n.exam === "ADVANCED" ? " adv" : "") + '">Notes</span>'; }
  function outline(kids) {
    if (!kids.length) return "";
    return '<ul class="ol">' + kids.map(function (k) {
      var tx = k.sn && k.depth > 3 ? '<a class="ol-link" href="#' + k.slug + '">' + fmt(k.t) + "</a>" + pill(k) + (k.sn.b ? '<span class="ol-bl">' + esc(k.sn.b) + "</span>" : "") : fmt(k.t);
      return '<li data-code="' + k.code + '"><div class="row"><span class="mk">' + esc(k.m) + '</span><span class="tx">' + tx + "</span></div>" + outline(k.kids) + "</li>";
    }).join("") + "</ul>";
  }
  function linkList(kids, withCounts) {
    return '<ul class="links">' + kids.map(function (k) {

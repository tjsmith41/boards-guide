      '<button type="button" class="btn" data-act="restore">Restore from a backup</button>' +
      '<span class="tools-status' + (tool.err ? " err" : "") + '" id="tools-status" role="status">' + esc(tool.msg) + "</span></div>" +
      '<div class="callout"><p><strong>Keep a backup.</strong> Clearing this browser’s history or site data deletes your notes, and some browsers, Safari in particular, can clear saved data for sites you haven’t opened in a while.</p>' +
      "<p>A backup file also moves your notes to another device or browser. Open the guide there, come to this page, and choose Restore from a backup.</p></div>" +
      (list.length ? '<ol class="note-list">' + list.map(function (x) {
        var when = fmtDate(x.v.u);
        return '<li><a class="res" href="#' + x.n.slug + '"><div class="res-top">' + badge(x.n) + '<span class="code">' + esc(x.n.code) + "</span>" +
          (when ? '<span class="code">' + esc(when) + "</span>" : "") + "</div>" +
          '<div class="res-text"><strong>' + esc(label(x.n)) + '</strong></div><p class="note-snip">' + esc(x.v.t.length > 280 ? x.v.t.slice(0, 280) + "…" : x.v.t) + "</p></a></li>";
      }).join("") + "</ol>" :
        '<p class="empty-note">No notes yet. Open any topic and write in its My notes box.</p>');
  }
  function saveFile(name, text, type) {
    var url = URL.createObjectURL(new Blob([text], { type: type }));
    var a = document.createElement("a");
    a.href = url; a.download = name; a.hidden = true;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 60000);
  }
  function downloadText() {
    var list = sortedNotes();
    var lines = ["# My notes: Anesthesia Boards Navigator", "", "Exported " + longDate(localDay()) + " · " + plural(list.length, "topic", "topics"), ""];
    list.forEach(function (x) { lines.push("## " + x.n.code + " " + x.n.t + " (" + x.n.exam + ")", "", x.v.t, ""); });
    saveFile("anesthesia-boards-notes.txt", lines.join(NL), "text/plain;charset=utf-8");
    tools("Downloaded a text copy of your notes.");
  }
  function backupNotes() {
    var data = { app: "anesthesia-boards-navigator", kind: "notes-backup", version: 1, exported: nowIso(), notes: readNotes() };
    saveFile("anesthesia-boards-notes-backup-" + localDay() + ".json", JSON.stringify(data, null, 1), "application/json");
    setItem("abn-last-backup", data.exported);
    tool.msg = "Backup file downloaded. Keep it somewhere safe, like your email or cloud storage."; tool.err = false;
    renderMyNotes();
  }
  var fileIn = document.getElementById("restore-file");
  fileIn.addEventListener("change", function () {
    var f = fileIn.files && fileIn.files[0];
    if (!f) return;
    if (f.size > 5000000) { fileIn.value = ""; tools("That file is too large to be a notes backup.", true); return; }
    var rd = new FileReader();
    rd.onload = function () { fileIn.value = ""; restoreFrom(String(rd.result || "")); };
    rd.onerror = function () { fileIn.value = ""; tools("Couldn’t read that file.", true); };
    rd.readAsText(f);
  });
  function restoreFrom(text) {
    var data = null;
    try { data = JSON.parse(text); } catch (e) {}
    var src = data && data.kind === "notes-backup" && data.notes && typeof data.notes === "object" && !Array.isArray(data.notes) ? data.notes : null;
    if (!src) { tools("That file isn’t a notes backup from this guide.", true); return; }
    var all = readNotes(), added = 0, updated = 0, kept = 0;
    Object.keys(src).forEach(function (k) {
      var b = src[k];
      if (!/^[a-z0-9-]{1,40}$/.test(k) || !b || typeof b.t !== "string" || !b.t.trim()) return;
      var e = { t: b.t, u: typeof b.u === "string" ? b.u.slice(0, 40) : "", c: typeof b.c === "string" ? b.c.slice(0, 40) : "", x: typeof b.x === "string" ? b.x.slice(0, 160) : "" };
      var a = all[k];
      if (!a || typeof a.t !== "string" || !a.t) { all[k] = e; added++; }
      else if (a.t === e.t) return;
      else if (e.u > (typeof a.u === "string" ? a.u : "")) { all[k] = e; updated++; }
      else kept++;
    });
    if ((added || updated) && !setItem(LKEY, JSON.stringify(all))) { tools("Couldn’t save the restored notes. This browser is blocking storage, or its storage is full.", true); return; }
    notes = all;
    tools(!added && !updated ?
      (kept ? "Nothing restored. The notes in this browser are newer than the ones in that backup." : "Nothing new to restore. This browser already has every note in that backup.") :
      "Restored " + plural(added + updated, "note", "notes") + "." + (!kept ? "" : kept === 1 ? " 1 note was newer in this browser, so it was kept." : " " + plural(kept, "note", "notes") + " were newer in this browser, so those were kept."));
    notesChanged();
  }
  main.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var act = b.dataset.act;
    if (act === "download-notes") downloadText();
    else if (act === "backup") backupNotes();
    else if (act === "restore") { tools(""); fileIn.click(); }
  });
  updateNoteDots();

  /* ---------- feedback: sent to a Google Form from inside the page, or written in the resident's email app ---------- */
  var FB = (function () {
    var form = typeof CONFIG.feedbackForm === "string" ? CONFIG.feedbackForm.trim() : "";
    var fields = CONFIG.formFields && typeof CONFIG.formFields === "object" ? CONFIG.formFields : {};
    var email = typeof CONFIG.feedbackEmail === "string" ? CONFIG.feedbackEmail.trim() : "";
    if (form.indexOf("https://docs.google.com/forms/") === 0) {
      var base = form.split("?")[0].split("#")[0];
      base = base.slice(0, base.lastIndexOf("/"));
      return fields.text ? { mode: "form", action: base + "/formResponse", fields: fields } : { mode: "link", url: base + "/viewform", fields: fields };
    }
    if (email.indexOf("@") > 0) return { mode: "email", email: email, fields: {} };
    return { mode: "", fields: {} };
  })();
  var fbBtn = document.getElementById("fb-btn"), fbDlg = document.getElementById("fb-dialog"), fbForm = document.getElementById("fb-form"),
      fbText = document.getElementById("fb-text"), fbName = document.getElementById("fb-name"), fbStatus = document.getElementById("fb-status"),
      fbSend = document.getElementById("fb-send"), fbTopic = null;
  fbBtn.hidden = !FB.mode;
  function pageTopic() {
    var t = q.value.trim() ? null : currentPage();
    return t ? pageFor(t) : null;
  }
  function topicText(t) { return t.code + " " + short(t.t, 80); }
  function openFeedback() {
    fbTopic = pageTopic();
    if (FB.mode === "link") {
      var u = FB.url;
      if (FB.fields.topic && fbTopic && fbTopic.depth > 0) u += "?usp=pp_url&" + encodeURIComponent(FB.fields.topic) + "=" + encodeURIComponent(topicText(fbTopic));
      window.open(u, "_blank", "noopener");
      return;
    }
    var row = document.getElementById("fb-topic-row");
    if (fbTopic && fbTopic.depth > 0) {
      row.hidden = false;
      document.getElementById("fb-topic-label").textContent = "This topic: " + fbTopic.code + " " + short(fbTopic.t, 48);
      document.getElementById("fb-about-topic").checked = true;
    } else {
      row.hidden = true;
      document.getElementById("fb-about-general").checked = true;
    }
    var named = FB.mode === "form" && !!FB.fields.name;
    document.getElementById("fb-name-row").hidden = !named;
    if (named && !fbName.value) fbName.value = getItem("abn-fb-name") || "";
    document.getElementById("fb-sub").textContent = FB.mode === "email" ?
      "This opens your email app with a message to your attending (" + FB.email + ")." :
      named ? "Goes privately to your attending. It’s anonymous unless you add your name." : "Goes privately to your attending, without your name.";
    fbSend.textContent = FB.mode === "email" ? "Open email" : "Send";
    fbStatus.textContent = ""; fbStatus.className = ""; fbSend.disabled = false;
    if (typeof fbDlg.showModal === "function") { if (!fbDlg.open) fbDlg.showModal(); } else fbDlg.setAttribute("open", "");
    fbText.focus();
  }
  function closeFeedback() { if (typeof fbDlg.close === "function") fbDlg.close(); else fbDlg.removeAttribute("open"); }
  fbBtn.addEventListener("click", openFeedback);
  document.getElementById("fb-close").addEventListener("click", closeFeedback);
  fbDlg.addEventListener("click", function (e) { if (e.target === fbDlg) closeFeedback(); });
  fbForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    var text = fbText.value.trim();
    if (!text) { fbStatus.className = "err"; fbStatus.textContent = "Write a message first."; fbText.focus(); return; }
    var topic = fbTopic && fbTopic.depth > 0 && document.getElementById("fb-about-topic").checked ? topicText(fbTopic) : "";
    if (FB.mode === "email") {
      var href = "mailto:" + FB.email + "?subject=" + encodeURIComponent("Boards guide feedback" + (topic ? ": " + fbTopic.code : "")) +
        "&body=" + encodeURIComponent(text + NL + NL + "About: " + (topic || "The guide in general"));
      var a = document.createElement("a");
      a.href = href; a.hidden = true;
      document.body.appendChild(a); a.click(); a.remove();
      fbStatus.className = "ok";
      fbStatus.innerHTML = 'Your email app should open with this message. If it didn’t, email <a href="' + esc(href) + '">' + esc(FB.email) + "</a>.";
      return;
    }
    var name = FB.fields.name ? fbName.value.trim().slice(0, 80) : "";
    if (FB.fields.name) setItem("abn-fb-name", name);
    var body = new URLSearchParams();
    body.append(FB.fields.text, text.slice(0, 2000));
    if (FB.fields.topic) body.append(FB.fields.topic, topic || "The guide in general");
    if (name) body.append(FB.fields.name, name);
    fbSend.disabled = true; fbStatus.className = ""; fbStatus.textContent = "Sending…";
    try {
      await fetch(FB.action, { method: "POST", mode: "no-cors", body: body });
      fbText.value = "";
      fbStatus.className = "ok"; fbStatus.textContent = "Sent. Thank you!";
    } catch (err) {
      fbStatus.className = "err"; fbStatus.textContent = "Couldn’t send. Check your connection and try again.";
    }
    fbSend.disabled = false;
  });

  function setPlaceholder() {
    q.placeholder = (q.offsetWidth || window.innerWidth) < 520 ? "Search " + TOTAL.toLocaleString() + " topics" : "Search " + TOTAL.toLocaleString() + " topics, e.g. one-lung, MAC, malignant hyperthermia";
  }
  setPlaceholder();
  window.addEventListener("resize", setPlaceholder);
  applyFilter();
  route(false);
})();
</script>
</body>
</html>

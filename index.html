uctor whose resistance changes with temperature (usually falling as it warms)<\/td><td>The most common probe, also used in pulmonary artery catheters; fast and accurate<\/td><\/tr><tr><th scope=\"row\">Thermocouple<\/th><td>The junction of two different metals produces a voltage that depends on temperature (Seebeck effect)<\/td><td>Small and robust<\/td><\/tr><tr><th scope=\"row\">Infrared<\/th><td>Detects infrared radiation from the eardrum or skin<\/td><td>Quick; ear readings vary with technique<\/td><\/tr><tr><th scope=\"row\">Liquid crystal strip<\/th><td>Changes color with skin temperature<\/td><td>Skin only; a poor guide to core<\/td><\/tr><tr><th scope=\"row\">Zero-heat-flux sensor<\/th><td>Heats the skin under it until no heat flows out, so the skin there reaches core temperature<\/td><td>Noninvasive core estimate on the forehead; useful in awake patients and under regional anesthesia<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Measurement sites<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Site<\/th><th scope=\"col\">Reflects<\/th><th scope=\"col\">Pitfalls<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Pulmonary artery<\/th><td>Core, the reference standard<\/td><td>Invasive; cold injectate disturbs it briefly<\/td><\/tr><tr><th scope=\"row\">Distal esophagus<\/th><td>Core<\/td><td>Must sit in the lower third, where heart sounds are loudest; higher up, airway gas cools it<\/td><\/tr><tr><th scope=\"row\">Nasopharynx<\/th><td>Core, close to brain temperature<\/td><td>Gas leaking around the tube cools it; can cause nosebleeds<\/td><\/tr><tr><th scope=\"row\">Tympanic membrane<\/th><td>Core, close to the hypothalamus<\/td><td>Contact probes can perforate the eardrum<\/td><\/tr><tr><th scope=\"row\">Bladder<\/th><td>Near core when urine flow is good<\/td><td>Lags when urine output is low<\/td><\/tr><tr><th scope=\"row\">Rectum<\/th><td>Near core<\/td><td>Lags during rapid cooling or warming<\/td><\/tr><tr><th scope=\"row\">Axilla<\/th><td>Near core only over the axillary artery with the arm at the side<\/td><td>Otherwise reads low<\/td><\/tr><tr><th scope=\"row\">Skin (forehead)<\/th><td>Below core<\/td><td>Varies with skin blood flow and room temperature<\/td><\/tr><\/tbody><\/table><\/div><ul><li>During cardiopulmonary bypass several sites are monitored, because they diverge during cooling and rewarming.<\/li><\/ul><h3 class=\"nb-h\">Why it matters<\/h3><ul><li>General and neuraxial anesthesia impair thermoregulation. Core temperature falls about 1 to 1.5 °C in the first hour as heat redistributes from core to periphery, then falls more slowly until vasoconstriction returns (see <a href=\"#i-c-1-a-7\">I.C.1.a.7<\/a>).<\/li><li>Mild hypothermia increases wound infection, bleeding, cardiac events, drug duration and shivering (see <a href=\"#i-b-6-c-1\">I.B.6.c.1<\/a>).<\/li><li>Monitoring also catches overheating from warming devices, especially in children, and the rise of malignant hyperthermia, although a rising end-tidal CO2 usually comes first.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a rectal or bladder probe can lag core temperature by many minutes during rapid cooling or warming. Use an esophageal, nasopharyngeal or pulmonary artery site when temperature is changing fast.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-c-1-a-7-e\">I.C.1.a.7.e Body Temperature Measurement; Sites; Gradients<\/a> · <a href=\"#i-b-6-c-1\">I.B.6.c.1 Hypothermia<\/a> · <a href=\"#i-a-2-i-6\">I.A.2.i.6 Body Warming Devices<\/a> · <a href=\"#i-c-1-a-7\">I.C.1.a.7 Temperature Regulation<\/a><\/p>","b":"Core temperature is best measured in the pulmonary artery, distal esophagus, nasopharynx or at the tympanic membrane. Bladder and rectal readings lag during rapid changes, and skin reads below core. Thermistors and thermocouples are the usual sensors. The ASA standard calls for temperature monitoring whenever clinically significant changes are intended, anticipated or suspected.","u":"2026-11-05"},"I.A.2.h.5":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Pulse oximetry estimates arterial saturation from how much red and infrared light the pulsing part of the signal absorbs. It is calibrated in healthy volunteers, so it is least accurate at low saturations, in poor perfusion and with abnormal hemoglobins, and it can overestimate saturation in patients with darker skin. Co-oximetry of a blood sample measures oxyhemoglobin, deoxyhemoglobin, carboxyhemoglobin and methemoglobin directly and is the reference.<\/p><h3 class=\"nb-h\">How a pulse oximeter works<\/h3><ul><li>Oximetry rests on the Beer–Lambert law: the light absorbed depends on the concentration of the absorbing substance and the distance the light travels through it.<\/li><li>Deoxyhemoglobin absorbs more red light (660 nm); oxyhemoglobin absorbs more infrared light (about 940 nm).<\/li><li>The probe shines both through a finger, earlobe or forehead and separates the pulsatile (arterial) part of the absorption from the steady background of tissue and venous blood.<\/li><li>It calculates the ratio R = (pulsatile ÷ steady absorbance at 660 nm) ÷ (pulsatile ÷ steady absorbance at 940 nm) and converts R to SpO2 with a calibration curve. R of 1.0 corresponds to about 85% and R of 0.4 to about 100%.<\/li><li>Volunteers can only be desaturated safely to about 70 to 80%, so lower readings are extrapolated and less accurate.<\/li><li>Readings lag behind arterial changes, more at the finger than at the ear or forehead, especially with vasoconstriction.<\/li><\/ul><h3 class=\"nb-h\">Sources of error<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Problem<\/th><th scope=\"col\">Effect<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Carboxyhemoglobin<\/th><td>Read as oxyhemoglobin, so SpO2 is falsely high, roughly oxyhemoglobin plus carboxyhemoglobin<\/td><\/tr><tr><th scope=\"row\">Methemoglobin<\/th><td>Absorbs red and infrared light about equally, pushing R toward 1 and SpO2 toward about 85%: falsely low when true saturation is high, falsely high when it is low<\/td><\/tr><tr><th scope=\"row\">Dyes (methylene blue most; also indocyanine green, isosulfan blue, indigo carmine)<\/th><td>Brief falsely low readings<\/td><\/tr><tr><th scope=\"row\">Darker skin pigmentation<\/th><td>Can overestimate true saturation and hide hypoxemia<\/td><\/tr><tr><th scope=\"row\">Poor perfusion (cold, vasoconstriction, hypotension, vasopressors)<\/th><td>Weak signal, dropout or error<\/td><\/tr><tr><th scope=\"row\">Motion and shivering<\/th><td>Artifact, reduced by modern signal processing<\/td><\/tr><tr><th scope=\"row\">Venous pulsation (tricuspid regurgitation, a tight probe, a dependent limb)<\/th><td>Falsely low<\/td><\/tr><tr><th scope=\"row\">Ambient light and electrical interference<\/th><td>Erratic readings; shield the probe<\/td><\/tr><tr><th scope=\"row\">Anemia<\/th><td>Usually accurate until anemia is severe<\/td><\/tr><tr><th scope=\"row\">Fetal hemoglobin and bilirubin<\/th><td>Little effect<\/td><\/tr><\/tbody><\/table><\/div><ul><li>In two large cohorts, occult hypoxemia (arterial saturation below 88% despite SpO2 of 92 to 96%) was nearly three times as frequent in Black patients as in White patients (<a href=\"https://doi.org/10.1056/NEJMc2029240\" target=\"_blank\" rel=\"noopener\">Sjoding 2020<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Co-oximetry<\/h3><ul><li>A co-oximeter, often part of the blood gas analyzer, passes light of several wavelengths through a hemolyzed blood sample and solves for oxyhemoglobin, deoxyhemoglobin, carboxyhemoglobin and methemoglobin.<\/li><li>It reports fractional saturation: oxyhemoglobin ÷ all hemoglobin, including abnormal forms. Pulse oximetry approximates functional saturation: oxyhemoglobin ÷ (oxyhemoglobin + deoxyhemoglobin).<\/li><li>A blood gas analyzer without co-oximetry calculates saturation from PO2 using a standard dissociation curve, so the calculated value looks normal in carbon monoxide poisoning and methemoglobinemia.<\/li><li>Use co-oximetry when carbon monoxide or methemoglobin is possible, or when SpO2 does not fit the clinical picture. Multiwavelength pulse oximeters can estimate carboxyhemoglobin and methemoglobin noninvasively, less accurately.<\/li><\/ul><h3 class=\"nb-h\">Other oximetry<\/h3><ul><li>Fiberoptic reflectance oximetry in a pulmonary artery catheter gives continuous mixed venous saturation (normally about 65 to 75%), which falls when oxygen delivery falls relative to consumption.<\/li><li>Cerebral near-infrared spectroscopy is covered in <a href=\"#i-a-2-i-4\">I.A.2.i.4<\/a>.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> in carbon monoxide poisoning, SpO2, PaO2 and a calculated saturation can all look normal. Only co-oximetry of a blood sample shows the low oxyhemoglobin.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-g-3-e\">I.A.2.g.3.e Toxicity: Compound A, Carbon Monoxide<\/a> · <a href=\"#i-a-2-i-1\">I.A.2.i.1 Arterial and Venous Blood Gases<\/a> · <a href=\"#i-a-2-i-4\">I.A.2.i.4 Neurologic Function Monitors<\/a> · <a href=\"#i-a-2-h\">I.A.2.h Monitoring Methods<\/a><\/p>","b":"Pulse oximetry estimates arterial saturation from how much red and infrared light the pulsing part of the signal absorbs. It is calibrated in healthy volunteers, so it is least accurate at low saturations, in poor perfusion and with abnormal hemoglobins, and it can overestimate saturation in patients with darker skin. Co-oximetry of a blood sample measures oxyhemoglobin, deoxyhemoglobin, carboxyhemoglobin and methemoglobin directly and is the reference.","u":"2026-11-05"},"I.A.2.h.6":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Noninvasive methods detect when an occluding cuff stops and then allows arterial flow, by feel (palpation), sound (Korotkoff), ultrasound (Doppler) or cuff pressure oscillations (oscillometry). Oscillometry measures mean pressure most directly and calculates systolic and diastolic. A cuff that is too small reads high. An arterial line gives beat-to-beat pressure and blood samples, and its accuracy depends on leveling, zeroing and the dynamic response of the tubing and transducer (<a href=\"#i-a-2-i-3\">I.A.2.i.3<\/a>).<\/p><h3 class=\"nb-h\">Cuff size and position<\/h3><ul><li>The bladder should be about 40% of the arm's circumference wide and at least 80% of it long.<\/li><li>Too small a cuff reads falsely high; too large reads slightly low.<\/li><li>Height matters: each 10 cm of difference between the cuff and the heart changes the reading by about 7.4 mmHg. In a beach-chair position, brain pressure is lower than an arm cuff shows.<\/li><\/ul><h3 class=\"nb-h\">Noninvasive methods<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Method<\/th><th scope=\"col\">How flow is detected<\/th><th scope=\"col\">What it gives<\/th><th scope=\"col\">Notes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Palpation<\/th><td>The distal pulse returns as the cuff deflates<\/td><td>Systolic only<\/td><td>Reads slightly low; useful when sounds cannot be heard<\/td><\/tr><tr><th scope=\"row\">Auscultation<\/th><td>Korotkoff sounds from turbulent flow under the partly deflated cuff<\/td><td>Systolic at the first sound (phase I); diastolic when sounds disappear (phase V) or muffle (phase IV)<\/td><td>Poor with low flow, vasoconstriction or noise; an auscultatory gap can hide the true systolic if the cuff is not inflated high enough<\/td><\/tr><tr><th scope=\"row\">Doppler<\/th><td>Frequency shift from moving red cells under an ultrasound probe<\/td><td>Systolic<\/td><td>Works at low flows; useful in infants, shock and obesity<\/td><\/tr><tr><th scope=\"row\">Oscillometry<\/th><td>Pressure oscillations transmitted to the cuff by the pulsing artery<\/td><td>Mean at the point of maximal oscillation; systolic and diastolic calculated<\/td><td>The automated standard; errors with arrhythmias, motion, shivering and extreme pressures; frequent cycling can injure skin and nerves<\/td><\/tr><tr><th scope=\"row\">Continuous noninvasive<\/th><td>A finger cuff that keeps the artery's volume constant (volume clamp), or tonometry over the radial artery<\/td><td>Beat-to-beat waveform<\/td><td>Less reliable with vasoconstriction; needs calibration<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Invasive arterial pressure<\/h3><ul><li>Uses: rapid pressure changes or vasoactive drugs, major surgery, frequent blood sampling, failed noninvasive measurement, and pulse pressure variation to judge fluid responsiveness.<\/li><li>Sites: radial most often, then brachial, femoral, axillary or dorsalis pedis.<\/li><li>Moving away from the aorta, systolic pressure rises, diastolic falls and pulse pressure widens because of wave reflection, while mean pressure barely changes. Trust the mean when sites disagree.<\/li><li>Zero the transducer to atmosphere and level it at the phlebostatic axis (fourth intercostal space, mid-axillary line), or at the ear to estimate brain pressure in a sitting patient.<\/li><li>A transducer below the reference level reads high and one above it reads low, by about 7.4 mmHg per 10 cm.<\/li><li>Air bubbles, clots, kinks and long, compliant tubing distort the waveform (damping and resonance, <a href=\"#i-a-2-i-3\">I.A.2.i.3<\/a>).<\/li><li>Complications: thrombosis, distal ischemia, infection, hematoma, nerve injury, air or clot embolism from flushing, and accidental injection of drugs into the artery.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a cuff that is too small, or a transducer that sits below the heart, both read falsely high. Check cuff size and transducer level before treating the number.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-i-3\">I.A.2.i.3 Pressure Transducers: Resonance, Damping<\/a> · <a href=\"#i-a-2-b-3\">I.A.2.b.3 Principles of Doppler Ultrasound<\/a> · <a href=\"#i-a-2-a-1\">I.A.2.a.1 Pressure Measurement of Gases, Liquids<\/a> · <a href=\"#i-a-2-h-7\">I.A.2.h.7 Heart Function<\/a><\/p>","b":"Noninvasive methods detect when an occluding cuff stops and then allows arterial flow, by feel (palpation), sound (Korotkoff), ultrasound (Doppler) or cuff pressure oscillations (oscillometry). Oscillometry measures mean pressure most directly and calculates systolic and diastolic. A cuff that is too small reads high. An arterial line gives beat-to-beat pressure and blood samples, and its accuracy depends on leveling, zeroing and the dynamic response of the tubing and transducer (I.A.2.i.3).","u":"2026-11-05"},"I.A.2.h.7":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> A precordial or esophageal stethoscope gives continuous heart and breath sounds. The ECG shows rate, rhythm, ischemia and electrolyte effects, and what you can see depends on lead choice and filter mode. Transesophageal and transthoracic echocardiography show filling, contractility, valves and the cause of sudden instability.<\/p><h3 class=\"nb-h\">Heart tones<\/h3><ul><li>A precordial stethoscope on the chest or an esophageal stethoscope behind the heart gives continuous heart and breath sounds. It is used mostly in children, and the esophageal type often carries a temperature sensor.<\/li><li>Fading heart sounds can signal falling cardiac output or deepening anesthesia; a \"mill-wheel\" murmur signals a large venous air embolism.<\/li><li>A precordial Doppler probe over the right heart is the most sensitive noninvasive detector of venous air embolism; transesophageal echocardiography is more sensitive still.<\/li><\/ul><h3 class=\"nb-h\">ECG leads<\/h3><ul><li>A three-electrode system gives leads I, II and III. A five-electrode system adds a precordial lead, usually V5.<\/li><li>Lead II shows P waves best, so it suits rhythm monitoring, and it shows inferior ischemia.<\/li><li>V5 is the most sensitive single lead for ischemia. Combining leads II and V5, or II, V4 and V5, detects more.<\/li><li>With only three electrodes, a modified chest lead approximates V5. In CS5, the right arm electrode goes under the right clavicle and the left arm electrode at the V5 position, and lead I is displayed.<\/li><\/ul><h3 class=\"nb-h\">Filter modes and interference<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Mode<\/th><th scope=\"col\">Bandwidth<\/th><th scope=\"col\">Use<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Diagnostic<\/th><td>About 0.05 to 100 Hz<\/td><td>Accurate ST segments<\/td><\/tr><tr><th scope=\"row\">Monitor<\/th><td>About 0.5 to 40 Hz<\/td><td>Removes baseline wander and noise but can distort ST segments<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Interference comes from electrocautery, mains current (60 Hz), shivering, poor electrode contact and some equipment such as bypass pumps.<\/li><li>Pacemaker spikes can be filtered out or counted as QRS complexes; use the monitor's pacing setting.<\/li><\/ul><h3 class=\"nb-h\">ECG patterns to recognize during anesthesia<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Condition<\/th><th scope=\"col\">ECG findings<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Ischemia<\/th><td>ST depression or elevation of 1 mm or more, measured 60 to 80 ms after the J point; new T wave changes<\/td><\/tr><tr><th scope=\"row\">Hyperkalemia<\/th><td>Peaked T waves, then a wide QRS and loss of P waves, then a sine wave<\/td><\/tr><tr><th scope=\"row\">Hypokalemia<\/th><td>Flat T waves, U waves, ST depression<\/td><\/tr><tr><th scope=\"row\">Hypocalcemia<\/th><td>Long QT interval<\/td><\/tr><tr><th scope=\"row\">Hypothermia<\/th><td>J (Osborn) waves, bradycardia, long intervals<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Echocardiography<\/h3><ul><li>Transesophageal echocardiography (TEE) uses a higher-frequency probe close to the heart, giving detailed images through a standard set of views.<\/li><li>It shows ventricular filling and function, regional wall motion (abnormal motion appears with ischemia, often before ECG changes), valve function, air, aortic disease and pericardial effusion.<\/li><li>It is routine in open-heart and thoracic aortic surgery and a rescue tool for unexplained, persistent, life-threatening instability.<\/li><li>Contraindications include esophageal stricture, tumor, recent surgery or perforation, and active upper gastrointestinal bleeding. Complications include dental and oropharyngeal injury, sore throat and, rarely, esophageal perforation.<\/li><li>Transthoracic and focused cardiac ultrasound give fast, noninvasive answers before and after surgery and during resuscitation.<\/li><li>Ultrasound and Doppler physics: <a href=\"#i-a-2-a-3\">I.A.2.a.3<\/a> and <a href=\"#i-a-2-b-3\">I.A.2.b.3<\/a>.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> the ECG monitor's filter mode can create or hide ST changes. Switch to the diagnostic mode before judging the ST segments.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-c-3-a-1-d\">I.C.3.a.1.d Normal ECG<\/a> · <a href=\"#i-a-2-a-3\">I.A.2.a.3 Principles of Ultrasound<\/a> · <a href=\"#i-a-2-b-3\">I.A.2.b.3 Principles of Doppler Ultrasound<\/a> · <a href=\"#ii-c-1-d-1-f-3\">II.C.1.d.1.f.3 Air Embolism<\/a> · <a href=\"#i-a-2-h-6\">I.A.2.h.6 Blood Pressure<\/a><\/p>","b":"A precordial or esophageal stethoscope gives continuous heart and breath sounds. The ECG shows rate, rhythm, ischemia and electrolyte effects, and what you can see depends on lead choice and filter mode. Transesophageal and transthoracic echocardiography show filling, contractility, valves and the cause of sudden instability.","u":"2026-11-05"},"I.A.2.i":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> These are the measuring and support devices behind many monitors: electrodes that measure blood gases, analyzers that identify gases by how they absorb or scatter energy, transducers that turn pressure into an electrical signal, brain monitors, and devices that warm fluids, warm patients and recover shed blood. For each, know the physical principle, how it is calibrated and the errors that follow from it.<\/p><h3 class=\"nb-h\">Principles at a glance<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Device<\/th><th scope=\"col\">Physical principle<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">pH electrode<\/th><td>Voltage across hydrogen ion-sensitive glass<\/td><\/tr><tr><th scope=\"row\">PCO2 electrode (Severinghaus)<\/th><td>CO2 crosses a membrane and changes the pH of a bicarbonate solution<\/td><\/tr><tr><th scope=\"row\">PO2 electrode (Clark)<\/th><td>Current from the reduction of oxygen at a platinum cathode<\/td><\/tr><tr><th scope=\"row\">Infrared gas analysis<\/th><td>Molecules made of two or more different atoms absorb infrared light at characteristic wavelengths<\/td><\/tr><tr><th scope=\"row\">Mass spectrometry<\/th><td>Ionized gas molecules separated by mass-to-charge ratio<\/td><\/tr><tr><th scope=\"row\">Raman analysis<\/th><td>Light scattered with a wavelength shift characteristic of each gas<\/td><\/tr><tr><th scope=\"row\">Pressure transducer<\/th><td>A strain gauge in a Wheatstone bridge<\/td><\/tr><tr><th scope=\"row\">Processed EEG and evoked potentials<\/th><td>Electrical activity of the brain and nerves, processed or averaged<\/td><\/tr><tr><th scope=\"row\">Cerebral oximetry<\/th><td>Absorption of near-infrared light by oxygenated and deoxygenated hemoglobin<\/td><\/tr><tr><th scope=\"row\">Fluid and patient warmers<\/th><td>Heat transfer by conduction, convection and radiation<\/td><\/tr><tr><th scope=\"row\">Cell salvage<\/th><td>Centrifugation to separate and wash red cells<\/td><\/tr><\/tbody><\/table><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-h\">I.A.2.h Monitoring Methods<\/a> · <a href=\"#i-a-2-a-2\">I.A.2.a.2 Transducers, Regulators, Medical Gas Cylinders<\/a> · <a href=\"#i-a-2-m\">I.A.2.m Electrical; Fire and Explosion Hazards; Basic Electronics<\/a><\/p>","b":"These are the measuring and support devices behind many monitors: electrodes that measure blood gases, analyzers that identify gases by how they absorb or scatter energy, transducers that turn pressure into an electrical signal, brain monitors, and devices that warm fluids, warm patients and recover shed blood. For each, know the physical principle, how it is calibrated and the errors that follow from it.","u":"2026-11-05"},"I.A.2.i.1":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> A blood gas analyzer measures pH, PCO2 and PO2 with three electrodes at 37 °C and calculates bicarbonate, base excess and, without co-oximetry, saturation. Sampling errors such as air bubbles, delay and excess heparin are more common than analyzer errors. In hypothermia, alpha-stat management uses the values measured at 37 °C, while pH-stat uses values corrected to the patient's temperature.<\/p><h3 class=\"nb-h\">The electrodes<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Electrode<\/th><th scope=\"col\">Principle<\/th><th scope=\"col\">Notes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">pH<\/th><td>Hydrogen ions create a voltage across thin pH-sensitive glass, measured against a reference electrode (potentiometry)<\/td><td>About 61.5 mV per pH unit at 37 °C (Nernst equation)<\/td><\/tr><tr><th scope=\"row\">PCO2 (Severinghaus)<\/th><td>A pH electrode behind a CO2-permeable membrane: CO2 diffuses into a bicarbonate solution and changes its pH in proportion to the log of PCO2<\/td><td>The slowest of the three to respond<\/td><\/tr><tr><th scope=\"row\">PO2 (Clark)<\/th><td>A voltage of about 0.6 V across a platinum cathode and silver/silver chloride anode; oxygen that diffuses through a membrane is reduced at the cathode, and the current is proportional to PO2 (polarography)<\/td><td>Consumes a little oxygen; membrane damage and protein deposits cause drift<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Calculated values<\/h3><ul><li>Bicarbonate, from the Henderson–Hasselbalch equation: pH = 6.1 + log ([HCO3−] ÷ (0.03 × PCO2)).<\/li><li>Base excess: the acid or base needed to return the blood to pH 7.40 at a PCO2 of 40 mmHg and 37 °C.<\/li><li>Saturation: calculated from PO2 with a standard dissociation curve unless co-oximetry measures it (see <a href=\"#i-a-2-h-5\">I.A.2.h.5<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Calibration<\/h3><ul><li>Analyzers calibrate automatically at two points, with buffers of known pH and gases of known composition, and are checked with quality-control samples.<\/li><li>Point-of-care analyzers calibrate with each single-use cartridge.<\/li><\/ul><h3 class=\"nb-h\">Temperature correction<\/h3><ul><li>Samples are warmed to 37 °C for analysis. In a cold patient, gases are more soluble, so the true PO2 and PCO2 are lower and the pH higher than the values measured at 37 °C.<\/li><li>Rough rules for each 1 °C below 37 °C: pH rises about 0.015, PCO2 falls about 4.5% and PO2 falls about 7%.<\/li><\/ul><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Strategy<\/th><th scope=\"col\">Values used<\/th><th scope=\"col\">Effect<\/th><th scope=\"col\">Typical use<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Alpha-stat<\/th><td>Measured at 37 °C (uncorrected); aim for pH 7.40 and PCO2 40 mmHg<\/td><td>The patient is alkalotic in vivo; cerebral autoregulation is preserved<\/td><td>Adults during moderate hypothermia on bypass<\/td><\/tr><tr><th scope=\"row\">pH-stat<\/th><td>Corrected to the patient's temperature; CO2 is added to keep corrected pH 7.40<\/td><td>Cerebral vasodilation, more brain blood flow and more even cooling, with more risk of carrying emboli to the brain<\/td><td>Children, deep hypothermic circulatory arrest<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Sampling errors<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Error<\/th><th scope=\"col\">Effect<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Air bubble<\/th><td>PO2 moves toward room air values (about 150 mmHg), PCO2 falls and pH rises<\/td><\/tr><tr><th scope=\"row\">Delay at room temperature<\/th><td>Cells keep using oxygen and making CO2: PO2 falls, PCO2 rises and pH falls, more with very high white cell or platelet counts<\/td><\/tr><tr><th scope=\"row\">Excess liquid heparin<\/th><td>Dilution lowers PCO2 and bicarbonate; dry heparin syringes avoid it<\/td><\/tr><tr><th scope=\"row\">Venous blood taken by mistake<\/th><td>Low PO2 and higher PCO2<\/td><\/tr><\/tbody><\/table><\/div><ul><li>In stable patients, peripheral venous pH is only slightly lower and PCO2 slightly higher than arterial, but venous PO2 says nothing about arterial oxygenation.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> an air bubble drags PO2 toward room air values. It falsely lowers PO2 in a patient breathing high oxygen and falsely raises it in a hypoxemic one.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-c-2-a-5-e\">I.C.2.a.5.e Basic Interpretation of Arterial Blood Gas<\/a> · <a href=\"#ii-c-2-c-4-b\">II.C.2.c.4.b Temperature Effect on Blood Gases: Alpha-Stat vs. pH-Stat<\/a> · <a href=\"#i-a-2-h-5\">I.A.2.h.5 Oxygen: Oximetry, Co-Oximetry, Pulse Oximetry<\/a> · <a href=\"#i-a-2-h-3\">I.A.2.h.3 Gas Concentrations<\/a><\/p>","b":"A blood gas analyzer measures pH, PCO2 and PO2 with three electrodes at 37 °C and calculates bicarbonate, base excess and, without co-oximetry, saturation. Sampling errors such as air bubbles, delay and excess heparin are more common than analyzer errors. In hypothermia, alpha-stat management uses the values measured at 37 °C, while pH-stat uses values corrected to the patient's temperature.","u":"2026-11-05"},"I.A.2.i.2":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Most operating room gas monitors use infrared absorption, which measures CO2, nitrous oxide and the volatile agents but not oxygen or nitrogen; oxygen comes from a separate paramagnetic or fuel-cell sensor. Mass spectrometry and Raman scattering can measure nearly every respiratory gas, including nitrogen, but are now rare. Sidestream monitors draw a sample to the analyzer, while mainstream sensors sit in the airway.<\/p><h3 class=\"nb-h\">Infrared absorption<\/h3><ul><li>Molecules made of two or more different atoms, such as CO2, nitrous oxide, water and the volatile agents, absorb infrared light at characteristic wavelengths. Oxygen and nitrogen (two identical atoms) and single-atom gases such as helium and xenon do not.<\/li><li>The light absorbed rises with the gas concentration (Beer–Lambert law).<\/li><li>CO2 is measured near 4.3 µm. Monitors that identify which volatile agent is present compare absorption at several wavelengths, usually in the 8 to 12 µm band.<\/li><li>Nitrous oxide slightly raises the CO2 reading (collision broadening), which monitors correct for. Water vapor also absorbs infrared light, so sampling lines use water traps or water-permeable tubing.<\/li><li>Older single-wavelength agent monitors could not tell agents apart, and methane building up in a closed circuit could be read as agent.<\/li><\/ul><h3 class=\"nb-h\">Sidestream and mainstream sampling<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Type<\/th><th scope=\"col\">How it works<\/th><th scope=\"col\">Strengths<\/th><th scope=\"col\">Weaknesses<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Sidestream (diverting)<\/th><td>A pump draws about 50 to 250 mL/min from the airway through a thin tube to the analyzer<\/td><td>Measures all gases; light at the airway; works with nasal cannulas in awake patients<\/td><td>A delay of a few seconds; water and secretions can block the line; sampled gas must return to the circuit or scavenger; can blunt the waveform when tidal volumes are tiny<\/td><\/tr><tr><th scope=\"row\">Mainstream (nondiverting)<\/th><td>An infrared sensor clips into the airway at the Y-piece<\/td><td>Instant, crisp waveform; no gas removed<\/td><td>Bulkier at the airway; adds dead space; usually measures CO2 only<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Mass spectrometry<\/h3><ul><li>Gas molecules are ionized, accelerated and separated in a magnetic field by mass-to-charge ratio, so every gas of interest can be measured, including oxygen and nitrogen.<\/li><li>CO2 and nitrous oxide both have a mass of 44, so one of them is measured from a fragment ion.<\/li><li>Older systems were shared between several operating rooms, with a delay between readings for each room.<\/li><\/ul><h3 class=\"nb-h\">Raman scattering<\/h3><ul><li>A laser beam passes through the gas. Almost all light scatters at the same wavelength, but a tiny fraction loses energy to molecular vibrations and scatters at a longer wavelength that is characteristic of each molecule.<\/li><li>It measures oxygen, nitrogen, CO2, nitrous oxide and agents, but not single-atom gases such as helium, argon or xenon.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> infrared analyzers cannot see oxygen, nitrogen, helium or xenon. A multigas monitor's oxygen value comes from a separate paramagnetic or fuel-cell sensor.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-h-3\">I.A.2.h.3 Gas Concentrations<\/a> · <a href=\"#i-a-2-g-5\">I.A.2.g.5 Waste Gas Evacuation Systems<\/a> · <a href=\"#i-a-4-b-11\">I.A.4.b.11 MAC<\/a> · <a href=\"#i-a-2-i\">I.A.2.i Instrumentation<\/a><\/p>","b":"Most operating room gas monitors use infrared absorption, which measures CO2, nitrous oxide and the volatile agents but not oxygen or nitrogen; oxygen comes from a separate paramagnetic or fuel-cell sensor. Mass spectrometry and Raman scattering can measure nearly every respiratory gas, including nitrogen, but are now rare. Sidestream monitors draw a sample to the analyzer, while mainstream sensors sit in the airway.","u":"2026-11-05"},"I.A.2.i.3":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> The catheter, fluid-filled tubing and transducer form a system that oscillates like a spring (resonance) and is slowed by friction (damping). To reproduce an arterial waveform faithfully it needs a high natural frequency and a moderate damping coefficient. The fast-flush test shows both: an underdamped system overshoots and exaggerates systolic pressure, an overdamped one blunts the waveform, and the mean pressure stays fairly accurate in either case.<\/p><h3 class=\"nb-h\">How the transducer works<\/h3><ul><li>Pressure flexes a diaphragm attached to strain gauges in a Wheatstone bridge. Their change in resistance unbalances the bridge and produces a voltage proportional to pressure (see <a href=\"#i-a-2-a-2\">I.A.2.a.2<\/a>).<\/li><li>Zeroing: opening the transducer to air sets atmospheric pressure as zero.<\/li><li>Leveling: placing the transducer's air-fluid interface at the reference level, usually the phlebostatic axis, removes hydrostatic error.<\/li><li>A pressurized flush bag (about 300 mmHg) pushes about 3 mL/h through the line to keep it open.<\/li><\/ul><h3 class=\"nb-h\">Waveform physics<\/h3><ul><li>An arterial waveform is a sum of sine waves: a fundamental at the heart rate plus harmonics at multiples of it. Faithful reproduction needs roughly the first 6 to 10 harmonics, so the system must respond accurately at up to about ten times the heart rate.<\/li><li>Natural (resonant) frequency: the frequency at which the system oscillates on its own. Waveform components near it are amplified, which causes overshoot or ringing.<\/li><li>The natural frequency is higher with short, stiff, wide tubing and few connections, and lower with long or compliant tubing, many stopcocks and air bubbles.<\/li><li>Damping coefficient: how quickly oscillations die away. About 0.6 to 0.7 is ideal; 1.0 is critical damping, with no overshoot but a slow response.<\/li><li>Small air bubbles both lower the natural frequency and add damping. The lower natural frequency can actually increase overshoot.<\/li><\/ul><h3 class=\"nb-h\">The fast-flush (square wave) test<\/h3><ul><li>Briefly pull and release the flush valve, then watch the oscillations that follow the square wave.<\/li><li>The natural frequency is the inverse of the time between oscillation peaks, and the ratio of successive peak heights gives the damping coefficient.<\/li><\/ul><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">System<\/th><th scope=\"col\">Fast-flush response<\/th><th scope=\"col\">Waveform<\/th><th scope=\"col\">Systolic<\/th><th scope=\"col\">Diastolic<\/th><th scope=\"col\">Mean<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Optimally damped<\/th><td>One or two oscillations, then settles<\/td><td>Normal, with a dicrotic notch<\/td><td>Accurate<\/td><td>Accurate<\/td><td>Accurate<\/td><\/tr><tr><th scope=\"row\">Underdamped<\/th><td>Several oscillations<\/td><td>Spiky, overshooting<\/td><td>Overestimated<\/td><td>Underestimated<\/td><td>About right<\/td><\/tr><tr><th scope=\"row\">Overdamped<\/th><td>Slow return, no oscillation<\/td><td>Blunted, no dicrotic notch<\/td><td>Underestimated<\/td><td>Overestimated<\/td><td>About right<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Causes and fixes<\/h3><ul><li>Overdamping: air bubbles, clots, kinks, a catheter against the vessel wall, compliant tubing and a flush bag that has lost pressure. Flush the line, remove bubbles, check the catheter and repressurize the bag.<\/li><li>Underdamping: long tubing with many connections, which lowers the natural frequency, combined with tachycardia or stiff arteries, whose waveforms carry more high-frequency content. Use short, stiff tubing with fewer stopcocks, or add an adjustable damping device.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> an air bubble does not always damp the trace. A small bubble can lower the natural frequency enough to increase overshoot, so check the fast-flush test rather than assuming.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-h-6\">I.A.2.h.6 Blood Pressure<\/a> · <a href=\"#i-a-2-a-2\">I.A.2.a.2 Transducers, Regulators, Medical Gas Cylinders<\/a> · <a href=\"#i-a-2-a-1\">I.A.2.a.1 Pressure Measurement of Gases, Liquids<\/a> · <a href=\"#i-a-2-m-3\">I.A.2.m.3 Macro and Micro Current Hazards<\/a><\/p>","b":"The catheter, fluid-filled tubing and transducer form a system that oscillates like a spring (resonance) and is slowed by friction (damping). To reproduce an arterial waveform faithfully it needs a high natural frequency and a moderate damping coefficient. The fast-flush test shows both: an underdamped system overshoots and exaggerates systolic pressure, an overdamped one blunts the waveform, and the mean pressure stays fairly accurate in either case.","u":"2026-11-05"},"I.A.2.i.4":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Neurologic monitors track anesthetic depth (raw and processed EEG), the integrity of neural pathways during surgery (evoked potentials and EMG), or brain oxygenation and blood flow (near-infrared spectroscopy, transcranial Doppler, jugular venous oximetry). Anesthetic choice matters most for evoked potentials: volatile agents and nitrous oxide depress cortical somatosensory responses and especially motor evoked potentials, so IV anesthesia is preferred when motor responses are monitored.<\/p><h3 class=\"nb-h\">EEG and processed EEG<\/h3><ul><li>The EEG records summed postsynaptic potentials of cortical neurons. Bands: delta below 4 Hz, theta 4 to 8, alpha 8 to 13, beta 13 to 30, gamma above 30.<\/li><li>With most GABA-acting agents, deepening anesthesia brings slower, larger waves, frontal alpha oscillations, then burst suppression and finally an isoelectric EEG.<\/li><li>Ketamine and nitrous oxide produce faster activity, so processed indices may stay high despite adequate anesthesia.<\/li><li>Processed EEG monitors (bispectral index, patient state index, entropy and others) reduce the frontal EEG to a number. For the bispectral index, 40 to 60 is the usual target during general anesthesia.<\/li><li>Limits: artifact from facial muscle activity, electrocautery and pacemakers; a delay of several seconds or more while the signal is processed; less reliability in infants and with ketamine, nitrous oxide or xenon.<\/li><li>They are most useful during total IV anesthesia with neuromuscular block, when no end-tidal agent value is available to guard against awareness.<\/li><li>Multichannel raw EEG detects cortical ischemia, for example during carotid clamping, and seizures.<\/li><\/ul><h3 class=\"nb-h\">Evoked potentials and EMG<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Type<\/th><th scope=\"col\">Stimulus and recording<\/th><th scope=\"col\">Pathway tested<\/th><th scope=\"col\">Typical uses<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Somatosensory (SSEP)<\/th><td>A peripheral nerve is stimulated (median, ulnar, posterior tibial); responses recorded over the spine and sensory cortex<\/td><td>Dorsal columns to sensory cortex (posterior spinal artery territory)<\/td><td>Spine surgery, scoliosis, some carotid and aortic surgery<\/td><\/tr><tr><th scope=\"row\">Motor (MEP)<\/th><td>Transcranial electrical stimulation of the motor cortex; responses recorded from muscles<\/td><td>Corticospinal tracts (anterior spinal artery territory)<\/td><td>Spine surgery, thoracoabdominal aortic surgery, tumors near motor areas<\/td><\/tr><tr><th scope=\"row\">Brainstem auditory (BAEP)<\/th><td>Clicks in the ear; scalp recording<\/td><td>Auditory nerve and brainstem<\/td><td>Posterior fossa surgery, acoustic neuroma, microvascular decompression<\/td><\/tr><tr><th scope=\"row\">Visual (VEP)<\/th><td>Light flashes through closed lids<\/td><td>Visual pathways<\/td><td>Rarely used; unreliable under anesthesia<\/td><\/tr><tr><th scope=\"row\">EMG, free-running and triggered<\/th><td>Recording from muscles supplied by nerves at risk<\/td><td>Cranial nerves, nerve roots<\/td><td>Facial nerve surgery, pedicle screw testing, recurrent laryngeal nerve monitoring<\/td><\/tr><\/tbody><\/table><\/div><ul><li>A warning sign for SSEPs is commonly taken as a fall in amplitude of 50% or more or a rise in latency of 10% or more.<\/li><li>Cortical responses are the most sensitive to anesthetics; spinal, subcortical and brainstem auditory responses are resistant.<\/li><li>Hypotension, hypothermia, hypoxemia, hypercarbia and severe anemia also depress responses.<\/li><\/ul><h3 class=\"nb-h\">Anesthetic effects on evoked potentials<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Agent<\/th><th scope=\"col\">Cortical SSEP<\/th><th scope=\"col\">MEP<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Volatile agents<\/th><td>Dose-dependent fall in amplitude and rise in latency<\/td><td>Very sensitive; often lost even at low doses<\/td><\/tr><tr><th scope=\"row\">Nitrous oxide<\/th><td>Lowers amplitude<\/td><td>Depresses responses<\/td><\/tr><tr><th scope=\"row\">Propofol<\/th><td>Mild depression<\/td><td>Usual basis of IV anesthesia for MEP monitoring<\/td><\/tr><tr><th scope=\"row\">Opioids<\/th><td>Minimal<\/td><td>Minimal<\/td><\/tr><tr><th scope=\"row\">Ketamine, etomidate<\/th><td>Can increase cortical amplitude<\/td><td>Little depression<\/td><\/tr><tr><th scope=\"row\">Neuromuscular blockers<\/th><td>No effect, and less muscle noise<\/td><td>Abolish muscle responses and EMG; avoid, or keep a stable partial block<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Brain oxygenation and blood flow<\/h3><ul><li>Cerebral oximetry (near-infrared spectroscopy): forehead sensors measure regional saturation of frontal cortical blood, mostly venous. It is a trend monitor; a fall of more than about 20% from baseline usually prompts action. Scalp blood can contaminate the reading.<\/li><li>Transcranial Doppler: ultrasound through the temporal bone measures middle cerebral artery flow velocity and detects emboli, vasospasm and hypoperfusion during carotid clamping.<\/li><li>Jugular bulb oximetry: a catheter passed upward into the jugular bulb measures venous saturation of blood leaving the brain, normally about 55 to 75%. Values below about 50% suggest cerebral ischemia.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a fall in evoked potentials during a steady anesthetic means possible neural injury or hypoperfusion until proven otherwise. Avoid boluses of volatile agent or other drugs at critical moments, so that any change can be interpreted.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#ii-a-1-a-3\">II.A.1.a.3 Brain and Spinal Cord Function: EEG, Depth of Anesthesia Monitors, Evoked Potentials<\/a> · <a href=\"#i-c-1-a-2-d\">I.C.1.a.2.d Evoked Potentials<\/a> · <a href=\"#ii-c-1-a-4\">II.C.1.a.4 Evoked Responses<\/a> · <a href=\"#i-b-3-a\">I.B.3.a Stages and Signs of Anesthesia; Awareness under Anesthesia<\/a> · <a href=\"#i-a-2-h-5\">I.A.2.h.5 Oxygen: Oximetry, Co-Oximetry, Pulse Oximetry<\/a><\/p>","b":"Neurologic monitors track anesthetic depth (raw and processed EEG), the integrity of neural pathways during surgery (evoked potentials and EMG), or brain oxygenation and blood flow (near-infrared spectroscopy, transcranial Doppler, jugular venous oximetry). Anesthetic choice matters most for evoked potentials: volatile agents and nitrous oxide depress cortical somatosensory responses and especially motor evoked potentials, so IV anesthesia is preferred when motor responses are monitored.","u":"2026-11-05"},"I.A.2.i.5":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Fluid warmers heat IV fluids and blood toward body temperature, mainly by conduction from heated plates or a countercurrent water jacket; the faster the flow, the more efficient the warmer must be. Their hazards are overheating and hemolysis, air embolism and, with water baths, contamination. Cell salvage collects shed blood, washes and concentrates the red cells and returns them, but not platelets or plasma, and its use in contaminated, cancer and obstetric surgery needs specific precautions.<\/p><h3 class=\"nb-h\">Why warm fluids<\/h3><ul><li>In an adult, 1 L of crystalloid at room temperature, or 1 unit of refrigerated blood, lowers mean body temperature by about 0.25 °C.<\/li><li>Warmed fluid prevents this cooling but adds little heat, so fluid warming cannot rewarm a cold patient on its own.<\/li><\/ul><h3 class=\"nb-h\">Types of warmer<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Type<\/th><th scope=\"col\">How it heats<\/th><th scope=\"col\">Best for<\/th><th scope=\"col\">Notes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Dry heat plate or cassette<\/th><td>Fluid runs through a thin channel between heated plates<\/td><td>Low to moderate flows<\/td><td>Simple and common<\/td><\/tr><tr><th scope=\"row\">Countercurrent water jacket<\/th><td>Warm water flows the opposite way around the fluid tubing<\/td><td>Moderate to high flows<\/td><td>Efficient; the water circuit must stay separate from the fluid<\/td><\/tr><tr><th scope=\"row\">Water bath<\/th><td>Tubing coils through warm water<\/td><td>Low flows<\/td><td>Older; infection risk<\/td><\/tr><tr><th scope=\"row\">Rapid infusion system<\/th><td>A large heat exchanger with pumps, pressure control and air detection<\/td><td>Massive transfusion<\/td><td>Can deliver several hundred milliliters per minute or more<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Blood should not be heated above about 42 °C, which causes hemolysis.<\/li><li>Warming releases dissolved gas as bubbles. Air embolism is a particular risk with pressurized bags and rapid infusers, so use air detectors and vents and remove air from bags.<\/li><li>Long tubing between the warmer and the patient lets fluid cool again at low flows.<\/li><\/ul><h3 class=\"nb-h\">Cell salvage (autotransfusion)<\/h3><ul><li>Shed blood is suctioned with an anticoagulant (heparin or citrate), filtered and collected. A centrifuge bowl separates the red cells, which are washed with saline and returned at a hematocrit of about 50 to 60%.<\/li><li>Washing removes most plasma, platelets, clotting factors, free hemoglobin, heparin and debris.<\/li><li>Uses: expected blood loss of about 1 L or more, patients who refuse donor blood but accept a continuous circuit, and rare blood types.<\/li><li>Complications: dilutional coagulopathy after large volumes, air embolism if blood is returned under pressure from the reservoir, and incomplete washing that leaves heparin, free hemoglobin, fat or bacteria.<\/li><li>Do not aspirate sterile water, hydrogen peroxide, alcohol or topical clotting agents into the system; they cause hemolysis or clotting.<\/li><\/ul><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Setting<\/th><th scope=\"col\">Concern<\/th><th scope=\"col\">Common precautions<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Bowel contamination or infection<\/th><td>Returning bacteria<\/td><td>Usually avoided; if lifesaving, extra washing, a filter and antibiotics<\/td><\/tr><tr><th scope=\"row\">Cancer surgery<\/th><td>Returning tumor cells<\/td><td>Leukocyte depletion filters or irradiation; many centers now use it<\/td><\/tr><tr><th scope=\"row\">Obstetrics<\/th><td>Amniotic fluid and fetal red cells<\/td><td>Separate suction for amniotic fluid, a leukocyte depletion filter, and anti-D immunoglobulin for RhD-negative mothers when indicated<\/td><\/tr><\/tbody><\/table><\/div><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> salvaged blood is washed red cells only. After large volumes, the patient also needs plasma and platelets to avoid a dilutional coagulopathy.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-c-6-a-1-f\">I.C.6.a.1.f Alternatives to Transfusion<\/a> · <a href=\"#i-c-6-b-4\">I.C.6.b.4 Effects of Cooling and Heating; Blood Warmers<\/a> · <a href=\"#i-c-6-d-4\">I.C.6.d.4 Massive Transfusion: Coagulopathies, Hypothermia<\/a> · <a href=\"#i-a-2-i-6\">I.A.2.i.6 Body Warming Devices<\/a><\/p>","b":"Fluid warmers heat IV fluids and blood toward body temperature, mainly by conduction from heated plates or a countercurrent water jacket; the faster the flow, the more efficient the warmer must be. Their hazards are overheating and hemolysis, air embolism and, with water baths, contamination. Cell salvage collects shed blood, washes and concentrates the red cells and returns them, but not platelets or plasma, and its use in contaminated, cancer and obstetric surgery needs specific precautions.","u":"2026-11-05"},"I.A.2.i.6":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Most heat leaves through the skin by radiation and convection, so the best devices warm a large area of skin: forced-air warming and circulating-water garments. Passive insulation reduces heat loss modestly, and prewarming before induction limits redistribution hypothermia. Burns happen when heat meets skin that is compressed or poorly perfused, or when a forced-air hose blows straight onto skin.<\/p><h3 class=\"nb-h\">How patients lose heat<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Mechanism<\/th><th scope=\"col\">Relative size<\/th><th scope=\"col\">Examples<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Radiation<\/th><td>Largest<\/td><td>Heat radiating to cooler walls and equipment<\/td><\/tr><tr><th scope=\"row\">Convection<\/th><td>Second<\/td><td>Air currents over exposed skin<\/td><\/tr><tr><th scope=\"row\">Evaporation<\/th><td>Moderate<\/td><td>Skin preparation, open wounds, the airway<\/td><\/tr><tr><th scope=\"row\">Conduction<\/th><td>Small<\/td><td>Contact with a cold table or fluids<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Devices<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Device<\/th><th scope=\"col\">How it works<\/th><th scope=\"col\">Effectiveness<\/th><th scope=\"col\">Hazards and notes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Forced-air warming<\/th><td>Warm air blown through a perforated blanket onto the skin (convection)<\/td><td>The most effective widely used method<\/td><td>Burns if the hose blows on skin without its blanket; strong evidence that it causes surgical site infection is lacking<\/td><\/tr><tr><th scope=\"row\">Circulating-water garments (\"second skin\")<\/th><td>Warm water flows through pads wrapped over large areas of skin (conduction)<\/td><td>At least as effective as forced air<\/td><td>Burns where pads press on tissue<\/td><\/tr><tr><th scope=\"row\">Circulating-water mattress<\/th><td>A water pad under the patient<\/td><td>Less effective: little skin area, and compressed skin has poor blood flow<\/td><td>Pressure and heat burns on the back<\/td><\/tr><tr><th scope=\"row\">Resistive electric blankets<\/th><td>Heating elements in a flexible cover<\/td><td>Similar to forced air when contact is good<\/td><td>Burns under pressure points<\/td><\/tr><tr><th scope=\"row\">Radiant heaters (heating lamps)<\/th><td>Infrared radiation onto exposed skin<\/td><td>Useful for infants during induction and procedures, with no contact needed<\/td><td>Burns if too close; warms only exposed skin<\/td><\/tr><tr><th scope=\"row\">Passive insulation (blankets, drapes, reflective covers)<\/th><td>Reduces radiation and convection<\/td><td>A single layer cuts skin heat loss by about 30%; more layers add little<\/td><td>Cover as much skin as possible, including the head in infants<\/td><\/tr><tr><th scope=\"row\">Warmer room<\/th><td>Reduces radiation and convection to the surroundings<\/td><td>Effective, though uncomfortable for staff<\/td><td>Important for neonates and burn patients<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Practice points<\/h3><ul><li>Prewarming the skin for even 10 to 30 minutes before induction raises peripheral heat content and reduces the core temperature drop from redistribution.<\/li><li>Aim for a core temperature of 36 °C or more unless hypothermia is intended.<\/li><li>Neonates and infants lose heat fastest because of their large surface area relative to body mass.<\/li><li>Warming fluids and humidifying gases prevent cooling but add little heat (see <a href=\"#i-a-2-i-5\">I.A.2.i.5<\/a> and <a href=\"#i-a-2-g-1\">I.A.2.g.1<\/a>).<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> never run a forced-air hose under drapes or onto skin without its blanket, and never warm a limb below an aortic cross-clamp. Skin without good blood flow cannot carry heat away, so both cause burns.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-h-4\">I.A.2.h.4 Temperature<\/a> · <a href=\"#i-b-6-c-1\">I.B.6.c.1 Hypothermia<\/a> · <a href=\"#i-c-1-a-7-d\">I.C.1.a.7.d Heat Loss; Mechanisms<\/a> · <a href=\"#ii-d-2-a-2\">II.D.2.a.2 Warming Devices: Types, Efficacy, Complications<\/a> · <a href=\"#i-a-2-i-5\">I.A.2.i.5 Fluid Warmers, Autotransfusion Devices<\/a><\/p>","b":"Most heat leaves through the skin by radiation and convection, so the best devices warm a large area of skin: forced-air warming and circulating-water garments. Passive insulation reduces heat loss modestly, and prewarming before induction limits redistribution hypothermia. Burns happen when heat meets skin that is compressed or poorly perfused, or when a forced-air hose blows straight onto skin.","u":"2026-11-05"},"I.A.2.j":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> An anesthesia ventilator takes the place of the reservoir bag in the circle and pushes gas into the lungs, with a bellows driven by gas or a piston driven by a motor. Every breath is described by what starts it (trigger), what is held constant (target or limit) and what ends it (cycle). Know how the drive design, fresh gas flow and a bellows leak change what the patient actually receives.<\/p><h3 class=\"nb-h\">Describing a breath<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Phase<\/th><th scope=\"col\">Meaning<\/th><th scope=\"col\">Examples<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Trigger<\/th><td>What starts inspiration<\/td><td>Time (a set rate) or patient effort, sensed as a fall in pressure or a change in flow<\/td><\/tr><tr><th scope=\"row\">Target (limit)<\/th><td>What the ventilator holds constant during inspiration<\/td><td>Flow, and so volume (volume control), or pressure (pressure control)<\/td><\/tr><tr><th scope=\"row\">Cycle<\/th><td>What ends inspiration<\/td><td>Time or delivered volume (volume control), time (pressure control), falling flow (pressure support)<\/td><\/tr><tr><th scope=\"row\">Baseline<\/th><td>Pressure during expiration<\/td><td>Zero or PEEP<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Anesthesia ventilator designs<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Design<\/th><th scope=\"col\">How it works<\/th><th scope=\"col\">Key points<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Ascending (standing) bellows<\/th><td>Drive gas (oxygen or air) squeezes the bellows inside a sealed housing; the bellows rises during expiration<\/td><td>A disconnection is obvious because the bellows collapses and does not refill; the design adds about 2 to 3 cm H2O of PEEP<\/td><\/tr><tr><th scope=\"row\">Descending (hanging) bellows<\/th><td>The bellows hangs down and refills by gravity<\/td><td>It keeps refilling through a disconnection, drawing in room air, so it can hide one; older design<\/td><\/tr><tr><th scope=\"row\">Piston<\/th><td>An electric motor drives a piston<\/td><td>Uses no drive gas, which spares cylinder oxygen during a pipeline failure; usually paired with fresh gas decoupling<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Bellows ventilators use about one minute volume of drive gas per minute, so during a pipeline failure they can empty the oxygen cylinder quickly (see <a href=\"#i-a-2-a-2\">I.A.2.a.2<\/a>).<\/li><li>A hole in the bellows lets drive gas into the breathing circuit: FiO2 rises with oxygen drive gas or falls with air, the anesthetic is diluted and airway pressure can rise.<\/li><li>Fresh gas coupling: on ventilators without decoupling, fresh gas that flows during inspiration adds to each breath. At 6 L/min (100 mL/s) with a 2-second inspiration, each breath gets about 200 mL extra. Fresh gas decoupling or software compensation prevents this.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> on a ventilator without fresh gas decoupling, raising the fresh gas flow raises the delivered tidal volume and airway pressure, even though the set volume has not changed.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-j-1\">I.A.2.j.1 Classifications<\/a> · <a href=\"#i-a-2-j-2\">I.A.2.j.2 Principles of Action<\/a> · <a href=\"#i-a-2-j-3\">I.A.2.j.3 Monitors<\/a> · <a href=\"#i-a-2-g-1\">I.A.2.g.1 Principles<\/a> · <a href=\"#i-a-2-a-2\">I.A.2.a.2 Transducers, Regulators, Medical Gas Cylinders<\/a><\/p>","b":"An anesthesia ventilator takes the place of the reservoir bag in the circle and pushes gas into the lungs, with a bellows driven by gas or a piston driven by a motor. Every breath is described by what starts it (trigger), what is held constant (target or limit) and what ends it (cycle). Know how the drive design, fresh gas flow and a bellows leak change what the patient actually receives.","u":"2026-11-05"},"I.A.2.j.1":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> A flow generator delivers a set flow whatever the lungs are like, so tidal volume stays constant and airway pressure rises when compliance falls or resistance rises. A pressure generator applies a set pressure, so flow and tidal volume change with the lungs. Modern ventilators can act as either: volume control behaves as a flow generator, pressure control as a pressure generator.<\/p><h3 class=\"nb-h\">The physics<\/h3><ul><li>A true flow generator uses a driving pressure far higher than airway pressure, behind a high internal resistance, so changes in the patient's lungs barely alter the flow.<\/li><li>A pressure generator uses a low driving pressure close to the airway pressure it targets. As the lungs fill and alveolar pressure approaches the set pressure, flow falls (a decelerating flow pattern).<\/li><\/ul><h3 class=\"nb-h\">Comparison<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Feature<\/th><th scope=\"col\">Flow generator (volume control)<\/th><th scope=\"col\">Pressure generator (pressure control)<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">What you set<\/th><td>Tidal volume and inspiratory flow, or time<\/td><td>Inspiratory pressure and time<\/td><\/tr><tr><th scope=\"row\">Flow pattern<\/th><td>Constant (square) or set decelerating<\/td><td>Decelerating, highest at the start<\/td><\/tr><tr><th scope=\"row\">If compliance falls or resistance rises<\/th><td>Tidal volume is kept; airway pressure rises<\/td><td>Airway pressure is kept; tidal volume falls<\/td><\/tr><tr><th scope=\"row\">With a leak<\/th><td>Volume is lost<\/td><td>Flow increases to hold pressure, partly making up for it<\/td><\/tr><tr><th scope=\"row\">Main risk<\/th><td>High pressures and barotrauma in stiff lungs<\/td><td>Hypoventilation when the lungs get stiffer or the airway narrows<\/td><\/tr><tr><th scope=\"row\">Alarm to watch<\/th><td>Peak and plateau pressure<\/td><td>Exhaled tidal and minute volume<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Other ways to classify ventilators<\/h3><ul><li>Power: pneumatic (compressed gas), electric, or both.<\/li><li>Drive: double circuit, where drive gas squeezes a bellows, or single circuit, such as a piston pushing the breathing gas directly.<\/li><li>Cycling: time, volume, pressure or flow.<\/li><li>Dual-control modes (for example pressure-regulated volume control or volume guarantee) give pressure-controlled breaths but adjust the pressure breath by breath to reach a target tidal volume.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> in pressure control, anything that stiffens the lungs or chest, such as bronchospasm, abdominal insufflation or steep Trendelenburg, silently lowers tidal volume; in volume control it raises airway pressure. Set alarms on the variable the mode does not control.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-j-2\">I.A.2.j.2 Principles of Action<\/a> · <a href=\"#i-a-2-j-3\">I.A.2.j.3 Monitors<\/a> · <a href=\"#i-c-2-a-2-a\">I.C.2.a.2.a Static and Dynamic Compliance<\/a> · <a href=\"#i-a-2-b-1\">I.A.2.b.1 Viscosity-Density, Laminar-Turbulent Flow<\/a><\/p>","b":"A flow generator delivers a set flow whatever the lungs are like, so tidal volume stays constant and airway pressure rises when compliance falls or resistance rises. A pressure generator applies a set pressure, so flow and tidal volume change with the lungs. Modern ventilators can act as either: volume control behaves as a flow generator, pressure control as a pressure generator.","u":"2026-11-05"},"I.A.2.j.2":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Modes differ in who starts each breath (machine or patient), what the machine controls (volume or pressure) and how spontaneous breaths are handled. Control and assist-control give full support, SIMV mixes set breaths with spontaneous ones, pressure support helps only the patient's own breaths, and CPAP and bilevel pressure can be given by mask. Lung-protective ventilation, with small tidal volumes sized to predicted body weight and PEEP, applies whatever the mode.<\/p><h3 class=\"nb-h\">Modes by trigger<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Mode<\/th><th scope=\"col\">Trigger<\/th><th scope=\"col\">What is delivered<\/th><th scope=\"col\">Notes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Control (controller)<\/th><td>Time only<\/td><td>Breaths of set rate and size; the patient's efforts are ignored<\/td><td>For apneic or paralyzed patients; awake patients fight it<\/td><\/tr><tr><th scope=\"row\">Assist (assistor)<\/th><td>Patient effort<\/td><td>A supported breath each time the patient triggers<\/td><td>No backup if the patient stops breathing<\/td><\/tr><tr><th scope=\"row\">Assist-control<\/th><td>Patient effort or time<\/td><td>A full set breath for every trigger, plus a backup rate<\/td><td>Rapid breathing can cause hyperventilation and gas trapping<\/td><\/tr><tr><th scope=\"row\">IMV<\/th><td>Time<\/td><td>Set breaths at a set rate, with spontaneous breathing in between<\/td><td>Unsynchronized, so a set breath can land on a spontaneous one (breath stacking)<\/td><\/tr><tr><th scope=\"row\">SIMV<\/th><td>Patient effort within a timing window, otherwise time<\/td><td>Set breaths timed to the patient's efforts; spontaneous breaths in between, often pressure supported<\/td><td>Used for weaning; common on anesthesia ventilators<\/td><\/tr><tr><th scope=\"row\">Pressure support<\/th><td>Patient effort<\/td><td>A set pressure until inspiratory flow falls to a set fraction of its peak, often about 25%<\/td><td>The patient controls rate and timing; needs an intact respiratory drive and an apnea backup; common with a supraglottic airway<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Volume-limited and pressure-limited breaths<\/h3><ul><li>Volume control delivers a set tidal volume and lets pressure vary; pressure control holds a set pressure for a set time and lets tidal volume vary (see <a href=\"#i-a-2-j-1\">I.A.2.j.1<\/a>).<\/li><li>In volume control, an upper pressure limit ends the breath or vents gas to protect the lungs.<\/li><\/ul><h3 class=\"nb-h\">FiO2 control<\/h3><ul><li>Intensive care ventilators blend oxygen and air to a set FiO2.<\/li><li>On an anesthesia machine, FiO2 depends on the fresh gas mixture and on rebreathing, so the inspired oxygen analyzer is the guide (see <a href=\"#i-a-2-g-1\">I.A.2.g.1<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Special techniques<\/h3><ul><li>Periodic sigh: an occasional breath about 1.5 to 2 times the usual tidal volume to reopen collapsed alveoli. Largely replaced by PEEP and recruitment maneuvers.<\/li><li>Inverse ratio ventilation: inspiration longer than expiration (I:E above 1:1). It raises mean airway pressure and can improve oxygenation, but it traps gas, reduces venous return and needs deep sedation.<\/li><li>High-frequency ventilation: rates far above normal with tidal volumes near or below dead space, so gas moves by enhanced mixing and diffusion rather than bulk flow. Jet ventilation is used in airway surgery and for bronchopleural fistula; oscillation at about 3 to 15 Hz is used in neonates and as rescue therapy.<\/li><li>With jet ventilation, exhalation is passive through the patient's own airway, so a clear outflow path is essential to avoid barotrauma.<\/li><li>APRV: a high continuous pressure for most of the cycle with brief releases to a low pressure that let CO2 out, while the patient breathes spontaneously throughout. An intensive care mode for ARDS.<\/li><\/ul><h3 class=\"nb-h\">Noninvasive techniques<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Technique<\/th><th scope=\"col\">What it gives<\/th><th scope=\"col\">Common uses<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">CPAP<\/th><td>One pressure throughout the breath<\/td><td>Obstructive sleep apnea, atelectasis, cardiogenic pulmonary edema, preoxygenation<\/td><\/tr><tr><th scope=\"row\">Bilevel positive airway pressure (BiPAP)<\/th><td>A higher inspiratory and a lower expiratory pressure<\/td><td>Hypercapnic failure (COPD), neuromuscular weakness, obesity hypoventilation, support after extubation<\/td><\/tr><tr><th scope=\"row\">High-flow nasal oxygen<\/th><td>Warm, humid flow up to about 60 L/min with a little positive pressure<\/td><td>Hypoxemia, preoxygenation, apneic oxygenation<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Avoid noninvasive ventilation in patients who cannot protect their airway or clear secretions, are vomiting, have facial injuries that prevent a seal, are hemodynamically unstable or cannot cooperate; recent upper gastrointestinal surgery is a relative contraindication.<\/li><\/ul><h3 class=\"nb-h\">Lung-protective ventilation<\/h3><ul><li>In ARDS, tidal volumes of 6 mL/kg of predicted body weight with a plateau pressure of 30 cm H2O or less lowered mortality compared with 12 mL/kg (31.0% versus 39.8%) (<a href=\"https://doi.org/10.1056/NEJM200005043421801\" target=\"_blank\" rel=\"noopener\">ARDS Network 2000<\/a>).<\/li><li>In patients at intermediate or high risk having major abdominal surgery, lung-protective ventilation with low tidal volumes and PEEP cut major complications in the first week compared with nonprotective ventilation (10.5% versus 27.5%) (<a href=\"https://doi.org/10.1056/NEJMoa1301082\" target=\"_blank\" rel=\"noopener\">Futier 2013<\/a>).<\/li><li>Predicted body weight depends on height and sex: men 50 + 0.91 × (height in cm − 152.4); women 45.5 + 0.91 × (height in cm − 152.4).<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> tidal volume is sized to predicted body weight, which depends on height and sex, not actual weight. Sizing it to actual weight in an obese patient overdistends the lungs.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-j-1\">I.A.2.j.1 Classifications<\/a> · <a href=\"#i-a-2-j-3\">I.A.2.j.3 Monitors<\/a> · <a href=\"#i-b-3-c-5\">I.B.3.c.5 Transcutaneous or Surgical Airway<\/a> · <a href=\"#i-c-2-a-4-b\">I.C.2.a.4.b Apneic Oxygenation, Diffusion Hypoxia<\/a> · <a href=\"#i-a-2-g-4\">I.A.2.g.4 Oxygen Supply Systems: FiO2<\/a><\/p>","b":"Modes differ in who starts each breath (machine or patient), what the machine controls (volume or pressure) and how spontaneous breaths are handled. Control and assist-control give full support, SIMV mixes set breaths with spontaneous ones, pressure support helps only the patient's own breaths, and CPAP and bilevel pressure can be given by mask. Lung-protective ventilation, with small tidal volumes sized to predicted body weight and PEEP, applies whatever the mode.","u":"2026-11-05"},"I.A.2.j.3":{"h":"<p class=\"nb-bl\"><strong>Bottom line:<\/strong> Peak pressure reflects resistance plus compliance; plateau pressure, measured during an end-inspiratory pause with no flow, reflects compliance alone. A higher peak with the same plateau points to the tube or airways, and a rise in both points to the lungs, chest wall or abdomen. Disconnection and apnea are caught by airway pressure, exhaled volume and capnography together.<\/p><h3 class=\"nb-h\">Airway pressures<\/h3><ul><li>Peak inspiratory pressure: the highest pressure in the breath. In volume control it is PEEP plus the resistive pressure (flow × resistance) plus the elastic pressure (tidal volume ÷ compliance).<\/li><li>Plateau pressure: the pressure during a brief end-inspiratory hold (about 0.5 seconds) once flow has stopped, so the resistive part is gone. It approximates alveolar pressure at end inspiration and is valid only if the patient is passive and there is no leak.<\/li><li>Peak minus plateau: the resistive pressure. It rises with a higher inspiratory flow, a small or kinked tube, secretions and bronchospasm.<\/li><li>Driving pressure: plateau minus PEEP, which equals tidal volume ÷ static compliance. It sizes the breath against the lung that is actually open.<\/li><li>PEEP and auto-PEEP: an end-expiratory hold measures total PEEP; total PEEP minus set PEEP is auto-PEEP (intrinsic PEEP), from gas trapped by too short an expiration.<\/li><li>Mean airway pressure: the average over the whole cycle. Along with FiO2 it is the main ventilator setting that drives oxygenation, and it rises with PEEP, inspiratory time and inspiratory pressure.<\/li><li>In pressure control, flow usually falls to zero before inspiration ends, so peak and plateau are about equal and the set pressure says little about the lungs; watch the exhaled tidal volume instead (see <a href=\"#i-a-2-j-1\">I.A.2.j.1<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Reading a change in pressure<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Pattern<\/th><th scope=\"col\">What changed<\/th><th scope=\"col\">Common causes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Peak up, plateau the same<\/th><td>Resistance<\/td><td>Kinked, bitten or blocked tube; secretions or a mucus plug; bronchospasm; a small tube; a wet heat and moisture exchanger; high inspiratory flow<\/td><\/tr><tr><th scope=\"row\">Peak and plateau both up<\/th><td>Compliance<\/td><td>Endobronchial intubation, pneumothorax, atelectasis, pulmonary edema, ARDS, gas trapping, abdominal insufflation, steep Trendelenburg, obesity, surgical packing or retraction, opioid chest wall rigidity<\/td><\/tr><tr><th scope=\"row\">Peak down<\/th><td>Gas lost or not delivered, or an improvement<\/td><td>Disconnection, cuff or circuit leak, a tube that has slipped above the cords, loss of drive gas or power; or bronchospasm resolving<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Patient effort (coughing, straining, light anesthesia or a wearing-off neuromuscular block) raises both pressures and makes the plateau unreliable.<\/li><\/ul><h3 class=\"nb-h\">Pressure targets<\/h3><ul><li>Keep the plateau at or below 30 cm H2O (see <a href=\"#i-a-2-j-2\">I.A.2.j.2<\/a>).<\/li><li>In an analysis of individual data from 3,562 patients with ARDS in nine randomized trials, driving pressure was the ventilation variable most strongly linked to survival. Each rise of about 7 cm H2O was associated with higher mortality (relative risk 1.41), even in patients already receiving protective plateau pressures and tidal volumes (<a href=\"https://doi.org/10.1056/NEJMsa1410639\" target=\"_blank\" rel=\"noopener\">Amato 2015<\/a>). This is an association, not a trial of targeting driving pressure; many clinicians aim to keep it below about 15 cm H2O.<\/li><\/ul><h3 class=\"nb-h\">Compliance<\/h3><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Measure<\/th><th scope=\"col\">Formula<\/th><th scope=\"col\">What it includes<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Static compliance<\/th><td>Tidal volume ÷ (plateau − PEEP)<\/td><td>Elastic recoil of the lungs and chest wall only<\/td><\/tr><tr><th scope=\"row\">Dynamic compliance<\/th><td>Tidal volume ÷ (peak − PEEP)<\/td><td>Recoil plus airway and tube resistance, so it is never higher than static compliance<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Use total PEEP (set plus auto-PEEP) in both formulas; otherwise compliance looks lower than it is.<\/li><li>In healthy adults the whole respiratory system compliance is about 100 mL/cm H2O (lungs and chest wall about 200 each, acting in series). It is lower under anesthesia, supine, in obesity and with abdominal insufflation.<\/li><li>If dynamic compliance falls while static compliance holds steady, resistance has risen; if both fall together, the lungs or chest wall have become stiffer.<\/li><li>Raising PEEP shows whether lung can be recruited: if the driving pressure falls (compliance improves), the PEEP opened lung; if it rises, the lungs are being overdistended.<\/li><li>On a pressure-volume loop the slope is compliance; a flattened beak at the top suggests overdistension, and a loop that does not close on the volume axis suggests a leak (see <a href=\"#i-a-2-h-2\">I.A.2.h.2<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Worked example<\/h3><p>Tidal volume 500 mL at a constant flow of 1 L/s, PEEP 5 cm H2O, peak 30 cm H2O, plateau 20 cm H2O:<\/p><div class=\"nb-table\" role=\"region\" tabindex=\"0\" aria-label=\"Table\"><table><thead><tr><th scope=\"col\">Value<\/th><th scope=\"col\">Calculation<\/th><th scope=\"col\">Result<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Resistive pressure<\/th><td>30 − 20<\/td><td>10 cm H2O<\/td><\/tr><tr><th scope=\"row\">Airway resistance<\/th><td>10 ÷ 1 L/s<\/td><td>10 cm H2O/L/s<\/td><\/tr><tr><th scope=\"row\">Driving pressure<\/th><td>20 − 5<\/td><td>15 cm H2O<\/td><\/tr><tr><th scope=\"row\">Static compliance<\/th><td>500 ÷ 15<\/td><td>about 33 mL/cm H2O<\/td><\/tr><tr><th scope=\"row\">Dynamic compliance<\/th><td>500 ÷ 25<\/td><td>20 mL/cm H2O<\/td><\/tr><\/tbody><\/table><\/div><h3 class=\"nb-h\">Oxygen<\/h3><ul><li>During general anesthesia with an anesthesia machine, ASA standards require an oxygen analyzer measuring the oxygen concentration in the breathing system, with a low oxygen concentration limit alarm in use (<a href=\"https://www.asahq.org/standards-and-practice-parameters/standards-for-basic-anesthetic-monitoring\" target=\"_blank\" rel=\"noopener\">ASA basic monitoring standards<\/a>).<\/li><li>The analyzer sits downstream of the pipelines, cylinders, flowmeters and proportioning system, so it is the last line of defense against crossed pipelines, a wrong gas, a flowmeter leak or a hypoxic mixture (see <a href=\"#i-a-2-g-6\">I.A.2.g.6<\/a> and <a href=\"#i-a-2-h-3\">I.A.2.h.3<\/a>).<\/li><li>It shows what the patient is breathing, not whether oxygen reaches the blood, so pulse oximetry and capnography are still needed.<\/li><li>The machine also alarms when the oxygen supply pressure falls (see <a href=\"#i-a-2-g-6\">I.A.2.g.6<\/a>).<\/li><\/ul><h3 class=\"nb-h\">Apnea and disconnection<\/h3><ul><li>When a mechanical ventilator controls ventilation, the same ASA standards require a device in continuous use that detects disconnection of breathing system components and gives an audible signal, and the end-tidal CO2 alarm must be audible.<\/li><li>Low airway pressure (disconnect) alarm: sounds when pressure fails to rise above a set threshold within a set time. Set the threshold just below the patient's usual peak pressure. If it is set too low, the resistance of a heat and moisture exchanger, or an open end lying against the drapes, can generate enough pressure to fool it.<\/li><li>Low exhaled tidal volume or minute volume alarm: measured in the expiratory limb (see <a href=\"#i-a-2-h-2\">I.A.2.h.2<\/a>).<\/li><li>Capnography: loss of the CO2 waveform is the most reliable early sign of disconnection, apnea or a misplaced tube.<\/li><li>In spontaneous modes such as pressure support or CPAP, an apnea alarm sounds if no breath is detected within a set time, and many ventilators then start backup breaths.<\/li><li>An ascending bellows that fails to refill is a visual sign of disconnection (see <a href=\"#i-a-2-j\">I.A.2.j<\/a>).<\/li><li>High, sustained and subatmospheric pressure alarms are covered in <a href=\"#i-a-2-k\">I.A.2.k<\/a>.<\/li><\/ul><h3 class=\"nb-h\">Inspiratory to expiratory (I:E) ratio<\/h3><ul><li>Adults are usually ventilated at 1:2. The cycle time is 60 ÷ rate: at 10 breaths per minute and 1:2, each 6-second cycle has 2 seconds of inspiration and 4 of expiration.<\/li><li>In volume control, a shorter inspiratory time means a higher inspiratory flow, which raises peak but not plateau pressure.<\/li><li>Too short an expiration traps gas (auto-PEEP or dynamic hyperinflation), especially in asthma and COPD. Signs: expiratory flow does not return to zero before the next breath, plateau pressure rises, blood pressure falls and, in severe cases, the circulation collapses.<\/li><li>Treat by disconnecting the circuit briefly to let the trapped gas out, then lowering the rate and tidal volume, lengthening expiration (1:3 or 1:4) and treating bronchospasm.<\/li><li>Inverse ratio ventilation (inspiration longer than expiration) is covered in <a href=\"#i-a-2-j-2\">I.A.2.j.2<\/a>.<\/li><\/ul><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a higher peak pressure with an unchanged plateau is a tube or airway problem, so check for kinks, biting and secretions and treat bronchospasm before blaming the lungs. Endobronchial intubation and pneumothorax raise both pressures.<\/p><\/div><div class=\"nb-callout\" role=\"note\"><p><strong>Common trap:<\/strong> a disconnect alarm threshold set far below the usual peak pressure can stay silent through a disconnection. Set it just below the peak and confirm that every breath gives a CO2 waveform.<\/p><\/div><p class=\"nb-related\"><strong>Related:<\/strong> <a href=\"#i-a-2-j-1\">I.A.2.j.1 Classifications<\/a> · <a href=\"#i-a-2-j-2\">I.A.2.j.2 Principles of Action<\/a> · <a href=\"#i-a-2-k\">I.A.2.k Alarms and Safety Features<\/a> · <a href=\"#i-a-2-h-2\">I.A.2.h.2 Ventilation: Respirometers, Inspiratory Force, Spirometry, Flow-Volume Loops<\/a> · <a href=\"#i-c-2-a-2-a\">I.C.2.a.2.a Static and Dynamic Compliance<\/a> · <a href=\"#i-b-6
